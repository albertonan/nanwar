// Provincias que comparten frontera con cada provincia.
const PROVINCE_NEIGHBORS = PROVINCES.map(() => new Set());
for (const i of G.land) for (let d = 0; d < 6; d++) {
    const j = G.nb[i * 6 + d];
    if (j >= 0 && isLand(j) && G.prov[j] !== G.prov[i]) PROVINCE_NEIGHBORS[G.prov[i]].add(G.prov[j]);
}
// Escalones de la OTAN: lo que se ve de un ejército enemigo sin identificar es su tamaño aproximado.
const ECHELONS = [
    { max: 3, mark: 'II', name: 'batallón', range: '1–3' },
    { max: 9, mark: 'III', name: 'regimiento', range: '4–9' },
    { max: 24, mark: 'X', name: 'brigada', range: '10–24' },
    { max: 99, mark: 'XX', name: 'división', range: '25–99' },
    { max: 399, mark: 'XXX', name: 'cuerpo de ejército', range: '100–399' },
    { max: 1499, mark: 'XXXX', name: 'ejército', range: '400–1499' },
    { max: Infinity, mark: 'XXXXX', name: 'grupo de ejércitos', range: '1500 o más' }
];
const echelonOf = n => ECHELONS.find(e => n <= e.max);
// Lo más que puede ser un ejército de n unidades que no se conoce (niebla de guerra): el tope de su escalón; el último
// no tiene tope, así que se supone de 3000.
const echelonCeil = n => Math.min(echelonOf(n).max, 3000);
const FORT_LEVELS = ['sacos terreros', 'hormigón armado', 'búnkeres', 'casamatas'];
// Cómo se dibuja la fortificación de cada nivel: relleno, muro (oscuro y claro) y sus grosores.
const FORT_STYLE = {
    0: { fill: 'rgba(214,203,178,0.5)', dark: '#2b2620', light: '#e3d9c0', wall: [3.8, 2.1] },
    1: { fill: 'rgba(150,156,162,0.55)', dark: '#151a12', light: '#cfd2d6', wall: [4.6, 2.6] },
    2: { fill: 'rgba(132,138,144,0.6)', dark: '#151a12', light: '#cfd2d6', wall: [4.6, 2.6] },
    3: { fill: 'rgba(92,97,102,0.65)', dark: '#151a12', light: '#e6e8eb', wall: [5.4, 3] },
    unk: { dark: '#151a12', light: '#a6a892', wall: [3.8, 2] }
};
const RESOURCES = E.resources.map(r => ({ ...r, typeName: E.resourceTypes[r.type], province: G.prov[r.cell] }));
const RESOURCE_AT = new Map(RESOURCES.map(r => [r.cell, r]));

class GameEngine {
    constructor(seed) {
        this.seed = seed;
        this.rng = mulberry32(seed);
        this.turn = 1;
        this.motion = [];   // movimientos y combates para que la vista los anime (no se guarda en la partida)
        this.player = null;
        this.over = false;
        this.won = false;
        this.logs = [];
        this.proposals = [];
        this.alerts = [];           // partes de guerra para el jugador (se muestran al volver a su turno)
        this.proposedThisTurn = new Set();
        this.version = 0;       // cambia con la propiedad de las casillas
        this.roadVersion = 0;   // cambia al construir
        this.blocVersion = 0;   // cambia con las alianzas
        this.warVersion = 0;    // cambia al declarar la guerra o firmar la paz
        this.econCache = [];
        this.techVersion = 0;       // cambia al terminar cualquier investigación
        this.rulesCache = [];
        this.dev = new Uint16Array(PROVINCES.length);   // desarrollo de cada provincia, en milésimas de su renta
        this.devVersion = 0;
        this.supplyCache = [];
        this.cutLogged = new Set();
        this.sieges = new Map();    // ciudad → { by, prev, held }: asedios en curso
        this.spies = new Map();     // provincia → { since, revealedTurn }: espías del jugador
        this.spyVersion = 0;
        this.armyVersion = 0;       // cambia cada vez que un ejército se mueve, aparece o desaparece
        this.orderVersion = 0;      // cambia al dar, cumplir o cancelar órdenes y operaciones
        this.ops = new Map();       // operaciones: id → { owner, kind, name, cells, ... }
        this.nextOpId = 1;
        this.fields = new Map();    // caminos hacia los destinos de las órdenes (se rehacen si cambia el mapa)
        this.fieldStamp = '';
        this.roadReach = new Map(); // ¿llega a una carretera en un turno? por dueño, casilla y velocidad (ver roadInReach)
        this.roadReachStamp = '';
        this.visCache = null;

        // Carreteras: clase por arista dirigida (0 nada, 1 carretera, 2 autopista). Se empieza sin ninguna: las construyen los jugadores.
        this.road = new Int8Array(G.N * 6);
        this.broken = new Int8Array(G.N * 6);   // tramos rotos: la clase que tenían, en los dos sentidos
        this.fort = new Uint8Array(G.N);   // nivel de la fortificación terminada (1 a 4; 0, ninguna)
        this.fortWork = new Map();          // celda → { owner, left, up }: obras en curso (up: reparación de un nivel)
        this.roadWork = new Map();          // tramo (edgeKey) → { owner, left, cls }: reparaciones en curso
        this.fortVersion = 0;

        this.owner = new Int16Array(G.N).fill(-1);
        for (const i of G.land) this.owner[i] = PROVINCES[G.prov[i]].country;
        // Dueño legal: el que controla una casilla en guerra (owner) no la posee hasta que se firma la paz.
        this.legal = Int16Array.from(this.owner);
        this.nations = E.countries.map((c, id) => ({
            id, key: c.key, name: c.name, color: c.color,
            capitalCell: PROVINCES[c.capital].city, capitalName: PROVINCES[c.capital].cityName,
            gold: 0, alive: true, recruited: new Map(), overlord: -1, templates: [], command: newCommand(),
            tech: { done: new Set(), progress: new Map(), current: [] },  // investigación: hechas, turnos invertidos, en curso
            lastTurn: 0,   // último turno en que empezó a jugar (ver nextOwnTurn)
            airFund: 0   // oro que la IA aparta para su próximo escuadrón (ver aiRecruit)
        }));
        const n = this.nations.length;
        this.relations = Array.from({ length: n }, () => []);
        for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
            const r = { state: 'paz', since: 0, truceUntil: 0 };
            this.relations[a][b] = r; this.relations[b][a] = r;
        }

        this.armies = new Map();
        this.armyAt = new Int32Array(G.N);
        this.nextArmyId = 1;
        for (const p of PROVINCES) {
            const units = { ...emptyUnits(), infantry: 1 };   // guarnición en cada ciudad
            if (p.forces) for (const k of UNIT_KEYS) units[k] += p.forces[k] ?? 0;
            this.settle(this.newArmy(p.country, p.city, units, 0));
        }
        // Aviación: escuadrones con base en un aeródromo (4 como mucho en cada uno) y la que tenía cada país en 2024.
        this.squadrons = new Map();   // id → { id, owner, base, ready, flown, patrol, op, task, damaged }
        this.nextSquadronId = 1;
        this.airfields = new Map();   // casilla → { owner, left, downUntil }: left, turnos de obra; downUntil, inservible hasta
        this.aaSites = new Map();     // casilla → { owner, left, hits, known }: antiaéreo fijo; known, quién lo conoce
        this.aaCache = null;          // aaList(): el antiaéreo que dispara, con la clave de versiones con que se calculó
        this.airVersion = 0;          // cambia con escuadrones, aeródromos y antiaéreos
        this.airHits = new Map();     // casilla × 8 + misión → turno: el blanco ya ha recibido su acierto de ese turno
        this.airSeen = new Map();     // país × casillas + casilla → turno: una misión suya la ha desvelado ese turno
        this.sats = [];               // { owner, cell, left }: satélites en órbita sobre `cell`; left, turnos de su dueño
        this.seedAir();
        this.configure({ aggression: 'normal', alliances: 'reales', victory: 0.5, fog: true });
        for (const nat of this.nations) nat.gold = this.income(nat.id) * CONFIG.START_GOLD_TURNS;
        this.log("SISTEMA DE COMANDO ONLINE. Configura la partida y elige tu nación.");
    }

    // Ajustes elegidos antes de empezar: agresividad de la IA, alianzas iniciales, victoria.
    configure(settings) {
        this.settings = { ...settings, fog: !!settings.fog };
        this.ai = AGGRESSION[settings.aggression];
        this.blocs = [];
        this.nextBlocId = 1;
        if (settings.alliances === 'reales') {
            for (const [name, keys] of Object.entries(E.alliances)) {
                const ids = keys.map(k => this.nations.findIndex(x => x.key === k)).filter(i => i >= 0);
                const bloc = this.createBloc(ids[0], name, false);
                for (const id of ids) bloc.members.add(id);
            }
        }
        this.blocsChanged();
    }

    // --- Guardar / cargar ---
    serialize() {
        // propietarios de las casillas de tierra, comprimidos por tramos [dueño, cuántas]
        const compress = arr => {
            const out = [];
            for (const i of G.land) {
                const o = arr[i], last = out[out.length - 1];
                if (last && last[0] === o) last[1]++; else out.push([o, 1]);
            }
            return out;
        };
        const runs = compress(this.owner);
        const relations = [];
        for (let a = 0; a < this.nations.length; a++) for (let b = a + 1; b < this.nations.length; b++) {
            const r = this.relations[a][b];
            if (r.state !== 'paz' || r.since || r.truceUntil) relations.push([a, b, r.state, r.since, r.truceUntil]);
        }
        return {
            format: 'eurowar-1', mapId: MAP_ID, map: `${G.land.length}:${PROVINCES.length}`, move: MOVE,
            seed: this.seed, rng: this.rng.state, turn: this.turn, player: this.player, over: this.over, won: this.won,
            settings: this.settings, logs: this.logs.slice(-150), proposals: this.proposals, proposed: [...this.proposedThisTurn],
            owner: runs, legal: compress(this.legal), dev: Array.from(this.dev), roads: this.roadEdges(), broken: this.brokenEdges(),
            fortLv: G.land.filter(i => this.fort[i]).map(i => [i, this.fort[i]]), fortWork: [...this.fortWork].map(([c, w]) => [c, w.owner, w.left, w.up ? 1 : 0]),
            roadWork: [...this.roadWork].map(([k, w]) => [k, w.owner, w.left, w.cls]),
            spies: [...this.spies].map(([pid, s]) => [pid, s.since, s.revealedTurn]),
            sieges: [...this.sieges].map(([c, s]) => [c, s.by, s.prev, s.held]),
            nations: this.nations.map(n => ({ gold: n.gold, airFund: n.airFund, alive: n.alive, recruited: [...n.recruited], overlord: n.overlord, templates: n.templates, command: n.command,
                tech: { done: [...n.tech.done], progress: [...n.tech.progress], current: [...n.tech.current] } })),
            relations,
            armies: [...this.armies.values()].map(a => [a.id, a.owner, a.cell, a.units.infantry, a.units.tank, a.units.artillery, a.used, a.hunger || 0, a.disorgUntil || 0, a.units.antiair || 0]),
            nextArmyId: this.nextArmyId,
            ops: [...this.ops.values()].map(o => ({ id: o.id, owner: o.owner, kind: o.kind, name: o.name, cells: o.cells, ratio: o.ratio, auto: o.auto,
                paused: o.paused, fortify: o.fortify, since: o.since, waiting: o.waiting, front: o.front ?? -1, drawn: o.drawn, state: o.state, rel: o.rel, gold: o.gold, extra: o.extra ?? 0, poolTurn: o.poolTurn ?? 0, template: o.template, pool: o.pool, formed: o.formed, aims: o.aims,
                form: o.form ? { name: o.form.name, units: o.form.units, zone: o.form.zone, recruited: o.form.recruited, pending: o.form.pending } : null })),
            armyForms: [...this.armies.values()].filter(a => a.form).map(a => [a.id, a.form]),
            nextOpId: this.nextOpId,
            armyOps: [...this.armies.values()].filter(a => a.op).map(a => [a.id, a.op]),
            armyFrom: [...this.armies.values()].filter(a => a.from).map(a => [a.id, a.from]),
            orders: [...this.armies.values()].filter(a => a.order).map(a => [a.id, a.order.kind, a.order.dest, a.order.target, a.order.ratio, a.order.flee ? 1 : 0, a.order.since, a.order.stuck]),
            blocs: this.blocs.map(b => ({ id: b.id, name: b.name, founder: b.founder, secret: b.secret, since: b.since, members: [...b.members] })),
            nextBlocId: this.nextBlocId,
            air: { sq: [...this.squadrons.values()].map(q => [q.id, q.owner, q.base, q.ready, q.flown, q.patrol, q.op, q.task ? q.task.cell : -1, q.task ? q.task.aims : [], q.damaged ? 1 : 0]), nextSq: this.nextSquadronId,
                fields: [...this.airfields].map(([c, f]) => [c, f.owner, f.left, f.downUntil]),
                aa: [...this.aaSites].map(([c, s]) => [c, s.owner, s.left, s.hits, [...s.known]]),
                hits: [...this.airHits].filter(([, t]) => t === this.turn).map(([k]) => k),
                seen: [...this.airSeen].filter(([, t]) => t === this.turn).map(([k]) => k),
                sats: this.sats.map(s => [s.owner, s.cell, s.left]) }
        };
    }

    static load(data) {
        if (data?.format !== 'eurowar-1') throw new Error('El archivo no es una partida de NanWar.');
        const mapId = data.mapId ?? 'europa';   // las partidas de antes del selector son todas de Europa
        if (mapId !== MAP_ID) throw new Error(`La partida es del mapa ${Object.prototype.hasOwnProperty.call(MAPS, mapId) ? MAPS[mapId].name : 'desconocido'}.`);
        if (data.map !== `${G.land.length}:${PROVINCES.length}`) throw new Error(`La partida se guardó con otra versión del mapa ${MAP.name}.`);
        // Todo lo que llega del archivo se valida antes de usarlo: enteros dentro de rango, índices de países,
        // casillas y provincias válidos, textos acotados y claves conocidas. Un archivo manipulado no puede
        // colar datos raros (ni HTML) en la partida.
        const NN = E.countries.length;
        const int = (v, min, max, def = min) => { const n = Math.trunc(Number(v)); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
        const nat = v => int(v, 0, NN - 1, 0);
        const natOrNone = v => int(v, -1, NN - 1, -1);
        const cellIdx = v => int(v, 0, G.N - 1, 0);
        const provIdx = v => int(v, 0, PROVINCES.length - 1, 0);
        const list = v => (Array.isArray(v) ? v : []);
        const str = (v, max = 300) => String(v ?? '').slice(0, max);
        const units = (u, max = 99) => Object.fromEntries(UNIT_KEYS.map(k => [k, int(u?.[k], 0, max, 0)]));   // la que falta, 0

        const g = new GameEngine(int(data.seed, 1, 2147483646, 1));
        g.rng.state = int(data.rng, -2147483648, 2147483647, 0);
        g.turn = int(data.turn, 1, 1e6, 1);
        const player = natOrNone(data.player);
        g.player = data.player === null || player < 0 ? null : player;
        g.over = !!data.over;
        g.won = !!data.won;
        g.logs = list(data.logs).slice(-400).map(l => ({ turn: int(l?.turn, 0, 1e6, 0), msg: str(l?.msg) }));
        g.proposals = list(data.proposals).filter(p => ['paz', 'bloque', 'llamada'].includes(p?.kind)).map(p => (
            p.kind === 'llamada' ? { kind: 'llamada', from: nat(p.from), against: nat(p.against) }
            : p.kind === 'bloque' ? { kind: 'bloque', from: nat(p.from), blocId: p.blocId === null || p.blocId === undefined ? null : int(p.blocId, 0, 1e6, 0) }
            : { kind: 'paz', from: nat(p.from) }));
        g.proposedThisTurn = new Set(list(data.proposed).map(x => str(x, 40)));
        const s = data.settings ?? {};
        g.settings = {
            aggression: Object.prototype.hasOwnProperty.call(AGGRESSION, s.aggression) ? s.aggression : 'normal',
            alliances: ['reales', 'ninguna'].includes(s.alliances) ? s.alliances : 'reales',
            victory: [0.5, 0.75, 1].includes(Number(s.victory)) ? Number(s.victory) : 0.5,
            fog: true   // la niebla de guerra es obligatoria (también en partidas guardadas sin ella)
        };
        g.ai = AGGRESSION[g.settings.aggression];

        const runs = (src, arr) => {
            let k = 0;
            for (const r of list(src)) {
                const o = nat(r?.[0]), count = int(r?.[1], 0, G.land.length, 0);
                for (let j = 0; j < count && k < G.land.length; j++) arr[G.land[k++]] = o;
            }
        };
        runs(data.owner, g.owner);
        g.legal = Int16Array.from(g.owner);   // partidas anteriores a las disputas: todo lo controlado es legal
        if (data.legal) runs(data.legal, g.legal);
        if (Array.isArray(data.dev)) g.dev = Uint16Array.from(PROVINCES.map((_, i) => int(data.dev[i], 0, 1000, 0)));
        const roads = list(data.roads ?? data.builtRoads);   // builtRoads: partidas guardadas antes de que se pudieran cortar
        for (let i = 0; i + 2 < roads.length; i += 3) {
            const a = cellIdx(roads[i]), d = int(roads[i + 1], 0, 5, 0), cls = int(roads[i + 2], 0, 2, 0), b = G.nb[a * 6 + d];
            if (b < 0) continue;
            g.road[a * 6 + d] = cls;
            g.road[b * 6 + (d + 3) % 6] = cls;
        }
        const broken = list(data.broken);
        for (let i = 0; i + 2 < broken.length; i += 3) {
            const a = cellIdx(broken[i]), d = int(broken[i + 1], 0, 5, 0), cls = int(broken[i + 2], 0, 2, 0), b = G.nb[a * 6 + d];
            if (b < 0 || !cls) continue;
            g.broken[a * 6 + d] = cls;
            g.broken[b * 6 + (d + 3) % 6] = cls;
        }
        // Fortificaciones con su nivel. Las de antes de los niveles (forts) toman el máximo de su dueño cuando ya se
        // conoce su investigación, más abajo.
        for (const x of list(data.fortLv)) g.fort[cellIdx(x?.[0])] = int(x?.[1], 1, 4, 1);
        const oldForts = data.fortLv ? [] : list(data.forts).map(cellIdx);
        g.fortWork = new Map(list(data.fortWork).map(w => [cellIdx(w?.[0]), { owner: nat(w?.[1]), left: int(w?.[2], 0, 100, 0), up: !!w?.[3] }])
            .filter(([c, w]) => !w.up || g.fort[c]));   // una reparación, solo sobre una fortificación
        g.roadWork = new Map();
        for (const w of list(data.roadWork)) {
            const key = int(w?.[0], 0, G.N * 6 - 1, -1), cls = int(w?.[3], 1, 2, 0);
            if (key < 0 || !cls) continue;
            const u = Math.floor(key / 6), d = key % 6;
            if (u >= G.N || G.nb[u * 6 + d] < 0 || edgeKey(u, d) !== key || !g.broken[u * 6 + d]) continue;   // solo sobre un tramo roto
            g.roadWork.set(key, { owner: nat(w?.[1]), left: int(w?.[2], 0, 100, 0), cls });
        }
        g.spies = new Map(list(data.spies).map(x => [provIdx(x?.[0]), { since: int(x?.[1], 0, 1e6, 0), revealedTurn: int(x?.[2], -1, 1e6, -1) }]));
        g.sieges = new Map(list(data.sieges).map(x => [cellIdx(x?.[0]), { by: nat(x?.[1]), prev: nat(x?.[2]), held: int(x?.[3], 0, CONFIG.SIEGE_TURNS, 0) }])
            .filter(([c]) => CITY_OF[c] >= 0));
        // Investigación: solo identificadores conocidos, cada nivel con el anterior hecho y progresos posibles.
        const techOf = v => {
            const ids = new Set(list(v?.done).map(x => str(x, 40)));
            const done = new Set(), ready = t => t.tier === 1 || done.has(t.branch + (t.tier - 1));
            for (const t of TECHS) if (ids.has(t.id) && ready(t)) done.add(t.id);
            const progress = new Map();
            for (const x of list(v?.progress)) {
                const t = TECH_BY_ID.get(str(x?.[0], 40)), p = Number(x?.[1]);
                if (t && !done.has(t.id) && ready(t) && Number.isInteger(p) && p >= 0 && p < CONFIG.RESEARCH.TURNS[t.tier - 1]) progress.set(t.id, p);
            }
            const current = [...new Set(list(v?.current).map(x => str(x, 40)))].filter(x => progress.has(x)).slice(0, done.has('ciencia3') ? 2 : 1);
            return { done, progress, current };
        };
        list(data.nations).slice(0, NN).forEach((n, i) => Object.assign(g.nations[i], {
            gold: int(n?.gold, -1e9, 1e12, 0),
            airFund: int(n?.airFund, 0, CONFIG.AIR.SQUADRON_COST, 0),
            alive: !!n?.alive,
            recruited: new Map(list(n?.recruited).map(x => [provIdx(x?.[0]), int(x?.[1], 0, 1e6, 0)])),
            overlord: natOrNone(n?.overlord ?? -1),
            command: (() => {
                const c = n?.command ?? {}, out = newCommand();
                if (Object.hasOwn(POSTURES, c.posture)) out.posture = c.posture;
                out.spend = !!c.spend;
                out.share = int(c.share, 0, 100, 60);
                for (const k of Object.keys(BUDGET_KEYS)) out.budget[k] = int(c.budget?.[k], 0, 100, out.budget[k]);
                for (const k of Object.keys(out.pools)) out.pools[k] = int(c.pools?.[k], 0, 1e8, 0);
                out.spentTurn = int(c.spentTurn, 0, 1e6, 0);
                out.goals = [...new Set(list(c.goals).slice(0, 400).map(provIdx))];
                out.goalsMet = [...new Set(list(c.goalsMet).map(nat))];
                for (const [k, v] of Object.entries(c.priority ?? {})) if (Object.hasOwn(PRIORITY, v) && Number.isInteger(+k) && +k >= 0 && +k < NN) out.priority[+k] = v;
                out.rear = !!c.rear;
                out.warned = [...new Set(list(c.warned).map(nat))];
                return out;
            })(),
            templates: list(n?.templates).slice(0, TPL_OWN_MAX).map(t => ({ name: str(t?.name, 40) || 'Plantilla', units: units(t?.units, TPL_MAX) }))
                .filter(t => countUnits(t.units) > 0),
            tech: techOf(n?.tech)
        }));
        g.techVersion++;   // lo calculado hasta aquí no conocía la investigación
        for (const c of oldForts) g.fort[c] = g.owner[c] >= 0 ? g.fortMax(g.owner[c]) : 1;
        for (const row of g.relations) for (const r of row) if (r) Object.assign(r, { state: 'paz', since: 0, truceUntil: 0 });
        for (const x of list(data.relations)) {
            const a = nat(x?.[0]), b = nat(x?.[1]);
            if (a === b) continue;
            Object.assign(g.relations[a][b], { state: x?.[2] === 'guerra' ? 'guerra' : 'paz', since: int(x?.[3], 0, 1e6, 0), truceUntil: int(x?.[4], 0, 1e6, 0) });
        }
        g.warVersion++;
        g.armies = new Map();
        g.armyAt = new Int32Array(G.N);
        // Las partidas de antes de los doceavos contaban el movimiento en sextos: el gastado se duplica. Las de antes de la
        // Antiaérea no traen el índice 9: 0 antiaéreas.
        const moveScale = data.move === MOVE ? 1 : MOVE / 6;
        for (const x of list(data.armies)) {
            const id = int(x?.[0], 1, 1e9, 1), cell = x?.[2];
            if (!Number.isInteger(cell) || cell < 0 || cell >= G.N || g.armyAt[cell] || g.armies.has(id)) continue;   // una casilla inválida no se cambia por otra
            g.armies.set(id, { id, owner: nat(x?.[1]), cell, units: { infantry: int(x?.[3], 0, 1e6, 0), tank: int(x?.[4], 0, 1e6, 0), artillery: int(x?.[5], 0, 1e6, 0), antiair: int(x?.[9], 0, 1e6, 0) }, used: Math.min(999, int(x?.[6], 0, 999, 0) * (x?.[6] >= 999 ? 1 : moveScale)), from: 0, hunger: int(x?.[7], 0, 99, 0), disorgUntil: int(x?.[8], 0, 1e6, 0) });
            g.armyAt[cell] = id;
        }
        g.nextArmyId = Math.max(int(data.nextArmyId, 1, 1e9, 1), ...[...g.armies.keys()].map(x => x + 1), 1);
        const kinds = ['march', 'attack', 'hold', 'fortify', 'follow'];
        g.blocs = list(data.blocs).map(b => ({ id: int(b?.id, 1, 1e6, 1), name: str(b?.name, 40), founder: nat(b?.founder), secret: !!b?.secret,
            since: int(b?.since, 0, 1e6, 0), members: new Set(list(b?.members).map(nat)) }));
        g.nextBlocId = Math.max(int(data.nextBlocId, 1, 1e6, 1), ...g.blocs.map(b => b.id + 1), 1);
        g.blocsChanged();
        g.version++; g.roadVersion++; g.fortVersion++;
        // Operaciones: tipos, casillas, nombres y ajustes conocidos; los ejércitos, solo si son del mismo dueño.
        for (const o of list(data.ops).slice(0, 5000)) {
            const kind = ['ofensiva', 'defensa', 'reserva'].find(k => k === o?.kind), id = int(o?.id, 1, 1e6, 0);
            if (!kind || !id || g.ops.has(id)) continue;
            const cells = list(o.cells).slice(0, 400).map(c => int(c, -1, G.N - 1, -1)).filter(c => c >= 0 && isLand(c));
            const ok = kind === 'ofensiva' ? cells.length >= 2 : kind === 'defensa' ? cells.length >= 1 : cells.length === 1;
            if (!ok) continue;
            g.ops.set(id, { id, owner: nat(o.owner), kind, name: str(o.name, 60) || 'Operación', cells: kind === 'ofensiva' ? cells : [...new Set(cells)],
                ratio: [0, 1, 1.3, 1.8].includes(Number(o.ratio)) ? Number(o.ratio) : 1.3, auto: ['manual', 'asistida', 'auto'].find(k => k === o.auto) ?? 'manual',
                paused: !!o.paused, fortify: !!o.fortify, since: int(o.since, 0, 1e6, g.turn), waiting: int(o.waiting, 0, 1e4, 0), uncovered: 0,
                front: natOrNone(o.front ?? -1), extra: int(o.extra, 0, 1e7, 0), poolTurn: int(o.poolTurn, 0, 1e6, 0), gold: OP_GOLD.includes(Number(o.gold)) ? Number(o.gold) : 0, template: str(o.template, 12) || 'auto', pool: int(o.pool, 0, 1e7, 0), formed: int(o.formed, 0, 1e4, 0), form: null,
                aims: Array.isArray(o.aims) ? [...new Set(o.aims.filter(k => Object.hasOwn(OP_AIMS, k)))] : [...OP_AIM_DEFAULT[kind]] });   // las de antes de la aviación, los de serie
            const op = g.ops.get(id);
            if (kind === 'defensa') {
                const drawn = [...new Set(list(o.drawn).slice(0, 400).map(c => int(c, -1, G.N - 1, -1)).filter(c => c >= 0 && isLand(c)))];
                op.drawn = drawn.length ? drawn : [...op.cells];
                op.state = ['aguanta', 'repliega', 'restablece'].find(k => k === o.state) ?? 'aguanta';
                op.rel = Number.isFinite(o.rel) ? Math.max(0, Math.min(1e3, o.rel)) : null;
            } else { op.drawn = null; op.state = 'aguanta'; op.rel = null; }
            const f = o.form;
            const zone = int(f?.zone, -1, G.N - 1, -1);
            if (f && zone >= 0 && isLand(zone)) op.form = { name: str(f.name, 40), units: units(f.units), zone, recruited: units(f.recruited),
                pending: list(f.pending).slice(0, 200).map(x => [int(x?.[0], -1, G.N - 1, -1), units(x?.[1])]).filter(([c]) => c >= 0 && CITY_OF[c] >= 0) };
        }
        g.nextOpId = Math.max(int(data.nextOpId, 1, 1e6, 1), ...[...g.ops.keys()].map(x => x + 1), 1);
        for (const x of list(data.armyForms)) {
            const a = g.armies.get(int(x?.[0], 1, 1e9, 0)), op = g.ops.get(int(x?.[1], 1, 1e6, 0));
            if (a && op && op.owner === a.owner && op.form) a.form = op.id;
        }
        for (const x of list(data.armyOps)) {
            const a = g.armies.get(int(x?.[0], 1, 1e9, 0)), op = g.ops.get(int(x?.[1], 1, 1e6, 0));
            if (a && op && op.owner === a.owner) a.op = op.id;
        }
        for (const x of list(data.armyFrom)) {
            const a = g.armies.get(int(x?.[0], 1, 1e9, 0)), op = g.ops.get(int(x?.[1], 1, 1e6, 0));
            if (a && op && op.owner === a.owner && op.kind === 'defensa') a.from = op.id;
        }
        // Órdenes: solo de ejércitos que existen y con destinos que se pueden cumplir (si no, se descartan).
        for (const x of list(data.orders)) {
            const a = g.armies.get(int(x?.[0], 1, 1e9, 0)), kind = kinds.find(k => k === x?.[1]);
            if (!a || a.order || !kind) continue;
            if (g.setOrder(a, { kind, dest: int(x?.[2], -1, G.N - 1, -1), target: int(x?.[3], 0, 1e9, 0), ratio: [0, 1, 1.3, 1.8].includes(Number(x?.[4])) ? Number(x[4]) : 1.3, flee: !!x?.[5] }))
                Object.assign(a.order, { since: int(x?.[6], 0, 1e6, g.turn), stuck: int(x?.[7], 0, 3, 0) });
        }
        // Aviación: lo que sembró el constructor se tira. Aeródromos y antiaéreos en tierra; escuadrones con id único, en
        // un aeródromo de su mismo dueño y con sitio, y en una operación solo si es suya; quién conoce un antiaéreo, solo
        // países que existen. Las partidas de antes de la aviación la reciben ahora, según quién tiene qué ciudades.
        g.squadrons = new Map(); g.airfields = new Map(); g.aaSites = new Map(); g.airHits = new Map(); g.airSeen = new Map(); g.nextSquadronId = 1;
        if (data.air) {
            for (const x of list(data.air.fields)) {
                const c = int(x?.[0], -1, G.N - 1, -1);
                if (c < 0 || !isLand(c) || g.airfields.has(c)) continue;
                g.airfields.set(c, { owner: nat(x?.[1]), left: int(x?.[2], 0, 100, 0), downUntil: int(x?.[3], 0, 1e6, 0) });
            }
            const based = new Map();   // escuadrones por aeródromo
            for (const x of list(data.air.sq)) {
                const id = int(x?.[0], 1, 1e9, 0), owner = nat(x?.[1]), base = int(x?.[2], -1, G.N - 1, -1), op = g.ops.get(int(x?.[6], 0, 1e6, 0));
                if (!id || g.squadrons.has(id) || g.airfields.get(base)?.owner !== owner || (based.get(base) ?? 0) >= CONFIG.AIR.PER_AIRFIELD) continue;
                based.set(base, (based.get(base) ?? 0) + 1);
                const sq = { id, owner, base, ready: int(x?.[3], 0, 1e6, 0), flown: int(x?.[4], 0, 1e6, 0), patrol: int(x?.[5], -1, G.N - 1, -1),
                    op: op && op.owner === owner ? op.id : 0, task: null, damaged: x?.[9] === 1 };   // las de antes no traen el 9: no dañado
                if (!sq.op) g.setAirTask(sq, int(x?.[7], -1, G.N - 1, -1) >= 0 ? { cell: int(x[7], 0, G.N - 1, 0), aims: list(x?.[8]).slice(0, 8) } : null);
                g.squadrons.set(id, sq);
            }
            g.nextSquadronId = Math.max(int(data.air.nextSq, 1, 1e9, 1), ...[...g.squadrons.keys()].map(x => x + 1), 1);
            for (const x of list(data.air.aa)) {
                const c = int(x?.[0], -1, G.N - 1, -1);
                if (c < 0 || !isLand(c) || g.aaSites.has(c)) continue;
                const known = new Set(list(x?.[4]).filter(k => Number.isInteger(k) && k >= 0 && k < NN));
                g.aaSites.set(c, { owner: nat(x?.[1]), left: int(x?.[2], 0, CONFIG.AIR.AA_TURNS, 0), hits: int(x?.[3], 0, 1, 0), known });
            }
            // Los aciertos y lo desvelado de este turno (solo se guardan esos).
            for (const k of list(data.air.hits)) if (Number.isInteger(k) && k >= 0 && k < G.N * 8) g.airHits.set(k, g.turn);
            for (const k of list(data.air.seen)) if (Number.isInteger(k) && k >= 0 && k < NN * G.N) g.airSeen.set(k, g.turn);
            // Satélites: en una casilla del mapa y con los turnos que dura uno de su dueño como mucho.
            for (const x of list(data.air.sats)) {
                const owner = nat(x?.[0]), c = int(x?.[1], -1, G.N - 1, -1);
                if (c >= 0 && g.nations[owner].alive) g.sats.push({ owner, cell: c, left: int(x?.[2], 1, g.rules(owner).satTurns, 1) });   // los de un país eliminado, no
            }
        } else g.seedAir();
        g.airVersion++;
        // Quién ya ha empezado este turno: el jugador, que es quien guarda; los demás juegan después.
        for (const n of g.nations) n.lastTurn = n.id === g.player ? g.turn : g.turn - 1;
        return g;
    }

    log(msg) { this.logs.push({ turn: this.turn, msg }); if (this.logs.length > 400) this.logs.shift(); }
    nm(id) { return this.nations[id].name; }
    involvesPlayer(...ids) { return ids.includes(this.player); }

    // --- Relaciones y alianzas ---
    rel(a, b) { return this.relations[a][b]; }
    atWar(a, b) { return a !== b && a >= 0 && b >= 0 && this.rel(a, b).state === 'guerra'; }
    allied(a, b) { return a !== b && a >= 0 && b >= 0 && this.alliedM[a * this.nations.length + b] === 1; }
    satellitesOf(id) { return this.nations.filter(n => n.alive && n.overlord === id).map(n => n.id); }
    isDisputed(cell) { return this.owner[cell] !== this.legal[cell]; }
    enemiesOf(id) { return this.nations.filter(n => n.alive && this.atWar(id, n.id)).map(n => n.id); }
    alliesOf(id) { return this.nations.filter(n => n.alive && this.allied(id, n.id)).map(n => n.id); }

    blocsChanged() {
        const n = this.nations.length;
        this.alliedM = new Uint8Array(n * n);
        for (const b of this.blocs) for (const x of b.members) for (const y of b.members) if (x !== y) this.alliedM[x * n + y] = 1;
        for (const s of this.nations) {
            if (!s.alive || s.overlord < 0) continue;
            for (const t of this.nations) {
                if (t.id === s.id || !t.alive) continue;
                if (t.id === s.overlord || t.overlord === s.overlord) { this.alliedM[s.id * n + t.id] = 1; this.alliedM[t.id * n + s.id] = 1; }
            }
        }
        this.blocVersion++;
    }
    createBloc(founder, name, secret) {
        const bloc = { id: this.nextBlocId++, name, founder, secret, members: new Set([founder]), since: this.turn };
        this.blocs.push(bloc);
        return bloc;
    }
    bloc(id) { return this.blocs.find(b => b.id === id); }
    blocsOf(id) { return this.blocs.filter(b => b.members.has(id)); }
    sharedBlocs(a, b) { return this.blocs.filter(bl => bl.members.has(a) && bl.members.has(b)); }
    // Alianzas que `viewer` conoce: las públicas y las secretas de las que es miembro.
    visibleBlocs(viewer) { return this.blocs.filter(b => !b.secret || b.members.has(viewer)); }
    knownAllies(viewer, id) {
        const out = new Set();
        for (const b of this.visibleBlocs(viewer)) if (b.members.has(id)) for (const m of b.members) if (m !== id && this.nations[m].alive) out.add(m);
        return [...out];
    }
    joinBloc(bloc, id) {
        bloc.members.add(id);
        this.blocsChanged();
        if (!bloc.secret || this.involvesPlayer(...bloc.members)) this.log(`${this.nm(id)} se une a ${bloc.name}.`);
    }
    leaveBloc(bloc, id, reason = '') {
        if (!bloc.members.delete(id)) return;
        if (!bloc.secret || this.involvesPlayer(id, ...bloc.members)) this.log(`${this.nm(id)} sale de ${bloc.name}${reason}.`);
        if (bloc.members.size === 0 || (bloc.members.size === 1 && !bloc.members.has(this.player))) {
            this.blocs = this.blocs.filter(b => b !== bloc);
            if (!bloc.secret) this.log(`${bloc.name} se disuelve.`);
        }
        this.blocsChanged();
    }
    reveal(bloc) {
        if (!bloc.secret) return;
        bloc.secret = false;
        this.log(`Se revela el pacto secreto «${bloc.name}»: ${[...bloc.members].map(m => this.nm(m)).join(', ')}.`);
    }

    // --- Economía ---
    // Casillas a las que llega la red de carreteras desde la capital, pasando por territorio propio o aliado. El mar
    // también une: un puerto propio al que llega la red la lleva a los demás puertos propios del mismo mar.
    reachedRoadCells(id) {
        const seen = new Uint8Array(G.N);
        const cap = this.nations[id].capitalCell;
        if (this.owner[cap] !== id) return seen;
        const spread = start => {
            const queue = [start];
            seen[start] = 1;
            for (let d = 0; d < 6; d++) {
                const j = G.nb[start * 6 + d];
                if (j >= 0 && this.owner[j] === id) { seen[j] = 1; queue.push(j); }
            }
            while (queue.length) {
                const u = queue.pop();
                for (let d = 0; d < 6; d++) {
                    if (!this.road[u * 6 + d]) continue;
                    const v = G.nb[u * 6 + d];
                    if (seen[v]) continue;
                    const o = this.owner[v];
                    if (o !== id && !this.allied(id, o)) continue;
                    seen[v] = 1;
                    queue.push(v);
                }
            }
        };
        spread(cap);
        const ports = PORTS.filter(p => this.owner[p.city] === id), seas = new Set();
        for (let grew = true; grew;) {
            grew = false;
            for (const p of ports) if (this.nearSeen(seen, p.city)) for (const s of p.seas) if (!seas.has(s)) { seas.add(s); grew = true; }
            for (const p of ports) if (!this.nearSeen(seen, p.city) && p.seas.some(s => seas.has(s))) { spread(p.city); grew = true; }
        }
        return seen;
    }
    nearSeen(seen, cell) {
        if (seen[cell]) return true;
        for (let d = 0; d < 6; d++) { const j = G.nb[cell * 6 + d]; if (j >= 0 && seen[j]) return true; }
        return false;
    }
    economy(id) {
        const key = `${this.version}:${this.roadVersion}:${this.blocVersion}:${this.devVersion}:${this.techVersion}`;
        const cached = this.econCache[id];
        if (cached && cached.key === key) return cached;
        const seen = this.reachedRoadCells(id);
        const connected = new Set();
        for (const p of PROVINCES) if (this.owner[p.city] === id && this.nearSeen(seen, p.city)) connected.add(p.id);
        let base = 0, road = 0, res = 0, dev = 0;
        for (const i of G.land) {
            if (this.owner[i] !== id) continue;
            const disputed = this.legal[i] !== id;
            const v = CELL_VALUE[i] * (disputed ? CONFIG.DISPUTED_INCOME : 1);
            base += v;
            dev += v * this.dev[G.prov[i]] / 1000;
            if (!disputed && connected.has(G.prov[i])) road += CELL_VALUE[i] * CONFIG.ROAD_BONUS;
        }
        // Un yacimiento siempre rinde su oro y abastece a su provincia. Si una carretera pasa por su casilla, abastece
        // también a las provincias cuya ciudad está en ese mismo tramo de red (territorio propio o aliado).
        const owned = RESOURCES.filter(r => this.owner[r.cell] === id);
        const rules = this.rules(id);
        for (const r of owned) res += r.value * (this.legal[r.cell] === id ? 1 : CONFIG.DISPUTED_INCOME) * rules.resIncome;
        const comp = this.roadComponents(id);
        const access = new Map();   // provincia → yacimientos que la abastecen
        for (const p of PROVINCES) {
            if (this.owner[p.city] !== id) continue;
            const near = new Set();
            if (comp[p.city] >= 0) near.add(comp[p.city]);
            for (let d = 0; d < 6; d++) { const j = G.nb[p.city * 6 + d]; if (j >= 0 && comp[j] >= 0) near.add(comp[j]); }
            const list = owned.filter(r => r.province === p.id || (comp[r.cell] >= 0 && near.has(comp[r.cell])));
            if (list.length) access.set(p.id, list);
        }
        let industry = 0;
        for (const i of G.land) {
            if (this.owner[i] !== id) continue;
            const list = access.get(G.prov[i]);
            if (!list) continue;
            const v = CELL_VALUE[i] * (this.legal[i] === id ? 1 : CONFIG.DISPUTED_INCOME) * (1 + this.dev[G.prov[i]] / 1000);
            industry += v * Math.min(rules.resIndustryMax, rules.resIndustry * list.length);
        }
        const resources = owned;
        const looseResources = owned.filter(r => comp[r.cell] < 0);   // sin carretera: solo abastecen a su provincia
        const byType = {};
        for (const r of owned) byType[r.type] = (byType[r.type] ?? 0) + 1;
        const capitalLost = this.owner[this.nations[id].capitalCell] !== id;
        if (capitalLost) { res *= CONFIG.CAPITAL_LOST_RESOURCES; industry *= CONFIG.CAPITAL_LOST_RESOURCES; }
        const legalProvinces = PROVINCES.filter(p => this.owner[p.city] === id && this.legal[p.city] === id).length;
        const empireRate = Math.max(0, Math.min(CONFIG.EMPIRE_MAX, (legalProvinces - START_PROVINCES[id]) * CONFIG.EMPIRE_PER_PROVINCE));
        const empire = (base + dev + road + industry) * empireRate;
        const e = { key, seen, connected, comp, access, base: Math.round(base), dev: Math.round(dev), road: Math.round(road), res: Math.round(res),
            capitalLost, industry: Math.round(industry), empire: Math.round(empire), empireRate, legalProvinces, byType, resources, looseResources,
            total: Math.round(base + dev + road + industry + empire + res) };
        this.econCache[id] = e;
        return e;
    }
    // Tributo: el satélite entrega una parte de sus ingresos a su señor.
    // Tramos de la red de carreteras de una nación: casillas propias o aliadas unidas por carretera, etiquetadas por componente.
    roadComponents(id) {
        const comp = new Int32Array(G.N).fill(-1);
        const friend = o => o === id || this.allied(id, o);
        let n = 0;
        for (const s of G.land) {
            if (comp[s] >= 0 || !friend(this.owner[s])) continue;
            let hasRoad = false;
            for (let d = 0; d < 6 && !hasRoad; d++) hasRoad = this.road[s * 6 + d] > 0;
            if (!hasRoad) continue;
            comp[s] = n;
            const stack = [s];
            while (stack.length) {
                const u = stack.pop();
                for (let d = 0; d < 6; d++) {
                    if (!this.road[u * 6 + d]) continue;
                    const v = G.nb[u * 6 + d];
                    if (comp[v] >= 0 || !friend(this.owner[v])) continue;
                    comp[v] = n;
                    stack.push(v);
                }
            }
            n++;
        }
        return comp;
    }
    // Provincias, además de la suya, a las que llega un yacimiento por carretera.
    resourceReach(r) {
        const o = this.owner[r.cell];
        if (o < 0) return [];
        return [...this.economy(o).access].filter(([pid, list]) => pid !== r.province && list.includes(r)).map(([pid]) => pid);
    }
    resourceLinked(r) { return this.resourceReach(r).length > 0; }
    // Yacimientos que abastecen a una provincia (para su dueño).
    provinceSupply(pid) { const o = this.owner[PROVINCES[pid].city]; return o >= 0 ? this.economy(o).access.get(pid) ?? [] : []; }
    tribute(id) {
        const n = this.nations[id];
        const out = n.overlord >= 0 ? Math.round(this.economy(id).total * CONFIG.TRIBUTE) : 0;
        const inn = this.satellitesOf(id).reduce((s, x) => s + Math.round(this.economy(x).total * CONFIG.TRIBUTE), 0);
        return { in: inn, out };
    }
    income(id) { const t = this.tribute(id); return this.economy(id).total - t.out + t.in; }
    // Alcance del suministro: casillas propias o aliadas cerca de la red de carreteras unida a la capital (por tierra o por
    // mar, de puerto a puerto) o de una ciudad propia.
    // Devuelve, por casilla, el alcance que le queda (−1 = sin suministro).
    supplyMap(id) {
        const key = `${this.version}:${this.roadVersion}:${this.blocVersion}:${this.techVersion}`;
        const cached = this.supplyCache[id];
        if (cached && cached.key === key) return cached.map;
        const net = this.economy(id).seen, R = this.rules(id).supplyRoad;
        const range = new Int8Array(G.N).fill(-1);
        const buckets = Array.from({ length: R + 1 }, () => []);
        const seed = (cell, r) => { if (range[cell] < r) { range[cell] = r; buckets[r].push(cell); } };
        for (const i of G.land) if (net[i]) seed(i, R);
        for (const p of PROVINCES) if (this.owner[p.city] === id) seed(p.city, CONFIG.SUPPLY_CITY_RANGE);
        for (let r = R; r > 0; r--) {
            for (const u of buckets[r]) {
                if (range[u] !== r) continue;
                for (let d = 0; d < 6; d++) {
                    const v = G.nb[u * 6 + d];
                    if (v < 0 || !isLand(v) || range[v] >= r - 1) continue;
                    const o = this.owner[v];
                    if (o !== id && !this.allied(id, o)) continue;
                    range[v] = r - 1;
                    buckets[r - 1].push(v);
                }
            }
        }
        this.supplyCache[id] = { key, map: range };
        return range;
    }
    inSupply(id, cell) { return this.supplyMap(id)[cell] >= 0; }
    powers() {
        const p = new Array(this.nations.length).fill(0);
        for (const a of this.armies.values()) { const r = this.rules(a.owner); p[a.owner] += unitPower(a.units, 'atk', r) + unitPower(a.units, 'def', r); }
        return p;
    }
    landCounts() {
        const n = new Array(this.nations.length).fill(0);
        for (const i of G.land) n[this.owner[i]]++;
        return n;
    }
    citiesOf(id) { return PROVINCES.filter(p => this.owner[p.city] === id); }

    borderSets() {
        if (this._borders && this._bordersVersion === this.version) return this._borders;
        const sets = this.nations.map(() => new Set());
        for (const i of G.land) {
            const a = this.owner[i];
            for (let d = 0; d < 3; d++) {
                const j = G.nb[i * 6 + d];
                if (j >= 0 && isLand(j) && this.owner[j] !== a) { sets[a].add(this.owner[j]); sets[this.owner[j]].add(a); }
            }
        }
        this._borders = sets; this._bordersVersion = this.version;
        return sets;
    }

    // --- Obras públicas ---
    roadEdgeCost(u, d, cls, mult = 1) {
        const cur = this.road[u * 6 + d];
        if (cur >= cls) return 0.01;   // tramo ya construido: casi gratis, pero se prefiere el trazado corto
        const v = G.nb[u * 6 + d];
        const t = Math.max(terrainOf(u).cost, terrainOf(v).cost) + RIVER[u * 6 + d];   // un puente cuesta como un tramo más
        const base = cls === 1 ? CONFIG.ROAD_COST : (cur === 1 ? CONFIG.HIGHWAY_COST : CONFIG.ROAD_COST + CONFIG.HIGHWAY_COST);
        return base * t * mult;
    }
    // Trazado más barato por territorio propio desde `from` hasta la primera casilla que cumpla `isTarget`.
    planRoad(id, from, isTarget, cls) {
        if (this.owner[from] !== id) return null;
        const dist = new Map([[from, 0]]), prev = new Map(), heap = new MinHeap(), mult = this.rules(id).roadCost;
        heap.push(0, from);
        let goal = -1;
        while (heap.size) {
            const [d0, u] = heap.pop();
            if (d0 > dist.get(u)) continue;
            if (u !== from && isTarget(u)) { goal = u; break; }
            for (let d = 0; d < 6; d++) {
                const v = G.nb[u * 6 + d];
                if (v < 0 || !isLand(v) || this.owner[v] !== id) continue;
                const nd = d0 + this.roadEdgeCost(u, d, cls, mult);
                if (nd < (dist.get(v) ?? Infinity)) { dist.set(v, nd); prev.set(v, u); heap.push(nd, v); }
            }
        }
        if (goal < 0) return null;
        const path = [goal];
        for (let c = goal; c !== from; c = prev.get(c)) path.push(prev.get(c));
        path.reverse();
        return { path, cost: Math.round(dist.get(goal)), cls };
    }
    // Tramo de carretera (sin autopista) que pasa por `cell`, de ciudad o cruce a ciudad o cruce, por territorio propio:
    // lo que se puede pasar a autopista de una vez. Desde una ciudad o un cruce, todos los tramos que salen de ella.
    roadStretch(id, cell) {
        const degree = c => { let n = 0; for (let d = 0; d < 6; d++) if (this.road[c * 6 + d]) n++; return n; };
        const edges = [], seen = new Set();
        for (let d0 = 0; d0 < 6; d0++) {
            if (this.road[cell * 6 + d0] !== 1) continue;
            for (let u = cell, d = d0; ;) {
                const v = G.nb[u * 6 + d], key = u < v ? u * 6 + d : v * 6 + (d + 3) % 6;
                if (seen.has(key) || this.owner[u] !== id || this.owner[v] !== id) break;
                seen.add(key);
                edges.push([u, d]);
                if (CITY_OF[v] >= 0 || degree(v) !== 2) break;
                const next = [0, 1, 2, 3, 4, 5].find(k => k !== (d + 3) % 6 && this.road[v * 6 + k] === 1);
                if (next === undefined) break;   // sigue en autopista: el tramo acaba aquí
                u = v; d = next;
            }
        }
        if (!edges.length) return null;
        const mult = this.rules(id).roadCost;
        const cost = Math.round(edges.reduce((sum, [u, d]) => sum + this.roadEdgeCost(u, d, 2, mult), 0));
        const ends = [...new Set(edges.flatMap(([u, d]) => [u, G.nb[u * 6 + d]]))];
        return { edges, cost, cls: 2, upgrade: true, ends };
    }
    upgradeRoad(id, plan) {
        const n = this.nations[id];
        if (!plan?.edges?.length || plan.cost > n.gold) return 0;
        let done = 0;
        for (const [u, d] of plan.edges) {
            const v = G.nb[u * 6 + d];
            if (this.road[u * 6 + d] !== 1 || this.owner[u] !== id || this.owner[v] !== id) continue;
            this.road[u * 6 + d] = 2; this.road[v * 6 + (d + 3) % 6] = 2;
            done++;
        }
        if (!done) return 0;
        n.gold -= plan.cost;
        this.roadVersion++;
        return done;
    }
    // Tramos nuevos y mejorados de un trazado (para explicar el precio).
    roadSplit(plan) {
        let fresh = 0, up = 0;
        for (let i = 0; i + 1 < plan.path.length; i++) {
            const a = plan.path[i], d = G.dirTo(a, plan.path[i + 1]), cur = d >= 0 ? this.road[a * 6 + d] : 0;
            if (cur >= plan.cls) continue;
            if (cur) up++; else fresh++;
        }
        return { fresh, up };
    }
    // Construye los tramos que falten del trazado; devuelve cuántos se construyeron (0 si ya existían o no hay fondos).
    roadEdges() {
        const out = [];
        for (const i of G.land) for (let d = 0; d < 3; d++) if (this.road[i * 6 + d]) out.push(i, d, this.road[i * 6 + d]);
        return out;
    }
    brokenEdges() {
        const out = [];
        for (const i of G.land) for (let d = 0; d < 3; d++) if (this.broken[i * 6 + d]) out.push(i, d, this.broken[i * 6 + d]);
        return out;
    }
    // Rompe los tramos intactos de la casilla (quedan con su clase en `broken`); devuelve cuántos.
    breakRoads(cell) {
        let n = 0;
        for (let d = 0; d < 6; d++) {
            const cls = this.road[cell * 6 + d];
            if (!cls) continue;
            const j = G.nb[cell * 6 + d], r = (d + 3) % 6;
            this.road[cell * 6 + d] = 0; this.road[j * 6 + r] = 0;
            this.broken[cell * 6 + d] = cls; this.broken[j * 6 + r] = cls;
            n++;
        }
        if (n) this.roadVersion++;
        return n;
    }
    // Camino más corto (en casillas) por territorio propio: la línea que se fortifica.
    planFort(id, from, to) {
        if (this.owner[from] !== id || this.owner[to] !== id) return null;
        const prev = new Map([[from, -1]]), queue = [from];
        for (let i = 0; i < queue.length && !prev.has(to); i++) {
            const u = queue[i];
            for (let d = 0; d < 6; d++) {
                const v = G.nb[u * 6 + d];
                if (v < 0 || prev.has(v) || !isLand(v) || this.owner[v] !== id) continue;
                prev.set(v, u);
                queue.push(v);
            }
        }
        if (!prev.has(to)) return null;
        const path = [];
        for (let c = to; c !== -1; c = prev.get(c)) path.push(c);
        path.reverse();
        const cells = path.filter(c => !this.fort[c] && !this.fortWork.has(c));
        return { path, cells, cost: cells.length * this.rules(id).fortCost, cls: 'fort' };
    }
    // La obra nace al nivel máximo de su dueño cuando termina (en beginNationTurn).
    buildFort(id, plan) {
        const n = this.nations[id];
        if (!plan || !plan.cells.length || plan.cost > n.gold) return 0;
        for (const c of plan.cells) this.fortWork.set(c, { owner: id, left: this.rules(id).fortTurns });
        n.gold -= plan.cost;
        this.fortVersion++;
        return plan.cells.length;
    }
    // Nivel de una fortificación nueva de `id`: 1 (sacos terreros) más su nivel de Fortificación.
    fortMax(id) { return 1 + this.techLevel(id, 'fortificacion'); }
    // Reparar una fortificación dañada de `id`: sube un nivel por obra y cuesta la mitad de fortificar. Solo si es suya
    // (también su dueño legal: la tierra ocupada no se repara), está por debajo de su máximo, no tiene obra y no hay
    // enemigos al lado.
    fortRepairPlan(id, cell) {
        if (this.fortRepairWhy(id, cell)) return null;
        return { cell, cost: Math.round(this.rules(id).fortCost / 2), cls: 'fortRepair' };
    }
    // Por qué `id` no puede reparar la fortificación de `cell`, en pocas palabras ('' si puede).
    fortRepairWhy(id, cell) {
        if (cell < 0 || this.owner[cell] !== id) return 'no es tuya';
        if (this.legal[cell] !== id) return 'es tierra ocupada';
        if (!this.fort[cell]) return 'no hay fortificación';
        if (this.fort[cell] >= this.fortMax(id)) return 'está intacta';
        if (this.fortWork.has(cell)) return 'ya está en obra';
        if (this.repairBlocked(id, cell, cell)) return 'hay un enemigo al lado';
        return '';
    }
    startFortRepair(id, plan) {
        const n = this.nations[id], p = plan ? this.fortRepairPlan(id, plan.cell) : null;
        if (!p || p.cost > n.gold) return false;
        this.fortWork.set(p.cell, { owner: id, left: this.rules(id).fortTurns, up: true });
        n.gold -= p.cost;
        this.fortVersion++;
        return true;
    }
    playerRepairFort(plan) {
        if (this.over || !plan) return false;
        const why = this.fortRepairWhy(this.player, plan.cell);   // el plan puede haber dejado de valer
        if (why) { this.log(`No puedes reparar la fortificación de ${this.placeName(plan.cell)}: ${why}.`); return false; }
        if (plan.cost > this.nations[this.player].gold) { this.log(`Fondos insuficientes: la reparación cuesta ${plan.cost}g.`); return false; }
        if (!this.startFortRepair(this.player, plan)) return false;
        this.log(`Reparas la fortificación de ${this.placeName(plan.cell)} por ${plan.cost} de oro.`);
        return true;
    }
    // La IA repara primero las fortificaciones de sus ciudades y luego las más amenazadas, hasta agotar el presupuesto;
    // devuelve el oro gastado.
    aiRepairForts(id, budget) {
        if (budget < Math.round(this.rules(id).fortCost / 2)) return 0;
        const todo = [];
        for (const c of G.land) {
            if (!this.fort[c] || this.owner[c] !== id) continue;
            const p = this.fortRepairPlan(id, c);
            if (p) todo.push({ p, city: CITY_OF[c] >= 0 ? 1 : 0, t: this.threat(id, c) });
        }
        todo.sort((x, y) => y.city - x.city || y.t - x.t);
        let spent = 0;
        for (const { p } of todo) {
            if (p.cost > budget - spent) break;
            if (this.startFortRepair(id, p)) spent += p.cost;
        }
        return spent;
    }

    // --- Aviación: aeródromos y escuadrones ---
    // Turno en que `id` jugará la próxima vez: este si aún no ha empezado a jugarlo, el siguiente si ya.
    nextOwnTurn(id) { return this.nations[id].lastTurn === this.turn ? this.turn + 1 : this.turn; }
    // Radio de acción de los escuadrones de `id`, en casillas.
    airRange(id) { return kmCells(this.rules(id).airRangeKm); }
    newSquadron(owner, base, ready = 0) {
        const sq = { id: this.nextSquadronId++, owner, base, ready, flown: 0, patrol: -1, op: 0, task: null, damaged: false };
        this.squadrons.set(sq.id, sq);
        this.airVersion++;
        return sq;
    }
    squadronsAt(cell) { const out = []; for (const q of this.squadrons.values()) if (q.base === cell) out.push(q); return out; }
    // Un aeródromo funciona si está terminado, no lo han dejado inservible y su casilla sigue siendo de su dueño.
    airfieldUp(cell) {
        const f = this.airfields.get(cell);
        return !!f && f.left === 0 && this.turn > f.downUntil && this.owner[cell] === f.owner;
    }
    // Un escuadrón vuela una vez por turno, si ya está listo y su aeródromo funciona.
    canFly(sq) { return this.turn >= sq.ready && sq.flown !== this.turn && this.airfieldUp(sq.base); }
    // Aeródromo terminado de `id` en una casilla suya, con sitio para otro escuadrón.
    hangar(id, cell) {
        const f = this.airfields.get(cell);
        return !!f && f.owner === id && f.left === 0 && this.owner[cell] === id && this.squadronsAt(cell).length < CONFIG.AIR.PER_AIRFIELD;
    }
    // Comprar un escuadrón en un aeródromo propio: vuela a partir del turno siguiente.
    buySquadron(id, cell) {
        const n = this.nations[id];
        if (!this.hangar(id, cell) || n.gold < CONFIG.AIR.SQUADRON_COST) return null;
        n.gold -= CONFIG.AIR.SQUADRON_COST;
        return this.newSquadron(id, cell, this.turn + 1);
    }
    // Un aeródromo nuevo: solo en una ciudad propia y legal que no tenga ya uno; tarda lo que una fortificación.
    planAirfield(id, cell) {
        if (cell < 0 || CITY_OF[cell] < 0 || this.owner[cell] !== id || this.legal[cell] !== id || this.airfields.has(cell)) return null;
        return { cell, cost: CONFIG.AIR.AIRFIELD_COST };
    }
    buildAirfield(id, plan) {
        const n = this.nations[id], p = plan ? this.planAirfield(id, plan.cell) : null;
        if (!p || p.cost > n.gold) return false;
        this.airfields.set(p.cell, { owner: id, left: this.rules(id).fortTurns, downUntil: 0 });
        n.gold -= p.cost;
        this.airVersion++;
        return true;
    }
    // Trasladar un escuadrón a otro aeródromo propio que funcione, a su alcance y con sitio: gasta su misión del turno.
    rebase(sq, cell) {
        if (cell === sq.base || !this.canFly(sq) || !this.airfieldUp(cell) || !this.hangar(sq.owner, cell)
            || hexDist(sq.base, cell) > this.airRange(sq.owner)) return false;
        sq.base = cell; sq.flown = this.turn;
        this.airVersion++;
        return true;
    }
    // Aviación de partida: un escuadrón por cada 24 aviones de 2024, de 4 en 4 en aeródromos que ya funcionan, en la
    // capital y luego en las ciudades mayores; si no hay bastantes, en casillas propias cerca de la capital. En esa misma
    // lista, un antiaéreo fijo terminado en la capital y otro más por cada 4 escuadrones. Sin azar.
    seedAir() {
        const per = CONFIG.AIR.PER_AIRFIELD, byCountry = this.nations.map(() => []);
        for (const p of PROVINCES) byCountry[this.owner[p.city]]?.push(p);
        for (const nat of this.nations) {
            const k = squadronsFor(airFleet(nat.key));
            if (!nat.alive || !k) continue;
            const id = nat.id, fields = Math.ceil(k / per), sites = 1 + Math.floor(k / per), need = Math.max(fields, sites), cap = nat.capitalCell, S = [];
            if (this.owner[cap] === id) S.push(cap);
            const cities = byCountry[id].filter(p => p.city !== cap && this.legal[p.city] === id).sort((a, b) => b.population - a.population || a.id - b.id);
            for (const p of cities) { if (S.length >= need) break; S.push(p.city); }
            if (S.length < need) {
                const rest = G.land.filter(c => this.owner[c] === id && CITY_OF[c] < 0 && CELL_TERRAIN[c] !== 'lake')
                    .sort((a, b) => hexDist(a, cap) - hexDist(b, cap) || a - b);
                S.push(...rest.slice(0, need - S.length));
            }
            S.slice(0, fields).forEach((c, i) => {
                this.airfields.set(c, { owner: id, left: 0, downUntil: 0 });
                for (let j = i * per; j < Math.min(k, (i + 1) * per); j++) this.newSquadron(id, c, 0);
            });
            for (const c of S.slice(0, sites)) this.aaSites.set(c, { owner: id, left: 0, hits: 0, known: new Set() });
        }
        this.airVersion++;
    }
    // La casilla `cell` ha cambiado de manos en combate: si tenía un aeródromo de otro, se pierde con sus escuadrones.
    loseAirfield(cell) {
        const f = this.airfields.get(cell);
        if (!f || f.owner === this.owner[cell]) return;
        const lost = this.squadronsAt(cell);
        for (const q of lost) this.squadrons.delete(q.id);
        this.airfields.delete(cell);
        this.airVersion++;
        if (f.owner === this.player) this.log(`Pierdes el aeródromo de ${this.placeName(cell)}${lost.length ? ` y sus ${plural(lost.length, 'escuadrón', 'escuadrones')}` : ''}.`);
    }
    // Lo mismo con el antiaéreo fijo de la casilla: si la toma otro, se pierde (también a medio construir).
    loseAASite(cell) {
        const s = this.aaSites.get(cell);
        if (!s || s.owner === this.owner[cell]) return;
        this.aaSites.delete(cell);
        this.airVersion++;
        if (s.owner === this.player) this.log(`Pierdes el antiaéreo de ${this.placeName(cell)}.`);
    }
    // Aeródromos en casillas que ya no son de su dueño (sin combate: un tratado, una provincia que cae entera...): se
    // cierran y sus escuadrones vuelan al aeródromo propio más cercano que funcione y tenga sitio. Si no hay, se pierden.
    // Los antiaéreos fijos de esas casillas se pierden sin más: no se trasladan.
    airSweep() {
        let lostAA = 0;
        for (const [c, s] of this.aaSites) {
            if (this.owner[c] === s.owner) continue;
            this.aaSites.delete(c);
            this.airVersion++;
            if (s.owner === this.player) lostAA++;
        }
        if (lostAA) this.log(`Pierdes ${lostAA === 1 ? 'un antiaéreo' : `${lostAA} antiaéreos`} en tierra que ya no es tuya.`);
        for (const [c, f] of [...this.airfields]) {
            if (this.owner[c] === f.owner) continue;
            this.airfields.delete(c);
            this.airVersion++;
            let moved = 0, lost = 0;
            for (const q of this.squadronsAt(c)) {
                let best = -1, bd = Infinity;
                for (const d of this.airfields.keys()) {
                    const dist = hexDist(c, d);
                    if (dist < bd && this.airfieldUp(d) && this.hangar(f.owner, d)) { best = d; bd = dist; }
                }
                if (best >= 0) { q.base = best; moved++; } else { this.squadrons.delete(q.id); lost++; }
            }
            if (f.owner !== this.player) continue;
            const parts = [moved ? `${moved === 1 ? 'un escuadrón vuela' : `${moved} escuadrones vuelan`} a otro aeródromo` : '',
                lost ? `${lost === 1 ? 'uno se pierde' : `${lost} se pierden`} por no tener dónde ir` : ''].filter(Boolean);
            this.log(`Pierdes el aeródromo de ${this.placeName(c)}${parts.length ? `: ${parts.join(' y ')}` : ''}.`);
        }
    }
    // Al empezar el turno de `id`: avanzan sus obras de aeródromo y de antiaéreo, sus escuadrones dejan de patrullar (y los
    // dañados que ya pueden volar dejan de contar como dañados) y sus satélites gastan un turno. Se olvidan los aciertos y
    // lo desvelado de turnos pasados.
    airTurn(id) {
        for (const [c, f] of this.airfields) {
            if (f.owner !== id || f.left <= 0) continue;
            if (--f.left === 0 && id === this.player) this.log(`Aeródromo terminado en ${this.placeName(c)}.`);
            this.airVersion++;
        }
        for (const [c, s] of this.aaSites) {
            if (s.owner !== id || s.left <= 0) continue;
            if (--s.left === 0 && id === this.player) this.log(`Antiaéreo terminado en ${this.placeName(c)}.`);
            this.airVersion++;
        }
        for (const q of this.squadrons.values()) {
            if (q.owner !== id) continue;
            if (q.patrol >= 0) { q.patrol = -1; this.airVersion++; }
            if (q.damaged && this.turn >= q.ready) { q.damaged = false; this.airVersion++; }   // reparado
        }
        // Sus satélites gastan un turno; el que llega a 0 deja de transmitir.
        for (const s of this.sats) {
            if (s.owner !== id) continue;
            s.left--;
            this.airVersion++;
            if (!s.left && id === this.player) this.log(`Tu satélite sobre ${this.placeName(s.cell)} deja de transmitir.`);
        }
        if (this.sats.some(s => !s.left)) this.sats = this.sats.filter(s => s.left > 0);
        for (const m of [this.airHits, this.airSeen]) for (const [k, t] of m) if (t < this.turn) m.delete(k);   // de turnos pasados
    }
    playerBuySquadron(cell) {
        if (this.over) return null;
        const p = this.player, f = this.airfields.get(cell), cost = CONFIG.AIR.SQUADRON_COST;
        if (!f || f.owner !== p || f.left > 0 || this.owner[cell] !== p) { this.log('Solo se compran escuadrones en un aeródromo tuyo terminado.'); return null; }
        if (this.squadronsAt(cell).length >= CONFIG.AIR.PER_AIRFIELD) { this.log(`El aeródromo de ${this.placeName(cell)} ya tiene ${CONFIG.AIR.PER_AIRFIELD} escuadrones.`); return null; }
        if (this.nations[p].gold < cost) { this.log(`Fondos insuficientes: el escuadrón cuesta ${cost}g.`); return null; }
        const sq = this.buySquadron(p, cell);
        if (sq) this.log(`Compras un escuadrón en ${this.placeName(cell)} por ${cost} de oro: listo para volar el turno que viene.`);
        return sq;
    }
    playerBuildAirfield(cell) {
        if (this.over) return false;
        const p = this.player, plan = this.planAirfield(p, cell);
        if (!plan) { this.log(this.airfields.has(cell) ? 'Ahí ya hay un aeródromo.' : 'Solo se construye un aeródromo en una ciudad tuya.'); return false; }
        if (plan.cost > this.nations[p].gold) { this.log(`Fondos insuficientes: el aeródromo cuesta ${plan.cost}g.`); return false; }
        if (!this.buildAirfield(p, plan)) return false;
        this.log(`Empiezas un aeródromo en ${this.placeName(cell)} por ${plan.cost} de oro: listo en ${plural(this.rules(p).fortTurns, 'turno', 'turnos')}.`);
        return true;
    }
    // Traslada los escuadrones elegidos del jugador a `cell` (los que puedan); devuelve cuántos.
    playerRebase(ids, cell) {
        if (this.over) return 0;
        let n = 0;
        for (const id of ids) { const q = this.squadrons.get(id); if (q && q.owner === this.player && this.rebase(q, cell)) n++; }
        if (n) this.log(`${n === 1 ? 'Un escuadrón se traslada' : `${n} escuadrones se trasladan`} a ${this.placeName(cell)}: no ${n === 1 ? 'vuelve' : 'vuelven'} a volar hasta el turno que viene.`);
        else this.log(`Ningún escuadrón puede trasladarse a ${this.placeName(cell)}: hace falta un aeródromo tuyo en servicio, con sitio y a su alcance (${plural(this.airRange(this.player), 'casilla', 'casillas')}), y que no hayan volado este turno.`);
        return n;
    }
    // --- Antiaéreo: sitios fijos e integrado en las ciudades con casamatas ---
    // Fuerza de un escuadrón de `id`, con lo que tenga investigado de Aviación.
    airPower(id) { return CONFIG.AIR.POWER * (1 + 0.1 * this.techLevel(id, 'aviacion')); }
    // Alcance del antiaéreo de `id`, en casillas.
    aaRadius(id) { return kmCells(this.rules(id).aaRangeKm); }
    // El antiaéreo que puede disparar ahora: los sitios terminados en una casilla de su dueño (los dañados, a media
    // fuerza), las ciudades con casamatas, que traen el integrado de la calidad que tenga investigada su dueño, y los
    // ejércitos con antiaéreas (el móvil), que cubren su casilla y sus vecinas, en tierra y en el mar.
    aaList() {
        const key = `${this.airVersion}:${this.fortVersion}:${this.techVersion}:${this.version}:${this.armyVersion}`;
        if (this.aaCache?.key === key) return this.aaCache.list;
        const list = [];
        for (const [cell, site] of this.aaSites) {
            if (site.left > 0 || this.owner[cell] !== site.owner) continue;
            list.push({ cell, owner: site.owner, kind: 'site', power: this.rules(site.owner).aaPower * (site.hits ? 0.5 : 1), radius: this.aaRadius(site.owner), site });
        }
        for (const p of PROVINCES) {
            const cell = p.city, owner = this.owner[cell];
            if (this.fort[cell] !== 4 || owner < 0) continue;   // solo con casamatas
            list.push({ cell, owner, kind: 'integrated', power: CONFIG.AIR.INTEGRATED * this.rules(owner).aaPower, radius: this.aaRadius(owner), site: null });
        }
        for (const a of this.armies.values()) {
            if (!a.units.antiair || this.armyAt[a.cell] !== a.id) continue;
            list.push({ cell: a.cell, owner: a.owner, kind: 'mobile', power: CONFIG.AIR.MOBILE * this.rules(a.owner).aaPower * a.units.antiair, radius: 1, site: null, army: a });
        }
        this.aaCache = { key, list };
        return list;
    }
    // ¿Ve `viewer` el antiaéreo que pueda haber en `cell`? Sin niebla, y el propio y el de los aliados, siempre; si no,
    // con un espía en la provincia, con un satélite suyo encima o con Reconocimiento 2 (el jugador, además, con la casilla
    // a la vista).
    aaVisible(viewer, cell) {
        const o = this.owner[cell];
        if (!this.settings.fog || viewer === null || o < 0 || o === viewer || this.allied(viewer, o)) return true;
        if (this.satCovers(viewer, cell)) return true;
        if (viewer === this.player && this.spiedProvinces().has(SEA_PROV[cell])) return true;
        return this.rules(viewer).intelExact && (viewer !== this.player || this.sees(viewer, cell));
    }
    // ¿Conoce `viewer` esta fuente de antiaéreo? Un sitio, si le ha disparado o si lo ve; el integrado, si conoce el
    // nivel de la fortificación de la ciudad; el móvil, si conoce el tipo y el número del ejército que lo lleva (el
    // jugador, además, con la casilla a la vista: no se sabe qué lleva un ejército que no se ve).
    aaKnown(viewer, src) {
        if (src.kind === 'integrated') return this.fortLevel(viewer, src.cell) !== null;
        if (src.kind === 'mobile') return this.knownCell(viewer, src.cell);
        return src.site.known.has(viewer) || this.aaVisible(viewer, src.cell);
    }
    // Antiaéreo enemigo que se encuentra una misión de `owner` que sale de `bases` contra `cell`, en línea recta.
    // - Lo que tiene el blanco a su alcance hace fracasar la misión (`fire`) y derriba (`loss`); el conocido, menos.
    // - Lo que solo cubre el camino derriba: el que no se conoce, de lleno; el conocido se rodea si sobra alcance y, si
    //   no, se sobrevuela a media eficacia. Con varias bases, cuenta el camino que peor lo tenga.
    // Cada fuente cuenta una vez, y las sumas tienen el tope del defensor (el ejército de la casilla o, si no, su dueño).
    // Los pesos de las pérdidas salen de lo que conoce el atacante (`owner`), que es con lo que vuela la misión; `seen`
    // es lo mismo con solo las fuentes que conoce `viewer`. `unknown` (ver aaDoubt) se calcula al leerlo: la IA no lo
    // usa. Un blanco en el mar solo cuenta con el antiaéreo móvil: el fijo y el integrado de la costa no protegen a un barco.
    aaCover(owner, bases, cell, { viewer = owner, range = this.airRange(owner) } = {}) {
        const A = CONFIG.AIR, sea = afloat(cell), def = this.armyOn(cell)?.owner ?? this.owner[cell];
        const cap = A.AA_CAP * (def >= 0 ? this.rules(def) : BASE_RULES).aaPower;
        const paths = bases.map(b => ({ base: b, d: hexDist(b, cell), cells: flightPath(b, cell) }));
        const sources = [];
        let fire = 0, loss = 0, seenFire = 0, seenLoss = 0;
        for (const src of this.aaList()) {
            if (!this.atWar(owner, src.owner) || (sea && src.kind !== 'mobile')) continue;
            const r = src.radius, dt = hexDist(src.cell, cell);
            // Las casillas del camino están a i de la base y a d − i del blanco: más lejos de eso, no lo cubre.
            const over = dt <= r ? null : paths.filter(p => hexDist(src.cell, p.base) + dt <= p.d + 2 * r && p.cells.some(x => hexDist(x, src.cell) <= r));
            if (over && !over.length) continue;
            const known = this.aaKnown(owner, src), seen = viewer === owner ? known : this.aaKnown(viewer, src);
            let w = 0;   // peso en las pérdidas
            if (!over) {
                w = known ? A.KNOWN_TARGET : 1;
                fire += src.power;
                if (seen) seenFire += src.power;
            } else {
                for (const p of over) w = Math.max(w, !known ? 1 : range >= p.d + 2 * r + 1 ? 0 : A.KNOWN_PATH);
                if (!w) continue;   // conocido y rodeado: no dispara
            }
            loss += w * src.power;
            if (seen) seenLoss += w * src.power;
            if (!sources.includes(src.cell)) sources.push(src.cell);
        }
        const top = x => Math.min(cap, x), g = this;

        return { fire: top(fire), loss: top(loss), cap, sources, seen: { fire: top(seenFire), loss: top(seenLoss) },

    }
    // Alcance del antiaéreo fijo de `id` que puede suponer `viewer`: el de su investigación si sabe qué investiga y, si no,
    // el mayor del juego (Defensa aérea 2).
    aaReach(viewer, id) { return this.knowsResearch(viewer, id) ? this.aaRadius(id) : AA_MAX_RADIUS; }
    // ¿Puede haber antiaéreo que `viewer` no conoce contra una misión de `owner` a `cell` por los caminos `paths`? Sale solo
    // de lo que `viewer` sabe y ve, nunca de lo que hay, para no delatar nada:
    // - a una casilla o menos del blanco o del camino, una casilla que no ve o un ejército enemigo que no identifica (el
    //   antiaéreo móvil), lo lleve o no;
    // - en tierra, a lo que podría cubrir un antiaéreo fijo de su dueño (aaReach), una casilla de un país en guerra con
    //   `owner` donde no vería un antiaéreo, o una ciudad suya fortificada cuyo nivel no conoce: podría tener casamatas.
    // El mar solo mira lo primero. Se recorren las casillas a esa distancia del camino, por anillos, y para en la primera.
    aaDoubt(owner, cell, paths, viewer) {
        if (!this.settings.fog || viewer === null) return false;
        const land = !afloat(cell), reach = new Map();
        let R = 1;
        if (land) for (const e of this.enemiesOf(owner)) { const r = this.aaReach(viewer, e); reach.set(e, r); R = Math.max(R, r); }
        const seen = new Set();
        let ring = [];
        for (const c of [cell, ...paths.flatMap(p => p.cells)]) if (!seen.has(c)) { seen.add(c); ring.push(c); }
        for (let d = 0; d <= R && ring.length; d++) {
            const next = [];
            for (const c of ring) {
                if (d <= 1) {
                    if (!this.sees(viewer, c)) return true;
                    const a = this.armyOn(c);
                    if (a && this.atWar(owner, a.owner) && !this.knownCell(viewer, c)) return true;
                }
                if (land && isLand(c) && d <= (reach.get(this.owner[c]) ?? -1)) {
                    if (!this.aaVisible(viewer, c)) return true;
                    if (CITY_OF[c] >= 0 && this.fort[c] > 0 && this.fortLevel(viewer, c) === null) return true;
                }
                if (d < R) for (let k = 0; k < 6; k++) { const j = G.nb[c * 6 + k]; if (j >= 0 && !seen.has(j)) { seen.add(j); next.push(j); } }
            }
            ring = next;
        }
        return false;
    }
    // Probabilidades de una misión según cuánto antiaéreo hay por cada punto de fuerza de los escuadrones: `rf`, el que
    // cubre el blanco (fracaso de la misión); `rl`, el que cuenta en las pérdidas (derribo y daño de cada escuadrón).
    // `evade` rebaja el derribo; el dañado nunca pasa del derribado ni de lo que queda.
    airOdds(rf, rl, evade = 1) {
        const fail = rf * rf / (rf * rf + CONFIG.AIR.FAIL_K), down = Math.min(0.6, 0.4 * (rl / 2) ** 1.5) * evade;
        return { fail, down, damaged: Math.min(down, 1 - down) };
    }
    // Un antiaéreo fijo: en cualquier casilla de tierra propia (no en un lago), uno por casilla.
    planAA(id, cell) {
        if (cell < 0 || !isLand(cell) || CELL_TERRAIN[cell] === 'lake' || this.owner[cell] !== id || this.aaSites.has(cell)) return null;
        return { cell, cost: CONFIG.AIR.AA_COST };
    }
    buildAA(id, plan) {
        const n = this.nations[id], p = plan ? this.planAA(id, plan.cell) : null;
        if (!p || p.cost > n.gold) return false;
        this.aaSites.set(p.cell, { owner: id, left: CONFIG.AIR.AA_TURNS, hits: 0, known: new Set() });
        n.gold -= p.cost;
        this.airVersion++;
        return true;
    }
    playerBuildAA(cell) {
        if (this.over) return false;
        const p = this.player, plan = this.planAA(p, cell);
        if (!plan) { this.log(this.owner[cell] === p && this.aaSites.has(cell) ? 'Ahí ya tienes un antiaéreo.' : 'Solo se construye un antiaéreo en tierra tuya.'); return false; }
        if (plan.cost > this.nations[p].gold) { this.log(`Fondos insuficientes: el antiaéreo cuesta ${plan.cost}g.`); return false; }
        if (!this.buildAA(p, plan)) return false;
        this.log(`Empiezas un antiaéreo en ${this.placeName(cell)} por ${plan.cost} de oro: listo en ${plural(CONFIG.AIR.AA_TURNS, 'turno', 'turnos')}.`);
        return true;
    }
    // --- Satélites (rama Espacio): vigilan un círculo del mapa durante unos turnos; no se derriban ni se comparten ---
    // Precio de un satélite: unos 20 turnos de renta, y nunca menos de 1000.
    satCost(id) { return Math.max(1000, 20 * this.income(id)); }
    // Radio de lo que ve un satélite de `id`, en casillas.
    satRadius(id) { return kmCells(this.rules(id).satRangeKm); }
    satsOf(id) { return this.sats.filter(s => s.owner === id); }
    // ¿Puede `id` lanzar otro? Le hace falta sitio en órbita (Lanzadores, y dos con Constelación) y el oro.
    canLaunch(id) { return this.rules(id).satMax > this.satsOf(id).length && this.nations[id].gold >= this.satCost(id); }

    launchSat(id, cell) {
        if (!Number.isInteger(cell) || cell < 0 || cell >= G.N || !this.canLaunch(id)) return false;
        this.nations[id].gold -= this.satCost(id);
        this.sats.push({ owner: id, cell, left: this.rules(id).satTurns });
        this.airVersion++;
        return true;
    }
    // ¿Cubre `cell` algún satélite de `viewer`? Los de sus aliados no cuentan.
    satCovers(viewer, cell) {
        for (const s of this.sats) if (s.owner === viewer && hexDist(s.cell, cell) <= this.satRadius(viewer)) return true;
        return false;
    }
    playerLaunchSat(cell) {
        if (this.over) return false;
        const p = this.player, r = this.rules(p), cost = this.satCost(p), n = this.satsOf(p).length;
        if (!r.satMax) { this.log('Para lanzar satélites hace falta investigar Lanzadores (Espacio 1).'); return false; }
        if (n >= r.satMax) { this.log(n === 1 ? 'Ya tienes un satélite en órbita: hasta que deje de transmitir no cabe otro.' : `Ya tienes ${n} satélites en órbita, los que caben.`); return false; }
        if (this.nations[p].gold < cost) { this.log(`Fondos insuficientes: el satélite cuesta ${cost}g.`); return false; }
        if (!this.launchSat(p, cell)) return false;
        this.log(`Lanzas un satélite sobre ${this.placeName(cell)} por ${cost} de oro: vigila ${plural(this.satRadius(p), 'casilla', 'casillas')} alrededor durante ${plural(r.satTurns, 'turno', 'turnos')}.`);
        return true;
    }
    // --- Misiones aéreas: se resuelven al darlas, como un ataque de tierra, y su resultado sale en el parte ---
    // Clave del acierto del turno de un blanco: cada casilla tiene uno por misión (el integrado comparte el de `fort`).
    hitKey(kind, cell) { return cell * 8 + AIR_KIND_INDEX[kind]; }
    // ¿Sabe `viewer` qué hay en `cell`? Conoce tipo y número de lo que tiene allí su dueño (el del ejército o, si no hay,
    // el de la casilla) y, si es el jugador, además la tiene a la vista.
    knownCell(viewer, cell) {
        const o = this.armyOn(cell)?.owner ?? this.owner[cell];
        return (viewer !== this.player || this.sees(viewer, cell)) && this.intel(viewer, o, cell).exact;
    }
    // Los escuadrones de `owner` que vuelan contra `cell`: los listos que no han volado este turno, con su aeródromo en
    // servicio y el blanco a su alcance; por id, que es el orden de sus tiradas.
    fliers(owner, sqs, cell) {
        const R = this.airRange(owner);
        return sqs.filter(q => q && q.owner === owner && this.canFly(q) && hexDist(q.base, cell) <= R).sort((a, b) => a.id - b.id);
    }
    // El antiaéreo de `cell` que `viewer` conoce y que `owner` puede atacar: un sitio fijo; si no hay, las antiaéreas del
    // ejército que haya; y si tampoco, el integrado.
    aaTarget(owner, cell, viewer = owner) {
        const rank = { site: 3, mobile: 2, integrated: 1 };
        let best = null;
        for (const src of this.aaList()) {
            if (src.cell !== cell || !this.atWar(owner, src.owner) || !this.aaKnown(viewer, src)) continue;
            if (!best || rank[src.kind] > rank[best.kind]) best = src;
        }
        return best;
    }
    // Los escuadrones que salen al paso de una misión de `owner` contra `cell`: los de países en guerra con él que
