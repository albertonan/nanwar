            case 'start':
                if (this.choice === null) return;
                g.start(this.choice);
                this.seenLog = g.logs.length;
                this.view.hoverNation = -1;
                this.view.centerOn(g.nations[this.choice].capitalCell, 5);
                this.select(g.nations[this.choice].capitalCell);
                return;
            case 'end-turn': this.endTurnFlow(); return;
            case 'skip-replay': this.skipReplay(); return;
            case 'multi-all': this.multi = new Set(this.myCities().map(p => p.id)); break;
            case 'multi-none': this.multi.clear(); break;
            case 'multi-recruit': g.playerRecruitMany([...this.multi], d.unit, this.recruitQty ?? 1); break;
            case 'multi-fort': {
                const cells = [...this.multi].map(pid => PROVINCES[pid].city).filter(c => !g.fort[c] && !g.fortWork.has(c))
                    .slice(0, Math.floor(g.nations[g.player].gold / g.rules(g.player).fortCost));
                if (cells.length) g.playerFortify({ cells, path: cells, cost: cells.length * g.rules(g.player).fortCost, cls: 'fort' });
                break;
            }
            case 'watch': this.prefs.watch = d.value; writePrefs(this.prefs); if ($('#game-dialog').open) this.renderGameDialog(); break;
            case 'speed': this.prefs.speed = d.value; writePrefs(this.prefs); if ($('#game-dialog').open) this.renderGameDialog(); break;
            case 'alerts-close': $('#alerts-dialog').close(); g.alerts = []; break;
            case 'alert-goto': $('#alerts-dialog').close(); g.alerts = []; this.view.centerOn(+d.cell, 6); this.setTool('command'); this.select(+d.cell); return;
            case 'next-army': this.nextArmy(); return;
            case 'run-orders': this.runOrders(); return;
            case 'op-kind': if (this.opDraft && !this.opDraft.redraw) this.opDraft = { kind: d.kind, cells: [], redraw: null }; break;
            case 'op-undo': this.opDraft?.cells.pop(); break;
            case 'op-new': this.setTool('op', { kind: d.kind, cells: [], redraw: null }); if (isMobile()) this.drawerOpen = false; return;
            case 'op-create': {
                const dr = this.opDraft;
                if (!this.opDraftReady()) return;
                const op = dr.redraw ? g.playerRedrawOp(g.ops.get(dr.redraw), dr.cells) : g.playerCreateOp(dr.kind, dr.cells);
                if (!op) { this.flash(dr.redraw ? 'No se puede usar ese trazado.' : `No caben más operaciones: tu estado mayor lleva ${g.commandCap(g.player)} a la vez.`); return; }
                this.setTool('command');
                this.focusOp = op.id; this.tab = 'mando'; this.drawerOpen = !isMobile() || this.drawerOpen;
                break;
            }
            case 'op-focus': this.focusOp = this.focusOp === +d.id ? null : +d.id; break;
            case 'op-close': this.focusOp = null; break;
            case 'op-set': {
                const op = g.ops.get(+d.id);
                if (!op || op.owner !== g.player) return;
                g.playerOpSet(op, d.key, d.key === 'ratio' || d.key === 'gold' ? +d.value : d.key === 'auto' ? d.value : !op[d.key]);
                break;
            }
            case 'op-redraw': {
                const op = g.ops.get(+d.id);
                if (op) this.setTool('op', { kind: op.kind, cells: [], redraw: op.id });
                if (isMobile()) this.drawerOpen = false;
                return;
            }
            case 'op-end': { const op = g.ops.get(+d.id); if (op) { g.endOp(op, 'terminada por orden tuya'); this.focusOp = null; } break; }
            case 'op-add-near': { const op = g.ops.get(+d.id); if (op) for (const a of g.nearbyFree(op, 4)) g.assignArmy(a, op.id); break; }
            case 'op-unassign': g.assignArmy(g.armies.get(+d.army), 0); break;
            case 'cmd': g.playerCommand(d.key, d.value); break;
            case 'op-suggest': {
                this.opPreview = null;
                const sg = g.frontPlan(g.player, +d.enemy);
                if (!sg) return;
                const op = d.kind === 'defensa' ? g.playerCreateOp('defensa', sg.line) : g.playerCreateOp('ofensiva', sg.attack);
                if (op) { op.front = sg.enemy; this.focusOp = op.id; }
                break;
            }
            case 'goal': g.toggleGoal(g.player, +d.pid); break;
            case 'open-command': this.tab = 'mando'; this.drawerOpen = true; if (+d.id && g.ops.has(+d.id)) this.focusOp = +d.id; break;
            case 'tpl-step': { const u = this.tplDraft.units; u[d.unit] = Math.max(0, Math.min(60, u[d.unit] + +d.delta)); this.tplOpen = true; break; }
            case 'tpl-save': if (g.playerSaveTemplate(this.tplDraft.name, this.tplDraft.units)) this.tplDraft = null; this.tplOpen = true; break;
            case 'tpl-del': g.playerDeleteTemplate(+d.index); this.tplOpen = true; break;
            case 'op-goto': {
                const op = g.ops.get(+d.id);
                if (!op) return;
                if (isMobile()) this.drawerOpen = false;
                this.view.centerOn(op.cells[Math.floor(op.cells.length / 2)], 5);
                break;
            }
            case 'assist-yes': g.executeOps(g.player, this.proposal?.ids ?? []); this.endProposal(true); return;
            case 'assist-no': this.endProposal(true); return;
            case 'assist-back': this.endProposal(); return;
            case 'order': {
                const a = this.selectedArmy();
                if (!a) return;
                if (['march', 'attack', 'follow'].includes(d.kind)) { this.ordering = { kind: d.kind }; break; }
                g.playerOrder(a, { kind: d.kind });
                break;
            }
            case 'order-cancel': g.playerClearOrder(this.selectedArmy()); break;
            case 'order-ratio': {
                this.orderRatio = +d.value;
                const a = this.selectedArmy();
                if (a?.order?.kind === 'attack') { a.order.ratio = this.orderRatio; g.orderVersion++; }
                break;
            }
            case 'order-flee': {
                this.orderFlee = !(this.orderFlee ?? true);
                const a = this.selectedArmy();
                if (a?.order) { a.order.flee = this.orderFlee; g.orderVersion++; }
                break;
            }
            case 'install':
                if (this.installPrompt) { this.installPrompt.prompt(); this.installPrompt.userChoice.finally(() => { this.installPrompt = null; this.renderTop(); }); }
                return;
            case 'confirm-build': this.confirmBuild(); return;
            case 'upgrade-stretch':
                if (this.stretch && g.playerUpgradeRoad(this.stretch)) { this.stretch = this.view.stretch = null; }
                break;
            case 'cancel-build': this.cancel(); return;
            case 'stop-build': this.setTool('command'); return;
            case 'highway': this.toggleHighway(); return;
            case 'open-drawer': this.drawerOpen = true; break;
            case 'tool': this.setTool(d.tool === this.tool && d.tool !== 'command' ? 'command' : d.tool); return;
            case 'supply': this.setLayer('supply', !this.view.showSupply); return;
            case 'layer-ops': this.setLayer('ops', !this.view.showOps); return;
            case 'view-mode': this.toggleViewMode(); return;
            case 'view-set': if (d.value !== this.prefs.view) this.toggleViewMode(); return;
            case 'map-menu': this.mapMenu = !this.mapMenu; break;
            case 'close-card': this.select(-1); return;
            case 'step': {
                const a = this.selectedArmy();
                if (!a) return;
                this.send[d.unit] = Math.max(0, Math.min(a.units[d.unit], this.send[d.unit] + +d.delta));
                break;
            }
            case 'send-all': { const a = this.selectedArmy(); if (a) this.send = copyUnits(a.units); break; }
            case 'recruit': g.playerRecruit(p, d.unit, this.recruitQty ?? 1); break;
            case 'recruit-qty': this.recruitQty = d.qty === 'max' ? Infinity : +d.qty; break;
            case 'diplo': g.playerDiplomacy(d.kind, +d.target); break;
            case 'invite': g.playerInvite(+d.bloc, +d.target); break;
            case 'accept': case 'reject':
                g.answerProposal(+d.index, d.action === 'accept');
                if ($('#alerts-dialog').open) this.renderAlerts();
                break;
            case 'tab': this.tab = d.tab; this.drawerOpen = true; this.focusNation = null; break;
            case 'drawer': this.drawerOpen = !this.drawerOpen; break;
            case 'nation': this.focusNation = +d.id; this.tab = 'paises'; this.drawerOpen = true; break;
            case 'nation-back': this.focusNation = null; break;
            case 'goto':
                if (isMobile()) this.drawerOpen = false;
                this.view.centerOn(+d.cell, 8); this.setTool('command'); this.select(+d.cell); return;
            case 'bloc-create': g.playerCreateBloc(this.blocName, this.blocSecret); this.blocName = ''; this.blocSecret = false; break;
            case 'bloc-invite': {
                const sel = document.querySelector(`select[data-bloc-invite="${d.bloc}"]`);
                if (sel && sel.value !== '') g.playerInvite(+d.bloc, +sel.value);
                break;
            }
            case 'bloc-request': g.playerRequestJoin(+d.bloc); break;
            case 'bloc-leave': g.playerLeaveBloc(+d.bloc); break;
            case 'open-game': this.renderGameDialog(); $('#game-dialog').showModal(); return;
            case 'open-research': this.openResearch(d.tech); return;
            case 'close-research': $('#research-dialog').close(); return;
            case 'rs-select': this.researchSel = d.tech; this.renderResearch(); return;
            case 'rs-filter': this.researchFilter = d.area; this.renderResearch(); return;
            case 'rs-start': g.startResearch(g.player, d.tech); this.renderResearch(); break;
            case 'rs-pause': g.pauseResearch(g.player, d.tech); this.renderResearch(); break;
            case 'close-game': $('#game-dialog').close(); return;
            case 'save': {
                const ok = writeSave(d.slot, g);
                g.log(ok ? `Partida guardada en ${SLOTS[d.slot]}.` : 'No se pudo guardar: el navegador bloquea el almacenamiento. Usa «Exportar a archivo».');
                this.renderGameDialog();
                break;
            }
            case 'load': {
                if (d.map && d.map !== MAP_ID) { switchMap(d.map, `${d.map}:${d.slot}`); return; }
                const save = readSaves()[d.slot];
                if (!save) return;
                try { this.setGame(GameEngine.load(save.data)); this.game.log(`Partida cargada de ${SLOTS[d.slot]}.`); }
                catch (err) { g.log(`No se pudo cargar: ${err.message}`); }
                $('#game-dialog').close();
                this.render();
                return;
            }
            case 'export': {
                const blob = new Blob([JSON.stringify(g.serialize())], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `nanwar-${g.nations[g.player].key}-turno${g.turn}.json`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                g.log(`Partida exportada a ${a.download}.`);
                break;
            }
            case 'import': $('#import-file').click(); return;
            case 'restart': location.href = location.pathname; return;
            case 'map': if (d.value !== MAP_ID && g.player === null) switchMap(d.value); return;
            default: return;
        }
        this.render();
    }

    // Fin de turno: los demás países juegan de golpe ("directo") o uno a uno, enseñando cada jugada ("ver").
    async endTurnFlow() {
        const g = this.game;
        if (this.replaying || g.player === null || g.over || this.proposal) return;
        if (!this.assistDone) {
            // Primero tus órdenes de varios turnos y las operaciones automáticas; viendo las jugadas, se espera a que se muevan.
            if (g.pendingOrders(g.player)) {
                this.replaying = this.prefs.watch === 'ver';
                g.executeOrders(g.player);
                if (this.replaying) {
                    this.render();
                    await new Promise(res => setTimeout(res, Math.min(2500, this.view.motion.pendingMs() + 150)));
                    this.replaying = false;
                }
            }
            // Después, lo que proponen las asistidas: se enseña y se espera a que lo confirmes.
            const ids = g.opsOf(g.player).filter(op => op.auto === 'asistida' && !op.paused).map(op => op.id);
            const ghost = ids.length ? g.previewOps(g.player, ids) : [];
            if (ghost.length) {
                this.setTool('command');
                this.proposal = { ids, ghost, skip: new Set() };
                this.render();
                return;
            }
        }
        this.assistDone = false;
        if (!g.beginAiPhase()) { this.render(); return; }
        const knew = new Set(g.nations[g.player].tech.done);
        this.setTool('command');
        const order = g.aiOrder();
        if (this.prefs.watch !== 'ver') {
            for (const id of order) g.aiStep(id);
            g.motion.length = 0;   // «directo»: nada que animar
        } else {
            this.replaying = true;
            this.skipping = false;
            $('#tooltip').hidden = true;
            $('#hint').hidden = true;
            $('#card').hidden = true;
            const delay = SPEEDS[this.prefs.speed] ?? SPEEDS.normal;
            this.view.motion.speed = { lenta: 1.4, normal: 1, rapida: 0.45 }[this.prefs.speed] ?? 1;
            for (let i = 0; i < order.length; i++) {
                const id = order[i];
                if (this.skipping || g.over || !g.nations[id].alive) { g.aiStep(id); continue; }
                const before = `${g.version}:${g.armyVersion}:${g.roadVersion}:${g.fortVersion}:${g.logs.length}`;
                this.view.hoverNation = id;
                this.renderReplay(id, i + 1, order.length);
                g.aiStep(id);
                const changed = before !== `${g.version}:${g.armyVersion}:${g.roadVersion}:${g.fortVersion}:${g.logs.length}`;
                if (!changed) continue;   // quien no hace nada no hace esperar
                this.view.draw();
                this.renderTop();
                const wait = Math.max(delay, this.view.motion.pendingMs() + 120);   // que se vea acabar cada movimiento
                await new Promise(res => { this.wakeReplay = res; setTimeout(res, wait); });
            }
            this.view.hoverNation = -1;
            this.replaying = false;
            $('#replay').hidden = true;
        }
        g.finishAiPhase();
        const myOps = g.opsOf(g.player);
        if (myOps.length) {
            const st = myOps.map(op => this.opState(op)), warn = st.filter(([, c]) => c === 'warn').length;
            const bad = myOps.filter((op, i) => st[i][1] === 'warn');
            const why = bad.slice(0, 3).map(op => `<br><b>${esc(op.name)}</b>: ${this.opWhy(op)}.`).join('') + (bad.length > 3 ? `<br>Y ${plural(bad.length - 3, 'otra', 'otras')}.` : '');
            this.notify(`Parte de operaciones: ${plural(myOps.length, 'operación', 'operaciones')}${warn ? `, <b>${warn} ${warn === 1 ? 'pide' : 'piden'} atención</b>.${why}` : ', todas en marcha.'}`,
                'open-command', bad.length === 1 ? 'Ver la operación' : 'Ver el mando', { key: 'parte', id: bad.length === 1 ? bad[0].id : 0 });
        }
        for (const t of g.nations[g.player].tech.done) if (!knew.has(t)) this.notify(`${uiIcon('check')} Investigación terminada: <b>${TECH_BY_ID.get(t).name}</b>.`, 'open-research', 'Ver investigación');
        writeSave('auto', g);
        this.select(this.selected);
        if (g.alerts.length || g.proposals.some(p => p.kind === 'llamada')) this.openAlerts();
    }
    // Fin de la propuesta de las asistidas: `go` sigue con el fin de turno; si no, se vuelve al turno.
    endProposal(go = false) {
        const g = this.game, pr = this.proposal;
        if (!pr) return;
        for (const id of pr.skip) { const a = g.armies.get(id); if (a && a.direct === g.turn && !go) a.direct = 0; }
        this.proposal = null;
        if (go) { this.assistDone = true; this.endTurnFlow(); } else this.render();
    }
    // «Ejecutar órdenes» (O): los ejércitos con órdenes de varios turnos las cumplen ya, con lo que les quede de movimiento.
    runOrders() {
        const g = this.game;
        if (this.replaying || this.proposal || g.player === null || g.over) return;
        if (!g.pendingOrders(g.player)) { this.flash('Ningún ejército con órdenes puede moverse ahora.'); return; }
        const sel = g.armyOn(this.selected)?.id;
        g.executeOrders(g.player, { assisted: true });
        const a = sel && g.armies.get(sel);
        this.select(a && a.owner === g.player ? a.cell : this.selected);
    }
    skipReplay() { this.skipping = true; this.view.motion.clear(); this.game.motion.length = 0; this.wakeReplay?.(); }
    // Vista sencilla ⇄ realista (botón «Relieve» y tecla V). Se guarda en este dispositivo, no en la partida.
    toggleViewMode() {
        this.prefs.view = this.prefs.view === 'realista' ? 'sencilla' : 'realista';
        writePrefs(this.prefs);
        this.view.setMode(this.prefs.view);
        this.renderTools();
        this.renderMapMenu();
        this.renderHint();
    }
    // Capas del mapa (se recuerdan en este dispositivo): logística y operaciones con sus órdenes.
    setLayer(key, on) {
        this.prefs[key] = on;
        writePrefs(this.prefs);
        if (key === 'supply') this.view.showSupply = on; else this.view.showOps = on;
        this.render();
    }
    // Panel «Mapa»: la vista (sencilla o realista) y las capas, todo en un sitio.
    renderMapMenu() {
        const el = $('#map-menu'), playing = this.game.player !== null && !this.game.over;
        el.hidden = !this.mapMenu;
        if (!this.mapMenu) return;
        const layer = (action, on, name, desc, key) => `<label class="layer"><input type="checkbox" data-action="${action}" ${on ? 'checked' : ''} ${playing ? '' : 'disabled'}>
            <b>${name}${key ? `<kbd>${key}</kbd>` : ''}</b><small>${desc}</small></label>`;
        el.innerHTML = `<header><h3 style="margin:0">Mapa</h3><button class="btn ghost" data-action="map-menu" aria-label="Cerrar" title="Cerrar (M o Esc)">✕</button></header>
            <span class="small muted">Vista <kbd>V</kbd></span>
            <div class="seg">${[['sencilla', 'Sencilla'], ['realista', 'Realista']].map(([v, l]) => `<button data-action="view-set" data-value="${v}" class="${this.prefs.view === v ? 'on' : ''}" aria-pressed="${this.prefs.view === v}">${l}</button>`).join('')}</div>
            <p class="note" style="margin:0">${this.prefs.view === 'realista' ? 'Relieve, bosques, ríos y ciudades reales pintados, y ejércitos en miniatura.' : 'Colores planos por país, casillas y fichas OTAN.'}</p>
            <span class="small muted">Capas</span>
            ${layer('supply', this.view.showSupply, 'Logística', 'Tu territorio sin suministro, en naranja: allí los ejércitos solo avanzan una casilla por turno.', 'L')}
            ${layer('layer-ops', this.view.showOps, 'Operaciones y órdenes', 'Flechas de ofensiva, líneas de defensa, zonas de reserva y los caminos de las órdenes de tus ejércitos.', '')}`;
    }
    renderReplay(id, n, total) {
        const g = this.game, el = $('#replay');
        el.hidden = false;
        el.innerHTML = `<span class="chip"><i style="background:${g.nations[id].color}"></i>${g.nm(id)}</span>
            <span class="small muted">turno ${n} de ${total}</span>
            <button class="btn" data-action="skip-replay" title="Terminar al instante (Esc)">Saltar</button>`;
    }

    // Partes de guerra al volver a tu turno: quién te ataca y qué aliados piden ayuda.
    openAlerts() { this.renderAlerts(); if (!$('#alerts-dialog').open) $('#alerts-dialog').showModal(); }
    renderAlerts() {
        const g = this.game, items = [];
        for (const a of g.alerts) {
            const cap = g.nations[a.from].capitalCell;
            if (a.kind === 'war') items.push(`<div class="alert"><p><b>${g.nm(a.from)}</b> te ha declarado la guerra.</p>
                <div class="row" style="margin-top:6px"><button class="btn" data-action="alert-goto" data-cell="${cap}">Ver en el mapa</button></div></div>`);
            else items.push(`<div class="alert"><p><b>${g.nm(a.from)}</b> entra en la guerra contra ti en defensa de ${g.nm(a.defending)}.</p></div>`);
        }
        g.proposals.forEach((pr, i) => {
            if (pr.kind !== 'llamada') return;
            items.push(`<div class="alert ally"><p>Tu aliado <b>${g.nm(pr.from)}</b> ha sido atacado por <b>${g.nm(pr.against)}</b>. ¿Entras en la guerra?</p>
                <p class="note">Si no intervienes, sales de las alianzas que compartís con ${g.nm(pr.from)}.</p>
                <div class="row" style="margin-top:6px"><button class="btn war" data-action="accept" data-index="${i}">Ir a la guerra</button>
                <button class="btn" data-action="reject" data-index="${i}">No intervenir</button></div></div>`);
        });
        const pending = g.proposals.some(p => p.kind === 'llamada');
        $('#alerts-body').innerHTML = `<h2>Partes de guerra</h2>
            ${items.join('') || '<p class="note" style="margin-top:8px">Ya has respondido a todo.</p>'}
            <div class="row" style="margin-top:14px;justify-content:flex-end">
                <button class="btn ${pending ? '' : 'primary'}" data-action="alerts-close">${pending ? 'Decidir más tarde' : 'Entendido'}</button></div>`;
    }

    onInput(e) {
        if (e.target.id === 'nation-search') { this.filter = e.target.value; this.renderNationList(); }
        if (e.target.id === 'bloc-name') this.blocName = e.target.value;
        if (e.target.id === 'tpl-name' && this.tplDraft) this.tplDraft.name = e.target.value;
        if (e.target.dataset.cmd) {   // deslizadores del presupuesto: se actualiza el texto sin redibujar (para poder arrastrar)
            this.game.playerCommand(e.target.dataset.cmd, e.target.value);
            const c = this.game.nations[this.game.player].command, total = Object.values(c.budget).reduce((x, y) => x + y, 0) || 1;
            const spend = Math.floor(Math.max(0, this.game.income(this.game.player)) * c.share / 100);
            const out = document.querySelector(`label[for="cmd-share"] output`);
            if (out) out.textContent = `${c.share} % · ${spend} de oro por turno`;
            for (const k of Object.keys(BUDGET_KEYS)) {
                const o = document.querySelector(`label[for="cmd-${k}"] output`);
                if (o) o.textContent = `${Math.round(100 * c.budget[k] / total)} % · ${Math.floor(spend * c.budget[k] / total)} de oro`;
                const bar = document.querySelector(`.budget-bar .b-${k}`);
                if (bar) bar.style.flex = c.budget[k];
            }
        }
    }

    onChange(e) {
        if (e.target.id === 'nation-select') { this.choice = +e.target.value; this.render(); }
        if (e.target.id === 'bloc-secret') this.blocSecret = e.target.checked;
        if (e.target.dataset.callWar !== undefined) { this.callAlly = +e.target.value; this.render(); }
        if (e.target.id === 'peace-mine') { this.peace.mine = +e.target.value; this.renderPeaceDialog(); }
        if (e.target.id === 'peace-keep') { this.peace.keep = e.target.checked; this.renderPeaceDialog(); }
        if (e.target.dataset.opAssign !== undefined) { this.game.assignArmy(this.selectedArmy(), +e.target.value); this.render(); }
        if (e.target.dataset.opTemplate !== undefined) { const op = this.game.ops.get(+e.target.dataset.opTemplate); if (op) this.game.playerOpSet(op, 'template', e.target.value); this.render(); }
        if (e.target.id === 'op-name') { const op = this.game.ops.get(this.focusOp); if (op) this.game.playerOpSet(op, 'name', e.target.value); this.render(); }
    }

    onKey(e) {
        if (this.replaying) { if (e.key === 'Escape') this.skipReplay(); return; }
        if ($('#research-dialog').open) { this.onResearchKey(e); return; }
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || $('#game-dialog').open || $('#peace-dialog').open || $('#alerts-dialog').open) return;
        const g = this.game;
        if (e.key === 'Escape') { this.cancel(); return; }
        if (e.key === 'v' || e.key === 'V') { this.toggleViewMode(); return; }
        if ((e.key === 'm' || e.key === 'M') && (this.game.player === null || this.game.over)) { this.mapMenu = !this.mapMenu; this.render(); return; }
        if (g.player === null || g.over) return;
        const tool = TOOLS.find(t => t.key === e.key);
        if (tool) { this.setTool(tool.id); return; }
        if (e.key === 'i' || e.key === 'I') { this.openResearch(); return; }
        if (e.key === 'a' || e.key === 'A') { this.toggleHighway(); return; }
        if (e.key === 'l' || e.key === 'L') this.setLayer('supply', !this.view.showSupply);
        else if (e.key === 'm' || e.key === 'M') { this.mapMenu = !this.mapMenu; this.render(); }
        else if (e.key === 'n' || e.key === 'N') this.nextArmy();
        else if (e.key === 'o' || e.key === 'O') this.runOrders();
        else if (e.key === 'Enter') { e.preventDefault(); $('#end-turn').click(); }
    }

    // Tamaño de la hoja inferior del móvil (ficha y panel): 'mini', 'media' o 'grande'. Se recuerda en el dispositivo.
    setSheet(size) {
        document.body.dataset.sheet = size;
        this.prefs.sheet = size;
        writePrefs(this.prefs);
    }
    addGrip(el) {
        if (el && !el.hidden && !el.querySelector(':scope > .sheet-grip'))
            el.insertAdjacentHTML('afterbegin', '<div class="sheet-grip" data-sheet-grip role="button" aria-label="Agrandar o achicar el panel" title="Toca o arrastra para cambiar el tamaño"><i></i></div>');
    }

    // --- Pintado ---
    render() {
        $('#tooltip').hidden = true;
        this.updateReach();
        this.view.draw();
        this.renderTop();
        this.renderTools();
        this.renderSetup();
        this.renderCard();
        this.addGrip($('#card'));
        this.renderToasts();
        this.renderDrawer();
        this.renderHint();
        this.renderConfirm();
        this.renderMapMenu();
        this.renderOverlay();
        this.hintOverride = null;
    }

    relationChip(id) {
        const g = this.game;
        if (!g.nations[id].alive) return '<span class="chip">eliminado</span>';
        if (g.player === null) return '';
        if (id === g.player) return '<span class="chip tu">tú</span>';
        if (g.nations[id].overlord === g.player) return '<span class="chip alianza">tu satélite</span>';
        if (g.nations[id].overlord >= 0) return `<span class="chip">satélite de ${g.nm(g.nations[id].overlord)}</span>`;
        if (g.atWar(g.player, id)) return '<span class="chip guerra">en guerra</span>';
        if (g.allied(g.player, id)) return '<span class="chip alianza">aliado</span>';
        const r = g.rel(g.player, id);
        return g.turn < r.truceUntil ? `<span class="chip">tregua hasta el turno ${r.truceUntil}</span>` : '<span class="chip">en paz</span>';
    }
    nationChip(id) { return `<span class="chip"><i style="background:${this.game.nations[id].color}"></i>${this.game.nm(id)}</span>`; }
    unitsLong(u) {
        return UNIT_KEYS.filter(k => u[k] > 0).map(k => `${u[k]} ${CONFIG.TYPES[k].name.toLowerCase()}`).join(', ') || 'sin tropas';
    }

    renderTop() {
        const g = this.game, p0 = g.player;
        $('#turn').textContent = g.turn;
        $('#end-turn').disabled = p0 === null || g.over;
        $('#btn-next').hidden = p0 === null;
        const pending = p0 === null || g.over ? 0 : g.pendingOrders(p0);
        $('#btn-orders').hidden = !pending;
        $('#btn-orders').innerHTML = `<span class="wide">Ejecutar órdenes</span><span class="narrow">Órdenes</span> <span class="count">${pending}</span> <kbd>O</kbd>`;
        $('#btn-install').hidden = !this.installPrompt;
        this.renderResearchFigure();
        this.renderLegend();
        if (p0 === null) {
            $('#nation-name').textContent = 'NanWar';
            $('#flag').style.background = SIGNAL;
            $('#gold').textContent = '—';
            return;
        }
        const n = g.nations[p0];
        $('#nation-name').textContent = n.name;
        $('#flag').style.background = n.color;
        $('#gold').innerHTML = `${n.gold}<small>+${g.income(p0)}</small>`;
    }

    renderTools() {
        const playing = this.game.player !== null && !this.game.over;
        const r = this.myRules();
        $('#tools').innerHTML = TOOLS.map(t => `
            <button class="tool ${this.tool === t.id ? 'on' : ''}" data-action="tool" data-tool="${t.id}" title="${typeof t.title === 'function' ? t.title(r) : t.title}" ${playing ? '' : 'disabled'}>
                ${t.id === 'road' && this.highway ? ICONS.highway : t.icon}${t.label}<kbd>${t.key}</kbd></button>`).join('') + `<hr>
            <button class="tool ${this.mapMenu ? 'on' : ''}" data-action="map-menu" aria-expanded="${this.mapMenu}" title="Vista del mapa y capas: sencilla o realista, logística, operaciones (M)">
                ${ICONS.layers}Mapa<kbd>M</kbd></button>
            <button class="tool mobile-only" data-action="open-drawer" ${playing ? '' : 'disabled'}>${ICONS.globe}Países</button>`;
    }

    renderSetup() {
        const g = this.game, el = $('#setup');
        el.hidden = g.player !== null;
        if (g.player !== null) return;
        const s = g.settings, c = this.choice;
        const seg = (key, options, cur) => `<div class="seg" role="group">${(Array.isArray(options) ? options : Object.entries(options)).map(([v, label]) =>
            `<button data-action="setting" data-key="${key}" data-value="${v}" class="${String(cur) === v ? 'on' : ''}">${label}</button>`).join('')}</div>`;
        const sorted = [...g.nations].sort((a, b) => a.name.localeCompare(b.name, 'es'));
        let pick = '<p class="note">Haz clic en un país del mapa o elígelo en la lista.</p>';
        if (c !== null) {
            const e = g.economy(c), lands = g.landCounts();
            pick = `<div class="pick" style="border-left-color:${g.nations[c].color}">
                <h3>${g.nm(c)}</h3>
                <dl class="facts" style="margin-top:8px">
                    <dt>Capital</dt><dd>${esc(g.nations[c].capitalName)}</dd>
                    <dt>Territorio</dt><dd>${plural(g.citiesOf(c).length, 'provincia', 'provincias')}, ${(100 * lands[c] / G.land.length).toFixed(1)} % ${MAP.of}</dd>
                    <dt>Economía</dt><dd>${e.total} de oro por turno, ${g.nations[c].gold} en el tesoro</dd>
                    <dt>Recursos</dt><dd>${[...e.resources, ...e.looseResources].map(r => `${CONFIG.RESOURCE_ICON[r.type]} ${esc(r.name)}`).join(', ') || 'ninguno'}${e.resources.length ? '<br><span class="small muted">Cada uno abastece a su provincia; con carretera, también a las ciudades que una.</span>' : ''}</dd>
                    <dt>Alianzas</dt><dd>${g.blocsOf(c).map(b => esc(b.name)).join(', ') || 'ninguna'}</dd>
                </dl></div>
                <button class="btn primary wide" style="margin-top:12px;padding:11px" data-action="start">Empezar con ${g.nm(c)}</button>`;
        }
        el.innerHTML = `
            <h2>Nueva partida</h2>
            <p class="lead">${MAP.lead}. Elige cómo será la partida y qué país diriges.</p>
            <div class="field"><span>Mapa</span><div class="maps">${Object.entries(MAPS).map(([id, m]) => `<button class="map-pick ${id === MAP_ID ? 'on' : ''}" data-action="map" data-value="${id}" aria-pressed="${id === MAP_ID}">
                    ${MAP_ICON[id]}<span><b>${m.name}</b><small>${m.desc}</small></span></button>`).join('')}</div></div>
            <div class="field"><span>Agresividad de los demás países</span>
                ${seg('aggression', Object.fromEntries(Object.entries(AGGRESSION).map(([k, v]) => [k, v.name])), s.aggression)}
                <p class="note">${g.ai.desc}</p></div>
            <div class="field"><span>Alianzas al empezar</span>${seg('alliances', { reales: 'OTAN y OTSC', ninguna: 'Ninguna' }, s.alliances)}</div>
            <p class="note">Niebla de guerra: solo ves las tropas en tu territorio y el de tus aliados, en una franja de ${this.myRules().visionTerritory} casillas alrededor y a ${this.myRules().visionArmy} de tus ejércitos. Puedes enviar espías.</p>
            <div class="field"><span>Para ganar</span>${seg('victory', [['0.5', `50 % ${MAP.of}`], ['0.75', '75 %'], ['1', MAP.all]], s.victory)}</div>
            <div class="field"><span>Tu país</span>
                <select id="nation-select"><option value="" ${c === null ? 'selected' : ''} disabled>Elige un país…</option>
                ${sorted.map(n => `<option value="${n.id}" ${c === n.id ? 'selected' : ''}>${n.name}</option>`).join('')}</select>
                ${pick}</div>
            ${this.watchSettings()}
            <button class="btn ghost wide" style="margin-top:12px" data-action="open-game">Cargar una partida guardada</button>
            ${this.installPrompt ? '<button class="btn wide" style="margin-top:6px" data-action="install">Instalar NanWar en este dispositivo</button>' : ''}
            ${isIOS() && !isStandalone() ? '<p class="note" style="margin-top:10px">Para instalarlo en el iPhone o iPad: botón Compartir de Safari y «Añadir a pantalla de inicio». Después funciona sin conexión.</p>' : ''}`;
    }

    renderCard() {
        const g = this.game, cell = this.selected, p0 = g.player, el = $('#card');
        if (this.tool === 'cities' && p0 !== null && !g.over) { this.renderMultiCard(); return; }
        if (this.tool === 'op' && p0 !== null && !g.over) { this.renderOpDraftCard(); return; }
        if (p0 === null || g.over || cell < 0 || !isLand(cell) || (isMobile() && this.tool !== 'command')) { el.hidden = true; return; }
        el.hidden = false;
        const p = PROVINCES[G.prov[cell]], o = g.owner[cell], a = g.armyOn(cell);
        el.style.setProperty('--owner', g.nations[o].color);
        const sections = [];

        // Ejército
        if (a && a.owner === p0 && this.tool === 'command') {
            const full = speedOf(this.send, g.rules(a.owner)) * MOVE, left = g.moveBudget(a.owner, a.cell, this.send, a.used);
            const supplied = g.inSupply(p0, a.cell);
            const rows = UNIT_KEYS.filter(k => a.units[k] > 0).map(k => `
                <div class="unit-row">${unitIcon(k, g.nations[o].color)}
                    <div>${CONFIG.TYPES[k].name}<div class="small muted">ataque ${g.rules(p0).types[k].atk}, defensa ${g.rules(p0).types[k].def}, velocidad ${g.rules(p0).types[k].speed}</div></div>
                    <div class="stepper"><button data-action="step" data-unit="${k}" data-delta="-1" ${this.send[k] ? '' : 'disabled'} aria-label="Una menos">−</button>
                    <output>${this.send[k]} de ${a.units[k]}</output>
                    <button data-action="step" data-unit="${k}" data-delta="1" ${this.send[k] < a.units[k] ? '' : 'disabled'} aria-label="Una más">+</button></div>
                </div>`).join('');
            const partial = !sameUnits(this.send, a.units);
            sections.push(`<section class="sec">
                <h3>Tu ejército</h3>
                <div class="units">${rows}</div>
                ${partial ? '<div class="row"><span class="small muted">Mueves solo una parte: el resto se queda.</span><button class="btn ghost" data-action="send-all">Todas</button></div>' : ''}
                <div class="meter"><i style="width:${!supplied ? (left > 0 ? 100 : 0) : full ? Math.round(100 * left / full) : 0}%"></i></div>
                <p class="small">${left <= 0 ? 'Ya no puede moverse este turno.'
                    : supplied ? `Le quedan ${fmtMp(left)} de ${fmtMp(speedOf(this.send, g.rules(a.owner)) * MOVE)} puntos de movimiento.`
                    : 'Puede avanzar una casilla este turno.'}</p>
                ${(() => { const sides = g.hostileSides(p0, a.cell); if (sides < CONFIG.FLANKED_SIDES) return '';
                    const cercado = sides >= CONFIG.SURROUNDED_SIDES;
                    return `<p class="note warn">${cercado ? 'Cercado' : 'Rodeado'} por ${sides} lados: ataque y defensa ×${g.flankFactor(p0, a.cell)} y ${cercado ? 'solo puede avanzar una casilla' : 'mueve la mitad'}. Mejor retirarse o romper el cerco.</p>`; })()}
                ${supplied ? '' : `<p class="note warn">Sin suministro: lejos de tus ciudades y de tu red de carreteras solo avanza una casilla por turno. Construye carreteras hasta el frente para abastecerlo (llegan a ${g.rules(p0).supplyRoad} casillas de la red).</p>`}
                ${left > 0 ? `<p class="note">Haz clic en una casilla ${this.view.isRealistic() ? 'de la zona clara' : 'verde'} para mover o en una roja para atacar. Por carretera llegas más lejos; si no se ha movido este turno, siempre puede avanzar al menos una casilla.</p>` : ''}
            </section>`);
            sections.push(this.orderSection(a));
        } else if (a && g.sees(p0, cell) && g.armyView(p0, a).n === null) {
            const ech = echelonOf(countUnits(a.units));
            sections.push(`<section class="sec"><h3>Ejército de ${g.nm(a.owner)}</h3>
                <p class="small">Un ${ech.name} sin identificar (escalón ${ech.mark}: ${ech.range} unidades).</p>
                <p class="note">Con Reconocimiento 2 o un espía en la provincia sabrías su tipo, su número y su fuerza.</p></section>`);
        } else if (a && g.sees(p0, cell)) {
            sections.push(`<section class="sec"><h3>Ejército de ${g.nm(a.owner)}</h3>
                <div class="units">${UNIT_KEYS.filter(k => a.units[k] > 0).map(k => `<div class="unit-row">${unitIcon(k, g.nations[a.owner].color)}<div>${a.units[k]} ${CONFIG.TYPES[k].name.toLowerCase()}</div><span></span></div>`).join('')}</div>
                <p class="small muted">Ataque ${unitPower(a.units, 'atk', g.rules(a.owner))}, defensa ${unitPower(a.units, 'def', g.rules(a.owner))}${g.fort[cell] ? (g.fortLevel(p0, cell) === null ? ', en una casilla fortificada' : `, ×${String(g.rules(g.owner[cell]).fortDefense).replace('.', ',')} por la fortificación`) : ''}.</p></section>`);
        }

        // Reclutar
        if (this.tool === 'command' && g.owner[p.city] === p0 && g.legal[p.city] !== p0) {
            sections.push(`<section class="sec"><h3>Reclutar</h3><p class="note warn">${esc(p.cityName)} está en disputa: no puedes reclutar aquí hasta que se anexione al firmar la paz.</p></section>`);
        } else if (this.tool === 'command' && g.owner[p.city] === p0) {
            const left = g.recruitLeft(p0, p), ok = g.canRecruitAt(p0, p), gold = g.nations[p0].gold;
            sections.push(`<section class="sec">
                <h3>Reclutar en ${esc(p.cityName)}</h3>
                <p class="small muted" style="margin:-3px 0 4px">${left > 0 ? `Puedes reclutar ${plural(left, 'unidad', 'unidades')} más este turno, de cualquier tipo.` : 'Ya no puedes reclutar más aquí este turno.'}</p>
                <p class="small muted" style="margin:0 0 8px">Cupo ${g.recruitCap(p0, p)}: ${g.recruitBreakdown(p0, p).map(([what, n]) => `${what} ${n}`).join(', ')}. Sube con el desarrollo, las carreteras y autopistas y los yacimientos que la abastecen.</p>
                <div class="row" style="margin-bottom:8px"><span class="small">Cantidad</span><div class="seg" style="flex:1">
                    ${[['1', '×1'], ['5', '×5'], ['max', 'Máximo']].map(([v, label]) => `<button data-action="recruit-qty" data-qty="${v}" class="${String(this.recruitQty ?? 1) === v || (v === 'max' && this.recruitQty === Infinity) ? 'on' : ''}">${label}</button>`).join('')}
                </div></div>
                <div class="recruit">${UNIT_KEYS.map(k => {
                    const t = CONFIG.TYPES[k];
                    const cost = g.unitCost(p0, k, p.id);
                    return `<button class="btn" data-action="recruit" data-unit="${k}" ${!ok || gold < cost ? 'disabled' : ''} title="${cost < t.cost ? `Tus yacimientos lo abaratan: ${t.cost} → ${cost}` : ''}">
                        ${unitIcon(k, g.nations[p0].color)}${t.name}<b>${cost} oro</b></button>`;
                }).join('')}</div>
                <p class="note">Las tropas nuevas aparecen en la ciudad y se mueven a partir del turno siguiente.</p></section>`);
        }

        // Niebla de guerra y espionaje
        if (g.settings.fog && o !== p0 && !g.allied(p0, o)) {
            const spy = g.spies.get(p.id), odds = g.spyOdds(p.id), pct = x => `${Math.round(x * 100)} %`;
            const seen = g.sees(p0, cell);
            let body;
            if (spy) {
                body = `<p class="small">${spy.revealedTurn === g.turn ? 'Tu espía ha informado este turno: ves las tropas de la provincia.' : 'Tu espía no ha conseguido informar este turno.'}
                    ${g.turn === spy.since ? 'Acaba de llegar.' : `Lleva ${plural(g.turn - spy.since, 'turno', 'turnos')} allí.`}</p>
                    <p class="note">Cada turno informa con un ${pct(odds.success)} de probabilidad; el riesgo de que lo capturen el próximo turno es del ${pct(Math.min(g.rules(p0).spyCatchMax, odds.caught + g.rules(p0).spyCatchPerTurn))}.</p>
                    <div class="row" style="margin-top:8px"><button class="btn" data-action="spy-recall" data-pid="${p.id}">Retirar el espía</button></div>`;
            } else {
                body = `<p class="small">${seen ? 'Ahora mismo ves esta casilla.' : 'No ves qué tropas hay en esta provincia.'} Un espía informa de las tropas de toda la provincia cada turno (${pct(odds.success)}) hasta que lo capturan (${pct(odds.caught)} el primer turno, y más cada turno).</p>
                    <div class="row" style="margin-top:8px"><button class="btn" data-action="spy-send" data-pid="${p.id}" ${g.canSpy(p.id) && g.nations[p0].gold >= g.rules(p0).spyCost ? '' : 'disabled'}>Enviar un espía (${g.rules(p0).spyCost} oro)</button></div>`;
            }
            sections.push(`<section class="sec"><h3>Espionaje</h3>${body}</section>`);
        }

        // Objetivo estratégico de la directiva
        if (this.tool === 'command' && g.owner[p.city] !== p0) {
            const on = g.nations[p0].command.goals.includes(p.id);
            sections.push(`<section class="sec"><h3>Objetivo estratégico</h3>
                <div class="row"><button class="btn ${on ? 'on' : ''}" data-action="goal" data-pid="${p.id}">${on ? 'Quitar de los objetivos' : 'Marcar como objetivo'}</button></div>
                <p class="note">Los objetivos de la directiva se siguen en la pestaña Mando; al tenerlos todos frente a un país, te avisa para proponer la paz.</p></section>`);
        }

        // Diplomacia rápida con el dueño de la casilla
        if (o !== p0 && g.nations[o].alive) sections.push(`<section class="sec">${this.diplomacyActions(o, p.id)}</section>`);

        // Provincia
        const control = new Map();
        for (const c of p.cells) control.set(g.owner[c], (control.get(g.owner[c]) ?? 0) + 1);
        const bar = [...control.entries()].sort((x, y) => y[1] - x[1])
            .map(([id, n]) => `<i title="${g.nm(id)}: ${Math.round(100 * n / p.cells.length)} %" style="width:${100 * n / p.cells.length}%;background:${g.nations[id].color}"></i>`).join('');
        const cityOwner = g.owner[p.city];
        const connected = g.economy(cityOwner).connected.has(p.id);
        const res = RESOURCES.filter(r => r.province === p.id);
        sections.push(`<section class="sec">
            <h3>Provincia</h3>
            <div class="control-bar">${bar}</div>
            <dl class="facts">
                <dt>Ciudad</dt><dd>${esc(p.cityName)}${CAPITAL_OF[p.city] >= 0 ? ' ★' : ''}, en manos de ${g.nm(cityOwner)}</dd>
                <dt>Población</dt><dd>${(p.population / 1e6).toLocaleString('es-ES', { maximumFractionDigits: 2 })} millones</dd>
                <dt>Renta</dt><dd>${Math.round(p.value * (1 + g.dev[p.id] / 1000))} de oro${connected ? ` (+${CONFIG.ROAD_BONUS * 100} % por carretera)` : ', sin carretera a la capital'}</dd>
                <dt>Desarrollo</dt><dd>+${Math.round(g.dev[p.id] / 10)} % de renta${g.dev[p.id] < (connected ? CONFIG.DEV_MAX_CONNECTED : CONFIG.DEV_MAX) && g.legal[p.city] === cityOwner ? `, crece un ${(connected ? CONFIG.DEV_GROWTH_CONNECTED : CONFIG.DEV_GROWTH) / 10} % por turno${connected ? '' : ' (con carretera a la capital crecería más)'}` : ''}</dd>
                <dt>Terreno</dt><dd>${this.terrainText(cell)}</dd>
                ${g.sieges.has(p.city) ? `<dt>Asedio</dt><dd class="warn-text">${g.nm(g.sieges.get(p.city).by)} tiene tropas en ${esc(p.cityName)}: lleva ${g.sieges.get(p.city).held} de ${g.rules(g.sieges.get(p.city).by).siegeTurns} turnos. Si las mantiene, toma la provincia.</dd>` : ''}
                ${g.isDisputed(cell) ? `<dt>Estado</dt><dd class="warn-text">en disputa: la ocupa ${g.nm(o)} pero es de ${g.nm(g.legal[cell])}. Rinde la mitad y se anexiona al firmar la paz.</dd>` : ''}
                ${res.map(r => { const reach = g.resourceReach(r); return `<dt>${r.typeName}</dt><dd>${CONFIG.RESOURCE_ICON[r.type]} ${esc(r.name)}, +${r.value} de oro. ${reach.length ? `Abastece también a ${reach.map(x => esc(PROVINCES[x].name)).join(', ')}.` : 'Solo abastece a esta provincia: pasa una carretera por su casilla y llévala hasta otras ciudades.'}</dd>`; }).join('')}
                ${(() => { const s = g.provinceSupply(p.id), r = g.rules(g.owner[p.city]); return s.length ? `<dt>Industria</dt><dd>+${Math.round(100 * Math.min(r.resIndustryMax, r.resIndustry * s.length))} % de renta y tropas más baratas: la abastecen ${s.map(r => `${CONFIG.RESOURCE_ICON[r.type]} ${esc(r.name)}`).join(', ')}</dd>` : ''; })()}
                ${g.fort[cell] ? `<dt>Casilla</dt><dd>fortificada</dd>` : g.fortWork.has(cell) ? `<dt>Casilla</dt><dd>fortificando, ${plural(g.fortWork.get(cell).left, 'turno', 'turnos')}</dd>` : ''}
            </dl></section>`);

        el.innerHTML = `
            <header class="card-head">
                <div><h2>${esc(p.name)}</h2>
                    <p class="row">${this.nationChip(o)} ${this.relationChip(o)}${g.isDisputed(cell) ? ` <span class="small warn-text">en disputa con ${g.nm(g.legal[cell])}</span>` : o !== p.country ? ` <span class="small muted">antes de ${g.nm(p.country)}</span>` : ''}</p></div>
                <button class="btn ghost" data-action="close-card" aria-label="Cerrar" title="Cerrar (Esc)">✕</button>
            </header>${sections.join('')}`;
    }

    // Qué hace un ejército con orden, en una frase.
    orderText(a) {
        const g = this.game, o = a.order;
        if (!o) return '';
        const place = c => { const p = PROVINCES[G.prov[c]]; return esc(CITY_OF[c] >= 0 ? p.cityName : p.name); };
        const eta = o.eta ? `; llega en ${o.eta === 1 ? 'este turno o el siguiente' : `unos ${o.eta} turnos`}` : '';
        const stuck = o.stuck ? ` <span class="warn-text">Sin paso desde hace ${plural(o.stuck, 'turno', 'turnos')}: se cancela a los 3.</span>` : '';
        const ratio = o.ratio ? `con una relación de fuerzas de ${decimal(o.ratio)} a 1 o más` : 'a toda costa';
        switch (o.kind) {
            case 'march': return `Marcha hacia ${place(o.dest)}${eta}.${stuck}`;
            case 'attack': return `Va a por ${place(o.dest)} y ataca lo que haya ${ratio}${eta}.${stuck}`;
            case 'hold': return 'Mantiene la posición: no se mueve hasta que le des otra orden.';
            case 'fortify': return `Fortificará su casilla en cuanto tengas ${g.rules(g.player).fortCost} de oro.`;
            case 'follow': { const t = g.armies.get(o.target); return t ? `Sigue al ejército de ${place(t.cell)} (${countUnits(t.units)} unidades), una casilla por detrás.` : 'Sigue a un ejército que ya no existe.'; }
        }
        return '';
    }
    // Órdenes de varios turnos en la ficha del ejército.
    orderSection(a) {
        const o = a.order, flee = o ? o.flee : (this.orderFlee ?? true), ratio = o?.kind === 'attack' ? o.ratio : this.orderRatio;
        const btn = (kind, label, title) => `<button class="btn ${o?.kind === kind ? 'on' : ''}" data-action="order" data-kind="${kind}" title="${title}">${label}</button>`;
        return `<section class="sec">
            <h3>Orden de varios turnos</h3>
            ${(() => { const g = this.game, ops = g.opsOf(g.player); return ops.length ? `<div class="row" style="margin-bottom:8px"><span class="small">Operación</span>
                <select data-op-assign style="flex:1"><option value="0">Ninguna</option>${ops.map(o => `<option value="${o.id}" ${a.op === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select></div>` : ''; })()}
            ${o ? `<p class="small">${this.orderText(a)}</p>
                <div class="row" style="margin:6px 0 8px"><button class="btn ghost" data-action="order-cancel">Cancelar la orden</button></div>`
                : a.op ? `<p class="small muted">Sin orden propia: lo mueve su operación${this.game.ops.get(a.op)?.auto === 'manual' ? ' (en manual: no lo mueve)' : ''}.</p>` : '<p class="small muted">Sin orden: solo se mueve cuando lo mueves tú.</p>'}
            <div class="orders">
                ${btn('march', 'Marchar a…', 'Elige un destino; va hasta allí aunque tarde varios turnos, por el camino más rápido')}
                ${btn('attack', 'Atacar…', 'Elige un objetivo; va hasta allí y ataca cuando tenga la ventaja que marques')}
                ${btn('hold', 'Mantener', 'Se queda donde está; «Siguiente ejército» deja de pedirte que lo muevas')}
                ${btn('fortify', 'Fortificar aquí', 'Fortifica su casilla y se queda en ella')}
                ${btn('follow', 'Seguir a…', 'Va una casilla por detrás de otro ejército tuyo, por ejemplo artillería tras los tanques')}
            </div>
            <div class="row" style="margin-top:8px"><span class="small">Atacar con</span><div class="seg" style="flex:1">
                ${[[1.8, '1,8 : 1'], [1.3, '1,3 : 1'], [1, '1 : 1'], [0, 'Siempre']].map(([v, l]) => `<button data-action="order-ratio" data-value="${v}" class="${ratio === v ? 'on' : ''}" title="${v ? `Solo ataca si su fuerza es al menos ${decimal(v)} veces la del defensor` : 'Ataca sin mirar la relación de fuerzas'}">${l}</button>`).join('')}
            </div></div>
            <label class="check small" style="margin-top:8px"><input type="checkbox" data-action="order-flee" ${flee ? 'checked' : ''}> Apartarse si lo rodean (3 lados o más)</label>
            <p class="note">Las órdenes son para todo el ejército y se cumplen solas al terminar tu turno, o ya con «Ejecutar órdenes» (O). Si lo mueves a mano, ese turno manda lo tuyo. Con niebla, la ventaja se calcula con lo peor de su escalón.</p>
        </section>`;
    }

    // Botones de diplomacia con una nación (en la ficha y en el panel de países).
    diplomacyActions(t, pid = -1) {
        const g = this.game, p0 = g.player, r = g.rel(p0, t);
        let html = `<h3>Diplomacia con ${g.nm(t)}</h3>`;
        if (g.nations[t].overlord === p0) {
            const p = pid >= 0 ? PROVINCES[pid] : null;
            return html + `<p class="small muted">Es tu satélite: te paga ${Math.round(g.economy(t).total * CONFIG.TRIBUTE)} de oro por turno, entra en tus guerras y nunca te ataca.</p>
                <div class="row" style="margin-top:8px">
                    ${p && g.owner[p.city] === t ? `<button class="btn" data-action="sat-annex-prov" data-pid="${p.id}">Anexionar ${esc(p.name)}</button>` : ''}
                    <button class="btn" data-action="sat-annex" data-target="${t}">Anexionar todo el país</button>
                    <button class="btn ghost" data-action="sat-release" data-target="${t}">Conceder la independencia</button>
                </div>`;
        }
        if (g.atWar(p0, t)) {
            const asked = g.proposedThisTurn.has(`paz${t}`);
            html += `<p class="small muted">En guerra desde el turno ${r.since}.</p>
                <div class="row" style="margin-top:8px"><button class="btn" data-action="peace-open" data-target="${t}" ${asked ? 'disabled' : ''}>${asked ? 'Paz ya propuesta este turno' : 'Negociar la paz'}</button></div>`;
            const helpers = g.nations.filter(n => n.alive && n.id !== p0 && g.allied(p0, n.id) && n.overlord < 0 && !g.atWar(n.id, t));
            if (helpers.length) {
                const label = x => { const o = g.callToWarOdds(x, t); return o >= 0.6 ? 'probable' : o >= 0.3 ? 'dudoso' : o > 0 ? 'improbable' : 'no puede'; };
                const sel = this.callAlly && helpers.some(n => n.id === this.callAlly) ? this.callAlly : helpers.sort((a, b) => g.callToWarOdds(b.id, t) - g.callToWarOdds(a.id, t))[0].id;
                const asked2 = g.proposedThisTurn.has(`call${sel}:${t}`);
                html += `<p class="small" style="margin-top:12px">Pedir a un aliado que entre en la guerra contra ${g.nm(t)}:</p>
                    <div class="row" style="margin-top:6px">
                        <select data-call-war="${t}" style="flex:1">${helpers.map(n => `<option value="${n.id}" ${n.id === sel ? 'selected' : ''}>${n.name} (${label(n.id)})</option>`).join('')}</select>
                        <button class="btn" data-action="call-war" data-target="${t}" ${asked2 || !g.callToWarOdds(sel, t) ? 'disabled' : ''}>${asked2 ? 'Ya se lo has pedido' : 'Pedir ayuda'}</button>
                    </div>
                    <p class="note">Acepta más si tiene frontera con ${g.nm(t)} y si juntos sois más fuertes. Si entra, los aliados de ${g.nm(t)} irán contra él.</p>`;
            }
            return html;
        }
        const allies = g.knownAllies(p0, t).filter(x => x !== p0);
        const shared = g.sharedBlocs(p0, t);
        const truce = g.turn < r.truceUntil;
        const invites = g.blocsOf(p0).filter(b => !b.members.has(t));
        if (allies.length) html += `<p class="small muted">Si le atacas, también te declaran la guerra: ${allies.map(x => g.nm(x)).join(', ')}.</p>`;
        if (shared.length) html += `<p class="note warn">Sois aliados: atacarle te expulsa de ${shared.map(b => esc(b.name)).join(', ')}.</p>`;
        html += `<div class="row" style="margin-top:8px">
            <button class="btn war" data-action="diplo" data-kind="war" data-target="${t}" ${truce ? 'disabled' : ''}>${truce ? `Tregua hasta el turno ${r.truceUntil}` : 'Declarar la guerra'}</button>
            ${invites.map(b => {
                const asked = g.proposedThisTurn.has(`inv${b.id}:${t}`);
                return `<button class="btn" data-action="invite" data-bloc="${b.id}" data-target="${t}" ${asked ? 'disabled' : ''}>Invitar a ${esc(b.name)}</button>`;
            }).join('')}</div>`;
        return html;
    }

    // Aviso pasajero (unos segundos) con un botón opcional.
    // Aviso flotante durante 6 segundos. Con `opts.key`, sustituye al aviso anterior de la misma clave (el parte de
    // operaciones de un turno al del siguiente); `opts.id` va como data-id en el botón.
    notify(html, action, label, opts = {}) {
        const note = { html, action, label, key: opts.key, data: opts.id, id: (this.flashId = (this.flashId ?? 0) + 1) };
        this.flashes = (this.flashes ?? []).filter(x => !opts.key || x.key !== opts.key);
        this.flashes.push(note);
        setTimeout(() => { this.flashes = this.flashes.filter(x => x !== note); this.renderToasts(); }, 6000);
        this.renderToasts();
    }
    // Lo que en la leyenda depende de tus investigaciones: costes de terreno, carreteras, ríos y asedios.
    renderLegend() {
        const key = `${this.game.player}:${this.game.techVersion}`;
        if (this.legendKey === key) return;
        this.legendKey = key;
        const r = this.myRules(), set = (k, html) => { const el = $(`#legend [data-legend="${k}"]`); if (el) el.innerHTML = html; };
        set('terrain', Object.entries(CONFIG.TERRAIN).map(([k, t]) => `${t.name.toLowerCase()} ${decimal(r.terrainCost[k])}${t.def > 1 ? ` ×${decimal(t.def)}` : ''}`).join(', '));
        set('road', moveFraction(r.roadMove[1]));
        set('highway', moveFraction(r.roadMove[2]));
        set('river', r.riverCrossing ? `cruzarlo sin carretera cuesta ${moveFraction(r.riverCrossing)} punto más` : 'tus pontoneros lo cruzan sin coste extra');
        set('siege', r.siegeTurns);
    }
    // Lo que sabes de la investigación de otro país: cuántas ha terminado y, si un espía informa, cuáles y qué investiga.
    researchText(id) {
        const g = this.game, s = g.nations[id].tech;
        const head = plural(s.done.size, 'terminada', 'terminadas');
        if (!g.knowsResearch(g.player, id)) return `${head}<br><span class="small muted">Un espía en su capital te diría cuáles.</span>`;
        const names = [...s.done].map(x => TECH_BY_ID.get(x).name).join(', ');
        const now = s.current.map(x => `${TECH_BY_ID.get(x).name} (faltan ${g.techTurns(id, x) - g.techProgress(id, x)})`).join(' y ');
        return `${head}${names ? `: ${names}` : ''}<br><span class="small muted">${now ? `Investiga ${now}.` : 'No investiga nada ahora.'}</span>`;
    }
    myRules() { return this.game.player !== null ? this.game.rules(this.game.player) : BASE_RULES; }

    // --- Investigación ---
    renderResearchFigure() {
        const g = this.game, p0 = g.player, fig = $('#fig-research');
        fig.hidden = p0 === null || g.over;
        $('#end-turn').classList.toggle('nudge', p0 !== null && !g.over && g.nations[p0].tech.current.length < g.rules(p0).labs);
        if (fig.hidden) return;
        const cur = g.nations[p0].tech.current;
        if (!cur.length) {
            fig.className = 'figure research idle';
            fig.innerHTML = '<span>Investigación</span><b>Laboratorio libre</b>';
            return;
        }
        const t = TECH_BY_ID.get(cur[0]), p = g.techProgress(p0, t.id), turns = g.techTurns(p0, t.id);
        fig.className = 'figure research';
        fig.innerHTML = `<span>Investigando${cur.length > 1 ? ' (2)' : ''}</span><b>${t.name} · ${turns - p} t</b><div class="mini"><i style="width:${Math.round(100 * p / turns)}%"></i></div>`;
    }
    openResearch(techId) {
        if (this.game.player === null || this.game.over) return;
        if (techId) this.researchSel = techId;
        this.renderResearch();
        if (!$('#research-dialog').open) $('#research-dialog').showModal();
        $('#research-dialog .rs-node.sel')?.focus();
    }
    // Casillas visibles con el filtro actual, por filas (ramas) y columnas (niveles), para moverse con las flechas.
    researchGrid() {
        const area = this.researchFilter ?? 'Todas';
        return RESEARCH_BRANCHES.filter(b => area === 'Todas' || b.area === area).map(b => [1, 2, 3].map(i => `${b.id}${i}`));
    }
    onResearchKey(e) {
        if (e.key === 'i' || e.key === 'I') { $('#research-dialog').close(); return; }
        const grid = this.researchGrid(), sel = this.researchSel;
        const r = grid.findIndex(row => row.includes(sel)), c = r >= 0 ? grid[r].indexOf(sel) : 0;
        const move = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
        if (move) {
            e.preventDefault();
            const nr = Math.max(0, Math.min(grid.length - 1, (r < 0 ? 0 : r) + move[0])), nc = Math.max(0, Math.min(2, c + move[1]));
            this.researchSel = grid[nr][nc];
            this.renderResearch();
            $('#research-dialog .rs-node.sel')?.focus();
        } else if (e.key === 'Enter' && e.target.closest?.('.rs-node')) {
            e.preventDefault();
            $('#research-dialog .rs-card [data-action="rs-start"], #research-dialog .rs-card [data-action="rs-pause"]')?.click();
        }
    }
    renderResearch() {
        const g = this.game, p0 = g.player;
        if (p0 === null) return;
        const s = g.nations[p0].tech, rules = g.rules(p0), gold = g.nations[p0].gold;
        if (!TECH_BY_ID.has(this.researchSel)) this.researchSel = s.current[0] ?? TECHS.find(t => g.techState(p0, t.id) === 'open')?.id ?? TECHS[0].id;
        const area = this.researchFilter ?? 'Todas';
        if (area !== 'Todas' && TECH_BY_ID.get(this.researchSel) && BRANCH_BY_ID.get(TECH_BY_ID.get(this.researchSel).branch).area !== area)
            this.researchSel = `${RESEARCH_BRANCHES.find(b => b.area === area).id}1`;
        const ring = (p, t) => {
            const c = 2 * Math.PI * 18;
            return `<svg class="rs-ring" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="18"/>
                <circle class="fg" cx="22" cy="22" r="18" stroke-dasharray="${(c * p / t).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 22 22)"/>
                <text x="22" y="26.5" text-anchor="middle">${t - p}</text></svg>`;
        };
        const bar = (p, t) => `<div class="rs-bar"><i style="width:${Math.round(100 * p / t)}%"></i></div>`;
        let labs = '';
        for (let k = 0; k < rules.labs; k++) {
            const id = s.current[k];
            if (id) {
                const t = TECH_BY_ID.get(id), p = g.techProgress(p0, id), turns = g.techTurns(p0, id);
                labs += `<button class="rs-lab" type="button" data-action="rs-select" data-tech="${id}">${ring(p, turns)}<span><small>Laboratorio ${k + 1}</small><b>${t.name}</b><small>Termina en el turno ${g.turn + turns - p}</small></span></button>`;
            } else labs += `<div class="rs-lab free"><span class="rs-slot">${uiIcon('flask', 20)}</span><span><small>Laboratorio ${k + 1}</small><b>Libre</b><small>Elige una investigación</small></span></div>`;
        }
        if (rules.labs === 1) labs += `<div class="rs-lab locked"><span class="rs-slot">${uiIcon('lock', 18)}</span><span><small>Laboratorio 2</small><b>Cerrado</b><small>Se abre con ${TECH_BY_ID.get('ciencia3').name}</small></span></div>`;

        const rows = RESEARCH_BRANCHES.filter(b => area === 'Todas' || b.area === area).map(b => `<div class="rs-row">
            <div class="rs-name"><span class="rs-patch">${rsIcon(b.icon)}</span><span><b>${b.name}</b><small>${b.sub}</small></span></div>
            ${[1, 2, 3].map(i => {
                const id = `${b.id}${i}`, t = TECH_BY_ID.get(id), st = g.techState(p0, id), p = g.techProgress(p0, id), turns = g.techTurns(p0, id);
                let line;
                if (st === 'done') line = `${uiIcon('check', 14)} Hecha`;
                else if (st === 'current') line = `En curso · faltan ${turns - p}`;
                else if (st === 'paused') line = `${uiIcon('pause', 13)} En pausa · ${p}/${turns}`;
                else if (st === 'locked') line = `${uiIcon('lock', 13)} Tras el nivel ${i - 1}`;
                else { const c = g.researchCost(p0, id); line = `${turns} turnos · <span class="${c > gold ? 'short' : ''}">${c} oro</span>`; }
                const after = i > 1 && s.done.has(`${b.id}${i - 1}`) ? ' after-done' : '';
                return `<button class="rs-node ${st}${after}${this.researchSel === id ? ' sel' : ''}" type="button" data-action="rs-select" data-tech="${id}" aria-pressed="${this.researchSel === id}">
                    ${galones(i)}<span class="n">${t.name}</span><span class="st">${line}</span>${st === 'current' || st === 'paused' ? bar(p, turns) : ''}</button>`;
            }).join('')}</div>`).join('');

        const t = TECH_BY_ID.get(this.researchSel), br = BRANCH_BY_ID.get(t.branch), st = g.techState(p0, t.id);
        const p = g.techProgress(p0, t.id), turns = g.techTurns(p0, t.id);
        const swap = s.current.length >= rules.labs ? s.current[0] : null;
        const swapNote = swap && (st === 'open' || st === 'paused')
            ? `<p class="swap">${TECH_BY_ID.get(swap).name} quedará en pausa con sus ${g.techProgress(p0, swap)} de ${g.techTurns(p0, swap)} turnos; no se vuelve a pagar.</p>` : '';
        let action;
        if (st === 'done') action = `<p class="status" style="color:var(--go)">${uiIcon('check')} Investigada. El efecto ya se aplica.</p>`;
        else if (st === 'current') action = `<p class="status">En curso: ${p} de ${turns} turnos. Termina en el turno ${g.turn + turns - p}.</p><button class="btn" data-action="rs-pause" data-tech="${t.id}">${uiIcon('pause')} Pausar</button>`;
        else if (st === 'paused') action = `<p class="status">En pausa: ${p} de ${turns} turnos, ya pagada.</p><button class="btn primary" data-action="rs-start" data-tech="${t.id}">Reanudar · ${plural(turns - p, 'turno', 'turnos')}</button>${swapNote}`;
        else if (st === 'locked') action = `<p class="status muted">${uiIcon('lock')} Antes, ${TECH_BY_ID.get(`${t.branch}${t.tier - 1}`).name} (nivel ${t.tier - 1}).</p>`;
        else {
            const c = g.researchCost(p0, t.id);
            action = c > gold ? `<button class="btn" disabled>Te faltan ${c - gold} de oro</button>`
                : `<button class="btn primary" data-action="rs-start" data-tech="${t.id}">Investigar · ${c} oro · ${plural(turns, 'turno', 'turnos')}</button>${swapNote}`;
        }
        const card = `<div class="rs-card"><div class="rs-who"><span class="rs-patch lg">${rsIcon(br.icon)}</span><div><div class="rs-crumb">${br.name} · ${galones(t.tier)} nivel ${t.tier}</div><h3>${t.name}</h3></div></div>
            <div class="rs-deltas">${t.changes.map(([k, a, b]) => `<div><span>${k}</span><b><s>${a}</s>${uiIcon('arrow', 14)}<em>${b}</em></b></div>`).join('')}</div>
            ${action}<p class="tip">${t.note}</p></div>`;

        const growth = Math.round(CONFIG.RESEARCH.COST_GROWTH * 100 * s.done.size);
        $('#research-body').innerHTML = `<div class="rs-head"><h2>Investigación</h2>
            <span class="muted">${plural(s.done.size, 'terminada', 'terminadas')}${growth ? ` · cada nueva cuesta un ${growth} % más` : ''}</span>
            <button class="btn ghost" data-action="close-research" aria-label="Cerrar">Cerrar <kbd>Esc</kbd></button></div>
            <div class="rs-labs">${labs}</div>
            <div class="rs-filter" role="group" aria-label="Filtrar por área">${['Todas', ...RESEARCH_AREAS].map(a => `<button data-action="rs-filter" data-area="${a}" class="${area === a ? 'on' : ''}" aria-pressed="${area === a}">${a}</button>`).join('')}</div>
            <div class="rs-body"><div class="rs-rows">${rows}</div>${card}</div>`;
    }

    renderToasts() {
        const g = this.game;
        $('#toasts').innerHTML = (this.flashes ?? []).map(f => `<div class="toast float done"><p>${f.html}</p>
            ${f.action ? `<div class="row"><button class="btn" data-action="${f.action}"${f.data ? ` data-id="${f.data}"` : ''}>${f.label}</button></div>` : ''}</div>`).join('') + g.proposals.map((pr, i) => {
            const who = `<b>${g.nm(pr.from)}</b>`;
            let text, yes = 'Aceptar', no = 'Rechazar';
            if (pr.kind === 'paz') text = `${who} te propone la paz.`;
            else if (pr.kind === 'bloque') text = `${who} te invita a ${pr.blocId && g.bloc(pr.blocId) ? `unirte a ${esc(g.bloc(pr.blocId).name)}` : 'formar una alianza'}.`;
            else { text = `${who}, tu aliado, ha sido atacado por <b>${g.nm(pr.against)}</b>. Si no acudes, saldrás de vuestras alianzas.`; yes = 'Ir a la guerra'; no = 'No intervenir'; }
            const yesAction = pr.kind === 'paz' ? `data-action="peace-open" data-target="${pr.from}"` : `data-action="accept" data-index="${i}"`;
            if (pr.kind === 'paz') yes = 'Negociar';
            return `<div class="toast float" style="border-left-color:${g.nations[pr.from].color}"><p>${text}</p>
                <div class="row"><button class="btn primary" ${yesAction}>${yes}</button>
                <button class="btn" data-action="reject" data-index="${i}">${no}</button></div></div>`;
        }).join('');
    }

    renderConfirm() {
        const g = this.game, el = $('#confirm'), plan = this.pending;
        el.classList.toggle('road', this.tool === 'road' && g.player !== null && !g.over && !this.proposal);
        if (this.proposal) {
            const pr = this.proposal, moves = pr.ghost.filter(e => e.kind === 'move').length, fights = pr.ghost.filter(e => e.kind === 'battle').length;
            const names = pr.ids.map(id => g.ops.get(id)?.name).filter(Boolean).map(esc).join(', ');
            el.hidden = false;
            el.innerHTML = `<span><b>${names}</b>: ${plural(moves, 'movimiento', 'movimientos')}${fights ? ` y ${plural(fights, 'ataque', 'ataques')}` : ''} propuestos.
                <span class="small muted">Toca un ejército para dejarlo fuera.</span></span>
                <button class="btn primary" data-action="assist-yes">Confirmar y terminar el turno</button>
                <button class="btn" data-action="assist-no">Terminar sin ellos</button>
                <button class="btn ghost" data-action="assist-back">Volver</button>`;
            return;
        }
        if (this.tool === 'road' && g.player !== null && !g.over) { this.renderRoadBar(el); return; }
        if (!plan || g.player === null) {
            // Con el dedo, mientras se construye, un botón visible para terminar (no hay clic derecho ni Esc).
            el.hidden = !(this.touch && ['road', 'fort'].includes(this.tool) && g.player !== null);
            if (el.hidden) el.innerHTML = '';
            else el.innerHTML = `<span class="small">${this.anchor < 0 ? 'Toca una casilla tuya para empezar' : 'Toca dónde termina la obra'}</span>
                <button class="btn" data-action="stop-build">Terminar obras</button>`;
            return;
        }
        const ok = plan.cost <= g.nations[g.player].gold;
        const what = plan.cls === 'fort' ? `Fortificar ${plural(plan.cells.length, 'casilla', 'casillas')}` : `${plural(plan.path.length - 1, 'tramo', 'tramos')} de ${plan.cls === 2 ? 'autopista' : 'carretera'}`;
        el.hidden = false;
        el.innerHTML = `<span>${what}: <b style="color:${ok ? 'var(--signal)' : 'var(--war)'}">${plan.cost} de oro</b></span>
            <button class="btn primary" data-action="confirm-build" ${ok ? '' : 'disabled'}>Confirmar</button>
            <button class="btn" data-action="cancel-build">Cancelar</button>`;
    }

    // Panel de la herramienta Carretera: carretera o autopista, qué hacer, lo que cuesta el trazado (nuevo y mejorado)
    // y, si la casilla elegida ya tiene carretera, pasar a autopista todo su tramo.
    renderRoadBar(el) {
        const g = this.game, r = this.myRules(), gold = g.nations[g.player].gold, plan = this.pending;
        const per = cls => decimal((cls === 1 ? CONFIG.ROAD_COST : CONFIG.ROAD_COST + CONFIG.HIGHWAY_COST) * r.roadCost);
        let body;
        if (plan) {
            const sp = g.roadSplit(plan), ok = plan.cost <= gold;
            body = `<span>${[sp.fresh ? plural(sp.fresh, 'tramo nuevo', 'tramos nuevos') : '', sp.up ? `${plural(sp.up, 'tramo mejorado', 'tramos mejorados')} (solo la diferencia)` : ''].filter(Boolean).join(' y ') || 'Ya está hecho'}
                de ${plan.cls === 2 ? 'autopista' : 'carretera'}: <b style="color:${ok ? 'var(--signal)' : 'var(--war)'}">${plan.cost} de oro</b></span>
                <button class="btn primary" data-action="confirm-build" ${ok ? '' : 'disabled'}>Confirmar</button>
                <button class="btn" data-action="cancel-build">Cancelar</button>`;
        } else body = `<span class="small">${this.anchor < 0 ? `${this.touch ? 'Toca' : 'Haz clic en'} una casilla tuya para empezar, o en una carretera para mejorar su tramo.`
            : `${this.touch ? 'Toca' : 'Haz clic en'} donde termina el tramo: se construye el camino más barato.`}</span>`;
        const st = this.stretch, stOk = st && st.cost <= gold;
        el.hidden = false;
        el.innerHTML = `<button class="tool tick road-tick ${this.highway ? 'on' : ''}" data-action="highway" aria-pressed="${this.highway}" title="Construir como autopista, o mejorar a autopista la carretera que ya haya (tecla A)">
                <span class="box" aria-hidden="true">${this.highway ? '✓' : ''}</span>Autopista<kbd>A</kbd></button>
            <span class="small muted road-price">${this.highway ? `⅓ de punto por tramo, ${per(2)} de oro (${decimal(CONFIG.HIGHWAY_COST * r.roadCost)} si ya hay carretera)` : `½ punto por tramo, ${per(1)} de oro`} × terreno</span>
            ${body}
            ${st && !plan ? `<button class="btn" data-action="upgrade-stretch" ${stOk ? '' : 'disabled'} title="De ciudad o cruce a ciudad o cruce">Pasar a autopista este tramo (${plural(st.edges.length, 'tramo', 'tramos')}, ${st.cost} de oro)</button>` : ''}
            ${plan ? '' : '<button class="btn ghost" data-action="stop-build">Terminar obras</button>'}`;
    }

    renderHint() {
        const g = this.game, el = $('#hint');
        let text;
        if (this.hintOverride) text = this.hintOverride;
        else if (g.player === null) text = 'Haz clic en un país para elegirlo. Rueda del ratón: zoom; arrastrar: mover el mapa.';
        else if (g.over) text = '';
        else if (this.tool === 'cities') text = 'Ciudades: haz clic en tus provincias para añadirlas o quitarlas de la selección.';
        else if (this.tool === 'fort') text = this.anchor < 0 ? 'Fortificar: haz clic en una casilla tuya.' : 'Clic en otra casilla para fortificar la línea, o en la misma para solo esa. Clic derecho para terminar.';
        else if (this.tool === 'road') text = '';   // lo explica su panel
        else if (this.proposal) text = 'Líneas blancas: lo que harían tus operaciones asistidas. Confirma, termina sin ellas o vuelve al turno.';
        else if (this.tool === 'op') text = `${OP_KINDS[this.opDraft.kind].name}: ${OP_KINDS[this.opDraft.kind].how}`;
        else if (this.ordering) text = this.ordering.kind === 'follow' ? 'Haz clic en el ejército tuyo al que debe seguir. Esc para cancelar.'
            : `Haz clic en el destino: ${this.ordering.kind === 'attack' ? 'irá hasta allí y atacará lo que haya cuando tenga ventaja' : 'irá hasta allí aunque tarde varios turnos'}.${this.touch ? '' : ' Esc para cancelar.'}`;
        else if (this.reachInfo) text = `${this.view.isRealistic() ? 'Zona clara: mover' : 'Verde: mover'}. Rojo: atacar.${this.touch ? ' Más lejos: «Marchar a…» en la ficha.' : ' Mayúsculas + clic más lejos: marchar en varios turnos. Esc para cancelar.'}`;
        else text = this.touch ? 'Toca un ejército tuyo para darle órdenes, o una provincia para ver qué puedes hacer.'
            : 'Clic en un ejército tuyo para darle órdenes (con Mayúsculas + clic, marcha hasta allí en varios turnos), o en una provincia para ver qué puedes hacer.';
        el.textContent = text;
        el.hidden = !text;
        el.classList.toggle('beside-card', !$('#card').hidden);
    }

    renderDrawer() {
        const g = this.game, el = $('#drawer');
        el.hidden = g.player === null;
        el.classList.toggle('closed', !this.drawerOpen);
        if (g.player === null) return;
        const unread = g.logs.length - this.seenLog;
        if (this.tab === 'registro' && this.drawerOpen) this.seenLog = g.logs.length;
        const tabs = [['paises', 'Países'], ['mando', 'Mando'], ['alianzas', 'Alianzas'], ['registro', 'Registro']];
        el.innerHTML = `<div class="sheet-grip" data-sheet-grip role="button" aria-label="Agrandar o achicar el panel"><i></i></div><div class="tabs">
            ${tabs.map(([id, label]) => `<button data-action="tab" data-tab="${id}" class="${this.tab === id ? 'on' : ''}">${label}${id === 'registro' && unread > 0 && this.tab !== 'registro' ? `<span class="count">${unread}</span>` : ''}</button>`).join('')}
            <button class="toggle" data-action="drawer" title="${this.drawerOpen ? 'Ocultar el panel' : 'Mostrar el panel'}" aria-label="${this.drawerOpen ? 'Cerrar' : 'Abrir'}">${isMobile() ? '✕' : this.drawerOpen ? '›' : '‹'}</button></div>
            <div class="drawer-body" id="drawer-body"></div>`;
        if (!this.drawerOpen) return;
        if (this.tab === 'paises') this.renderNations();
        else if (this.tab === 'mando') this.renderCommand();
        else if (this.tab === 'alianzas') this.renderBlocs();
        else this.renderLog();
    }

    renderNations() {
        const g = this.game, body = $('#drawer-body');
        if (this.focusNation !== null) {
            const t = this.focusNation, n = g.nations[t], lands = g.landCounts(), powers = g.powers();
            const blocs = g.visibleBlocs(g.player).filter(b => b.members.has(t));
            body.innerHTML = `<button class="btn ghost" data-action="nation-back">‹ Todos los países</button>
                <div class="pick" style="border-left-color:${n.color}">
                    <h3>${n.name}</h3><p class="row" style="margin-top:4px">${this.relationChip(t)}</p>
                    <dl class="facts" style="margin-top:8px">
                        <dt>Capital</dt><dd>${esc(n.capitalName)}${g.owner[n.capitalCell] !== t ? ` (en manos de ${g.nm(g.owner[n.capitalCell])})` : ''}</dd>
                        <dt>Territorio</dt><dd>${(100 * lands[t] / G.land.length).toFixed(1)} % ${MAP.of}</dd>
                        <dt>Fuerza</dt><dd>${this.powerText(t, powers)}</dd>
                        <dt>Investigación</dt><dd>${this.researchText(t)}</dd>
                        <dt>Alianzas</dt><dd>${blocs.map(b => esc(b.name) + (b.secret ? ' (secreta)' : '')).join(', ') || 'ninguna conocida'}</dd>
                        ${n.overlord >= 0 ? `<dt>Señor</dt><dd>${g.nm(n.overlord)}</dd>` : ''}
                        ${n.overlord === g.player ? `<dt>Tributo</dt><dd>${Math.round(g.economy(t).total * CONFIG.TRIBUTE)} de oro por turno</dd>` : ''}
                        ${g.satellitesOf(t).length ? `<dt>Satélites</dt><dd>${g.satellitesOf(t).map(x => g.nm(x)).join(', ')}</dd>` : ''}
                    </dl>
                    ${t === g.player ? this.economyFacts(t) : ''}
                    <button class="btn" style="margin-top:10px" data-action="goto" data-cell="${n.capitalCell}" ${n.alive ? '' : 'disabled'}>Ver en el mapa</button>
                </div>
                ${n.alive && t !== g.player ? `<div style="margin-top:12px">${this.diplomacyActions(t)}</div>` : ''}`;
            return;
        }
        body.innerHTML = `<input type="search" id="nation-search" placeholder="Buscar país" value="${esc(this.filter)}" aria-label="Buscar país">
            <div id="nation-list"></div>`;
        this.renderNationList();
    }

    // Con niebla de guerra solo se conoce la fuerza propia y la de los aliados.
    powerText(id, powers) {
        const g = this.game;
        return !g.settings.fog || id === g.player || g.allied(g.player, id) ? String(powers[id]) : '?';
    }

    // Desglose de la renta y de los precios de las tropas (para tu país).
    economyFacts(id) {
        const g = this.game, e = g.economy(id), tr = g.tribute(id);
        const counts = Object.entries(e.byType).map(([k, n]) => `${CONFIG.RESOURCE_ICON[k]} ${n}`).join(' ');
        return `<h3 style="margin-top:12px">Economía</h3><dl class="facts">
            <dt>Provincias</dt><dd>${e.base} de oro</dd>
            <dt>Desarrollo</dt><dd>+${e.dev}</dd>
            <dt>Industria</dt><dd>+${e.industry}${e.access.size ? ` (${plural(e.access.size, 'provincia abastecida', 'provincias abastecidas')} por yacimientos)` : ''}</dd>
            <dt>Carreteras</dt><dd>+${e.road}</dd>
