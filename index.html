            <dt>Imperio</dt><dd>+${e.empire}${e.empireRate > 0 ? ` (+${Math.round(e.empireRate * 100)} % por ${e.legalProvinces - START_PROVINCES[id]} provincias ganadas)` : ' (crece al anexionar provincias)'}</dd>
            <dt>Recursos</dt><dd>+${e.res}${counts ? ` (${counts})` : ''}${e.looseResources.length ? `<br><span class="small muted">${plural(e.looseResources.length, 'yacimiento', 'yacimientos')} sin carretera: solo abastecen a su provincia</span>` : ''}</dd>
            ${tr.in || tr.out ? `<dt>Tributo</dt><dd>${tr.in ? `+${tr.in}` : ''}${tr.out ? ` −${tr.out}` : ''}</dd>` : ''}
            ${e.capitalLost ? `<dt>Capital</dt><dd class="warn-text">perdida: tus yacimientos y tu industria rinden la mitad hasta que la recuperes</dd>` : ''}
            <dt>Total</dt><dd><b>${g.income(id)} de oro por turno</b></dd>
            <dt>Precios en la capital</dt><dd>${UNIT_KEYS.map(k => `${CONFIG.TYPES[k].name.toLowerCase()} ${g.unitCost(id, k, G.prov[g.nations[id].capitalCell])}`).join(', ')}</dd>
        </dl>`;
    }

    renderNationList() {
        const g = this.game, p0 = g.player, list = $('#nation-list');
        if (!list) return;
        const lands = g.landCounts(), powers = g.powers();
        const spies = [...g.spies].map(([pid, s]) => { const p = PROVINCES[pid]; return `<button class="nation-row" data-action="goto" data-cell="${p.city}">
            <span class="sw" style="background:${g.nations[g.owner[p.city]].color}"></span><span>${esc(p.name)}</span>
            <span class="num">${s.revealedTurn === g.turn ? 'informa' : 'sin noticias'}</span><span class="num">espía</span></button>`; }).join('');
        const q = this.filter.trim().toLowerCase();
        const groups = [
            ['Tu país', n => n.id === p0],
            ['Tus satélites', n => n.alive && n.overlord === p0],
            ['En guerra contigo', n => n.alive && g.atWar(p0, n.id)],
            ['Aliados', n => n.alive && g.allied(p0, n.id) && !g.atWar(p0, n.id) && n.overlord !== p0],
            [`Resto ${MAP.of}`, n => n.alive && n.id !== p0 && !g.atWar(p0, n.id) && !g.allied(p0, n.id)],
            ['Eliminados', n => !n.alive]
        ];
        list.innerHTML = (spies && !q ? `<p class="group-title">Tus espías</p>${spies}` : '') + groups.map(([title, test]) => {
            const rows = g.nations.filter(n => test(n) && (!q || n.name.toLowerCase().includes(q)))
                .sort((a, b) => (g.settings.fog ? lands[b.id] - lands[a.id] : powers[b.id] - powers[a.id]))
                .map(n => `<button class="nation-row" data-action="nation" data-id="${n.id}">
                    <span class="sw" style="background:${n.color}"></span><span>${n.name}</span>
                    <span class="num" title="Parte ${MAP.of}">${(100 * lands[n.id] / G.land.length).toFixed(1)} %</span>
                    <span class="num" title="Fuerza militar">${this.powerText(n.id, powers)}</span></button>`).join('');
            return rows ? `<p class="group-title">${title}</p>${rows}` : '';
        }).join('') || '<p class="note">Ningún país coincide con la búsqueda.</p>';
    }

    // Estado de una operación en una palabra o dos, con su clase de aviso.
    opState(op) {
        const g = this.game, n = g.opMembers(op).length;
        if (op.paused) return ['En pausa', ''];
        if (op.kind === 'reserva') return [plural(n, 'ejército', 'ejércitos'), ''];
        if (!n) return ['Sin ejércitos', 'warn'];
        if (op.kind === 'defensa') {
            if (op.state === 'repliega') return ['Se repliega', 'warn'];
            if (op.state === 'restablece') return ['Vuelve a su línea', 'ok'];
            const k = g.opNeed(op); return k ? [`Faltan ${k}`, 'warn'] : ['Línea cubierta', 'ok'];
        }
        return op.waiting ? ['Espera ventaja', 'warn'] : [op.auto === 'manual' ? 'Manual' : 'Avanzando', 'ok'];
    }
    // Qué haría una línea manual (sin hacerlo), guardado por turno y versión de la partida para no recalcularlo al dibujar.
    defenseHint(op) {
        const g = this.game, key = `${op.id}:${g.turn}:${g.version}:${g.armyVersion}:${g.orderVersion}:${op.cells.join()}`;
        if ((this._hints ??= new Map()).has(key)) return this._hints.get(key);
        if (this._hints.size > 50) this._hints.clear();
        const h = g.defenseDecide(op);
        this._hints.set(key, h);
        return h;
    }
    // Por qué pide atención una operación, en una frase para el parte de operaciones.
    opWhy(op) {
        const g = this.game, n = g.opMembers(op).length;
        if (!n) return op.kind === 'ofensiva' ? `no tiene ejércitos; añade los libres a ${OP_GATHER_TURNS} turnos de marcha o asígnaselos desde su ficha`
            : 'no tiene ejércitos; asígnale alguno desde su ficha o desde la pestaña Mando';
        if (op.kind === 'defensa') { const k = g.opNeed(op); return `${k} de sus ${plural(op.cells.length, 'casilla', 'casillas')} de línea ${k === 1 ? 'está' : 'están'} sin tropas; le ${k === 1 ? 'falta 1 ejército' : `faltan ${k} ejércitos`}, o acorta la línea`; }
        return `${plural(op.waiting, 'ejército espera', 'ejércitos esperan')} una ventaja de ${decimal(op.ratio)} a 1 que no tiene${op.waiting === 1 ? '' : 'n'}; dale más fuerzas o una postura más agresiva`;
    }
    // Pestaña Mando: operaciones del jugador y la abierta, con sus ejércitos y ajustes.
    renderCommand() {
        const g = this.game, p0 = g.player, body = $('#drawer-body'), ops = g.opsOf(p0), cap = g.commandCap(p0);
        if (this.focusOp && !g.ops.has(this.focusOp)) this.focusOp = null;
        const rules = g.rules(p0), units = a => `${countUnits(a.units)} (${unitText(a.units)})`;
        const row = op => { const [st, cls] = this.opState(op); return `<button class="op-row ${this.focusOp === op.id ? 'on' : ''}" data-action="op-focus" data-id="${op.id}">
            <i style="background:${opColor(op)}"></i><span><b>${esc(op.name)}</b><small>${OP_KINDS[op.kind].name} · ${plural(g.opMembers(op).length, 'ejército', 'ejércitos')}</small></span>
            <span class="chip ${cls}">${st}</span></button>`; };
        let detail = '';
        const op = this.focusOp ? g.ops.get(this.focusOp) : null;
        if (op) {
            const members = g.opMembers(op), atk = members.reduce((s, a) => s + unitPower(a.units, 'atk', rules), 0), def = members.reduce((s, a) => s + unitPower(a.units, 'def', rules), 0);
            const near = g.nearbyFree(op, 4).length;
            let front = '';
            if (op.kind === 'ofensiva') {
                // Relación con los enemigos a la vista junto a sus ejércitos (con niebla, lo peor de su escalón).
                const foes = new Map();
                for (const a of members) for (let d = 0; d < 6; d++) { const c = G.nb[a.cell * 6 + d], e = c >= 0 ? g.armyOn(c) : null; if (e && g.atWar(p0, e.owner) && g.sees(p0, c)) foes.set(e.id, [e, a]); }
                let dfn = 0;
                for (const [e, a] of foes.values()) { const r = g.expectedRatio(p0, a.units, a.cell, e, e.cell); dfn += unitPower(a.units, 'atk', rules) * g.flankFactor(p0, a.cell) / Math.max(0.01, r); }
                const ratio = dfn ? atk / dfn : null, pct = x => Math.max(3, Math.min(100, x / 3 * 100));
                front = ratio === null ? '<p class="small muted">Aún no toca al enemigo: no hay relación de fuerzas que calcular.</p>'
                    : `<div class="meter op-meter"><i style="width:${pct(ratio)}%;background:${ratio >= op.ratio ? 'var(--go)' : 'var(--signal)'}"></i><b style="left:${pct(op.ratio)}%"></b></div>
                       <p class="small">Relación de fuerzas en el frente: <b>${decimal(ratio)} a 1</b> contra ${plural(foes.size, 'ejército enemigo', 'ejércitos enemigos')} (la raya es la ventaja que pide: ${decimal(op.ratio)}).</p>`;
            }
            if (op.kind === 'ofensiva' && !members.length) front += `<p class="small warn-text">${esc(g.opWaitNote(op))}</p>`;
            if (op.kind === 'defensa') {
                // Estado de la línea y relación de fuerzas en su franja; las rayas: 1 (por debajo se repliega) y 1,5 (vuelve).
                const hint = op.auto === 'manual' ? this.defenseHint(op) : null, rel = hint ? hint.ev.rel : op.rel ?? g.lineEval(op).rel;
                const pct = x => Math.max(3, Math.min(100, x / 3 * 100));
                front = `<p class="small" style="margin-top:6px">Estado: <b>${OP_LINE_STATES[op.state] ?? 'Aguanta'}</b>${op.drawn && op.drawn.join() !== op.cells.join() ? ` · replegada a ${esc(g.lineLabel(p0, op.cells))}; la línea dibujada se guarda y vuelve a ella cuando tenga 1,5 a 1` : ''}.</p>
                    ${hint?.state === 'repliega' ? `<p class="small warn-text">Se replegaría a ${esc(g.lineLabel(p0, hint.cells))}: está en manual y no se mueve sola.</p>` : ''}
                    ${rel === null ? '<p class="small muted">Sin enemigos a la vista en su franja.</p>'
                    : `<div class="meter op-meter"><i style="width:${pct(rel)}%;background:${rel >= LINE_HOLD ? 'var(--go)' : 'var(--signal)'}"></i><b style="left:${pct(LINE_HOLD)}%"></b><b style="left:${pct(LINE_RETURN)}%"></b></div>
                       <p class="small">Relación de fuerzas en su franja: <b>${decimal(rel)} a 1</b> (por debajo de ${decimal(LINE_HOLD)} se repliega; con ${decimal(LINE_RETURN)} en la línea dibujada, vuelve).</p>`}`;
            }
            const where = op.kind === 'ofensiva' ? `Objetivo: ${esc(g.placeName(op.cells[op.cells.length - 1]))}` : op.kind === 'defensa' ? `${plural(op.cells.length, 'casilla', 'casillas')} de línea` : `Zona de reunión: ${esc(g.placeName(op.cells[0]))}`;
            detail = `<div class="bloc mine op-detail" style="border-left-color:${opColor(op)}">
                <div class="row"><input type="text" id="op-name" maxlength="60" value="${esc(op.name)}" aria-label="Nombre de la operación" style="flex:1">
                    <button class="btn ghost" data-action="op-close" aria-label="Cerrar" title="Cerrar">✕</button></div>
                <p class="small" style="margin-top:6px">${OP_KINDS[op.kind].name} desde el turno ${op.since}. ${where}.</p>
                ${front}
                <p class="group-title">Ejércitos (${members.length}) · ataque ${Math.round(atk)}, defensa ${Math.round(def)}</p>
                <div class="op-members">${members.map(a => `<div class="op-member"><button class="link" data-action="goto" data-cell="${a.cell}">${esc(g.placeName(a.cell))}</button>
                    <span class="small muted">${units(a)}${a.order ? ' · con orden propia' : ''}</span>
                    <button class="btn ghost" data-action="op-unassign" data-army="${a.id}" title="Sacarlo de la operación" aria-label="Quitar">✕</button></div>`).join('') || '<p class="note">Sin ejércitos. Añade los cercanos o asígnalos desde su ficha.</p>'}</div>
                <button class="btn" style="margin-top:6px" data-action="op-add-near" data-id="${op.id}" ${near ? '' : 'disabled'}>Añadir los ${near || ''} ${op.kind === 'ofensiva' ? `libres a ${OP_GATHER_TURNS} turnos de marcha` : 'cercanos sin operación'}</button>
                ${op.kind === 'reserva' ? '' : `<p class="group-title">Postura</p><div class="seg">${OP_STANCES.map(([v, l, t]) => `<button data-action="op-set" data-id="${op.id}" data-key="ratio" data-value="${v}" class="${op.ratio === v ? 'on' : ''}" title="${t}">${l}</button>`).join('')}</div>`}
                <p class="group-title">Automatización</p>
                <div class="seg">${OP_AUTO.map(([v, l, t]) => `<button data-action="op-set" data-id="${op.id}" data-key="auto" data-value="${v}" class="${op.auto === v ? 'on' : ''}" title="${t}">${l}</button>`).join('')}</div>
                <p class="note">${OP_AUTO.find(([v]) => v === op.auto)[2]}.${op.kind === 'reserva' ? ' En manual no manda refuerzos.' : ''}</p>
                ${this.reinforceSection(op)}
                ${op.kind === 'defensa' ? `<label class="check small" style="margin-top:8px"><input type="checkbox" data-action="op-set" data-id="${op.id}" data-key="fortify" ${op.fortify ? 'checked' : ''}><span>Fortificar las casillas de la línea que ocupe (hasta 2 por turno, ${rules.fortCost} de oro cada una)</span></label>` : ''}
                <div class="row" style="margin-top:10px;flex-wrap:wrap">
                    <button class="btn" data-action="op-set" data-id="${op.id}" data-key="paused">${op.paused ? 'Reanudar' : 'Pausar'}</button>
                    <button class="btn" data-action="op-goto" data-id="${op.id}">Ver en el mapa</button>
                    <button class="btn" data-action="op-redraw" data-id="${op.id}">Redibujar</button>
                    <button class="btn ghost" data-action="op-end" data-id="${op.id}">Terminar</button></div>
            </div>`;
        }
        // Operaciones agrupadas por teatro (país enemigo), con su prioridad; y propuestas para los frentes sin ninguna.
        const command = g.nations[p0].command, groups = new Map();
        for (const o of ops) { const f = g.opFront(o); if (!groups.has(f)) groups.set(f, []); groups.get(f).push(o); }
        const theatre = ([f, list]) => `<div class="theatre"><div class="theatre-head"><span>${f >= 0 ? `Frente con ${this.nationChip(f)}` : 'Sin frente'}</span>
            ${f >= 0 ? `<div class="seg small-seg">${Object.keys(PRIORITY).map(k => `<button data-action="cmd" data-key="priority" data-value="${f}:${k}" class="${(command.priority[f] ?? 'media') === k ? 'on' : ''}" title="Prioridad ${k}: los refuerzos y la reserva van antes a los frentes de prioridad alta">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>` : ''}</div>
            ${list.map(row).join('')}</div>`;
        const sug = g.frontSuggestions(p0).map(sg => `<div class="suggest"><p class="small">Frente con <b>${g.nm(sg.enemy)}</b> sin operaciones.</p><div class="row">
            <button class="btn" data-action="op-suggest" data-enemy="${sg.enemy}" data-kind="defensa" data-preview="${sg.enemy}" ${ops.length >= cap ? 'disabled' : ''}>Línea propuesta</button>
            ${sg.attack ? `<button class="btn" data-action="op-suggest" data-enemy="${sg.enemy}" data-kind="ofensiva" ${ops.length >= cap ? 'disabled' : ''}>Ofensiva sobre ${esc(sg.target)}</button>` : ''}</div>
            <p class="small muted">Línea: ${esc(sg.lineInfo.label)} · ${sg.lineInfo.rel === null ? 'sin enemigos a la vista' : `${decimal(sg.lineInfo.rel)} a 1 prevista${sg.lineInfo.rel < 1 ? ', no basta: hacen falta refuerzos' : ''}`}${sg.lineInfo.front.length ? ` · deja delante ${esc(sg.lineInfo.front.join(', '))} (con guarnición)` : ''}</p></div>`).join('');
        body.innerHTML = `
            ${this.directiveSection()}
            <p class="group-title">Operaciones · ${ops.length} de ${cap}</p>
            <div class="row">${Object.entries(OP_KINDS).map(([k, v]) => `<button class="btn" data-action="op-new" data-kind="${k}" ${ops.length >= cap ? 'disabled' : ''}>${v.icon.replace('<svg ', '<svg width="15" height="15" aria-hidden="true" ')}${v.name}</button>`).join('')}</div>
            ${sug}
            <div class="op-list">${[...groups].map(theatre).join('') || '<p class="note" style="margin:8px">Sin operaciones. Dibuja una flecha de ofensiva, una línea de defensa o una zona de reserva (tecla 5) y asígnale ejércitos: se moverán solos turno a turno.</p>'}</div>
            ${detail}
            <p class="note" style="margin-top:10px">Tu estado mayor lleva ${cap} operaciones a la vez: ${rules.commandOps} por Doctrina y una más por cada 20 provincias.</p>
            ${this.templatesSection()}`;
    }
    // Directiva nacional: postura, objetivos estratégicos, presupuesto opcional y retaguardia.
    directiveSection() {
        const g = this.game, p0 = g.player, c = g.nations[p0].command, inc = g.income(p0);
        const total = Object.values(c.budget).reduce((x, y) => x + y, 0) || 1, spend = Math.floor(Math.max(0, inc) * c.share / 100);
        const goals = g.goalProgress(p0);
        return `<details class="tpl-box directive" ${this.dirOpen ? "open" : ""} data-dir-box>
            <summary>Directiva nacional · ${POSTURES[c.posture].name}</summary>
            <div class="seg" style="margin:6px 8px 0">${Object.entries(POSTURES).map(([k, v]) => `<button data-action="cmd" data-key="posture" data-value="${k}" class="${c.posture === k ? 'on' : ''}">${v.name}</button>`).join('')}</div>
            <p class="note" style="margin:4px 8px">${POSTURES[c.posture].desc}</p>
            <p class="group-title">Objetivos estratégicos</p>
            ${goals.length ? goals.map(gp => `<div class="goal"><span>${g.nm(gp.nation)}: ${gp.held} de ${plural(gp.total, 'provincia', 'provincias')}</span>
                <div class="meter"><i style="width:${Math.round(100 * gp.held / gp.total)}%"></i></div></div>`).join('')
                : '<p class="note" style="margin:0 8px">Sin objetivos. Marca provincias como objetivo desde su ficha («Objetivo estratégico»): al tenerlas todas, te avisará de que es buen momento para la paz.</p>'}
            <p class="group-title">Presupuesto</p>
            <label class="check small" style="margin:0 8px"><input type="checkbox" data-action="cmd" data-key="spend" ${c.spend ? 'checked' : ''}><span>La directiva gasta por ti una parte de la renta</span></label>
            ${c.spend ? `<div class="budget">
                <label class="small" for="cmd-share">Parte de la renta: <output>${c.share} % · ${spend} de oro por turno</output></label>
                <input type="range" id="cmd-share" min="0" max="100" step="5" value="${c.share}" data-cmd="share">
                <div class="budget-bar">${Object.keys(BUDGET_KEYS).map(k => `<i style="flex:${c.budget[k]}" class="b-${k}"></i>`).join('')}</div>
                ${Object.entries(BUDGET_KEYS).map(([k, label]) => `<label class="small" for="cmd-${k}"><i class="dot b-${k}"></i>${label}: <output>${Math.round(100 * c.budget[k] / total)} % · ${Math.floor(spend * c.budget[k] / total)} de oro</output></label>
                    <input type="range" id="cmd-${k}" min="0" max="100" step="5" value="${c.budget[k]}" data-cmd="${k}">`).join('')}
                <p class="note">Reclutar va a los refuerzos de tus operaciones (más a las de prioridad alta y a las que piden ayuda). Investigar elige lo que investigaría la IA en tu lugar; Fortificar, tus ciudades más amenazadas; Carreteras, la ciudad más valiosa sin unir a la capital. Guardado: ${c.pools.research} para investigar, ${c.pools.forts} para fortificar, ${c.pools.roads} para carreteras.</p>
            </div>` : '<p class="note" style="margin:4px 8px">Apagado: el oro lo gastas tú. Las operaciones usan solo el oro por turno que les des.</p>'}
            <label class="check small" style="margin:8px"><input type="checkbox" data-action="cmd" data-key="rear" ${c.rear ? 'checked' : ''}><span>Retaguardia: en guerra, lo que sobre en las ciudades sin peligro va a tu reserva (deja una infantería)</span></label>
        </details>`;
    }
    // Refuerzos de una operación: oro por turno, plantilla y cómo va la formación.
    reinforceSection(op) {
        const g = this.game, tpl = g.opTemplate(op), n = g.nations[g.player], pr = g.formProgress(op), cost = g.templateCost(g.player, tpl.units);
        const opts = [['auto', `Automática: ${tpl.auto ? tpl.name : g.templateOf(g.player, g.suggestTemplate(op).key).name}`],
            ...Object.entries(TEMPLATES).map(([k, t]) => [k, t.name]), ...n.templates.map((t, i) => [`c${i}`, `${t.name} (propia)`])];
        const status = pr ? `Formando ${esc(op.form.name.toLowerCase())} en ${esc(g.placeName(op.form.zone))}: ${pr.done} de ${pr.total} reclutadas${pr.waiting ? `, ${pr.waiting} salen el turno que viene` : ''}${pr.moving ? `, ${pr.moving} en camino` : ''}${pr.ready ? `, ${pr.ready} en la zona` : ''}.`
            : op.gold ? 'La primera formación empieza al terminar el turno.' : 'Sin oro para refuerzos.';
        return `<p class="group-title">Refuerzos</p>
            <div class="seg">${OP_GOLD.map(v => `<button data-action="op-set" data-id="${op.id}" data-key="gold" data-value="${v}" class="${op.gold === v ? 'on' : ''}">${v ? `${v}` : 'Nada'}</button>`).join('')}</div>
            <p class="note">Oro por turno, de tus ${g.income(g.player)} de renta${op.gold > g.income(g.player) ? ' (más de lo que ingresas: tirará del tesoro)' : ''}. ${op.gold ? `Una ${esc(tpl.name.toLowerCase())} (${cost} de oro) cada unos ${Math.ceil(cost / op.gold)} turnos.` : ''}</p>
            <select data-op-template="${op.id}" style="width:100%;margin-top:6px" aria-label="Plantilla de refuerzo">${opts.map(([v, l]) => `<option value="${v}" ${op.template === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
            <p class="note">${esc(tpl.why)} Se recluta en las ciudades más cercanas a la zona de reunión y las tropas marchan hasta ella; completa, entra en la operación.</p>
            <p class="small" style="margin-top:4px">${status}${op.formed ? ` Formadas: ${op.formed}.` : ''}${op.pool ? ` Guardado: ${op.pool} de oro.` : ''}</p>`;
    }
    // Plantillas de serie y propias, con su fuerza, y un editor para crear la tuya.
    templatesSection() {
        const g = this.game, r = g.rules(g.player), n = g.nations[g.player];
        const d = this.tplDraft ??= { name: '', units: { infantry: 6, tank: 2, artillery: 1 } };
        const facts = u => { const k = countUnits(u); return `${k} · ${echelonOf(k).mark} · ataque ${unitPower(u, 'atk', r)}, defensa ${unitPower(u, 'def', r)}, velocidad ${k ? speedOf(u, r) : 0} · ${g.templateCost(g.player, u)} de oro`; };
        const row = (name, u, extra = '') => `<div class="tpl-row">${unitIcon(dominantType(u), g.nations[g.player].color)}<span><b>${esc(name)}</b><small>${unitText(u)} · ${facts(u)}</small></span>${extra}</div>`;
        return `<details class="tpl-box" ${this.tplOpen ? 'open' : ''} data-tpl-box>
            <summary>Plantillas de ejército</summary>
            ${Object.values(TEMPLATES).map(t => row(t.name, t.units)).join('')}
            ${n.templates.map((t, i) => row(t.name, t.units, `<button class="btn ghost" data-action="tpl-del" data-index="${i}" aria-label="Borrar" title="Borrar">✕</button>`)).join('')}
            <div class="tpl-edit">
                <input type="text" id="tpl-name" maxlength="40" placeholder="Nombre de tu plantilla" value="${esc(d.name)}" aria-label="Nombre de la plantilla">
                ${UNIT_KEYS.map(k => `<div class="unit-row">${unitIcon(k, g.nations[g.player].color)}<div>${CONFIG.TYPES[k].name}</div>
                    <div class="stepper"><button data-action="tpl-step" data-unit="${k}" data-delta="-1" ${d.units[k] ? '' : 'disabled'} aria-label="Una menos">−</button><output>${d.units[k]}</output>
                    <button data-action="tpl-step" data-unit="${k}" data-delta="1" aria-label="Una más">+</button></div></div>`).join('')}
                <p class="small muted">${facts(d.units)}</p>
                <button class="btn" data-action="tpl-save" ${countUnits(d.units) && n.templates.length < 12 ? '' : 'disabled'}>Guardar plantilla</button>
            </div>
            <p class="note">La artillería frena a todo el ejército a velocidad 3 y la infantería a 4: para ir rápido, tanques solos. La infantería es la defensa más barata; la artillería, el ataque más barato pero muy frágil.</p>
        </details>`;
    }

    renderBlocs() {
        const g = this.game, p0 = g.player, body = $('#drawer-body');
        const visible = g.visibleBlocs(p0);
        const mine = visible.filter(b => b.members.has(p0));
        const others = visible.filter(b => !b.members.has(p0));
        const memberChips = b => `<div class="members">${[...b.members].map(m => this.nationChip(m)).join('')}</div>`;
        const eligible = b => g.nations.filter(n => n.alive && !b.members.has(n.id) && !g.atWar(p0, n.id)).sort((x, y) => x.name.localeCompare(y.name, 'es'));
        body.innerHTML = `
            <p class="group-title" style="margin-top:0">Tus alianzas</p>
            ${mine.map(b => `<div class="bloc mine">
                <h3>${esc(b.name)}${b.secret ? ' <span class="chip">secreta</span>' : ''}</h3>
                ${memberChips(b)}
                <div class="row"><select data-bloc-invite="${b.id}" style="flex:1">${eligible(b).map(n => `<option value="${n.id}">${n.name}</option>`).join('')}</select>
                <button class="btn" data-action="bloc-invite" data-bloc="${b.id}">Invitar</button></div>
                <button class="btn ghost" style="margin-top:6px" data-action="bloc-leave" data-bloc="${b.id}">Abandonar la alianza</button>
            </div>`).join('') || '<p class="note" style="margin:0 0 8px 8px">No perteneces a ninguna alianza.</p>'}
            <div class="bloc">
                <h3>Fundar una alianza</h3>
                <div class="stack">
                    <input type="text" id="bloc-name" maxlength="40" placeholder="Pacto de ${esc(g.nations[p0].capitalName)}" value="${esc(this.blocName)}" aria-label="Nombre de la alianza">
                    <label class="check small"><input type="checkbox" id="bloc-secret" ${this.blocSecret ? 'checked' : ''}><span>Secreta: solo la conocen sus miembros hasta que una guerra la active</span></label>
                    <button class="btn primary" data-action="bloc-create">Fundar alianza</button>
                </div>
                <p class="note">Puedes estar en varias a la vez, OTAN incluida. Si atacan a un miembro, los demás entran en guerra.</p>
            </div>
            ${others.length ? `<p class="group-title">Otras alianzas</p>${others.map(b => `<div class="bloc">
                <h3>${esc(b.name)}</h3>${memberChips(b)}
                <button class="btn" data-action="bloc-request" data-bloc="${b.id}" ${g.proposedThisTurn.has(`req${b.id}`) ? 'disabled' : ''}>Pedir el ingreso</button></div>`).join('')}` : ''}`;
    }

    renderLog() {
        const body = $('#drawer-body');
        const entries = this.game.logs.slice(-250).reverse();
        let html = '', turn = null;
        for (const { turn: t, msg } of entries) {
            if (msg.startsWith('— TURNO')) continue;
            if (t !== turn) { html += `<p class="log-turn">Turno ${t}</p>`; turn = t; }
            html += `<p class="log-line">${esc(msg)}</p>`;
        }
        body.innerHTML = html || '<p class="note">Todavía no ha pasado nada.</p>';
    }

    renderPeaceDialog() {
        const g = this.game, s = this.peace, t = s.target, me = g.player;
        const occ = g.occupation(t), sats = g.satellitesOf(me);
        const offered = g.proposals.some(p => p.kind === 'paz' && p.from === t);
        const crushed = g.isCrushed(t);
        if (s.mode === 'satellite' && !crushed) s.mode = 'annex';
        const opt = (mode, title, desc, enabled = true) => `<button class="peace-opt ${s.mode === mode ? 'on' : ''}" data-action="peace-mode" data-mode="${mode}" ${enabled ? '' : 'disabled'}><b>${title}</b><span>${desc}</span></button>`;
        const keeps = s.mode === 'annex' || (s.mode === 'satellite' && s.keep);
        let extra = '';
        if (keeps && occ.mine && sats.length && s.mode === 'annex') {
            extra += `<label class="field"><span>Lo que has ocupado tú es para</span>
                <select id="peace-mine"><option value="-1" ${s.mine < 0 ? 'selected' : ''}>Ti</option>
                ${sats.map(x => `<option value="${x}" ${s.mine === x ? 'selected' : ''}>Tu satélite ${g.nm(x)}</option>`).join('')}</select></label>`;
        }
        if (keeps && occ.sats) {
            extra += `<div class="field"><span>Lo que han ocupado tus satélites es para</span><div class="seg">
                <button data-action="peace-sat" data-value="self" class="${s.satGains === 'self' ? 'on' : ''}">Ellos</button>
                <button data-action="peace-sat" data-value="overlord" class="${s.satGains === 'overlord' ? 'on' : ''}">Ti</button></div></div>`;
        }
        if (s.mode === 'satellite') {
            extra += `<label class="check small" style="margin-top:10px"><input type="checkbox" id="peace-keep" ${s.keep ? 'checked' : ''}><span>Quedarte lo que has ocupado de ${g.nm(t)} (si no, se lo devuelves)</span></label>`;
        }
        const asked = !offered && g.proposedThisTurn.has(`paz${t}`);
        $('#peace-body').innerHTML = `
            <div class="row" style="justify-content:space-between"><h2>Paz con ${g.nm(t)}</h2><button class="btn ghost" data-action="peace-close" aria-label="Cerrar">✕</button></div>
            <p class="note" style="margin-bottom:10px">${offered ? `${g.nm(t)} te ha propuesto la paz: aceptará anexionar lo ocupado o una paz blanca.` : `Elige las condiciones. ${g.nm(t)} puede rechazarlas, y solo puedes proponerle la paz una vez por turno.`}</p>
            <dl class="facts" style="margin-bottom:12px">
                <dt>Has ocupado</dt><dd>${plural(occ.mine, 'casilla', 'casillas')} en ${plural(occ.provinces, 'provincia', 'provincias')}${occ.sats ? `, y tus satélites ${occ.sats} más` : ''}</dd>
                <dt>Te ha ocupado</dt><dd>${plural(occ.theirs, 'casilla', 'casillas')} tuyas o de tus satélites</dd>
            </dl>
            <div class="stack">
                ${opt('annex', 'Anexionar lo ocupado', 'Cada bando se queda lo que ocupa: deja de estar en disputa y pasa a ser territorio propio, con toda su renta.')}
                ${opt('satellite', `Convertir a ${g.nm(t)} en tu satélite`, crushed
                    ? `Conserva su país, te paga el ${CONFIG.TRIBUTE * 100} % de sus ingresos, entra en tus guerras y nunca te ataca. Lo que te ocupó vuelve a ti.`
                    : 'Solo si le has vencido claramente: ocupas su capital o el 40 % de su territorio, o tiene menos de un tercio de tu fuerza.', crushed)}
                ${opt('white', 'Paz blanca', 'Cada uno recupera lo suyo; las casillas ocupadas vuelven a su dueño.')}
            </div>
            ${extra}
            <div class="row" style="margin-top:16px;justify-content:flex-end">
                <button class="btn" data-action="peace-close">Cancelar</button>
                <button class="btn primary" data-action="peace-send" ${asked ? 'disabled' : ''}>${asked ? 'Ya has propuesto la paz este turno' : 'Proponer estas condiciones'}</button>
            </div>`;
    }

    watchSettings() {
        const p = this.prefs, seg = (action, opts, cur) => `<div class="seg">${opts.map(([v, label]) => `<button data-action="${action}" data-value="${v}" class="${cur === v ? 'on' : ''}">${label}</button>`).join('')}</div>`;
        return `<div class="field"><span>Turno de los demás países</span>
                ${seg('watch', [['directo', 'Directo a mi turno'], ['ver', 'Ver sus jugadas']], p.watch)}</div>
            ${p.watch === 'ver' ? `<div class="field"><span>Velocidad</span>${seg('speed', [['lenta', 'Lenta'], ['normal', 'Normal'], ['rapida', 'Rápida']], p.speed)}
                <p class="note">Cada país juega por orden y se resalta su territorio; los que no hacen nada se saltan. «Saltar» o Esc lo termina al instante.</p></div>` : ''}`;
    }

    renderGameDialog() {
        const g = this.game, saves = readSaves(), playing = g.player !== null;
        const when = s => new Date(s.date).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
        $('#game-dialog-body').innerHTML = `
            <div class="row" style="justify-content:space-between"><h2>Partida</h2><button class="btn ghost" data-action="close-game" aria-label="Cerrar">✕</button></div>
            <p class="note" style="margin-bottom:8px">Se guarda sola al terminar cada turno. Las ranuras viven en este navegador; para hacer copias o jugar en otro equipo, exporta a archivo.</p>
            ${Object.entries(SLOTS).map(([slot, label]) => {
                const s = saves[slot];
                return `<div class="slot"><div><b>${label}</b><div class="small muted">${s ? `${esc(s.nation)}, turno ${s.turn}, ${when(s)}` : 'vacía'}</div></div>
                    ${slot === 'auto' ? '<span></span>' : `<button class="btn" data-action="save" data-slot="${slot}" ${playing && !g.over ? '' : 'disabled'}>Guardar aquí</button>`}
                    <button class="btn" data-action="load" data-slot="${slot}" ${s ? '' : 'disabled'}>Cargar</button></div>`;
            }).join('')}
            ${Object.keys(MAPS).filter(m => m !== MAP_ID).map(m => {
                const other = readSaves(m), list = Object.keys(SLOTS).filter(slot => other[slot]);
                return list.length ? `<h3 class="slots-other">Mapa ${MAPS[m].name}</h3>${list.map(slot => `<div class="slot"><div><b>${SLOTS[slot]}</b><div class="small muted">${esc(other[slot].nation)}, turno ${other[slot].turn}, ${when(other[slot])}</div></div>
                    <span></span><button class="btn" data-action="load" data-map="${m}" data-slot="${slot}" title="Cambia al mapa ${MAPS[m].name} y carga la partida">Cargar</button></div>`).join('')}` : '';
            }).join('')}
            ${this.watchSettings()}
            <div class="row" style="margin-top:14px">
                <button class="btn" data-action="export" ${playing ? '' : 'disabled'}>Exportar a archivo</button>
                <button class="btn" data-action="import">Importar archivo</button>
            </div>`;
    }

    renderOverlay() {
        const g = this.game, overlay = $('#overlay');
        overlay.hidden = !g.over;
        if (!g.over) return;
        $('#overlay-card').innerHTML = `
            <h2 style="color:${g.won ? SIGNAL : 'var(--war)'}">${g.won ? 'Victoria' : 'Derrota'}</h2>
            <p>${g.won ? `${g.nm(g.player)} domina ${MAP.it} en el turno ${g.turn}.` : `${g.nm(g.player)} ha caído en el turno ${g.turn}.`}</p>
            <button class="btn primary" style="margin-top:16px" data-action="restart">Nueva partida</button>`;
    }
}

const seedParam = Number(new URLSearchParams(location.search).get('seed'));
let game = new GameEngine(Number.isFinite(seedParam) && seedParam > 0 ? seedParam : Date.now() % 2147483647);
const ui = new GameUI(game);
// --- Actualizaciones ---
// La app compara su versión con version.json (al abrirse, al volver a primer plano y cada 15 minutos). Si hay una
// nueva, guarda la partida, recarga y la reanuda: las apps instaladas no se quedan con versiones antiguas.
const APP_VERSION = '2026.10.19-220221';
const RESUME_KEY = 'nanwar.resume';
let updating = false;
async function checkForUpdate() {
    if (location.protocol === 'file:' || updating) return;
    try {
        const res = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;
        const { version } = await res.json();
        if (version && version !== APP_VERSION && APP_VERSION !== 'dev') applyUpdate(version);
    } catch { /* sin conexión: se seguirá con esta versión */ }
}
function applyUpdate(version) {
    // Un solo intento por versión y sesión: si la recarga trajera aún la página vieja, no se entra en bucle.
    try { if (sessionStorage.getItem('nanwar.updateTried') === version) return; sessionStorage.setItem('nanwar.updateTried', version); } catch { /* sin almacenamiento */ }
    updating = true;
    if (game.player !== null && !game.over && writeSave('auto', game)) {
        try { localStorage.setItem(RESUME_KEY, 'auto'); } catch { /* sin almacenamiento no se puede reanudar */ }
    }
    const box = document.createElement('div');
    box.className = 'toast float';
    box.innerHTML = '<p style="margin:0"><b>Actualizando NanWar…</b> Tu partida se ha guardado y continuará en un momento.</p>';
    $('#toasts').prepend(box);
    const reg = navigator.serviceWorker ? navigator.serviceWorker.getRegistration() : Promise.resolve(null);
    reg.then(r => r && r.update()).catch(() => {}).finally(() => setTimeout(() => location.reload(), 1200));
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(err => console.warn('Sin modo sin conexión:', err));
}
// Tras una actualización, se reanuda la partida que se estaba jugando.
try {
    const resume = localStorage.getItem(RESUME_KEY);
    if (resume) {
        localStorage.removeItem(RESUME_KEY);
        if (resume === 'import') {
            const text = sessionStorage.getItem(IMPORT_KEY);
            sessionStorage.removeItem(IMPORT_KEY);
            if (text) { ui.setGame(GameEngine.load(JSON.parse(text))); game.log(`Partida importada (mapa ${MAP.name}).`); ui.render(); }
        } else {
            // "auto" tras una actualización; "mapa:ranura" al cargar una partida de otro mapa.
            const [map, slot] = resume.includes(':') ? resume.split(':') : [MAP_ID, resume];
            const save = map === MAP_ID && Object.prototype.hasOwnProperty.call(SLOTS, slot) ? readSaves()[slot] : null;
            if (save) {
                ui.setGame(GameEngine.load(save.data));
                game.log(resume.includes(':') ? `Partida cargada de ${SLOTS[slot]} (mapa ${MAP.name}).` : `NanWar se ha actualizado a la versión ${APP_VERSION}. Continúas tu partida.`);
                ui.render();
            }
        }
    }
} catch { /* sin almacenamiento local */ }
setTimeout(checkForUpdate, 2000);
setInterval(checkForUpdate, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
</script>
