        if (id === this.player) for (const [pid, s] of this.spies) if (s.revealedTurn === this.turn) for (const c of PROVINCES[pid].cells) map[c] = 1;
        this.visCache = { key, map };
        return map;
    }
    sees(id, cell) { return !this.settings.fog || id === null || this.visibleCells(id)[cell] === 1; }

    spyOdds(pid) {
        const p = PROVINCES[pid], s = this.spies.get(pid);
        const hard = CAPITAL_OF[p.city] >= 0 || this.fort[p.city] === 1;
        const turns = s ? this.turn - s.since : 0;
        return {
            success: hard ? CONFIG.SPY_SUCCESS_HARD : CONFIG.SPY_SUCCESS,
            caught: Math.min(CONFIG.SPY_CATCH_MAX, (CONFIG.SPY_CATCH_BASE + CONFIG.SPY_CATCH_PER_TURN * turns) * (hard ? 1.5 : 1))
        };
    }
    canSpy(pid) {
        const o = this.owner[PROVINCES[pid].city];
        return !!this.settings.fog && this.player !== null && o !== this.player && !this.allied(this.player, o) && !this.spies.has(pid);
    }
    // El espía intenta informar: si lo consigue, la provincia queda a la vista hasta el turno siguiente.
    spyReport(pid) {
        const s = this.spies.get(pid), p = PROVINCES[pid];
        if (this.rng() < this.spyOdds(pid).success) {
            s.revealedTurn = this.turn;
            const units = emptyUnits();
            for (const c of p.cells) {
                const a = this.armyOn(c);
                if (a && a.owner !== this.player && !this.allied(this.player, a.owner)) for (const k of UNIT_KEYS) units[k] += a.units[k];
            }
            this.log(`Tu espía en ${p.name} informa: ${countUnits(units) ? unitWords(units) : 'no hay tropas enemigas'}.`);
        } else {
            this.log(`Tu espía en ${p.name} no consigue información este turno.`);
        }
        this.spyVersion++;
    }
    // Al empezar cada turno del jugador: los espías pueden ser capturados y, si no, vuelven a informar.
    spyTurn() {
        for (const [pid, s] of [...this.spies]) {
            const p = PROVINCES[pid], o = this.owner[p.city];
            if (o === this.player || this.allied(this.player, o)) {
                this.spies.delete(pid);
                this.log(`Tu espía vuelve de ${p.name}: la provincia ya está en manos amigas.`);
                continue;
            }
            if (this.rng() < this.spyOdds(pid).caught) {
                this.spies.delete(pid);
                this.log(`${this.nm(o)} ha capturado a tu espía en ${p.name}.`);
                continue;
            }
            this.spyReport(pid);
        }
        this.spyVersion++;
    }
    playerSendSpy(pid) {
        if (this.over || !this.canSpy(pid)) return;
        const n = this.nations[this.player], p = PROVINCES[pid];
        if (n.gold < CONFIG.SPY_COST) { this.log(`No tienes oro para un espía (cuesta ${CONFIG.SPY_COST}).`); return; }
        n.gold -= CONFIG.SPY_COST;
        this.spies.set(pid, { since: this.turn, revealedTurn: -1 });
        this.log(`Envías un espía a ${p.name} (${this.nm(this.owner[p.city])}).`);
        this.spyReport(pid);
    }
    playerRecallSpy(pid) {
        if (!this.spies.delete(pid)) return;
        this.spyVersion++;
        this.log(`Retiras a tu espía de ${PROVINCES[pid].name}.`);
    }

    // --- Investigación ---
    // Reglas de la nación: las de CONFIG con lo que ha investigado encima.
    rules(id) {
        const c = this.rulesCache[id];
        if (c && c.v === this.techVersion) return c.r;
        const r = baseRules(), done = this.nations[id].tech.done;
        for (const t of TECHS) if (done.has(t.id)) mergeFx(r, t.fx);
        this.rulesCache[id] = { v: this.techVersion, r };
        return r;
    }
    techLevel(id, branch) { const d = this.nations[id].tech.done; return d.has(`${branch}3`) ? 3 : d.has(`${branch}2`) ? 2 : d.has(`${branch}1`) ? 1 : 0; }
    techTurns(id, techId) { return Math.max(1, Math.round(CONFIG.RESEARCH.TURNS[TECH_BY_ID.get(techId).tier - 1] * this.rules(id).researchTurns)); }
    techProgress(id, techId) { return this.nations[id].tech.progress.get(techId) ?? 0; }
    // Oro de una investigación: turnos de renta según el nivel, un 10 % más por cada una ya terminada.
    researchCost(id, techId) {
        const R = CONFIG.RESEARCH, i = TECH_BY_ID.get(techId).tier - 1;
        const base = Math.max(R.COST_MIN[i], this.income(id) * R.COST_TURNS[i]);
        return Math.round(base * (1 + R.COST_GROWTH * this.nations[id].tech.done.size) * this.rules(id).researchCost);
    }
    techState(id, techId) {
        const s = this.nations[id].tech, t = TECH_BY_ID.get(techId);
        if (s.done.has(techId)) return 'done';
        if (s.current.includes(techId)) return 'current';
        if (s.progress.has(techId)) return 'paused';
        if (t.tier > 1 && !s.done.has(`${t.branch}${t.tier - 1}`)) return 'locked';
        return 'open';
    }
    // Empieza (pagando) o reanuda (gratis) una investigación. Sin laboratorio libre, la más antigua en curso queda en pausa.
    startResearch(id, techId) {
        const t = TECH_BY_ID.get(techId), n = this.nations[id], s = n.tech;
        if (!t || this.over) return false;
        const st = this.techState(id, techId);
        if (st === 'open') {
            const cost = this.researchCost(id, techId);
            if (n.gold < cost) return false;
            n.gold -= cost;
            s.progress.set(techId, 0);
            if (id === this.player) this.log(`Empiezas a investigar ${t.name} (${cost} oro, ${plural(this.techTurns(id, techId), 'turno', 'turnos')}).`);
        } else if (st === 'paused') {
            if (id === this.player) this.log(`Reanudas ${t.name}.`);
        } else return false;
        if (s.current.length >= this.rules(id).labs) {
            const old = s.current.shift();
            if (id === this.player) this.log(`${TECH_BY_ID.get(old).name} queda en pausa.`);
        }
        s.current.push(techId);
        return true;
    }
    pauseResearch(id, techId) {
        const s = this.nations[id].tech;
        if (!s.current.includes(techId)) return;
        s.current = s.current.filter(x => x !== techId);
        if (id === this.player) this.log(`${TECH_BY_ID.get(techId).name} queda en pausa.`);
    }
    // Al empezar el turno de la nación, cada investigación en curso avanza un turno.
    advanceResearch(id) {
        const s = this.nations[id].tech;
        for (const techId of [...s.current]) {
            const p = (s.progress.get(techId) ?? 0) + 1;
            if (p < this.techTurns(id, techId)) { s.progress.set(techId, p); continue; }
            s.progress.delete(techId);
            s.current = s.current.filter(x => x !== techId);
            s.done.add(techId);
            this.techVersion++;
            if (id === this.player) this.log(`Investigación terminada: ${TECH_BY_ID.get(techId).name}.`);
        }
    }

    // --- Reclutamiento ---
    // Coste de una unidad para una nación: sus yacimientos abaratan el material.
    // Coste de una unidad reclutada en la provincia `pid`: la abaratan los yacimientos que abastecen a esa provincia.
    unitCost(id, type, pid = -1) {
        const list = pid >= 0 ? this.economy(id).access.get(pid) ?? [] : [];
        const byType = {};
        for (const r of list) byType[r.type] = (byType[r.type] ?? 0) + 1;
        let disc = 0;
        for (const [k, v] of Object.entries(CONFIG.RESOURCE_DISCOUNT[type])) disc += v * (byType[k] ?? 0);
        return Math.round(CONFIG.TYPES[type].cost * (1 - Math.min(CONFIG.MAX_DISCOUNT, disc)));
    }
    // Cupo de reclutamiento por turno de una provincia: crece con su población, su desarrollo, sus conexiones y los
    // yacimientos que la abastecen, y es mayor en la capital.
    recruitBreakdown(nation, p) {
        const e = this.economy(nation);
        const parts = [['población', p.recruitCap]];
        const dev = Math.floor(this.dev[p.id] / 250);
        if (dev) parts.push(['desarrollo', dev]);
        if (e.connected.has(p.id)) parts.push(['carretera a la capital', 1]);
        if ([0, 1, 2, 3, 4, 5].some(d => this.road[p.city * 6 + d] === 2)) parts.push(['autopista', 1]);
        const mines = Math.floor((e.access.get(p.id)?.length ?? 0) / 2);
        if (mines) parts.push(['yacimientos', mines]);
        if (CAPITAL_OF[p.city] === nation) parts.push(['capital', 2]);
        return parts;
    }
    recruitCap(nation, p) { return this.recruitBreakdown(nation, p).reduce((s, [, n]) => s + n, 0); }
    recruitLeft(nation, p) { return this.recruitCap(nation, p) - (this.nations[nation].recruited.get(p.id) ?? 0); }
    canRecruitAt(nation, p) {
        const ar = this.armyOn(p.city);
        return this.owner[p.city] === nation && this.legal[p.city] === nation && (!ar || ar.owner === nation) && this.recruitLeft(nation, p) > 0;
    }
    recruit(nation, p, type) {
        const n = this.nations[nation], cost = this.unitCost(nation, type, p.id);
        if (n.gold < cost || !this.canRecruitAt(nation, p)) return false;
        n.gold -= cost;
        n.recruited.set(p.id, (n.recruited.get(p.id) ?? 0) + 1);
        const units = emptyUnits(); units[type] = 1;
        this.settle(this.newArmy(nation, p.city, units, 999));   // los reclutas no se mueven este turno
        return true;
    }

    // --- Turnos ---
    start(playerId) {
        this.player = playerId;
        this.log(`Asumes el mando de ${this.nm(playerId)}. IA ${this.ai.name.toLowerCase()}, alianzas ${this.settings.alliances}.`);
        this.beginNationTurn(playerId);
    }

    beginNationTurn(id) {
        for (const a of this.armies.values()) if (a.owner === id) a.used = 0;
        this.advanceResearch(id);
        let done = 0;
        for (const [c, w] of this.fortWork) {
            if (w.owner !== id) continue;
            if (this.owner[c] !== id) { this.fortWork.delete(c); this.fortVersion++; continue; }
            if (--w.left <= 0) { this.fort[c] = 1; this.fortWork.delete(c); done++; }
        }
        if (done) {
            this.fortVersion++;
            if (id === this.player) this.log(`Fortificación terminada en ${done} casilla${done > 1 ? 's' : ''}.`);
        }
        this.nations[id].recruited.clear();
        if (id === this.player) this.spyTurn();
        for (const [cell, s] of [...this.sieges]) {
            if (s.by !== id) continue;
            if (this.owner[cell] !== id) { this.sieges.delete(cell); continue; }
            const ar = this.armyOn(cell);
            if (!ar || ar.owner !== id) { s.held = 0; continue; }   // sin tropas encima, el asedio no avanza
            if (++s.held >= CONFIG.SIEGE_TURNS) { this.sieges.delete(cell); this.completeCity(cell, id, s.prev, true); }
            if (this.over) return 0;
        }
        const econ = this.economy(id);
        let grew = false;
        for (const p of PROVINCES) {
            if (this.owner[p.city] !== id || this.legal[p.city] !== id) continue;
            const linked = econ.connected.has(p.id);
            const max = linked ? CONFIG.DEV_MAX_CONNECTED : CONFIG.DEV_MAX;
            if (this.dev[p.id] >= max) continue;
            this.dev[p.id] = Math.min(max, this.dev[p.id] + (linked ? CONFIG.DEV_GROWTH_CONNECTED : CONFIG.DEV_GROWTH));
            grew = true;
        }
        if (grew) this.devVersion++;
        const inc = this.income(id);
        this.nations[id].gold += inc;
        return inc;
    }

    // El fin de turno en tres pasos, para que la interfaz pueda enseñar la jugada de cada país (el resultado es el mismo).
    endTurn() {
        if (!this.beginAiPhase()) return;
        for (const id of this.aiOrder()) this.aiStep(id);
        this.finishAiPhase();
    }
    beginAiPhase() {
        if (this.over || this.player === null) return false;
        for (const p of [...this.proposals]) this.answerProposal(this.proposals.indexOf(p), false, true);
        this.proposals = [];
        this.alerts = [];
        return true;
    }
    aiOrder() {
        const out = [];
        for (let i = 1; i < this.nations.length; i++) out.push((this.player + i) % this.nations.length);
        return out;
    }
    aiStep(id) {
        if (this.over || !this.nations[id].alive) return false;
        this.beginNationTurn(id);
        this.aiTurn(id);
        return true;
    }
    finishAiPhase() {
        if (this.over) return;
        this.turn++;
        this.proposedThisTurn.clear();
        const inc = this.beginNationTurn(this.player);
        this.log(`— TURNO ${this.turn} — Ingresos: +${inc}g`);
    }

    // --- Diplomacia ---
    declareWar(a, b) {
        const r = this.rel(a, b);
        if (r.state === 'guerra' || this.turn < r.truceUntil || !this.nations[b].alive || a === b) return false;
        if (this.nations[a].overlord === b || this.nations[b].overlord === a) return false;   // ni el satélite ni su señor se atacan
        for (const bl of this.sharedBlocs(a, b)) this.leaveBloc(bl, a, ` por atacar a ${this.nm(b)}`);
        Object.assign(r, { state: 'guerra', since: this.turn });
        this.log(`${this.nm(a)} DECLARA LA GUERRA a ${this.nm(b)}.`);
        if (b === this.player) this.alerts.push({ kind: 'war', from: a });
        const joined = [], handled = new Set([a, b]);
        for (const bl of this.blocsOf(b)) {
            for (const c of [...bl.members]) {
                if (handled.has(c) || !this.nations[c].alive || this.atWar(c, a)) continue;
                handled.add(c);
                this.reveal(bl);
                if (c === this.player) { this.proposals.push({ kind: 'llamada', from: b, against: a }); continue; }
                for (const bl2 of this.sharedBlocs(c, a)) this.leaveBloc(bl2, c, ` para defender a ${this.nm(b)}`);
                Object.assign(this.rel(c, a), { state: 'guerra', since: this.turn });
                joined.push(this.nm(c));
                if (a === this.player) this.alerts.push({ kind: 'joined', from: c, defending: b });
            }
        }
        if (joined.length) this.log(`En defensa de ${this.nm(b)} entran en guerra contra ${this.nm(a)}: ${joined.join(', ')}.`);
        for (const s of this.nations) {
            if (!s.alive || s.overlord < 0 || handled.has(s.id)) continue;
            const side = s.overlord === a ? a : s.overlord === b ? b : -1;
            if (side < 0) continue;
            const foe = side === a ? b : a;
            handled.add(s.id);
            if (this.atWar(s.id, foe)) continue;
            Object.assign(this.rel(s.id, foe), { state: 'guerra', since: this.turn });
            this.log(`${s.name}, satélite de ${this.nm(side)}, entra en la guerra contra ${this.nm(foe)}.`);
            if (foe === this.player) this.alerts.push({ kind: 'joined', from: s.id, defending: side });
        }
        const lord = this.nations[b].overlord;
        if (lord >= 0 && !handled.has(lord) && lord !== a && !this.atWar(lord, a)) {
            if (lord === this.player) this.proposals.push({ kind: 'llamada', from: b, against: a });
            else Object.assign(this.rel(lord, a), { state: 'guerra', since: this.turn });
        }
        return true;
    }
    makePeace(a, b, quiet = false) {
        Object.assign(this.rel(a, b), { state: 'paz', since: this.turn, truceUntil: this.turn + CONFIG.TRUCE_TURNS });
        if (!quiet) this.log(`PAZ entre ${this.nm(a)} y ${this.nm(b)} (tregua hasta el turno ${this.turn + CONFIG.TRUCE_TURNS}).`);
    }
    // Firma la paz entre el bando de `a` y el de `b` (cada uno con sus satélites) y reparte lo ocupado.
    // terms.mode: 'annex' (cada uno se anexiona lo que ocupa), 'satellite' (b pasa a ser satélite de a) o 'white' (todo vuelve).
    // terms.keep: en 'satellite', si a se queda lo que ocupó. terms.mine: satélite al que a cede lo que ocupó él (−1: para a).
    // terms.satGains: 'self' (lo ocupado por los satélites de a es para ellos) u 'overlord' (para a).
    settlePeace(a, b, terms = { mode: 'annex' }) {
        const sideA = new Set([a, ...this.satellitesOf(a)]), sideB = new Set([b, ...this.satellitesOf(b)]);
        for (const [c, s] of [...this.sieges]) if ((sideA.has(s.by) && sideB.has(s.prev)) || (sideB.has(s.by) && sideA.has(s.prev))) this.sieges.delete(c);
        let gainedA = 0, gainedB = 0;
        for (const i of G.land) {
            const o = this.owner[i], l = this.legal[i];
            if (o === l) continue;
            const aGain = sideA.has(o) && sideB.has(l), bGain = sideB.has(o) && sideA.has(l);
            if (!aGain && !bGain) continue;
            if (terms.mode === 'white' || (terms.mode === 'satellite' && (bGain || !terms.keep))) { this.owner[i] = l; continue; }
            if (aGain) {
                let to = o;
                if (o === a && terms.mine >= 0 && sideA.has(terms.mine)) to = terms.mine;
                else if (o !== a && terms.satGains === 'overlord') to = a;
                this.owner[i] = to;
                this.legal[i] = to;
                gainedA++;
            } else {
                this.legal[i] = o;
                gainedB++;
            }
        }
        for (const x of sideA) for (const y of sideB) if (this.atWar(x, y)) this.makePeace(x, y, true);
        const what = terms.mode === 'white' ? 'paz blanca: cada uno recupera lo suyo'
            : terms.mode === 'satellite' ? `${this.nm(b)} pasa a ser satélite de ${this.nm(a)}`
            : `${this.nm(a)} se anexiona ${plural(gainedA, 'casilla', 'casillas')} y ${this.nm(b)} ${gainedB}`;
        this.log(`PAZ entre ${this.nm(a)} y ${this.nm(b)}: ${what}. Tregua hasta el turno ${this.turn + CONFIG.TRUCE_TURNS}.`);
        this.version++;
        if (terms.mode === 'satellite') this.makeSatellite(b, a);
        this.evictArmies();
        this.checkGameOver();
    }
    makeSatellite(sat, lord) {
        const s = this.nations[sat];
        for (const bl of this.blocsOf(sat)) this.leaveBloc(bl, sat, ' al pasar a ser un estado satélite');
        s.overlord = lord;
        this.blocsChanged();
        // Hace la paz con quien no esté en guerra con su señor y entra en las guerras de su señor.
        for (const e of this.enemiesOf(sat)) if (!this.atWar(lord, e)) this.settlePeace(sat, e, { mode: 'annex' });
        for (const e of this.enemiesOf(lord)) if (!this.atWar(sat, e)) Object.assign(this.rel(sat, e), { state: 'guerra', since: this.turn });
        this.proposals = this.proposals.filter(p => p.from !== sat);
        this.version++;
    }
    // Tras un tratado, los ejércitos que han quedado en territorio de un país en paz vuelven a la casilla propia más cercana.
    evictArmies() {
        for (const a of [...this.armies.values()]) {
            const o = this.owner[a.cell];
            if (o === a.owner || this.allied(a.owner, o) || this.atWar(a.owner, o)) continue;
            const seen = new Set([a.cell]), queue = [a.cell];
            let dest = -1;
            for (let i = 0; i < queue.length && dest < 0 && i < 4000; i++) {
                for (let d = 0; d < 6; d++) {
                    const v = G.nb[queue[i] * 6 + d];
                    if (v < 0 || seen.has(v)) continue;
                    seen.add(v);
                    if (isLand(v) && this.owner[v] === a.owner) { const other = this.armyOn(v); if (!other || other.owner === a.owner) { dest = v; break; } }
                    queue.push(v);
                }
            }
            this.removeArmy(a);
            if (dest >= 0) { a.cell = dest; a.used = 999; this.armies.set(a.id, a); this.settle(a); }
        }
    }
    // ¿Está `ai` claramente vencido por el jugador y sus satélites? (capital ocupada, el 40 % de su tierra o un tercio de su fuerza)
    isCrushed(ai) {
        const side = new Set([this.player, ...this.satellitesOf(this.player)]);
        let legalCells = 0, occupied = 0;
        for (const i of G.land) if (this.legal[i] === ai) { legalCells++; if (side.has(this.owner[i])) occupied++; }
        const powers = this.powers(), mine = [...side].reduce((s, x) => s + powers[x], 0);
        return side.has(this.owner[this.nations[ai].capitalCell]) || occupied >= legalCells * 0.4 || powers[ai] < mine * 0.35;
    }
    // Casillas ocupadas por cada bando en la guerra entre el jugador y `t`.
    occupation(t) {
        const sideA = new Set([this.player, ...this.satellitesOf(this.player)]), sideB = new Set([t, ...this.satellitesOf(t)]);
        let mine = 0, sats = 0, theirs = 0;
        const provs = new Set();
        for (const i of G.land) {
            const o = this.owner[i], l = this.legal[i];
            if (o === l) continue;
            if (sideA.has(o) && sideB.has(l)) { if (o === this.player) mine++; else sats++; provs.add(G.prov[i]); }
            else if (sideB.has(o) && sideA.has(l)) theirs++;
        }
        return { mine, sats, theirs, provinces: provs.size };
    }
    acceptsPeace(ai, terms, offered) {
        if (terms.mode === 'satellite') return this.isCrushed(ai);
        if (offered || this.wantsPeace(ai, this.player) || this.isCrushed(ai)) return true;
        const occ = this.occupation(ai);
        return terms.mode === 'annex' && occ.theirs > occ.mine + occ.sats && this.rng() < 0.6;   // si gana, acepta quedarse lo ocupado
    }
    wantsPeace(ai, other, powers = this.powers()) {
        const r = this.rel(ai, other);
        if (r.state !== 'guerra') return false;
        return powers[ai] < powers[other] * this.ai.peaceRatio || (this.turn - r.since >= this.ai.peaceAfter && this.rng() < 0.25);
    }
    // ¿Acepta `ai` entrar en `bloc` (o fundar uno con `inviter` si bloc es null)?
    acceptsBloc(ai, bloc, inviter) {
        const members = bloc ? [...bloc.members] : [inviter];
        if (members.includes(ai) || members.some(m => this.atWar(ai, m))) return false;
        if (members.some(m => this.enemiesOf(m).some(e => this.allied(ai, e)))) return false;   // chocaría con sus aliados
        const powers = this.powers();
        const shared = this.enemiesOf(ai).some(e => members.some(m => this.atWar(m, e)));
        const strength = members.reduce((s, m) => s + powers[m], 0);
        let p = shared ? 0.8 : 0.12;
        if (strength > 2 * powers[ai]) p += 0.15;
        if (bloc?.secret) p -= 0.05;
        return this.rng() < p;
    }
    // ¿Admite el bloque a `applicant`? Decide su miembro más fuerte.
    admits(bloc, applicant) {
        const members = [...bloc.members];
        if (members.some(m => this.atWar(m, applicant))) return false;
        const powers = this.powers();
        const shared = this.enemiesOf(applicant).some(e => members.some(m => this.atWar(m, e)));
        const leader = members.sort((x, y) => powers[y] - powers[x])[0];
        const p = 0.25 + (shared ? 0.45 : 0) + (powers[applicant] >= powers[leader] * 0.3 ? 0.15 : 0);
        return this.rng() < p;
    }

    // --- Acciones del jugador ---
    playerMove(army, send, dest) {
        if (this.over || army.owner !== this.player) return null;
        if (UNIT_KEYS.some(k => send[k] < 0 || send[k] > army.units[k]) || countUnits(send) === 0) return null;
        const r = this.reach(army.owner, army.cell, this.moveBudget(army.owner, army.cell, send, army.used), army.used === 0);
        const isAttack = r.attacks.has(dest);
        if (!isAttack && !this.destinations(r).has(dest)) return null;
        const mover = this.split(army, copyUnits(send));
        if (isAttack) { this.attack(mover, r.attacks.get(dest), dest, r); return this.armyOn(dest) ?? this.armyOn(r.attacks.get(dest)); }
        return this.moveArmy(mover, dest, r);
    }
    // Recluta hasta `qty` unidades (Infinity: todas las que permitan el oro y el cupo).
    playerRecruit(p, type, qty = 1) {
        if (this.over) return;
        let n = 0;
        while (n < qty && this.recruit(this.player, p, type)) n++;
        if (n) this.log(`Reclutas ${n} ${n === 1 ? CONFIG.TYPES[type].name.toLowerCase() : `unidades de ${CONFIG.TYPES[type].name.toLowerCase()}`} en ${p.cityName}.`);
        else this.log("No se puede reclutar ahí (fondos o cupo de la provincia agotados).");
    }
    playerRecruitMany(pids, type, qty) {
        if (this.over) return 0;
        let units = 0, cities = 0;
        for (const pid of pids) {
            const p = PROVINCES[pid];
            let n = 0;
            while (n < qty && this.recruit(this.player, p, type)) n++;
            if (n) { units += n; cities++; }
        }
        if (units) this.log(`Reclutas ${units} ${units === 1 ? CONFIG.TYPES[type].name.toLowerCase() : `unidades de ${CONFIG.TYPES[type].name.toLowerCase()}`} en ${plural(cities, 'ciudad', 'ciudades')}.`);
        else this.log('No se pudo reclutar: sin oro o sin cupo en esas ciudades.');
        return units;
    }
    playerBuild(plan) {
        if (this.over || !plan) return false;
        if (plan.cost > this.nations[this.player].gold) { this.log(`Fondos insuficientes: la obra cuesta ${plan.cost}g.`); return false; }
        const built = this.buildRoad(this.player, plan);
        if (!built) { this.log(`Ese trazado ya es ${plan.cls === 2 ? 'autopista' : 'carretera'}.`); return true; }
        this.log(`Construyes ${plan.cls === 2 ? 'autopista' : 'carretera'}: ${built} tramos por ${plan.cost}g.`);
        return true;
    }
    playerFortify(plan) {
        if (this.over || !plan) return false;
        if (!plan.cells.length) { this.log("Esas casillas ya están fortificadas o en obras."); return true; }
        if (plan.cost > this.nations[this.player].gold) { this.log(`Fondos insuficientes: la fortificación cuesta ${plan.cost}g.`); return false; }
        const n = this.buildFort(this.player, plan);
        this.log(`Empiezas a fortificar ${n} casilla${n > 1 ? 's' : ''} por ${plan.cost}g: listas en ${CONFIG.FORT_TURNS} turnos.`);
        return true;
    }
    playerDiplomacy(action, target) {
        const p = this.player;
        if (this.over || target === p || !this.nations[target].alive) return;
        if (action === 'war') {
            if (!this.declareWar(p, target)) this.log(`No puedes declarar la guerra a ${this.nm(target)} ahora.`);
        }
    }
    playerPeace(target, terms) {
        const p = this.player, key = `paz${target}`;
        const offered = this.proposals.findIndex(x => x.kind === 'paz' && x.from === target);
        if (this.over || !this.atWar(p, target) || (offered < 0 && this.proposedThisTurn.has(key))) return false;
        this.proposedThisTurn.add(key);
        if (!this.acceptsPeace(target, terms, offered >= 0)) {
            this.log(`${this.nm(target)} rechaza tus condiciones de paz.`);
            return false;
        }
        if (offered >= 0) this.proposals.splice(offered, 1);
        this.settlePeace(p, target, terms);
        return true;
    }
    // Pedir a un aliado que entre en la guerra contra `target`: probabilidad de que acepte (sin azar).
    callToWarOdds(ally, target) {
        const p = this.player;
        if (!this.nations[ally].alive || !this.allied(ally, p) || this.nations[ally].overlord >= 0 || this.atWar(ally, target)
            || !this.atWar(p, target) || this.turn < this.rel(ally, target).truceUntil) return 0;
        const powers = this.powers();
        const side = id => powers[id] + this.knownAllies(ally, id).filter(x => x !== ally && x !== p).reduce((s, x) => s + powers[x], 0);
        let odds = 0.3;
        if (this.borderSets()[ally].has(target)) odds += 0.2;
        if (powers[ally] + powers[p] > 1.5 * side(target)) odds += 0.2;
        if (this.enemiesOf(ally).length > this.ai.maxWars) odds -= 0.25;
        if (this.allied(ally, target)) odds -= 0.4;   // tendría que romper con un aliado suyo
        const mood = { pacifica: 0.5, normal: 1, agresiva: 1.3, caos: 1.6 }[this.settings.aggression] ?? 1;
        return Math.max(0, Math.min(0.95, odds * mood));
    }
    playerCallToWar(ally, target) {
        const key = `call${ally}:${target}`;
        if (this.over || this.proposedThisTurn.has(key)) return false;
        this.proposedThisTurn.add(key);
        if (this.rng() >= this.callToWarOdds(ally, target)) {
            this.log(`${this.nm(ally)} no quiere entrar en tu guerra contra ${this.nm(target)}.`);
            return false;
        }
        this.log(`${this.nm(ally)} acepta entrar en la guerra a tu lado contra ${this.nm(target)}.`);
        return this.declareWar(ally, target);
    }
    playerAnnexProvince(pid) {
        const p = PROVINCES[pid], sat = this.owner[p.city], me = this.player;
        if (this.over || sat < 0 || this.nations[sat].overlord !== me) return;
        for (const c of p.cells) {
            if (this.owner[c] !== sat) continue;
            this.owner[c] = me;
            this.legal[c] = me;
            const a = this.armyOn(c);
            if (a && a.owner === sat) a.owner = me;
        }
        this.armyVersion++;
        this.version++;
        this.log(`Te anexionas ${p.name}, que era de tu satélite ${this.nm(sat)}.`);
        if (!PROVINCES.some(q => this.owner[q.city] === sat)) this.playerAnnexSatellite(sat);
        this.checkGameOver();
    }
    playerAnnexSatellite(sat) {
        const s = this.nations[sat], me = this.player;
        if (this.over || s.overlord !== me) return;
        for (const i of G.land) {
            if (this.owner[i] === sat) this.owner[i] = me;
            if (this.legal[i] === sat) this.legal[i] = this.owner[i] === me ? me : this.owner[i];
        }
        for (const a of this.armies.values()) if (a.owner === sat) a.owner = me;
        for (const a of [...this.armies.values()]) if (a.owner === me) this.settle(a);
        this.nations[me].gold += s.gold;
        s.alive = false;
        s.overlord = -1;
        for (const o of this.nations) if (o.id !== sat) Object.assign(this.rel(sat, o.id), { state: 'paz' });
        this.blocsChanged();
        this.armyVersion++;
        this.version++;
        this.log(`Te anexionas ${s.name} entera: su territorio, su ejército y su tesoro pasan a ser tuyos.`);
        this.checkGameOver();
    }
    playerReleaseSatellite(sat) {
        const s = this.nations[sat];
        if (this.over || s.overlord !== this.player) return;
        s.overlord = -1;
        this.blocsChanged();
        this.log(`Concedes la independencia a ${s.name}.`);
    }
    playerCreateBloc(name, secret) {
        if (this.over) return null;
        const clean = name.trim().slice(0, 40) || `Pacto de ${this.nations[this.player].capitalName}`;
        const bloc = this.createBloc(this.player, clean, secret);
        this.blocsChanged();
        this.log(`Fundas ${secret ? 'el pacto secreto' : 'la alianza'} «${clean}».`);
        return bloc;
    }
    playerInvite(blocId, target) {
        const bloc = this.bloc(blocId), key = `inv${blocId}:${target}`;
        if (this.over || !bloc || !bloc.members.has(this.player) || bloc.members.has(target) || this.proposedThisTurn.has(key)) return;
        this.proposedThisTurn.add(key);
        if (this.acceptsBloc(target, bloc, this.player)) this.joinBloc(bloc, target);
        else this.log(`${this.nm(target)} rechaza unirse a ${bloc.name}.`);
    }
    playerRequestJoin(blocId) {
        const bloc = this.bloc(blocId), key = `req${blocId}`;
        if (this.over || !bloc || bloc.members.has(this.player) || this.proposedThisTurn.has(key)) return;
        this.proposedThisTurn.add(key);
        if (this.admits(bloc, this.player)) this.joinBloc(bloc, this.player);
        else this.log(`${bloc.name} rechaza tu solicitud de ingreso.`);
    }
    playerLeaveBloc(blocId) {
        const bloc = this.bloc(blocId);
        if (bloc) this.leaveBloc(bloc, this.player);
    }
    answerProposal(index, accept, ignored = false) {
        const pr = this.proposals.splice(index, 1)[0];
        if (!pr) return;
        const p = this.player, verb = ignored ? 'Ignoras' : 'Rechazas';
        if (pr.kind === 'llamada') {
            if (accept && !this.atWar(p, pr.against)) {
                for (const bl of this.sharedBlocs(p, pr.against)) this.leaveBloc(bl, p, ` para defender a ${this.nm(pr.from)}`);
                Object.assign(this.rel(p, pr.against), { state: 'guerra', since: this.turn });
                this.log(`Acudes en defensa de ${this.nm(pr.from)}: guerra contra ${this.nm(pr.against)}.`);
            } else if (!accept) {
                this.log(`${verb} la llamada de ${this.nm(pr.from)}.`);
                for (const bl of this.sharedBlocs(p, pr.from)) this.leaveBloc(bl, p, ` por abandonar a ${this.nm(pr.from)}`);
            }
            return;
        }
        if (!accept) { this.log(`${verb} la propuesta de ${pr.kind === 'paz' ? 'paz' : 'alianza'} de ${this.nm(pr.from)}.`); return; }
        if (pr.kind === 'paz' && this.atWar(pr.from, p)) this.settlePeace(p, pr.from, { mode: 'annex' });
        else if (pr.kind === 'bloque' && !this.atWar(pr.from, p)) {
            let bloc = pr.blocId ? this.bloc(pr.blocId) : null;
            if (!bloc) { bloc = this.createBloc(pr.from, `Pacto de ${this.nations[pr.from].capitalName}`, false); this.blocsChanged(); this.log(`Nace ${bloc.name}.`); }
            this.joinBloc(bloc, p);
        }
    }

    // --- IA ---
    aiTurn(id) {
        const powers = this.powers();
        this.aiDiplomacy(id, powers);
        this.aiForts(id);   // antes de reclutar: en guerra el reclutamiento gasta todo el oro
        this.aiRecruit(id);
        this.aiArmies(id);
        if (!this.over) this.aiRoads(id);
    }

    aiDiplomacy(id, powers) {
        const S = this.ai;
        if (this.nations[id].overlord >= 0) return;   // un satélite sigue la política de su señor
        for (const e of this.enemiesOf(id)) {
            if (this.nations[e].overlord >= 0 || !this.atWar(id, e) || !this.wantsPeace(id, e, powers)) continue;   // con un satélite se negocia a través de su señor
            if (e === this.player) { if (!this.proposals.some(p => p.kind === 'paz' && p.from === id)) this.proposals.push({ kind: 'paz', from: id }); }
            else if (this.wantsPeace(e, id, powers) || this.rng() < 0.3) this.settlePeace(id, e, { mode: 'annex' });
        }
        const enemies = this.enemiesOf(id);
        if (enemies.length <= S.maxWars && this.turn >= S.warFrom && this.rng() < S.warChance) {
            const side = t => powers[t] + this.knownAllies(id, t).filter(x => x !== id).reduce((s, x) => s + powers[x], 0);
            const target = [...this.borderSets()[id]]
                .filter(b => this.nations[b].alive && !this.atWar(id, b) && this.turn >= this.rel(id, b).truceUntil
                    && (!this.allied(id, b) || this.rng() < S.betrayChance))
                .sort((x, y) => side(x) - side(y))[0];
            if (target !== undefined && powers[id] > S.warRatio * side(target)) this.declareWar(id, target);
        }
        if (enemies.length && this.rng() < S.blocChance) {
            const partner = this.nations.find(n => n.alive && n.id !== id && !this.allied(id, n.id) && !this.atWar(id, n.id)
                && enemies.some(e => this.atWar(n.id, e)));
            if (!partner) return;
            const own = this.blocs.find(b => b.founder === id && b.members.has(id));
            if (partner.id === this.player) {
                if (!this.proposals.some(p => p.kind === 'bloque' && p.from === id)) this.proposals.push({ kind: 'bloque', from: id, blocId: own?.id ?? null });
            } else if (this.acceptsBloc(partner.id, own ?? null, id)) {
                const bloc = own ?? this.createBloc(id, `Pacto de ${this.nations[id].capitalName}`, false);
                if (!own) { this.blocsChanged(); this.log(`Nace ${bloc.name}.`); }
                this.joinBloc(bloc, partner.id);
            }
        }
    }

    // Distancia (en pasos) a `sources` por terreno transitable para la nación `id` (incluye el mar).
    field(id, sources) {
        const dist = new Int32Array(G.N).fill(1e9), queue = new Int32Array(G.N);
        let head = 0, tail = 0;
        for (const s of sources) { dist[s] = 0; queue[tail++] = s; }
        while (head < tail) {
            const u = queue[head++];
            for (let d = 0; d < 6; d++) {
                const v = G.nb[u * 6 + d];
                if (v < 0 || dist[v] <= dist[u] + 1) continue;
                if (isLand(v)) {
                    const o = this.owner[v];
                    if (!(o === id || this.allied(id, o) || this.atWar(id, o))) continue;
                }
                dist[v] = dist[u] + 1;
                queue[tail++] = v;
            }
        }
        return dist;
    }

    aiReserve(id) { return this.enemiesOf(id).length ? 0 : this.income(id) * 4; }

    aiRecruit(id) {
        const n = this.nations[id];
        const enemies = this.enemiesOf(id);
        const reserve = this.aiReserve(id);
        let cities = this.citiesOf(id);
        if (!cities.length) return;
        if (enemies.length) {
            const dist = this.field(id, PROVINCES.filter(p => enemies.includes(this.owner[p.city])).map(p => p.city));
            cities = cities.sort((x, y) => dist[x.city] - dist[y.city]);
        } else {
            // Barajado Fisher-Yates: consume siempre los mismos números aleatorios (sort con comparador aleatorio no).
            for (let i = cities.length - 1; i > 0; i--) {
                const j = Math.floor(this.rng() * (i + 1));
                [cities[i], cities[j]] = [cities[j], cities[i]];
            }
        }
        for (let guard = 0; guard < 200 && n.gold - reserve >= this.unitCost(id, 'infantry'); guard++) {
            const p = cities.find(c => this.canRecruitAt(id, c));
            if (!p) break;
            const r = this.rng(), budget = n.gold - reserve;
            let type = 'infantry';
            if (budget >= this.unitCost(id, 'artillery', p.id) && r < 0.2) type = 'artillery';
            else if (budget >= this.unitCost(id, 'tank', p.id) && r < 0.55) type = 'tank';
            if (!this.recruit(id, p, type)) break;
        }
    }

    aiArmies(id) {
        const enemies = this.enemiesOf(id);
        if (!enemies.length) return;
        const targets = PROVINCES.filter(p => enemies.includes(this.owner[p.city])).map(p => p.city);
        if (!targets.length) return;
        const dist = this.field(id, targets);
        const mine = [...this.armies.values()].filter(a => a.owner === id && this.mp(a) > 0)
            .sort((x, y) => unitPower(y.units, 'atk') - unitPower(x.units, 'atk'));
        for (const army0 of mine) {
            if (this.over) return;
            if (!this.armies.has(army0.id) || army0.owner !== id || this.mp(army0) <= 0) continue;
            if (this.sieges.get(army0.cell)?.by === id) continue;   // mantiene el asedio
            let army = army0;
            const onCity = CITY_OF[army.cell] >= 0;
            if (onCity && unitPower(army.units, 'atk') <= 10) continue;               // guarnición
            if (onCity && army.units.infantry >= 1 && countUnits(army.units) > 1) {   // deja una infantería de guarnición
                const send = copyUnits(army.units); send.infantry--;
                army = this.split(army, send);
            }
            const r = this.reach(id, army.cell, this.mp(army), army.used === 0);
            const atk = unitPower(army.units, 'atk') * this.flankFactor(id, army.cell);
            const trapped = this.hostileSides(id, army.cell);
            let best = null, bestScore = 0;
            for (const [target, from] of r.attacks) {
                const def = this.armyOn(target);
                const fx = this.combatFactors(id, army.units, from, def, target);
                const ratio = fx.atk / fx.dfn;
                // Rodeada, le basta una ventaja menor para atacar y prefiere romper el cerco antes que huir.
                if (ratio < (trapped >= CONFIG.FLANKED_SIDES ? 1.1 : 1.3)) continue;
                const score = 1000 + Math.min(ratio, 5) * 20 + (CITY_OF[target] >= 0 ? 300 : 0) + (trapped >= CONFIG.FLANKED_SIDES ? 200 : 0);
                if (score > bestScore) { bestScore = score; best = { kind: 'attack', target, from }; }
            }
            for (const v of this.destinations(r)) {
                const hostile = this.atWar(id, this.owner[v]);
                const gain = dist[army.cell] - dist[v];
                if (gain <= 0 && !(CITY_OF[v] >= 0 && hostile) && !(trapped >= CONFIG.FLANKED_SIDES && this.hostileSides(id, v) < trapped)) continue;
                const escape = trapped >= CONFIG.FLANKED_SIDES ? (trapped - this.hostileSides(id, v)) * 120 : 0;   // rodeada: retirarse vale más
                const score = gain * 10 + escape + (CITY_OF[v] >= 0 && hostile ? 600 : 0) + (RESOURCE_AT.has(v) && hostile ? 150 : 0) + (hostile ? 2 : 0);
                if (score > bestScore) { bestScore = score; best = { kind: 'move', target: v }; }
            }
            if (!best) { this.settle(army); continue; }
            if (best.kind === 'attack') this.attack(army, best.from, best.target, r);
            else this.moveArmy(army, best.target, r);
        }
    }

    // En guerra fortifica la ciudad propia más valiosa que tenga territorio enemigo a 3 casillas o menos.
    aiForts(id) {
        const enemies = this.enemiesOf(id), n = this.nations[id];
        if (!enemies.length || n.gold < CONFIG.FORT_COST * 4 || this.rng() > 0.35) return;
        const nearEnemy = cell => {
            const seen = new Set([cell]);
            let front = [cell];
            for (let r = 0; r < 3; r++) {
                const next = [];
                for (const u of front) for (let d = 0; d < 6; d++) {
                    const v = G.nb[u * 6 + d];
                    if (v < 0 || seen.has(v)) continue;
                    seen.add(v);
                    if (isLand(v) && enemies.includes(this.owner[v])) return true;
                    next.push(v);
                }
                front = next;
            }
            return false;
        };
        const free = c => c >= 0 && isLand(c) && this.owner[c] === id && !this.fort[c] && !this.fortWork.has(c);
        const city = this.citiesOf(id).filter(p => free(p.city) && nearEnemy(p.city)).sort((x, y) => y.value - x.value)[0];
        if (!city) return;
        const ring = [city.city, ...[0, 1, 2, 3, 4, 5].map(d => G.nb[city.city * 6 + d])].filter(free);
        const cells = ring.slice(0, Math.floor(n.gold * 0.4 / CONFIG.FORT_COST));
        if (cells.length) this.buildFort(id, { cells, cost: cells.length * CONFIG.FORT_COST });
    }

    // Une a la red de carreteras la ciudad o el yacimiento más valioso que aún no lo esté (una obra por turno;
    // en guerra solo con el oro que sobre tras reclutar).
    aiRoads(id) {
        const atWar = this.enemiesOf(id).length > 0;
        const n = this.nations[id], budget = atWar ? n.gold * 0.5 : n.gold - this.aiReserve(id) * 0.5;
        if (budget < CONFIG.ROAD_COST * 2) return;
        const e = this.economy(id);
        const cap = n.capitalCell;
        if (this.owner[cap] !== id) return;
        const targets = [
            ...this.citiesOf(id).filter(p => !e.connected.has(p.id)).map(p => ({ cell: p.city, value: p.value })),
            ...e.looseResources.map(r => ({ cell: r.cell, value: r.value * 2 }))   // con carretera abastece a más provincias
        ].sort((x, y) => y.value - x.value);
        const loose = targets[0];
        if (!loose) return;
        const plan = this.planRoad(id, loose.cell, c => e.seen[c] === 1, 1);
        if (plan && plan.cost <= budget * 0.7) this.buildRoad(id, plan);
    }
}

class MapView {
    constructor(game, canvas) {
        this.game = game;
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.scale = 1; this.ox = 0; this.oy = 0;
        this.builtVersion = -1;
        this.builtRoads = -1;
        this.builtForts = -1;
        this.showSupply = false;
        this.highlight = null;   // { moves:Set, attacks:Set }
        this.preview = null;     // obra en curso de trazar
        this.selectedCell = -1;
        this.hoverCell = -1;
        this.hoverNation = -1;
        this.mode = 'sencilla';          // 'sencilla' o 'realista' (preferencia del dispositivo)
        this.motion = new ArmyMotion(this);
        this.realistic = new RealisticMap(this);
        this.instantMotion = false;      // la IA juega «directo»: sin animaciones
        this.frameReq = 0;
        this.buildStatic();
        this.resize();
        this.fit();
        new ResizeObserver(() => { this.resize(); this.draw(); }).observe(canvas.parentElement);
    }

    resize() {
        const r = this.canvas.parentElement.getBoundingClientRect();
        this.dpr = Math.min(2, window.devicePixelRatio || 1);   // más de 2 no se nota y en el móvil cuesta fluidez
        this.w = r.width; this.h = r.height;
        this.canvas.width = Math.round(r.width * this.dpr);
        this.canvas.height = Math.round(r.height * this.dpr);
    }

    // Encaja Europa en el hueco que dejan libre los paneles flotantes (padLeft píxeles a la izquierda).
    fit(padLeft = 0, padBottom = 0) {
        const w = this.w - padLeft, hh = this.h - padBottom;
        this.scale = Math.min(w / G.width, hh / G.height) * 0.98;
        this.ox = padLeft + (w - G.width * this.scale) / 2 - (G.x0 - G.W / 2) * this.scale;
        this.oy = (hh - G.height * this.scale) / 2 - (G.y0 - G.S) * this.scale;
    }

    setMode(mode) {
        this.mode = mode;
        if (mode === 'realista') this.realistic.prepare();
        this.requestFrame();
    }
    isRealistic() { return this.mode === 'realista' && this.realistic.state === 'ready'; }
    requestFrame() {
        if (this.frameReq) return;
        this.frameReq = requestAnimationFrame(() => { this.frameReq = 0; this.draw(); });
    }

    toWorld(px, py) { return [(px - this.ox) / this.scale, (py - this.oy) / this.scale]; }
    toScreen(x, y) { return [x * this.scale + this.ox, y * this.scale + this.oy]; }
    cellAtScreen(px, py) { const [x, y] = this.toWorld(px, py); return G.cellAt(x, y); }

    zoomAt(px, py, factor) {
        const hexPx = G.S * this.scale * factor;
        if (hexPx < 1.5 || hexPx > 60) return;
        const [x, y] = this.toWorld(px, py);
        this.scale *= factor;
        this.ox = px - x * this.scale;
        this.oy = py - y * this.scale;
    }

    // yFrac: altura de pantalla donde queda la casilla (en el móvil, por encima de la ficha inferior).
    centerOn(cell, hexPx = 8, yFrac = isMobile() ? 0.27 : 0.5) {
        this.scale = Math.max(this.scale, hexPx / G.S);
        this.ox = this.w / 2 - G.cx[cell] * this.scale;
        this.oy = this.h * yFrac - G.cy[cell] * this.scale;
    }

    hexPath(path, i, r = 1) {
        const x = G.cx[i], y = G.cy[i], k = G.corners;
        path.moveTo(x + k[0][0] * r, y + k[0][1] * r);
        for (let j = 1; j < 6; j++) path.lineTo(x + k[j][0] * r, y + k[j][1] * r);
        path.closePath();
    }

    edge(path, i, d) {
        const x = G.cx[i], y = G.cy[i], a = G.corners[d], b = G.corners[(d + 1) % 6];
        path.moveTo(x + a[0], y + a[1]);
        path.lineTo(x + b[0], y + b[1]);
    }

    buildStatic() {
        this.provBorders = new Path2D();
        this.coast = new Path2D();
        for (const i of G.land) {
            for (let d = 0; d < 6; d++) {
                const j = G.nb[i * 6 + d];
                if (j < 0 || !isLand(j)) this.edge(this.coast, i, d);
                else if (d < 3 && G.prov[j] !== G.prov[i]) this.edge(this.provBorders, i, d);
            }
        }
    }

    buildRoads() {
        const road = this.game.road;
        this.roads = { 1: new Path2D(), 2: new Path2D() };
        for (const i of G.land) {
            for (let d = 0; d < 3; d++) {
                const cls = road[i * 6 + d];
                if (!cls) continue;
                const j = G.nb[i * 6 + d];
                this.roads[cls].moveTo(G.cx[i], G.cy[i]);
                this.roads[cls].lineTo(G.cx[j], G.cy[j]);
            }
        }
        this.builtRoads = this.game.roadVersion;
    }

    // Fortificaciones: relleno de piedra y muro en el contorno de cada bloque; obras en curso, discontinuas.
    buildForts() {
        const g = this.game;
        this.fortFill = new Path2D();
        this.walls = new Path2D();
        this.works = new Path2D();
        for (const i of G.land) {
            if (!g.fort[i]) continue;
            this.hexPath(this.fortFill, i);
            for (let d = 0; d < 6; d++) {
                const j = G.nb[i * 6 + d];
                if (j < 0 || !g.fort[j]) this.edge(this.walls, i, d);
            }
        }
        for (const c of g.fortWork.keys()) this.hexPath(this.works, c, 0.8);
        this.builtForts = g.fortVersion;
    }

    buildDynamic() {
        const g = this.game;
        this.fills = new Map();
        this.stripes = new Map();   // ocupante → casillas en disputa
        this.borders = new Path2D();
        const sums = g.nations.map(() => [0, 0, 0]);
        for (const i of G.land) {
            const o = g.owner[i];
            const base = g.legal[i] !== o ? g.legal[i] : o;
            if (!this.fills.has(base)) this.fills.set(base, new Path2D());
            this.hexPath(this.fills.get(base), i);
            if (base !== o) {
                if (!this.stripes.has(o)) this.stripes.set(o, new Path2D());
                this.hexPath(this.stripes.get(o), i);
            }
            for (let d = 0; d < 3; d++) {
                const j = G.nb[i * 6 + d];
                if (j >= 0 && isLand(j) && g.owner[j] !== o) this.edge(this.borders, i, d);
            }
            sums[o][0] += G.cx[i]; sums[o][1] += G.cy[i]; sums[o][2]++;
        }
        this.labels = sums.map(([x, y, n], id) => (n ? { id, x: x / n, y: y / n, n } : null)).filter(Boolean);
        this.nationPaths = new Map();
        this.builtVersion = g.version;
    }

    // Rayas diagonales del color del ocupante, con un filete oscuro para que se lean sobre cualquier color.
    stripePattern(color) {
        this.patterns ??= new Map();
        if (!this.patterns.has(color)) {
            const c = document.createElement('canvas');
            c.width = c.height = 10;
            const x = c.getContext('2d');
            const line = (w, style) => {
                x.strokeStyle = style; x.lineWidth = w; x.beginPath();
                for (const o of [-10, 0, 10]) { x.moveTo(o - 1, 11); x.lineTo(o + 11, -1); }
                x.stroke();
            };
            line(4.6, 'rgba(21,26,18,0.55)');
            line(3, color);
            this.patterns.set(color, this.ctx.createPattern(c, 'repeat'));
        }
        return this.patterns.get(color);
    }

    nationPath(id) {
        if (!this.nationPaths.has(id)) {
            const p = new Path2D();
            for (const i of G.land) if (this.game.owner[i] === id) this.hexPath(p, i);
            this.nationPaths.set(id, p);
        }
        return this.nationPaths.get(id);
    }

    draw() {
        const g = this.game, ctx = this.ctx, s = this.scale, dpr = this.dpr;
        if (this.builtVersion !== g.version) this.buildDynamic();
        if (this.builtRoads !== g.roadVersion) this.buildRoads();
        if (this.builtForts !== g.fortVersion) this.buildForts();
        const hexPx = G.S * s, now = performance.now();
        this.motion.consume(now);
        const real = this.isRealistic();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = real ? '#2a5670' : '#16232b';
        ctx.fillRect(0, 0, this.w, this.h);

        ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * this.ox, dpr * this.oy);
        if (real) this.realistic.drawWorld(ctx, now);
        else {
            ctx.globalAlpha = 0.86;
            for (const [o, path] of this.fills) { ctx.fillStyle = g.nations[o].color; ctx.fill(path); }
            ctx.globalAlpha = 1;
        }
        for (const [o, path] of this.stripes) {
            const pat = this.stripePattern(g.nations[o].color);
            pat.setTransform(new DOMMatrix([1 / s, 0, 0, 1 / s, 0, 0]));   // franjas del mismo grosor a cualquier zoom
            ctx.fillStyle = pat;
            ctx.fill(path);
        }
        if (g.settings.fog && g.player !== null) {
            const vis = g.visibleCells(g.player);
            if (this.fogKey !== g.visCache.key) {
                this.fogPath = new Path2D();
                for (const i of G.land) if (!vis[i]) this.hexPath(this.fogPath, i);
                this.fogKey = g.visCache.key;
            }
            ctx.fillStyle = 'rgba(12,16,14,0.5)';
            ctx.fill(this.fogPath);
        }
        if (this.hoverNation >= 0) { ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill(this.nationPath(this.hoverNation)); }

        if (this.showSupply && g.player !== null) {
            const sup = g.supplyMap(g.player), out = new Path2D();
            for (const i of G.land) if (g.owner[i] === g.player && sup[i] < 0) this.hexPath(out, i);
            ctx.fillStyle = 'rgba(255,150,30,0.5)'; ctx.fill(out);
        }
        if (this.highlight) {
            const mv = new Path2D(), at = new Path2D();
            for (const c of this.highlight.moves) this.hexPath(mv, c);
            for (const c of this.highlight.attacks) this.hexPath(at, c);
            if (real) {
                // Alcance: velo claro y contorno discontinuo de toda la zona, sin dibujar cada casilla
                if (this.reachEdges?.src !== this.highlight) {
                    const edge = new Path2D(), inside = new Set([...this.highlight.moves, this.selectedCell]);
                    for (const c of inside) for (let d = 0; d < 6; d++) { const j = G.nb[c * 6 + d]; if (j < 0 || !inside.has(j)) this.edge(edge, c, d); }
                    this.reachEdges = { src: this.highlight, edge };
                }
                ctx.fillStyle = 'rgba(255,248,220,0.24)'; ctx.fill(mv);
                ctx.strokeStyle = 'rgba(255,250,232,0.95)'; ctx.lineWidth = 1.5 / s;
                ctx.setLineDash([4 / s, 3 / s]); ctx.stroke(this.reachEdges.edge); ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(224,90,71,0.32)'; ctx.fill(at);
                ctx.strokeStyle = '#e05a47'; ctx.lineWidth = 2 / s; ctx.stroke(at);
            } else {
                ctx.fillStyle = 'rgba(143,209,107,0.42)'; ctx.fill(mv);
                ctx.fillStyle = 'rgba(224,90,71,0.7)'; ctx.fill(at);
            }
        }

        if (!real) {
        if (hexPx >= 3) {
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 0.7 / s;
            ctx.stroke(this.provBorders);
        }
        ctx.strokeStyle = '#5c8197'; ctx.lineWidth = 1 / s; ctx.stroke(this.coast);
        ctx.strokeStyle = INK; ctx.lineWidth = 1.9 / s; ctx.stroke(this.borders);

        // Carreteras
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(21,26,18,0.6)'; ctx.lineWidth = Math.min(3.6, 1.4 + hexPx * 0.12) / s;
        ctx.stroke(this.roads[1]);
        ctx.strokeStyle = '#efe9d6'; ctx.lineWidth = Math.min(1.8, 0.6 + hexPx * 0.07) / s;
        ctx.stroke(this.roads[1]);
        ctx.strokeStyle = 'rgba(21,26,18,0.7)'; ctx.lineWidth = Math.min(5, 2 + hexPx * 0.16) / s;
        ctx.stroke(this.roads[2]);
        ctx.strokeStyle = SIGNAL; ctx.lineWidth = Math.min(2.8, 1 + hexPx * 0.1) / s;
        ctx.stroke(this.roads[2]);
        }

        // Fortificaciones
        ctx.fillStyle = 'rgba(214,203,178,0.5)'; ctx.fill(this.fortFill);
        ctx.strokeStyle = '#2b2620'; ctx.lineWidth = 3.8 / s; ctx.stroke(this.walls);
        ctx.strokeStyle = '#e3d9c0'; ctx.lineWidth = 2.1 / s; ctx.stroke(this.walls);
        ctx.setLineDash([3 / s, 2 / s]);
        ctx.strokeStyle = '#e3d9c0'; ctx.lineWidth = 1.5 / s; ctx.stroke(this.works);
        ctx.setLineDash([]);

        if (this.preview) {
            const p = new Path2D();
            const ok = this.preview.affordable ? '#8fd16b' : '#e05a47';
            if (this.preview.cls === 'fort') {
                for (const c of this.preview.path) this.hexPath(p, c);
                ctx.fillStyle = this.preview.affordable ? 'rgba(143,209,107,0.35)' : 'rgba(224,90,71,0.4)';
                ctx.fill(p);
                ctx.strokeStyle = ok; ctx.lineWidth = 1.5 / s; ctx.stroke(p);
            } else {
                this.preview.path.forEach((c, i) => (i ? p.lineTo(G.cx[c], G.cy[c]) : p.moveTo(G.cx[c], G.cy[c])));
                ctx.setLineDash([5 / s, 3 / s]);
                ctx.strokeStyle = ok;
                ctx.lineWidth = 3.2 / s;
                ctx.stroke(p);
                ctx.setLineDash([]);
            }
        }

        if (this.hoverCell >= 0 && isLand(this.hoverCell) && this.hoverCell !== this.selectedCell) {
            const p = new Path2D(); this.hexPath(p, this.hoverCell);
            ctx.strokeStyle = real ? 'rgba(255,252,240,0.7)' : 'rgba(255,255,255,0.75)'; ctx.lineWidth = (real ? 1.1 : 1.4) / s; ctx.stroke(p);
        }
        if (this.multi?.size) {
            const p = new Path2D();
            for (const c of this.multi) this.hexPath(p, c);
            ctx.strokeStyle = INK; ctx.lineWidth = 5 / s; ctx.stroke(p);
            ctx.strokeStyle = SIGNAL; ctx.lineWidth = 2.6 / s; ctx.stroke(p);
        }
        if (this.selectedCell >= 0) {
            const p = new Path2D(); this.hexPath(p, this.selectedCell);
            ctx.strokeStyle = INK; ctx.lineWidth = 4.5 / s; ctx.stroke(p);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2 / s; ctx.stroke(p);
        }

        // Capa en píxeles de pantalla: recursos, ciudades, ejércitos, rótulos.
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const visible = (x, y, m = 40) => x > -m && y > -m && x < this.w + m && y < this.h + m;
        const font = (size, weight = 600) => `${weight} ${size}px 'Barlow Semi Condensed', Bahnschrift, 'Arial Narrow', sans-serif`;

        for (const r of RESOURCES) {
            const [x, y] = this.toScreen(G.cx[r.cell], G.cy[r.cell]);
            if (!visible(x, y)) continue;
            const rad = Math.max(4, Math.min(11, hexPx * 0.9));
            ctx.globalAlpha = g.resourceLinked(r) ? 1 : 0.7;
            ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
            ctx.fillStyle = CONFIG.RESOURCE_COLOR[r.type]; ctx.fill();
            ctx.lineWidth = 1.5; ctx.strokeStyle = g.nations[g.owner[r.cell]].color; ctx.stroke();
            if (rad >= 6) {
                ctx.font = `${Math.round(rad * 1.2)}px sans-serif`;
                ctx.fillStyle = '#fff';
                ctx.fillText(CONFIG.RESOURCE_ICON[r.type], x, y + 1);
            }
            ctx.globalAlpha = 1;
        }

        for (const p of PROVINCES) {
            const [x, y] = this.toScreen(G.cx[p.city], G.cy[p.city]);
            if (!visible(x, y)) continue;
            if (CAPITAL_OF[p.city] >= 0) {
                ctx.font = `bold ${Math.max(11, Math.min(17, hexPx * 1.6))}px sans-serif`;
                ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.strokeText('★', x, y);
                ctx.fillStyle = SIGNAL; ctx.fillText('★', x, y);
            } else if (hexPx >= 2.5 && !(real && hexPx >= 9)) {   // en la vista realista, de cerca se ven sus casas
                ctx.beginPath(); ctx.arc(x, y, Math.max(1.6, Math.min(3.5, hexPx * 0.35)), 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.stroke();
            }
        }

        // Asedios: anillo rojo discontinuo y turnos que lleva
        for (const [c, sg] of g.sieges) {
            if (!g.sees(g.player, c)) continue;
            const [x, y] = this.toScreen(G.cx[c], G.cy[c]);
            if (!visible(x, y)) continue;
            const r = Math.max(7, hexPx * 1.25);
            ctx.setLineDash([4, 3]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#e05a47';
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
            if (hexPx >= 5) {
                ctx.font = font(11, 700); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = '#ffb3a8';
                ctx.strokeText(`${sg.held}/${CONFIG.SIEGE_TURNS}`, x, y - r - 7); ctx.fillText(`${sg.held}/${CONFIG.SIEGE_TURNS}`, x, y - r - 7);
            }
        }

        // Espías del jugador: un ojo junto a la ciudad de la provincia
        for (const [pid, s] of g.spies) {
            const c = PROVINCES[pid].city, [x, y] = this.toScreen(G.cx[c], G.cy[c]);
            if (!visible(x, y)) continue;
            const r = Math.max(6, Math.min(10, hexPx * 0.8)), ex = x - Math.max(10, hexPx * 1.1), ey = y;
            ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2);
            ctx.fillStyle = s.revealedTurn === g.turn ? SIGNAL : '#ebe7d8'; ctx.fill();
            ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.62, r * 0.36, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(ex, ey, r * 0.2, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
        }

        // Ejércitos: fichas OTAN en la vista sencilla, miniaturas en la realista. Mientras se mueven, siguen su camino.
        const tokens = [];
        const seen = (wx, wy, cell) => { const c = G.cellAt(wx, wy); return g.sees(g.player, c >= 0 && isLand(c) ? c : cell); };
        for (const a of g.armies.values()) {
            if (g.armyOn(a.cell) !== a) continue;
            const pose = this.motion.pose(a.id, now);
            const wx = pose ? pose.x : G.cx[a.cell], wy = pose ? pose.y : G.cy[a.cell];
            if (!seen(wx, wy, a.cell)) continue;
            const mine = a.owner === g.player;
            tokens.push({ id: a.id, owner: a.owner, type: dominantType(a.units), n: countUnits(a.units), wx, wy, mine,
                spent: mine && g.mp(a) === 0, noSupply: mine && !g.inSupply(a.owner, a.cell),
                flanked: g.hostileSides(a.owner, a.cell) >= CONFIG.FLANKED_SIDES, selected: a.cell === this.selectedCell && !pose?.moving,
                moving: !!pose?.moving, facing: this.motion.facingOf(a.id, pose), alpha: 1 });
        }
        for (const gh of this.motion.ghosts(now)) {
            if (!seen(gh.p.x, gh.p.y, gh.tr.cells[gh.tr.cells.length - 1])) continue;
            tokens.push({ id: gh.id, owner: gh.tr.owner, type: gh.tr.type, n: gh.tr.n, wx: gh.p.x, wy: gh.p.y, mine: gh.tr.owner === g.player,
                moving: gh.p.moving, facing: this.motion.facingOf(gh.id, gh.p), alpha: 1 });
        }
        for (const f of this.motion.fx) {   // quien cae en combate se desvanece al terminar el choque
            for (const [id, owner, type, n, cell] of [[f.def, f.defOwner, f.defType, f.defN, f.cell], [f.att, f.attOwner, f.attType, f.attN, f.from]]) {
                if (g.armies.has(id) || now < f.start || this.motion.tracks.has(id) || !g.sees(g.player, cell)) continue;
                const alpha = now < f.end ? 1 : Math.max(0, 1 - (now - f.end) / 500);
                tokens.push({ id, owner, type, n, wx: G.cx[cell], wy: G.cy[cell], mine: owner === g.player, facing: 1, alpha });
            }
        }
        if (real) tokens.sort((p, q) => p.wy - q.wy);
        for (const t of tokens) {
            let [x, y] = this.toScreen(t.wx, t.wy);
            if (!visible(x, y)) continue;
            const sh = this.motion.shake(t.id, now);
            if (sh) { x += sh[0]; y += sh[1]; }
            if (real) this.realistic.drawArmy(ctx, { ...t, x, y, hexPx, color: g.nations[t.owner].color, now });
            else this.drawCounter(t, x, y, hexPx, font);
        }
        this.motion.effects(now);
        this.motion.drawParticles(ctx, this, now);

        if (hexPx >= 7) {
            ctx.font = font(Math.round(Math.min(15, 10 + hexPx * 0.2)));
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(21,26,18,0.9)'; ctx.fillStyle = '#f3efe2';
            for (const p of PROVINCES) {
                const [x, y] = this.toScreen(G.cx[p.city], G.cy[p.city]);
                if (!visible(x, y, 100)) continue;
                ctx.strokeText(p.cityName, x, y + hexPx * 1.1 + 7);
                ctx.fillText(p.cityName, x, y + hexPx * 1.1 + 7);
            }
        } else {
            // Nombres de país, de mayor a menor; se omite el que se solaparía con uno ya dibujado.
            const placed = [];
            for (const l of [...this.labels].sort((a, b) => b.n - a.n)) {
                if (l.n < 25) continue;
                const [x, y] = this.toScreen(l.x, l.y);
                if (!visible(x, y, 100)) continue;
                const size = Math.max(10, Math.min(20, Math.sqrt(l.n) * hexPx * 0.38));
                ctx.font = font(Math.round(size), 700);
                const t = g.nations[l.id].name;
                const w = ctx.measureText(t).width / 2 + 2, h = size / 2 + 1;
                if (placed.some(r => Math.abs(r.x - x) < r.w + w && Math.abs(r.y - y) < r.h + h)) continue;
                placed.push({ x, y, w, h });
                ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(21,26,18,0.85)'; ctx.fillStyle = '#fff';
                ctx.strokeText(t, x, y); ctx.fillText(t, x, y);
            }
        }
        if (this.motion.active(now)) this.requestFrame();
    }

    // Ficha OTAN de la vista sencilla: color del país, símbolo del tipo dominante y número de unidades.
    drawCounter(t, x, y, hexPx, font) {
        const ctx = this.ctx, g = this.game;
        ctx.globalAlpha = t.alpha;
        if (hexPx < 6) {
            ctx.fillStyle = g.nations[t.owner].color;
            ctx.fillRect(x - 3, y - 3, 6, 6);
            ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.strokeRect(x - 3, y - 3, 6, 6);
            ctx.globalAlpha = 1;
            return;
        }
        const w = Math.max(22, Math.min(40, hexPx * 2.2)), hh = w * 0.62;
        const x0 = x - w / 2, y0 = y - hh / 2 - hexPx * 0.12;
        ctx.globalAlpha = t.alpha * (t.spent ? 0.55 : 1);
        ctx.fillStyle = g.nations[t.owner].color;
        ctx.fillRect(x0, y0, w, hh);
        ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
        ctx.beginPath();
        if (t.type === 'infantry') { ctx.moveTo(x0, y0); ctx.lineTo(x0 + w, y0 + hh); ctx.moveTo(x0 + w, y0); ctx.lineTo(x0, y0 + hh); ctx.stroke(); }
        else if (t.type === 'tank') { ctx.ellipse(x, y0 + hh / 2, w * 0.28, hh * 0.24, 0, 0, Math.PI * 2); ctx.stroke(); }
        else { ctx.arc(x, y0 + hh / 2, hh * 0.17, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill(); }
        ctx.lineWidth = t.selected ? 3 : t.flanked || t.noSupply ? 2.6 : 1.6;
        ctx.strokeStyle = t.selected ? '#fff' : t.flanked ? '#e05a47' : t.noSupply ? '#ff9f1c' : INK;
        ctx.strokeRect(x0, y0, w, hh);
        // número de unidades
        const n = String(t.n), r = Math.max(7, hh * 0.42);
        const bx = x0 + w, by = y0;
        ctx.beginPath(); ctx.arc(bx, by, r + (n.length > 2 ? 2 : 0), 0, Math.PI * 2);
        ctx.fillStyle = t.mine ? SIGNAL : '#ebe7d8'; ctx.fill();
        ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
        ctx.fillStyle = INK; ctx.font = font(Math.round(r * (n.length > 2 ? 0.95 : 1.15)), 700);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(n, bx, by + 1);
        ctx.globalAlpha = 1;
    }
}

class GameUI {
    constructor(game) {
        this.game = game;
        this.view = new MapView(game, $('#map'));
        this.selected = -1;
        this.send = emptyUnits();
        this.reachInfo = null;
        this.choice = null;          // nación elegida antes de empezar
        this.tool = 'command';
        this.anchor = -1;            // origen de la obra que se está trazando
        this.tab = 'paises';
        this.drawerOpen = !isMobile();
        this.pending = null;         // obra trazada con el dedo, a la espera de confirmar
        this.touch = false;          // último puntero usado: dedo o ratón
        this.installPrompt = null;
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); this.installPrompt = e; this.renderTop(); });
        window.addEventListener('appinstalled', () => { this.installPrompt = null; this.renderTop(); });
        this.focusNation = null;     // ficha de país abierta en el panel derecho
        this.filter = '';
        this.blocName = '';
        this.blocSecret = false;
        this.seenLog = 0;
        this.prefs = readPrefs();
        this.view.onRealisticReady = () => this.render();
        this.view.onRealisticFailed = () => { this.prefs.view = 'sencilla'; this.view.setMode('sencilla'); this.renderTools(); };
        this.view.setMode(this.prefs.view);
        this.multi = new Set();      // provincias seleccionadas con la herramienta Ciudades
        this.replaying = false;

        this.bindMap();
        document.addEventListener('click', e => this.onAction(e));
        document.addEventListener('input', e => this.onInput(e));
        document.addEventListener('change', e => this.onChange(e));
        document.addEventListener('keydown', e => this.onKey(e));
        $('#import-file').addEventListener('change', async e => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            try { this.setGame(GameEngine.load(JSON.parse(await file.text()))); this.game.log(`Partida importada de ${file.name}.`); }
            catch (err) { this.game.log(`No se pudo importar: ${err.message}`); }
            $('#game-dialog').close();
            this.render();
        });
        if (game.player === null && isMobile()) this.view.fit(0, this.view.h * 0.64);
        else if (game.player === null && this.view.w > 900) this.view.fit(410);
        $('#legend').innerHTML = `<summary>Leyenda</summary><ul>
            <li>${unitIcon('infantry', '#9aa57a')} Infantería &nbsp;${unitIcon('tank', '#9aa57a')} Blindados &nbsp;${unitIcon('artillery', '#9aa57a')} Artillería</li>
            <li><i class="line" style="border-top:3px solid ${SIGNAL}"></i>Autopista: ⅓ de punto por tramo</li>
            <li><i class="line" style="border-top:2px solid #efe9d6"></i>Carretera: ½ punto por tramo</li>
            <li><i class="line" style="border-top:3px solid #e3d9c0"></i>Fortificación</li>
            <li>★ capital &nbsp; ● ciudad &nbsp; A rayas: territorio en disputa (ocupado en guerra)</li>
            <li>Terreno (coste de mover, defensa): ${Object.values(CONFIG.TERRAIN).map(t => `${t.name.toLowerCase()} ${t.cost}${t.def > 1 ? ` ×${String(t.def).replace('.', ',')}` : ''}`).join(', ')}</li>
            <li><i class="line" style="border-top:3px solid #4a86a0"></i>Río: cruzarlo sin carretera cuesta ½ punto más; quien defiende tras él, ×${String(CONFIG.RIVER_DEFENSE).replace('.', ',')}</li>
            <li>Ficha con borde rojo: ejército rodeado por 3 o más lados (más débil y más lento)</li>
            <li>Anillo rojo: ciudad asediada (hay que mantener tropas ${CONFIG.SIEGE_TURNS} turnos para tomarla)</li>
            <li>Con niebla de guerra, en sombra: lo que no ves. Ojo junto a una ciudad: tu espía</li>
            <li>${Object.entries(E.resourceTypes).map(([k, name]) => `${CONFIG.RESOURCE_ICON[k]} ${name}`).join(' &nbsp;')}</li>
            <li>Un yacimiento abastece a su provincia; si una carretera pasa por él, también a las ciudades que una (más renta y tropas más baratas). Más tenue: aún sin carretera</li></ul>`;
        this.render();
    }

    // Sustituye la partida en curso (al cargar).
    setGame(g) {
        game = g;
        this.game = g;
        Object.assign(this.view, { game: g, builtVersion: -1, builtRoads: -1, builtForts: -1, preview: null, hoverNation: -1 });
        this.tool = 'command';
        this.anchor = -1;
        this.choice = g.player;
        this.focusNation = null;
        this.seenLog = g.logs.length;
        if (g.player !== null) this.view.centerOn(g.nations[g.player].capitalCell, 5);
        this.select(g.player !== null ? g.nations[g.player].capitalCell : -1);
    }

    // --- Mapa ---
    // Ratón y pantalla táctil: arrastrar mueve el mapa, la rueda o el pellizco hacen zoom, un toque o clic selecciona.
    bindMap() {
        const c = this.view.canvas;
        const pointers = new Map();
        let drag = null, pinch = null;
        const startDrag = (x, y, moved = false) => { drag = { x, y, ox: this.view.ox, oy: this.view.oy, moved }; };
        c.addEventListener('pointerdown', e => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            c.setPointerCapture(e.pointerId);
            this.touch = e.pointerType !== 'mouse';
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pointers.size === 1) startDrag(e.clientX, e.clientY);
            else if (pointers.size === 2) {
                const [a, b] = [...pointers.values()];
                pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), scale: this.view.scale };
                if (drag) drag.moved = true;
            }
        });
        c.addEventListener('pointermove', e => {
            if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pinch && pointers.size === 2) {
                const [a, b] = [...pointers.values()];
                const r = c.getBoundingClientRect();
                const target = pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
                this.view.zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, target / this.view.scale);
                this.requestDraw();
                return;
            }
            if (drag && pointers.has(e.pointerId)) {
                const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
                if (Math.abs(dx) + Math.abs(dy) > (e.pointerType === 'mouse' ? 4 : 10)) drag.moved = true;
                if (drag.moved) {
                    c.classList.add('dragging');
                    this.view.ox = drag.ox + dx; this.view.oy = drag.oy + dy;
                    this.requestDraw();
                }
            }
            if (e.pointerType === 'mouse') this.hover(e);
        });
        const end = e => {
            const tap = drag && !drag.moved && !pinch && pointers.size === 1 && e.type === 'pointerup';
            pointers.delete(e.pointerId);
            if (pointers.size < 2) pinch = null;
            if (pointers.size === 1) { const [p] = pointers.values(); startDrag(p.x, p.y, true); }   // tras el pellizco sigue arrastrando
            if (pointers.size === 0) {
                if (tap) this.clickCell(this.cellFromEvent(e));
                drag = null;
                c.classList.remove('dragging');
            }
        };
        c.addEventListener('pointerup', end);
        c.addEventListener('pointercancel', end);
        c.addEventListener('contextmenu', e => { e.preventDefault(); this.cancel(); });
        c.addEventListener('wheel', e => {
            e.preventDefault();
            const r = c.getBoundingClientRect();
            this.view.zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.2 : 1 / 1.2);
            this.requestDraw();
        }, { passive: false });
        c.addEventListener('pointerleave', e => {
            if (e.pointerType !== 'mouse') return;
            $('#tooltip').hidden = true;
            this.view.hoverCell = -1;
            this.view.hoverNation = -1;
            this.requestDraw();
        });
    }

    // «colinas, defensa ×1,3, cuesta 2 · río», para la ficha y la información bajo el puntero.
    terrainText(cell) {
        const t = terrainOf(cell), num = x => String(x).replace('.', ',');
        const river = [0, 1, 2, 3, 4, 5].some(d => RIVER[cell * 6 + d]);
        return `${t.name.toLowerCase()}${t.def > 1 ? `, defensa ×${num(t.def)}` : ''}, mover cuesta ${num(t.cost)}${river ? ' · junto a un río (cruzarlo cuesta ½ más y defiende ×' + num(CONFIG.RIVER_DEFENSE) + ')' : ''}`;
    }

    cellFromEvent(e) {
        const r = this.view.canvas.getBoundingClientRect();
        return this.view.cellAtScreen(e.clientX - r.left, e.clientY - r.top);
    }

    requestDraw() {
        if (this.drawPending) return;
        this.drawPending = true;
        requestAnimationFrame(() => { this.drawPending = false; this.view.draw(); });
    }

    toolDef() { return TOOLS.find(t => t.id === this.tool); }

    planTo(cell) {
        const g = this.game, t = this.toolDef();
        if (this.tool === 'command' || this.tool === 'cities' || this.anchor < 0 || cell < 0 || !isLand(cell) || g.owner[cell] !== g.player) return null;
        if (this.tool === 'fort') return g.planFort(g.player, this.anchor, cell);
        if (cell === this.anchor) return null;
        return g.planRoad(g.player, this.anchor, c => c === cell, t.cls);
    }

    hover(e) {
        const g = this.game, cell = this.cellFromEvent(e), tip = $('#tooltip');
        if (cell !== this.view.hoverCell) {
            this.view.hoverCell = cell;
            if (this.tool !== 'command') {
                const plan = this.planTo(cell);
                this.view.preview = plan ? { ...plan, affordable: plan.cost <= g.nations[g.player].gold } : null;
            }
            const hn = g.player === null && cell >= 0 && isLand(cell) ? g.owner[cell] : -1;
            this.view.hoverNation = hn;
            this.requestDraw();
        }
        if (cell < 0 || !isLand(cell)) { tip.hidden = true; return; }
        const p = PROVINCES[G.prov[cell]], o = g.owner[cell], a = g.armyOn(cell), res = RESOURCE_AT.get(cell);
        const lines = [`<b>${esc(p.name)}</b>${g.isDisputed(cell) ? ` <span class="muted">(en disputa: es de ${g.nm(g.legal[cell])})</span>` : ''}`,
            `<span style="color:${g.nations[o].color}">■</span> ${g.nm(o)}${g.player !== null && o !== g.player ? ` ${this.relationChip(o)}` : ''}`];
        if (CITY_OF[cell] >= 0) lines.push(`${CAPITAL_OF[cell] >= 0 ? '★ Capital' : '● Ciudad'}: ${esc(p.cityName)}`);
        if (res) {
            const reach = g.resourceReach(res).length;
            lines.push(`${CONFIG.RESOURCE_ICON[res.type]} ${res.typeName} de ${esc(res.name)}: +${res.value} de oro, ${reach ? `abastece a su provincia y a ${plural(reach, 'otra', 'otras')}` : 'abastece solo a su provincia'}`);
        }
        lines.push(`<span class="muted">${this.terrainText(cell)}</span>`);
        const supply = g.provinceSupply(G.prov[cell]);
        if (supply.length) lines.push(`Abastecida por ${supply.map(r => CONFIG.RESOURCE_ICON[r.type]).join('')}: +${Math.round(100 * Math.min(CONFIG.RESOURCE_INDUSTRY_MAX, CONFIG.RESOURCE_INDUSTRY * supply.length))} % de renta`);
        const sg = g.sieges.get(cell);
        if (sg) lines.push(`<span class="warn-text">Asediada por ${g.nm(sg.by)}: ${sg.held} de ${CONFIG.SIEGE_TURNS} turnos</span>`);
        if (g.fort[cell]) lines.push(`Fortificada: defensa ×${CONFIG.FORT_DEFENSE}`);
        else if (g.fortWork.has(cell)) lines.push(`Fortificando: ${plural(g.fortWork.get(cell).left, 'turno', 'turnos')}`);
        if (!g.sees(g.player, cell)) lines.push('<span class="muted">Niebla de guerra: no sabes qué tropas hay</span>');
        else if (a) {
            lines.push(`Ejército de ${g.nm(a.owner)}: ${this.unitsLong(a.units)}`);
            const sides = g.hostileSides(a.owner, cell);
            if (sides >= CONFIG.FLANKED_SIDES) lines.push(`<span class="warn-text">${sides >= CONFIG.SURROUNDED_SIDES ? 'Cercado' : 'Rodeado'} por ${sides} lados: ataque y defensa ×${g.flankFactor(a.owner, cell)}</span>`);
        }
        if (g.spies.has(G.prov[cell])) lines.push('Tienes un espía en esta provincia');
        if (g.player !== null && o === g.player && !g.inSupply(g.player, cell)) lines.push('<span style="color:#ffb347">Sin suministro</span>');
        if (this.reachInfo?.attacks.has(cell) && a) {
            const mine = this.selectedArmy();
            const fx = g.combatFactors(g.player, this.send, this.reachInfo.from.get(cell) ?? mine.cell, a, cell);
            const chance = g.winChance(fx.atk, fx.dfn), r = fx.atk / fx.dfn, n = countUnits(this.send);
            const winLeft = Math.round(n * (1 - Math.min(1, 0.3 / r))), loseLeft = Math.round(n * (1 - Math.min(1, 0.35 + 0.35 * (1 / r - 1))));
