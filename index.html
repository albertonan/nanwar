            ctx.globalAlpha = 1;
        }
        for (const k of ids) for (const [o, path] of this.stripes[k]) {
            const pat = this.stripePattern(g.nations[o].color, ctx);
            pat.setTransform(new DOMMatrix([px, 0, 0, px, 0, 0]));   // franjas del mismo grosor a cualquier zoom
            ctx.fillStyle = pat;
            ctx.fill(path);
        }
        if (fog) {
            ctx.fillStyle = 'rgba(12,16,14,0.5)';
            for (const k of ids) if (this.fog[k]) ctx.fill(this.fog[k]);
        }
        if (real) return;
        const stroke = (list, style, w) => { ctx.strokeStyle = style; ctx.lineWidth = w * px; for (const k of ids) if (list[k]) ctx.stroke(list[k]); };
        stroke(this.coast, '#5c8197', 1);
        stroke(this.borders, INK, 1.9);
    }

    // Imagen del mapa entero con las capas planas, para dibujarlas de lejos de una vez. Se rehace cuando cambian los
    // dueños, la niebla o la vista.
    flatLayer(real, fog) {
        const key = `${this.builtVersion}:${fog ? this.fogKey : '-'}:${real}:${this.dpr}`;
        if (this.flat?.key === key) return this.flat.c;
        const c = this.flat?.c ?? document.createElement('canvas');
        c.width = Math.ceil(G.width * FLAT_RES); c.height = Math.ceil(G.height * FLAT_RES);
        const x = c.getContext('2d');
        x.setTransform(FLAT_RES, 0, 0, FLAT_RES, -(G.x0 - G.W / 2) * FLAT_RES, -(G.y0 - G.S) * FLAT_RES);
        this.drawLayers(x, CHUNKS.all, real, fog, this.dpr / FLAT_RES);
        this.flat = { key, c };
        return c;
    }

    // Rayas diagonales del color del ocupante, con un filete oscuro para que se lean sobre cualquier color.
    stripePattern(color, ctx = this.ctx) {
        this.patterns ??= new Map();
        if (!this.patterns.has(color)) {
            const c = document.createElement('canvas');
            c.width = c.height = 10;
            const x = c.getContext('2d');
            const line = (w, style) => {
                x.strokeStyle = style; x.lineWidth = w; x.beginPath();
                for (const o of [-10, 0, 10]) { x.moveTo(o - 1, 11); x.lineTo(o + 11, -1); }
                x.stroke();
            };
            line(4.6, 'rgba(21,26,18,0.55)');
            line(3, color);
            this.patterns.set(color, ctx.createPattern(c, 'repeat'));
        }
        return this.patterns.get(color);
    }

    nationPath(id) {
        if (!this.nationPaths.has(id)) {
            const p = new Path2D();
            for (const i of G.land) if (this.game.owner[i] === id) this.hexPath(p, i);
            this.nationPaths.set(id, p);
        }
        return this.nationPaths.get(id);
    }

    draw() {
        const g = this.game, ctx = this.ctx, s = this.scale, dpr = this.dpr;
        if (this.builtVersion !== g.version) this.buildDynamic();
        if (this.builtRoads !== g.roadVersion) this.buildRoads();
        if (this.builtForts !== this.fortKey()) this.buildForts();
        const hexPx = G.S * s, now = performance.now();
        this.motion.consume(now);
        const real = this.isRealistic();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = real ? '#2a5670' : '#16232b';
        ctx.fillRect(0, 0, this.w, this.h);

        ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * this.ox, dpr * this.oy);
        if (real) this.realistic.drawWorld(ctx, now);
        // Colores, disputas, niebla y fronteras: de lejos, desde la imagen del mapa entero; de cerca, solo los trozos a la vista.
        const fog = this.updateFog();
        if (s * dpr <= FLAT_RES * 1.3) {
            const c = this.flatLayer(real, fog);
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(c, G.x0 - G.W / 2, G.y0 - G.S, c.width / FLAT_RES, c.height / FLAT_RES);
        } else this.drawLayers(ctx, this.visibleChunks(), real, fog, 1 / s);
        // Límites de provincia (vista sencilla), aparte porque solo se ven a partir de cierto zoom.
        if (!real && hexPx >= 3) {
            ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.7 / s;
            for (const k of this.visibleChunks()) if (this.provBorders[k]) ctx.stroke(this.provBorders[k]);
        }
        if (this.hoverNation >= 0) { ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill(this.nationPath(this.hoverNation)); }

        if (this.showSupply && g.player !== null) {
            const sup = g.supplyMap(g.player), out = new Path2D();
            for (const i of G.land) if (g.owner[i] === g.player && sup[i] < 0) this.hexPath(out, i);
            ctx.fillStyle = 'rgba(255,150,30,0.5)'; ctx.fill(out);
            ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,150,30,0.9)'; ctx.lineWidth = 4 / s; ctx.stroke(this.cutMine().path);   // tramos rotos propios
        }
        if (this.highlight) {
            const mv = new Path2D(), at = new Path2D();
            for (const c of this.highlight.moves) this.hexPath(mv, c);
            for (const c of this.highlight.attacks) this.hexPath(at, c);
            if (real) {
                // Alcance: velo claro y contorno discontinuo de toda la zona, sin dibujar cada casilla
                if (this.reachEdges?.src !== this.highlight) {
                    const edge = new Path2D(), inside = new Set([...this.highlight.moves, this.selectedCell]);
                    for (const c of inside) for (let d = 0; d < 6; d++) { const j = G.nb[c * 6 + d]; if (j < 0 || !inside.has(j)) this.edge(edge, c, d); }
                    this.reachEdges = { src: this.highlight, edge };
                }
                ctx.fillStyle = 'rgba(255,248,220,0.24)'; ctx.fill(mv);
                ctx.strokeStyle = 'rgba(255,250,232,0.95)'; ctx.lineWidth = 1.5 / s;
                ctx.setLineDash([4 / s, 3 / s]); ctx.stroke(this.reachEdges.edge); ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(224,90,71,0.32)'; ctx.fill(at);
                ctx.strokeStyle = '#e05a47'; ctx.lineWidth = 2 / s; ctx.stroke(at);
            } else {
                ctx.fillStyle = 'rgba(143,209,107,0.42)'; ctx.fill(mv);
                ctx.fillStyle = 'rgba(224,90,71,0.7)'; ctx.fill(at);
            }
        }

        if (this.airPick) this.drawAirPick(ctx, s);
        this.drawSatAreas(ctx, s);

        if (!real) {
        // Carreteras
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(21,26,18,0.6)'; ctx.lineWidth = Math.min(3.6, 1.4 + hexPx * 0.12) / s;
        ctx.stroke(this.roads[1]);
        ctx.strokeStyle = '#efe9d6'; ctx.lineWidth = Math.min(1.8, 0.6 + hexPx * 0.07) / s;
        ctx.stroke(this.roads[1]);
        ctx.strokeStyle = 'rgba(21,26,18,0.7)'; ctx.lineWidth = Math.min(5, 2 + hexPx * 0.16) / s;
        ctx.stroke(this.roads[2]);
        ctx.strokeStyle = SIGNAL; ctx.lineWidth = Math.min(2.8, 1 + hexPx * 0.1) / s;
        ctx.stroke(this.roads[2]);
        this.strokeCuts(ctx, s, hexPx);
        }

        // Fortificaciones, con el material de su nivel
        for (const [k, gr] of this.fortGroups) {
            const st = FORT_STYLE[k];
            ctx.fillStyle = k === 'unk' ? this.hatchPattern(s) : st.fill; ctx.fill(gr.fill);
            ctx.strokeStyle = st.dark; ctx.lineWidth = st.wall[0] / s; ctx.stroke(gr.walls);
            ctx.strokeStyle = st.light; ctx.lineWidth = st.wall[1] / s; ctx.stroke(gr.walls);
            if (k === 3) { ctx.lineWidth = 1.2 / s; ctx.stroke(gr.inner); }
        }
        if (hexPx >= 7) for (const c of this.bunkers) {   // búnker con tronera en el centro de la casilla
            const r = G.S * 0.34, bx = G.cx[c], by = G.cy[c] + r * 0.45;
            ctx.beginPath(); ctx.arc(bx, by, r, Math.PI, 0); ctx.closePath();
            ctx.fillStyle = '#a3a9ae'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.2 / s; ctx.stroke();
            ctx.fillStyle = INK; ctx.fillRect(bx - r * 0.55, by - r * 0.55, r * 1.1, r * 0.22);
        }
        ctx.setLineDash([3 / s, 2 / s]);
        ctx.strokeStyle = '#e3d9c0'; ctx.lineWidth = 1.5 / s; ctx.stroke(this.works);
        ctx.setLineDash([]);

        if (this.preview) {
            const p = new Path2D();
            const ok = this.preview.affordable ? '#8fd16b' : '#e05a47';
            if (this.preview.cls === 'fort') {
                for (const c of this.preview.path) this.hexPath(p, c);
                ctx.fillStyle = this.preview.affordable ? 'rgba(143,209,107,0.35)' : 'rgba(224,90,71,0.4)';
                ctx.fill(p);
                ctx.strokeStyle = ok; ctx.lineWidth = 1.5 / s; ctx.stroke(p);
            } else {
                this.preview.path.forEach((c, i) => (i ? p.lineTo(G.cx[c], G.cy[c]) : p.moveTo(G.cx[c], G.cy[c])));
                ctx.setLineDash([5 / s, 3 / s]);
                ctx.strokeStyle = ok;
                ctx.lineWidth = 3.2 / s;
                ctx.stroke(p);
                ctx.setLineDash([]);
            }
        }

        if (this.stretch) {   // tramo de carretera elegido para pasarlo a autopista
            const p = new Path2D();
            for (const [u, d] of this.stretch.edges) { const v = G.nb[u * 6 + d]; p.moveTo(G.cx[u], G.cy[u]); p.lineTo(G.cx[v], G.cy[v]); }
            ctx.lineCap = 'round';
            ctx.strokeStyle = INK; ctx.lineWidth = 6 / s; ctx.stroke(p);
            ctx.setLineDash([6 / s, 4 / s]); ctx.strokeStyle = SIGNAL; ctx.lineWidth = 3.4 / s; ctx.stroke(p); ctx.setLineDash([]);
        }
        if (this.hoverCell >= 0 && isLand(this.hoverCell) && this.hoverCell !== this.selectedCell) {
            const p = new Path2D(); this.hexPath(p, this.hoverCell);
            ctx.strokeStyle = real ? 'rgba(255,252,240,0.7)' : 'rgba(255,255,255,0.75)'; ctx.lineWidth = (real ? 1.1 : 1.4) / s; ctx.stroke(p);
        }
        if (this.multi?.size) {
            const p = new Path2D();
            for (const c of this.multi) this.hexPath(p, c);
            ctx.strokeStyle = INK; ctx.lineWidth = 5 / s; ctx.stroke(p);
            ctx.strokeStyle = SIGNAL; ctx.lineWidth = 2.6 / s; ctx.stroke(p);
        }
        if (this.selectedCell >= 0) {
            const p = new Path2D(); this.hexPath(p, this.selectedCell);
            ctx.strokeStyle = INK; ctx.lineWidth = 4.5 / s; ctx.stroke(p);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2 / s; ctx.stroke(p);
        }

        // Capa en píxeles de pantalla: recursos, ciudades, ejércitos, rótulos.
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const visible = (x, y, m = 40) => x > -m && y > -m && x < this.w + m && y < this.h + m;
        const font = (size, weight = 600) => `${weight} ${size}px 'Barlow Semi Condensed', Bahnschrift, 'Arial Narrow', sans-serif`;

        // De lejos (casillas de menos de FAR_HEX píxeles) solo se ven las capitales: ni ciudades, ni yacimientos, ni
        // más ejércitos que los tuyos, los de tus enemigos en guerra y los que se están moviendo.
        const far = hexPx < FAR_HEX;
        if (!far) for (const r of RESOURCES) {
            const [x, y] = this.toScreen(G.cx[r.cell], G.cy[r.cell]);
            if (!visible(x, y)) continue;
            const rad = Math.max(4, Math.min(11, hexPx * 0.9));
            ctx.globalAlpha = g.resourceLinked(r) ? 1 : 0.7;
            ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
            ctx.fillStyle = CONFIG.RESOURCE_COLOR[r.type]; ctx.fill();
            ctx.lineWidth = 1.5; ctx.strokeStyle = g.nations[g.owner[r.cell]].color; ctx.stroke();
            if (rad >= 6) {
                ctx.font = `${Math.round(rad * 1.2)}px sans-serif`;
                ctx.fillStyle = '#fff';
                ctx.fillText(CONFIG.RESOURCE_ICON[r.type], x, y + 1);
            }
            ctx.globalAlpha = 1;
        }

        for (const p of PROVINCES) {
            const [x, y] = this.toScreen(G.cx[p.city], G.cy[p.city]);
            if (!visible(x, y)) continue;
            if (CAPITAL_OF[p.city] >= 0) {
                ctx.font = `bold ${Math.max(11, Math.min(17, hexPx * 1.6))}px sans-serif`;
                ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.strokeText('★', x, y);
                ctx.fillStyle = SIGNAL; ctx.fillText('★', x, y);
            } else if (!far && !(real && hexPx >= 9)) {   // en la vista realista, de cerca se ven sus casas
                ctx.beginPath(); ctx.arc(x, y, Math.max(1.6, Math.min(3.5, hexPx * 0.35)), 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.stroke();
            }
        }

        // Asedios: anillo rojo discontinuo y turnos que lleva
        if (g.player !== null) for (const [c, sg] of g.sieges) {
            if (!g.sees(g.player, c)) continue;
            const [x, y] = this.toScreen(G.cx[c], G.cy[c]);
            if (!visible(x, y)) continue;
            const r = Math.max(7, hexPx * 1.25);
            ctx.setLineDash([4, 3]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#e05a47';
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
            if (hexPx >= 5) {
                ctx.font = font(11, 700); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = '#ffb3a8';
                const label = `${sg.held}/${g.rules(sg.by).siegeTurns}`;
                ctx.strokeText(label, x, y - r - 7); ctx.fillText(label, x, y - r - 7);
            }
        }

        // Espías del jugador: un ojo junto a la ciudad de la provincia
        for (const [pid, s] of g.spies) {
            const c = PROVINCES[pid].city, [x, y] = this.toScreen(G.cx[c], G.cy[c]);
            if (!visible(x, y)) continue;
            const r = Math.max(6, Math.min(10, hexPx * 0.8)), ex = x - Math.max(10, hexPx * 1.1), ey = y;
            ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2);
            ctx.fillStyle = s.revealedTurn === g.turn ? SIGNAL : '#ebe7d8'; ctx.fill();
            ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.62, r * 0.36, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(ex, ey, r * 0.2, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
        }

        const air = this.marks();
        if (!far) this.drawAir(air, hexPx, font, real, visible, false);

        if (g.player !== null && !g.over) { this.drawOps(hexPx, font); if (this.showOps) this.drawOrders(hexPx, font); }

        // Ejércitos: fichas OTAN en la vista sencilla, miniaturas en la realista. Mientras se mueven, siguen su camino.
        const tokens = [];
        const seen = (wx, wy, cell) => { const c = G.cellAt(wx, wy); return g.sees(g.player, c >= 0 ? c : cell); };
        // Embarcado según la casilla donde se dibuja: a medio camino, la ficha cambia al entrar o salir del mar.
        const onSea = (wx, wy, cell) => { const c = G.cellAt(wx, wy); return afloat(c >= 0 ? c : cell); };
        // Antes de elegir país no se enseñan las fuerzas de nadie.
        if (g.player !== null) for (const a of g.armies.values()) {
            if (g.armyOn(a.cell) !== a) continue;
            const pose = this.motion.pose(a.id, now);
            const wx = pose ? pose.x : G.cx[a.cell], wy = pose ? pose.y : G.cy[a.cell];
            const [sx, sy] = this.toScreen(wx, wy);
            if (!visible(sx, sy)) continue;
            if (far && !pose?.moving && a.owner !== g.player && !g.atWar(g.player, a.owner)) continue;
            if (far && this.showOps && a.owner === g.player && a.op && g.ops.has(a.op) && !pose?.moving) continue;   // de lejos, una ficha por operación
            if (!seen(wx, wy, a.cell)) continue;
            const mine = a.owner === g.player, sea = afloat(a.cell);   // embarcado: ni suministro ni rodeo
            const view = g.armyView(g.player, a);
            tokens.push({ id: a.id, owner: a.owner, type: view.type, n: view.n, echelon: view.echelon, level: view.level, wx, wy, mine,
                spent: mine && g.mp(a) === 0, noSupply: mine && !sea && !g.inSupply(a.owner, a.cell),
                flanked: !sea && g.hostileSides(a.owner, a.cell) >= CONFIG.FLANKED_SIDES, starving: g.starving(a.owner, a.cell), selected: a.cell === this.selectedCell && !pose?.moving,
                moving: !!pose?.moving, facing: this.motion.facingOf(a.id, pose), afloat: onSea(wx, wy, a.cell), alpha: 1 });
        }
        if (g.player !== null) for (const gh of this.motion.ghosts(now)) {
            if (!seen(gh.p.x, gh.p.y, gh.tr.cells[gh.tr.cells.length - 1])) continue;
            const k = g.intel(g.player, gh.tr.owner, gh.tr.cells[gh.tr.cells.length - 1]);
            tokens.push({ id: gh.id, owner: gh.tr.owner, type: k.exact ? gh.tr.type : null, n: k.exact ? gh.tr.n : null, echelon: echelonOf(gh.tr.n).mark,
                level: k.levels && k.exact ? g.techLevel(gh.tr.owner, UNIT_BRANCH[gh.tr.type]) : null, wx: gh.p.x, wy: gh.p.y, mine: gh.tr.owner === g.player,
                moving: gh.p.moving, facing: this.motion.facingOf(gh.id, gh.p), afloat: onSea(gh.p.x, gh.p.y, gh.tr.cells[gh.tr.cells.length - 1]), alpha: 1 });
        }
        for (const f of this.motion.fx) {   // quien cae en combate se desvanece al terminar el choque
            for (const [id, owner, type, n, cell] of [[f.def, f.defOwner, f.defType, f.defN, f.cell], [f.att, f.attOwner, f.attType, f.attN, f.from]]) {
                if (g.armies.has(id) || now < f.start || this.motion.tracks.has(id) || !g.sees(g.player, cell)) continue;
                const alpha = now < f.end ? 1 : Math.max(0, 1 - (now - f.end) / 500);
                const k = g.intel(g.player, owner, cell);
                tokens.push({ id, owner, type: k.exact ? type : null, n: k.exact ? n : null, echelon: echelonOf(n).mark,
                    level: k.levels && k.exact ? g.techLevel(owner, UNIT_BRANCH[type]) : null, wx: G.cx[cell], wy: G.cy[cell], mine: owner === g.player, facing: 1, afloat: afloat(cell), alpha });
            }
        }
        if (real) tokens.sort((p, q) => p.wy - q.wy);
        for (const t of tokens) {
            let [x, y] = this.toScreen(t.wx, t.wy);
            if (!visible(x, y)) continue;
            const sh = this.motion.shake(t.id, now);
            if (sh) { x += sh[0]; y += sh[1]; }
            if (real) this.realistic.drawArmy(ctx, { ...t, x, y, hexPx, color: g.nations[t.owner].color, now });
            else this.drawCounter(t, x, y, hexPx, font);
        }
        if (!far) this.drawAir(air, hexPx, font, real, visible, true);   // las patrullas vuelan por encima
        this.drawSats(hexPx, font, visible);   // encima de todo y también de lejos: el círculo que vigila es grande
        drawAirTrails(ctx, this, now);
        this.motion.effects(now);
        this.motion.drawParticles(ctx, this, now);

        if (hexPx >= 7) {
            ctx.font = font(Math.round(Math.min(15, 10 + hexPx * 0.2)));
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(21,26,18,0.9)'; ctx.fillStyle = '#f3efe2';
            for (const p of PROVINCES) {
                const [x, y] = this.toScreen(G.cx[p.city], G.cy[p.city]);
                if (!visible(x, y, 100)) continue;
                ctx.strokeText(p.cityName, x, y + hexPx * 1.1 + 7);
                ctx.fillText(p.cityName, x, y + hexPx * 1.1 + 7);
            }
        } else {
            // Nombres de país, de mayor a menor; se omite el que se solaparía con uno ya dibujado.
            const placed = [];
            for (const l of [...this.labels].sort((a, b) => b.n - a.n)) {
                if (l.n < 25) continue;
                const [x, y] = this.toScreen(l.x, l.y);
                if (!visible(x, y, 100)) continue;
                const size = Math.max(10, Math.min(20, Math.sqrt(l.n) * hexPx * 0.38));
                ctx.font = font(Math.round(size), 700);
                const t = g.nations[l.id].name;
                const w = ctx.measureText(t).width / 2 + 2, h = size / 2 + 1;
                if (placed.some(r => Math.abs(r.x - x) < r.w + w && Math.abs(r.y - y) < r.h + h)) continue;
                placed.push({ x, y, w, h });
                ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(21,26,18,0.85)'; ctx.fillStyle = '#fff';
                ctx.strokeText(t, x, y); ctx.fillText(t, x, y);
            }
        }
        if (this.motion.active(now)) this.requestFrame();
    }

    // Operaciones del jugador como calcos tácticos: flecha de eje de avance (ofensiva), línea fortificada con almenas
    // hacia el enemigo (defensa) y zona de reunión discontinua (reserva); un anillo de su color bajo cada ejército
    // asignado. También el trazado que se está dibujando y, al confirmar las asistidas, sus movimientos propuestos.
    drawOps(hexPx, font) {
        const g = this.game, ctx = this.ctx, ui = this.ui;
        const scr = c => this.toScreen(G.cx[c], G.cy[c]);
        const list = !this.showOps ? [] : g.opsOf(g.player).map(op => ({ op, kind: op.kind, cells: op.cells, color: opColor(op), name: op.name, dim: op.paused }));
        if (this.showOps) for (const op of g.knownEnemyOps(g.player)) list.push({ kind: 'ofensiva', cells: op.cells, color: '#e05a47', name: `${op.name} (${g.nm(op.owner)})`, enemy: true });
        // Líneas replegadas: la dibujada, tenue, y la flecha de repliegue; en las manuales, el repliegue que harían.
        if (this.showOps) for (const op of g.opsOf(g.player)) {
            if (op.kind !== 'defensa' || op.paused) continue;
            const hint = op.auto === 'manual' ? ui?.defenseHint(op) : null;
            if (hint?.state === 'repliega') list.push({ kind: 'repliegue', from: op.cells, cells: hint.cells, color: opColor(op), hint: true });
            else if (op.drawn && op.drawn.join() !== op.cells.join()) list.push({ kind: 'repliegue', from: op.drawn, cells: op.cells, color: opColor(op) });
        }
        if (ui?.opPreview?.length) list.push({ kind: 'defensa', cells: ui.opPreview, color: '#ffffff', name: 'Línea propuesta', draft: true });
        const d = ui?.opDraft;
        if (d?.cells.length) list.push({ kind: d.kind, cells: d.cells, color: '#ffffff', name: d.redraw ? 'Nuevo trazado' : 'Nueva operación', draft: true });
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const labels = [];
        for (const it of list) {
            const pts = it.cells.map(scr);
            ctx.globalAlpha = it.dim ? 0.45 : 1;
            if (it.kind === 'ofensiva' && pts.length >= 2) {
                const w = Math.max(9, Math.min(30, hexPx * 1.3));
                const path = arrowOutline(smoothLine(pts), w * 0.8, w, w * 1.5, w * 2.3);
                ctx.fillStyle = it.color; ctx.globalAlpha *= it.draft ? 0.18 : 0.32; ctx.fill(path); ctx.globalAlpha = it.dim ? 0.45 : 1;
                ctx.strokeStyle = 'rgba(21,26,18,0.85)'; ctx.lineWidth = 4; ctx.stroke(path);
                ctx.strokeStyle = it.color; ctx.lineWidth = 2; if (it.draft) ctx.setLineDash([6, 4]); ctx.stroke(path); ctx.setLineDash([]);
                const [ox, oy] = pts[pts.length - 1], rr = Math.max(14, hexPx * 1.8);   // objetivo
                ctx.beginPath(); ctx.ellipse(ox, oy, rr * 1.15, rr * 0.85, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(21,26,18,0.8)'; ctx.lineWidth = 4; ctx.stroke(); ctx.strokeStyle = '#ff8a78'; ctx.lineWidth = 2; ctx.stroke();
                labels.push({ x: ox, y: oy - rr * 0.85 - 9, text: 'OBJ', color: '#ff8a78' });
                const m = pts[Math.floor((pts.length - 1) / 2)], n2 = pts[Math.min(pts.length - 1, Math.floor((pts.length - 1) / 2) + 1)];
                labels.push({ x: (m[0] + n2[0]) / 2, y: (m[1] + n2[1]) / 2 - w * 1.2 - 4, text: it.name, color: it.color });
            } else if (it.kind === 'defensa') {
                ctx.beginPath(); pts.forEach(([x, y], i) => (i && G.dirTo(it.cells[i - 1], it.cells[i]) >= 0 ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
                if (pts.length === 1) { ctx.arc(pts[0][0], pts[0][1], 3, 0, Math.PI * 2); }
                ctx.strokeStyle = 'rgba(21,26,18,0.85)'; ctx.lineWidth = 5; ctx.stroke();
                ctx.strokeStyle = it.color; ctx.lineWidth = 2.4; if (it.draft) ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
                // Almenas hacia el lado del enemigo (o de fuera de tu territorio)
                const step = Math.max(5, Math.min(12, hexPx * 0.55)), h = step * 0.8;
                ctx.beginPath();
                for (let i = 0; i < it.cells.length - 1; i++) {
                    const a = it.cells[i], b = it.cells[i + 1], [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
                    const len = Math.hypot(x1 - x0, y1 - y0); if (len < 1 || G.dirTo(a, b) < 0) continue;
                    let nx = -(y1 - y0) / len, ny = (x1 - x0) / len;
                    const wx = (G.cx[a] + G.cx[b]) / 2, wy = (G.cy[a] + G.cy[b]) / 2, side = G.cellAt(wx + nx * G.S * 1.6, wy + ny * G.S * 1.6);
                    if (side >= 0 && isLand(side) && g.owner[side] === g.player) { nx = -nx; ny = -ny; }
                    const k = Math.max(2, Math.round(len / step));
                    for (let j = 0; j < k; j += 2) {
                        const t0 = j / k, t1 = Math.min(1, (j + 1) / k);
                        const ax = x0 + (x1 - x0) * t0, ay = y0 + (y1 - y0) * t0, bx = x0 + (x1 - x0) * t1, by = y0 + (y1 - y0) * t1;

                ctx.strokeStyle = 'rgba(21,26,18,0.85)'; ctx.lineWidth = 4; ctx.stroke(); ctx.strokeStyle = it.color; ctx.lineWidth = 2; ctx.stroke();
                const m = pts[Math.floor(pts.length / 2)];
                labels.push({ x: m[0], y: m[1] - Math.max(16, hexPx * 1.4), text: it.name, color: it.color });
            } else if (it.kind === 'repliegue') {
                // La línea de la que sale, discontinua y tenue (o la que tomaría, si es una sugerencia), y la flecha de
                // repliegue de APP-6: eje discontinuo hacia atrás con la letra W.
                const line = it.hint ? it.cells : it.from, lp = line.map(scr);
                ctx.globalAlpha = 0.55;
                ctx.beginPath(); lp.forEach(([x, y], i) => (i && G.dirTo(line[i - 1], line[i]) >= 0 ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
                ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(21,26,18,0.8)'; ctx.lineWidth = 4; ctx.stroke(); ctx.strokeStyle = it.color; ctx.lineWidth = 2; ctx.stroke();
                // Del centro de una línea al de la otra, sin llegar a tapar las fichas de la nueva.
                const [ax, ay] = scr(it.from[Math.floor(it.from.length / 2)]), [cx, cy] = scr(it.cells[Math.floor(it.cells.length / 2)]);
                const bx = ax + (cx - ax) * 0.8, by = ay + (cy - ay) * 0.8, len = Math.hypot(bx - ax, by - ay);
                if (len > 8) {
                    const ux = (bx - ax) / len, uy = (by - ay) / len, hw = Math.max(5, Math.min(10, hexPx * 0.6));
                    ctx.globalAlpha = it.hint ? 0.6 : 0.9;
                    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx - ux * hw, by - uy * hw);
                    ctx.strokeStyle = 'rgba(21,26,18,0.8)'; ctx.lineWidth = 4; ctx.stroke(); ctx.strokeStyle = it.color; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
                    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - ux * hw * 1.6 - uy * hw, by - uy * hw * 1.6 + ux * hw); ctx.lineTo(bx - ux * hw * 1.6 + uy * hw, by - uy * hw * 1.6 - ux * hw); ctx.closePath();
                    ctx.fillStyle = it.color; ctx.fill(); ctx.strokeStyle = 'rgba(21,26,18,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
                    labels.push({ x: ax + (bx - ax) * 0.3 - uy * 14, y: ay + (by - ay) * 0.3 + ux * 14, text: it.hint ? 'W?' : 'W', color: it.color });

            if (!it.op) continue;
            const members = g.opMembers(it.op);
            if (!members.length) continue;
            const units = emptyUnits();
            let wx = 0, wy = 0;
            for (const a of members) { for (const k of UNIT_KEYS) units[k] += a.units[k] || 0; wx += G.cx[a.cell]; wy += G.cy[a.cell]; }
            const [x, y] = this.toScreen(wx / members.length, wy / members.length), n = countUnits(units);
            if (x < -40 || y < -40 || x > this.w + 40 || y > this.h + 40) continue;
            this.drawCounter({ owner: g.player, type: dominantType(units), n, echelon: echelonOf(n).mark, level: 0, mine: true, alpha: 1 }, x, y, 12, font);
            ctx.strokeStyle = it.color; ctx.lineWidth = 2.5; ctx.strokeRect(x - 15, y - 11, 30, 19);
            labels.push({ x, y: y + 20, text: it.name, color: it.color });

        // cada base al blanco.

            const pts = cells.map(scr);

            ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));

            ctx.setLineDash([6, 4]); ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.stroke(); ctx.setLineDash([]);

            ctx.fillStyle = l.color; ctx.fillText(l.text, l.x, l.y);
        }
    }

    // Órdenes de varios turnos de tus ejércitos: camino discontinuo hasta el destino (rojo si es para atacar, punteado si
    // sigue a otro ejército) con los turnos que faltan; «mantener» y «fortificar» como rótulo bajo la ficha.
    drawOrders(hexPx, font) {
        const g = this.game, ctx = this.ctx, sel = this.selectedCell >= 0 ? g.armyOn(this.selectedCell) : null;
        const pills = [];
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (const a of g.armies.values()) {
            const o = a.order;
            if (!o || a.owner !== g.player || g.armyOn(a.cell) !== a || this.motion.tracks.has(a.id)) continue;
            const [ax, ay] = this.toScreen(G.cx[a.cell], G.cy[a.cell]);
            if (o.kind === 'hold' || o.kind === 'fortify') {
                if (hexPx >= 10) pills.push({ x: ax, y: ay, side: -1, text: o.kind === 'hold' ? 'mantener' : 'fortificar', dark: true });
                continue;
            }
            if (o.path?.[0] !== a.cell) g.refreshOrder(a);
            if (!o.path || o.path.length < 2) continue;
            const pts = o.path.map(c => this.toScreen(G.cx[c], G.cy[c]));
            if (pts.every(([x, y]) => x < -50 || y < -50 || x > this.w + 50 || y > this.h + 50)) continue;

            ctx.strokeStyle = 'rgba(21,26,18,0.8)'; ctx.lineWidth = isSel ? 5 : 3.5; ctx.stroke();
            ctx.setLineDash(o.kind === 'follow' ? [1.5, 5] : [8, 5]);

            ctx.setLineDash([]);

            const ang = Math.atan2(y1 - y0, x1 - x0), L = isSel ? 11 : 8;

            ctx.moveTo(x1, y1); ctx.lineTo(x1 - L * Math.cos(ang - 0.45), y1 - L * Math.sin(ang - 0.45)); ctx.lineTo(x1 - L * Math.cos(ang + 0.45), y1 - L * Math.sin(ang + 0.45)); ctx.closePath();
            ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
            ctx.globalAlpha = 1;

        }

        for (const p of pills) {   // al lado de la ficha: a la izquierda las de quedarse, a la derecha los turnos
            const w = ctx.measureText(p.text).width + 12;

            ctx.beginPath(); ctx.roundRect(p.x - w / 2, p.y - 8, w, 16, 8);

            ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.stroke();
            ctx.fillStyle = p.dark ? '#ebe7d8' : INK; ctx.fillText(p.text, p.x, p.y + 1);
        }
    }

    // --- Aviación en el mapa ---
    // Lo que cambia las marcas de la aviación: escuadrones, aeródromos y antiaéreos, el turno, el país del jugador, los
    // espías, la investigación, los dueños, los ejércitos (lo que se ve) y las fortificaciones.
    airKey() {
        const g = this.game;
        return `${g.airVersion}:${g.turn}:${g.player}:${g.spyVersion}:${g.techVersion}:${g.version}:${g.armyVersion}:${g.fortVersion}`;
    }
    marks() {
        if (this.airFor !== this.game || this.airBuilt !== this.airKey()) this.buildAir();
        return this.airMarks;
    }
    // Las marcas de la aviación que ve el jugador; la niebla se decide aquí:

    //   es tuyo o de un aliado o si la información de la casilla es exacta; si no, null;
    // - escuadrones en tierra (`sq`): los de un aeródromo del que sabes cuántos tiene, sin los que patrullan;
    // - antiaéreo fijo (`aa`): el tuyo y el de tus aliados, y el ajeno solo si lo conoces (aaKnown);
    // - patrullas (`patrol`): las tuyas, y las ajenas solo con la casilla a la vista e información exacta.
    // `level`: los galones (Aviación; Defensa aérea en el antiaéreo), si conoces sus niveles. `down`: aeródromo
    // inservible, antiaéreo dañado o, en `sq`, ninguno puede volar. `left`: turnos de obra que le quedan.
    // Antes de elegir país solo se ven los aeródromos.
    buildAir() {

        const friend = o => p0 !== null && (o === p0 || g.allied(p0, o));
        const exact = (o, c) => p0 !== null && g.sees(p0, c) && g.intel(p0, o, c).exact;
        const level = (o, c, branch) => (p0 !== null && g.intel(p0, o, c).levels ? g.techLevel(o, branch) : null);
        const based = new Map(), patrols = new Map();   // aeródromo → { n, ground, ready }; dueño × casilla → escuadrones
        for (const q of g.squadrons.values()) {
            const b = based.get(q.base) ?? { n: 0, ground: 0, ready: 0 };
            based.set(q.base, b);
            b.n++;
            if (q.patrol >= 0) { const k = q.owner * G.N + q.patrol; patrols.set(k, (patrols.get(k) ?? 0) + 1); }
            else { b.ground++; if (g.canFly(q)) b.ready++; }

            if (f.left > 0 && !friend(f.owner)) continue;

            out.push({ kind: 'field', cell, owner: f.owner, n: sure ? (b?.n ?? 0) : null, level: lv, down: f.left === 0 && g.turn <= f.downUntil, left: f.left });
            if (sure && b?.ground) out.push({ kind: 'sq', cell, owner: f.owner, n: b.ground, level: lv, down: !b.ready, left: 0 });
        }
        if (p0 === null) return;
        for (const [cell, site] of g.aaSites) {

            out.push({ kind: 'aa', cell, owner: site.owner, n: null, level: level(site.owner, cell, 'antiaerea'), down: site.hits > 0, left: site.left });

    // Casillas a `r` o menos de `c` (hexDist), por vecinas: el conjunto es convexo.

            const j = G.nb[list[k] * 6 + d];
            if (j >= 0 && !seen.has(j) && hexDist(c, j) <= r) { seen.add(j); list.push(j); }
        }
        return seen;
    }
    // Contorno de un conjunto de casillas: las aristas que dan fuera.
    outline(cells) {
        const p = new Path2D();
        for (const c of cells) for (let d = 0; d < 6; d++) { const j = G.nb[c * 6 + d]; if (j < 0 || !cells.has(j)) this.edge(p, c, d); }
        return p;
    }
    // La herramienta Aviación (en coordenadas del mapa): el alcance de la base con un contorno discontinuo, un velo rojo
    // con el radio de cada antiaéreo enemigo que conoces y el camino a trazos hasta el blanco, rojo donde lo cubre.
    // El contorno se guarda por base y alcance, y el velo por las fuentes que se conocen.
    drawAirPick(ctx, s) {
        const P = this.airPick, rk = `${P.bases.join(',')}:${P.range}`, vk = P.known.map(k => `${k.cell}:${k.radius}`).join(',');
        if (this.airRangeCache?.key !== rk) {
            const all = new Set();
            for (const b of P.bases) for (const c of this.cellsWithin(b, P.range)) all.add(c);
            this.airRangeCache = { key: rk, edge: this.outline(all) };
        }
        if (this.airVeilCache?.key !== vk) {
            const cover = new Set(), fill = new Path2D();
            for (const k of P.known) for (const c of this.cellsWithin(k.cell, k.radius)) cover.add(c);
            for (const c of cover) this.hexPath(fill, c);
            this.airVeilCache = { key: vk, cover, fill, edge: this.outline(cover) };

        ctx.strokeStyle = 'rgba(224,90,71,0.75)'; ctx.lineWidth = 1.2 / s; ctx.stroke(V.edge);
        ctx.setLineDash([5 / s, 3.5 / s]);
        ctx.strokeStyle = INK; ctx.lineWidth = 3.2 / s; ctx.stroke(this.airRangeCache.edge);
        ctx.strokeStyle = 'rgba(255,250,232,0.95)'; ctx.lineWidth = 1.6 / s; ctx.stroke(this.airRangeCache.edge);

                seg.moveTo(G.cx[a], G.cy[a]); seg.lineTo(G.cx[b], G.cy[b]);
            }
            ctx.lineCap = 'round';
            for (const [p, color] of [[safe, SIGNAL], [hot, '#e05a47']]) {

    }
    // Los satélites del jugador (en coordenadas del mapa): el contorno discontinuo del círculo que vigila cada uno. El
    // contorno se guarda por centros y radio, que solo cambian al lanzar uno, al acabarse o con Óptica de alta resolución.
    drawSatAreas(ctx, s) {
        const g = this.game, p0 = g.player;
        if (p0 === null || !g.sats.length) return;
        const R = g.satRadius(p0), key = g.satsOf(p0).map(x => `${x.cell}:${R}`).join(',');
        if (!key) return;

            const all = new Set();
            for (const x of g.satsOf(p0)) for (const c of hexDisc(x.cell, R)) all.add(c);
            this.satCache = { key, edge: this.outline(all) };

        ctx.strokeStyle = SIGNAL; ctx.lineWidth = 1.7 / s; ctx.stroke(this.satCache.edge);
        ctx.setLineDash([]);
    }
    // En píxeles de pantalla, en el centro de cada satélite del jugador: su pictograma (el de la rama Espacio, el cuerpo
    // con dos paneles solares y la antena) en un disco, y a su derecha los turnos que le quedan.
    drawSats(hexPx, font, visible) {
        const g = this.game, ctx = this.ctx;
        if (g.player === null || !g.sats.length) return;
        const r = Math.max(8, Math.min(13, hexPx * 0.9)), k = r * 1.7 / 32;
        // Por encima de la ficha del ejército y del aeródromo con su cifra (las medidas de drawAir).
        const cw = Math.max(22, Math.min(40, hexPx * 2.2)), ih = Math.max(15, Math.min(26, hexPx * 1.4)) * 0.66, top = cw * 0.31 + ih + Math.max(5.5, ih * 0.4) + 2;
        for (const sat of g.satsOf(g.player)) {
            const [x, y0] = this.toScreen(G.cx[sat.cell], G.cy[sat.cell]), y = y0 - top - r;
            if (!visible(x, y)) continue;
            ctx.save();
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = SIGNAL; ctx.fill();
            ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
            ctx.font = font(11, 700); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 3; ctx.fillStyle = SIGNAL;
            ctx.strokeText(String(sat.left), x + r + 3, y); ctx.fillText(String(sat.left), x + r + 3, y);
            ctx.translate(x, y); ctx.rotate(-35 * Math.PI / 180); ctx.scale(k, k); ctx.translate(-16, -16);
            ctx.fillStyle = INK;
            ctx.fillRect(11.5, 11, 9, 10); ctx.fillRect(2, 12, 8, 8); ctx.fillRect(22, 12, 8, 8);
            ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(16, 11); ctx.lineTo(16, 6.5); ctx.moveTo(13, 6.5); ctx.lineTo(19, 6.5); ctx.stroke();
            ctx.restore();
        }
    }
    // La aviación en píxeles de pantalla. Vista sencilla, con los símbolos de la OTAN (APP-6): el aeródromo es un marco
    // de instalación con la hélice de ala fija, arriba a la izquierda de su ciudad para no tapar la ficha del ejército;
    // el antiaéreo fijo, una instalación con la cúpula de defensa aérea (a su izquierda si comparten casilla); la
    // patrulla, una ficha de escuadrón a la derecha de la casilla que protege. Vista realista: miniaturas sobre peana.
    // Con `flying`, solo las patrullas, que se dibujan encima de los ejércitos; sin él, todo lo demás, debajo.
    drawAir(marks, hexPx, font, real, visible, flying) {
        const g = this.game, ctx = this.ctx;
        const cw = Math.max(22, Math.min(40, hexPx * 2.2)), ch = cw * 0.62;   // la ficha de un ejército, para esquivarla
        const iw = Math.max(15, Math.min(26, hexPx * 1.4)), ih = iw * 0.66;   // el marco de instalación
        const U = Math.max(8, Math.min(24, hexPx * 0.82));                     // la miniatura de un ejército
        const fields = new Set();
        for (const m of marks) if (m.kind === 'field') fields.add(m.cell);
        for (const m of marks) {
            if ((m.kind === 'patrol') !== flying || (m.kind === 'sq' && !real)) continue;   // en la sencilla, cuántos van en la esquina del aeródromo
            const [x, y] = this.toScreen(G.cx[m.cell], G.cy[m.cell]);
            if (!visible(x, y)) continue;
            const color = g.nations[m.owner].color, mine = m.owner === g.player, shared = m.kind === 'aa' && fields.has(m.cell);
            if (real) {
                const o = { x: x - U * (shared ? 3.6 : 1.8), y: y - U * 0.55, hexPx, color, n: m.n, level: m.level, down: m.down, left: m.left, mine };
                if (m.kind === 'patrol') Object.assign(o, { x: x + U * 1.7, y: y - U * 0.2, flying: true });
                if (m.kind === 'field') this.realistic.drawAirfield(ctx, o);
                else if (m.kind === 'aa') this.realistic.drawAASite(ctx, o);
                else this.realistic.drawSquadrons(ctx, o);
            } else if (m.kind === 'patrol') {
                const pw = Math.max(22, Math.min(40, hexPx * 0.72 * 2.2));   // el ancho de su ficha, como en drawCounter
                this.drawCounter({ type: 'air', owner: m.owner, n: m.n, level: m.level, mine, alpha: 1 }, x + cw / 2 + Math.max(7, ch * 0.42) + pw / 2 + 2, y - ch * 0.15, hexPx * 0.72, font);   // pasada la cifra de la ficha
            } else this.drawInstallation(m, x - cw / 2 - iw * (shared ? 1.45 : 0.3), y - ch / 2 - ih * 0.5, iw, ih, color, mine, font);
        }
    }
    // Marco de instalación de la OTAN: el rectángulo negro sobre el borde de arriba, y dentro la hélice de ala fija
    // (aeródromo) o la cúpula de defensa aérea (antiaéreo; a trazos si está dañado). En obra, el marco a trazos; un
    // aeródromo inservible, atenuado y con un aspa, y en su esquina cuántos escuadrones tiene («?» si no lo sabes).
    drawInstallation(m, x, y, w, h, color, mine, font) {
        const ctx = this.ctx, x0 = x - w / 2, y0 = y - h / 2;
        ctx.save();
        ctx.globalAlpha = m.left > 0 ? 0.6 : m.down && m.kind === 'field' ? 0.55 : 1;
        ctx.fillStyle = color; ctx.fillRect(x0, y0, w, h);
        ctx.fillStyle = INK; ctx.fillRect(x - w * 0.2, y0 - h * 0.26, w * 0.4, h * 0.26);
        ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
        if (m.left > 0) ctx.setLineDash([3, 2]);
        ctx.strokeRect(x0, y0, w, h);
        ctx.setLineDash([]);
        ctx.lineWidth = 1.2;
        if (m.kind === 'field') strokePropeller(ctx, x, y + h * 0.04, w * 0.34);
        else {
            if (m.down) ctx.setLineDash([2.5, 2]);
            ctx.beginPath(); ctx.ellipse(x, y0 + h, w * 0.3, h * 0.62, 0, Math.PI, 0); ctx.stroke();
            ctx.setLineDash([]);
        }
        if (m.kind === 'field' && m.down && !m.left) {
            ctx.strokeStyle = '#e05a47'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + w, y0 + h); ctx.moveTo(x0 + w, y0); ctx.lineTo(x0, y0 + h); ctx.stroke();
        }
        if (m.kind === 'field' && !m.left) {
            const t = m.n === null ? '?' : String(m.n), r = Math.max(5.5, h * 0.4);
            ctx.beginPath(); ctx.arc(x0 + w, y0, r, 0, Math.PI * 2);
            ctx.fillStyle = mine ? SIGNAL : '#ebe7d8'; ctx.fill();
            ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
            ctx.fillStyle = INK; ctx.font = font(Math.round(r * 1.2), 700);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(t, x0 + w, y0 + 1);
        }
        ctx.restore();
    }

    // Ficha OTAN de la vista sencilla: color del país, símbolo del tipo dominante y número de unidades. Embarcado
    // (t.afloat), el marco es el círculo de superficie marítima de APP-6, tan alto como la ficha, con el mismo símbolo. Un
    // escuadrón (t.type 'air') lleva la hélice de ala fija.
    drawCounter(t, x, y, hexPx, font) {
        const ctx = this.ctx, g = this.game;
        ctx.globalAlpha = t.alpha;
        if (hexPx < 6) {
            ctx.fillStyle = g.nations[t.owner].color;
            ctx.fillRect(x - 3, y - 3, 6, 6);
            ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.strokeRect(x - 3, y - 3, 6, 6);
            ctx.globalAlpha = 1;
            return;
        }
        const w = Math.max(22, Math.min(40, hexPx * 2.2)), hh = w * 0.62;
        const x0 = x - w / 2, y0 = y - hh / 2 - hexPx * 0.12, cy = y0 + hh / 2, rad = hh / 2;
        // en el círculo, el símbolo cabe en el cuadrado inscrito (la X de la infantería va de esquina a esquina)
        const sx = t.afloat ? rad * Math.SQRT1_2 : w / 2, sy = t.afloat ? rad * Math.SQRT1_2 : hh / 2;
        const frame = () => { ctx.beginPath(); if (t.afloat) ctx.arc(x, cy, rad, 0, Math.PI * 2); else ctx.rect(x0, y0, w, hh); };
        ctx.globalAlpha = t.alpha * (t.spent ? 0.55 : 1);
        ctx.fillStyle = g.nations[t.owner].color;
        frame(); ctx.fill();
        ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
        ctx.beginPath();
        if (t.type === 'infantry') { ctx.moveTo(x - sx, cy - sy); ctx.lineTo(x + sx, cy + sy); ctx.moveTo(x + sx, cy - sy); ctx.lineTo(x - sx, cy + sy); ctx.stroke(); }
        else if (t.type === 'tank') { ctx.ellipse(x, cy, t.afloat ? rad * 0.62 : w * 0.28, t.afloat ? rad * 0.34 : hh * 0.24, 0, 0, Math.PI * 2); ctx.stroke(); }
        else if (t.type === 'artillery') { ctx.arc(x, cy, hh * 0.17, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill(); }
        else if (t.type === 'antiair') {   // la cúpula de defensa aérea, sobre el borde de abajo (en el círculo, del cuadrado inscrito)
            if (t.afloat) ctx.ellipse(x, cy + sy, sx * 0.85, sy * 1.15, 0, Math.PI, 0);
            else ctx.ellipse(x, y0 + hh, w * 0.3, hh * 0.57, 0, Math.PI, 0);
            ctx.stroke();
        }
        else if (t.type === 'air') strokePropeller(ctx, x, cy, w * 0.36);   // escuadrón: aviación de ala fija
        // sin tipo conocido: el marco queda vacío, como en un mapa militar
        ctx.lineWidth = t.selected ? 3 : t.starving || t.flanked || t.noSupply ? 2.6 : 1.6;
        ctx.strokeStyle = t.selected ? '#fff' : t.starving ? HUNGER : t.flanked ? '#e05a47' : t.noSupply ? '#ff9f1c' : INK;
        frame(); ctx.stroke();
        if (t.level > 0 && hexPx >= 8) {   // galones bajo la ficha: nivel de su rama de tropa
            const cw = Math.max(5, w * 0.2), ch = Math.max(2.5, hh * 0.14), gap = ch + 1.8;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            for (let i = 0; i < t.level; i++) {
                const cy = y0 + hh + 3 + ch + i * gap;
                for (const [color, width] of [[INK, 3.6], [SIGNAL, 1.8]]) {
                    ctx.strokeStyle = color; ctx.lineWidth = width;
                    ctx.beginPath(); ctx.moveTo(x - cw, cy); ctx.lineTo(x, cy - ch); ctx.lineTo(x + cw, cy); ctx.stroke();
                }
            }
            ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
        }
        if (t.n === null) {   // tamaño desconocido: el escalón de la OTAN encima de la ficha
            ctx.font = font(Math.round(Math.max(10, hh * 0.55)), 700);
            ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
            ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = '#ebe7d8';
            ctx.strokeText(t.echelon, x, y0 - 3); ctx.fillText(t.echelon, x, y0 - 3);
            ctx.globalAlpha = 1;
            return;
        }
        // número de unidades
        const n = String(t.n), r = Math.max(7, hh * 0.42);
        const bx = t.afloat ? x + rad : x0 + w, by = y0;   // en la esquina de la ficha, o arriba a la derecha del círculo
        ctx.beginPath(); ctx.arc(bx, by, r + (n.length > 2 ? 2 : 0), 0, Math.PI * 2);
        ctx.fillStyle = t.mine ? SIGNAL : '#ebe7d8'; ctx.fill();
        ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
        ctx.fillStyle = INK; ctx.font = font(Math.round(r * (n.length > 2 ? 0.95 : 1.15)), 700);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(n, bx, by + 1);
        ctx.globalAlpha = 1;
    }
}

            <li>Aviación (herramienta Aviación, tecla 6): elige un aeródromo tuyo y marca los escuadrones que vuelan; luego haz clic en un blanco a su alcance. Cada misión dice su probabilidad de acierto y lo que puedes perder según lo que sabes: con niebla, el antiaéreo que no conoces no cuenta y la ficha te avisa. Cada escuadrón vuela una vez por turno y cada blanco recibe como mucho un acierto por turno. En tu territorio se construyen aeródromos (en una ciudad) y antiaéreo (en cualquier casilla)</li>
            <li>Aviación en el mando: una ofensiva o una línea llevan escuadrones, igual que ejércitos (pestaña Mando o «Encargo» en la ficha de Aviación), y marcan sus fines: golpear ejércitos, cortar carreteras, bajar fortificaciones, destruir antiaéreo o proteger y escoltar. Cada turno eligen, con lo que conoces, hasta ${AIR_TARGETS} blancos a su alcance y solo vuelan si la previsión es buena; respetan el modo manual, asistido o automático. La reserva manda sus escuadrones a la operación que pide ayuda. Orden de zona: un escuadrón suelto ataca turno a turno con sus fines a ${AIR_ZONE_KM} km de la casilla que marques. Una misión a mano gana a su encargo ese turno; al siguiente vuelve a él</li>
            <li>Con niebla de guerra, en sombra: lo que no ves. Ojo junto a una ciudad: tu espía</li>
            <li>${Object.entries(E.resourceTypes).map(([k, name]) => `${CONFIG.RESOURCE_ICON[k]} ${name}`).join(' &nbsp;')}</li>
            <li>Un yacimiento abastece a su provincia; si una carretera pasa por él, también a las ciudades que una (más renta y tropas más baratas). Más tenue: aún sin carretera</li></ul>`;
        this.render();
    }

    // Sustituye la partida en curso (al cargar).
    setGame(g) {
        this.opPreview = null;
        game = g;
        this.game = g;
        this.legendKey = null;
        Object.assign(this.view, { game: g, builtVersion: -1, builtRoads: -1, builtForts: -1, preview: null, stretch: null, hoverNation: -1 });
        // Lo que quedaba por animar es de la otra partida: sus números de ejército se repiten en la nueva.
        this.view.motion.clear(); this.view.motion.facings.clear();
        this.stretch = null;
        this.repair = this.fortRepair = null;
        this.tool = 'command';
        this.air = this.noAir();
        this.anchor = -1;
        this.choice = g.player;
        this.focusNation = null;
        this.seenLog = g.logs.length;
        if (g.player !== null) this.view.centerOn(g.nations[g.player].capitalCell, 5);
        this.select(g.player !== null ? g.nations[g.player].capitalCell : -1);
    }

    // --- Mapa ---
    // Ratón y pantalla táctil: arrastrar mueve el mapa, la rueda o el pellizco hacen zoom, un toque o clic selecciona.
    bindMap() {
        const c = this.view.canvas;
        const pointers = new Map();
        let drag = null, pinch = null;
        const startDrag = (x, y, moved = false) => { drag = { x, y, ox: this.view.ox, oy: this.view.oy, moved }; };
        c.addEventListener('pointerdown', e => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            c.setPointerCapture(e.pointerId);
            this.touch = e.pointerType !== 'mouse';
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pointers.size === 1) startDrag(e.clientX, e.clientY);
            else if (pointers.size === 2) {
                const [a, b] = [...pointers.values()];
                pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), scale: this.view.scale };
                if (drag) drag.moved = true;
            }
        });
        c.addEventListener('pointermove', e => {
            if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pinch && pointers.size === 2) {
                const [a, b] = [...pointers.values()];
                const r = c.getBoundingClientRect();
                const target = pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
                this.view.zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, target / this.view.scale);
                this.requestDraw();
                return;
            }
            if (drag && pointers.has(e.pointerId)) {
                const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
                if (Math.abs(dx) + Math.abs(dy) > (e.pointerType === 'mouse' ? 4 : 10)) drag.moved = true;
                if (drag.moved) {
                    c.classList.add('dragging');
                    this.view.ox = drag.ox + dx; this.view.oy = drag.oy + dy;
                    this.requestDraw();
                }
            }
            if (e.pointerType === 'mouse' && !drag?.moved) this.hover(e);   // arrastrando, sin información bajo el puntero
            else if (drag?.moved) $('#tooltip').hidden = true;
        });
        const end = e => {
            const tap = drag && !drag.moved && !pinch && pointers.size === 1 && e.type === 'pointerup';
            pointers.delete(e.pointerId);
            if (pointers.size < 2) pinch = null;
            if (pointers.size === 1) { const [p] = pointers.values(); startDrag(p.x, p.y, true); }   // tras el pellizco sigue arrastrando
            if (pointers.size === 0) {
                if (tap) this.clickCell(this.cellFromEvent(e), e.shiftKey);
                drag = null;
                c.classList.remove('dragging');
            }
        };
        c.addEventListener('pointerup', end);
        c.addEventListener('pointercancel', end);
        c.addEventListener('contextmenu', e => { e.preventDefault(); this.cancel(); });
        c.addEventListener('wheel', e => {
            e.preventDefault();
            const r = c.getBoundingClientRect();
            // Zoom proporcional al giro: un paso de rueda (~100 px) es ×1,2; el touchpad, que manda muchos pasos
            // pequeños, hace un zoom suave en vez de saltos.
            const dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
            this.view.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-Math.max(-300, Math.min(300, dy)) * 0.00182));
            this.requestDraw();
        }, { passive: false });
        c.addEventListener('pointerleave', e => {
            if (e.pointerType !== 'mouse') return;
            $('#tooltip').hidden = true;
            this.view.hoverCell = -1;
            this.view.hoverNation = -1;
            this.requestDraw();
        });
    }

    // «colinas, defensa ×1,3, cuesta 2 · río», para la ficha y la información bajo el puntero.
    terrainText(cell) {
        const t = terrainOf(cell), num = x => String(x).replace('.', ','), r = this.myRules();
        const river = [0, 1, 2, 3, 4, 5].some(d => RIVER[cell * 6 + d]);
        const crossing = r.riverCrossing ? `cruzarlo cuesta ${moveFraction(r.riverCrossing)} más` : 'tus pontoneros lo cruzan sin coste';
        return `${t.name.toLowerCase()}${t.def > 1 ? `, defensa ×${num(t.def)}` : ''}, mover cuesta ${num(r.terrainCost[CELL_TERRAIN[cell]])}${river ? ` · junto a un río (${crossing}; defiende ×${num(CONFIG.RIVER_DEFENSE)})` : ''}`;
    }

    // Con niebla, de un ejército que no es tuyo ni aliado solo se sabe si está aislado cuando ves sus seis vecinas: si no,
    // la ficha diría que no hay nadie a su lado en casillas que no ves. El combate sigue usando lo que hay de verdad.
    isolationHidden(a) {
        const g = this.game;
        if (!g.settings.fog || g.player === null || a.owner === g.player || g.allied(g.player, a.owner)) return false;
        for (let d = 0; d < 6; d++) {
            const j = G.nb[a.cell * 6 + d];
            if (j >= 0 && isLand(j) && !g.sees(g.player, j)) return true;   // en el mar no hay ejércitos que ver
        }
        return false;
    }

    // El desgaste de un ejército, una línea por cada parte: aislado, sin carretera al alcance y sin víveres (rodeado va
    // aparte); en el mar, embarcado y, sin costa propia o aliada libre al lado, que se hunde si pierde. Con `explain`,
    // cada línea dice además por qué y qué hacer.
    wearLines(a, explain = false) {
        const g = this.game, out = [], hide = this.isolationHidden(a);
        const disorg = x => `Desorganizado ×${decimal(x)}: hasta el turno ${a.disorgUntil}${explain ? '. Un ataque aéreo le ha roto el orden; ataque y defensa bajan.' : ''}`;
        if (afloat(a.cell)) {
            out.push(`Embarcado: defensa ×${decimal(CONFIG.EMBARKED_DEF)}${explain ? ': en el mar no hay terreno, ciudad ni fortificación que lo cubra. Desembarca antes de que lo ataquen.' : ''}`);
            // Con niebla, de un barco ajeno solo se sabe si tiene costa libre al lado cuando se ven sus vecinas.
            if (!hide && g.retreatCell(a, a.cell) < 0) out.push(`Si pierde un combate, se hunde${explain ? ': no hay costa tuya o aliada libre al lado a la que retirarse.' : ''}`);
            for (const [k, x] of g.armyState(a.owner, a.cell, a.units, a.id).parts) if (k === 'desorganizado') out.push(disorg(x));
            return out;
        }
        for (const [k, x] of g.armyState(a.owner, a.cell, a.units, a.id).parts) {
            if (k === 'aislado' && hide) continue;
            if (k === 'aislado') out.push(`Aislado ×${decimal(x)}${explain ? ': ningún ejército propio o aliado al lado y fuera de una ciudad; ataque y defensa bajan. Acércale otro ejército.' : ''}`);
            else if (k === 'sin carretera') out.push(`Sin carretera al alcance ×${decimal(x)}${explain ? ': en territorio enemigo y sin ninguna carretera a un turno de marcha.' : ''}`);
            else if (k === 'desorganizado') out.push(disorg(x));
        }
        const left = g.hungerLeft(a);
        if (left !== null) out.push(`Sin víveres: pierde 1 unidad dentro de ${plural(left, 'turno', 'turnos')}${explain ? '. Rompe el cerco o abre un paso hasta tu territorio.' : ''}`);
        return out;
    }

    // La aviación de una casilla en la tarjeta del ratón, con lo mismo que enseña el mapa (view.marks: la niebla).
    airLines(cell) {
        const g = this.game, out = [], who = o => (o === g.player ? '' : ` de ${g.nm(o)}`);
        for (const m of this.view.marks()) {
            if (m.cell !== cell) continue;
            if (m.kind === 'field') {
                if (m.left) { out.push(`Aeródromo en obras: ${plural(m.left, 'turno', 'turnos')}`); continue; }
                out.push(`Aeródromo de ${g.nm(m.owner)}: ${m.n === null ? 'no sabes cuántos escuadrones tiene' : plural(m.n, 'escuadrón', 'escuadrones')}`);
                if (m.down) out.push(`<span class="warn-text">Inservible hasta el turno ${g.airfields.get(cell).downUntil}</span>`);
            } else if (m.kind === 'aa') {
                if (m.left) { out.push(`Antiaéreo fijo en obras: ${plural(m.left, 'turno', 'turnos')}`); continue; }
                // Solo se enseña el alcance real si se conoce la investigación de su dueño; si no, el que se supone.
                const known = g.knowsResearch(g.player, m.owner), R = g.aaReach(g.player, m.owner), km = known ? g.rules(m.owner).aaRangeKm : AA_MAX_KM;
                out.push(`Antiaéreo fijo${who(m.owner)}${m.down ? ' (dañado)' : ''}: cubre ${plural(R, 'casilla', 'casillas')} (${km} km)`);
            } else if (m.kind === 'patrol') {
                out.push(`${m.owner === g.player ? 'Protegida por tus escuadrones hasta tu próximo turno' : `Protegida por escuadrones${who(m.owner)}`}: ${plural(m.n, 'escuadrón', 'escuadrones')}`);
            }
        }
        return out;
    }

    cellFromEvent(e) {
        const r = this.view.canvas.getBoundingClientRect();
        return this.view.cellAtScreen(e.clientX - r.left, e.clientY - r.top);
    }

    requestDraw() { this.view.requestFrame(); }   // un solo dibujo por fotograma, lo pida quien lo pida

    planTo(cell) {
        const g = this.game;
        if (this.tool === 'command' || this.tool === 'cities' || this.tool === 'air' || this.anchor < 0 || cell < 0 || !isLand(cell) || g.owner[cell] !== g.player) return null;
        if (this.tool === 'fort') return g.planFort(g.player, this.anchor, cell);
        if (cell === this.anchor) return null;
        return g.planRoad(g.player, this.anchor, c => c === cell, this.highway ? 2 : 1);
    }

    hover(e) {
        const g = this.game, cell = this.cellFromEvent(e), tip = $('#tooltip');
        if (cell !== this.view.hoverCell) {
            this.view.hoverCell = cell;
            if (this.tool !== 'command') {
                const plan = this.planTo(cell);
                this.view.preview = plan ? { ...plan, affordable: plan.cost <= g.nations[g.player].gold } : null;
            }
            const hn = g.player === null && cell >= 0 && isLand(cell) ? g.owner[cell] : -1;
            this.view.hoverNation = hn;
            this.requestDraw();
        }
        // En el mar solo hay tarjeta sobre un barco que se ve o sobre una casilla a la que puede ir el ejército elegido.
        const sea = cell >= 0 && afloat(cell), a = cell >= 0 ? g.armyOn(cell) : null;
        if (cell < 0 || (sea && (g.player === null || !(a && g.sees(g.player, cell)) && !this.reachInfo?.moves.has(cell)))) { tip.hidden = true; return; }
        const lines = sea ? [`<b>En el mar</b> <span class="muted">junto a ${esc(PROVINCES[SEA_PROV[cell]].name)}</span>`] : [];
        const p = PROVINCES[SEA_PROV[cell]], o = g.owner[cell], res = RESOURCE_AT.get(cell);
        if (!sea) lines.push(`<b>${esc(p.name)}</b>${g.isDisputed(cell) ? ` <span class="muted">(en disputa: es de ${g.nm(g.legal[cell])})</span>` : ''}`,
            `<span style="color:${g.nations[o].color}">■</span> ${g.nm(o)}${g.player !== null && o !== g.player ? ` ${this.relationChip(o)}` : ''}`);
        if (sea) { /* en el mar no hay dueño, ciudad, terreno, suministro ni obras */ }
        else if (CITY_OF[cell] >= 0) lines.push(`${CAPITAL_OF[cell] >= 0 ? '★ Capital' : '● Ciudad'}: ${esc(p.cityName)}${p.seas.length ? ' (puerto)' : ''}`);
        if (res) {
            const reach = g.resourceReach(res).length;
            lines.push(`${CONFIG.RESOURCE_ICON[res.type]} ${res.typeName} de ${esc(res.name)}: +${res.value} de oro, ${reach ? `abastece a su provincia y a ${plural(reach, 'otra', 'otras')}` : 'abastece solo a su provincia'}`);
        }
        if (!sea) lines.push(`<span class="muted">${this.terrainText(cell)}</span>`);
        const supply = sea ? [] : g.provinceSupply(G.prov[cell]);
        const ownerRules = g.owner[cell] >= 0 ? g.rules(g.owner[cell]) : BASE_RULES;
        if (supply.length) lines.push(`Abastecida por ${supply.map(r => CONFIG.RESOURCE_ICON[r.type]).join('')}: +${Math.round(100 * Math.min(ownerRules.resIndustryMax, ownerRules.resIndustry * supply.length))} % de renta`);
        const sg = g.sieges.get(cell);
        if (sg) lines.push(`<span class="warn-text">Asediada por ${g.nm(sg.by)}: ${sg.held} de ${g.rules(sg.by).siegeTurns} turnos</span>`);
        if (g.fort[cell]) {
            const lv = g.fortLevel(g.player, cell), w = g.fortWork.get(cell);
            lines.push(lv === null ? 'Fortificada (no sabes de qué nivel)' : `Fortificada con ${FORT_LEVELS[lv]}: defensa ×${decimal(FORT_FX[g.fort[cell]].fortDefense)}`);
            if (w?.up && lv !== null) lines.push(`Reparando la fortificación: ${plural(w.left, 'turno', 'turnos')}`);
            else if (g.owner[cell] === g.player && g.fort[cell] < g.fortMax(g.player)) {   // dañada: si se puede reparar ahora y, si no, por qué
                const why = g.fortRepairWhy(g.player, cell);
                lines.push(`<span class="muted">Dañada${why ? `; no se puede reparar porque ${why}` : ': se repara con Fortificar'}</span>`);
            }
        }
        else if (g.fortWork.has(cell)) lines.push(`Fortificando: ${plural(g.fortWork.get(cell).left, 'turno', 'turnos')}`);
        if (!sea) lines.push(...this.airLines(cell));
        if (g.player === null) { /* antes de elegir país no se enseñan las fuerzas de nadie */ }
        else if (!g.sees(g.player, cell)) lines.push('<span class="muted">Niebla de guerra: no sabes qué tropas hay</span>');
        else if (a) {
            const view = g.armyView(g.player, a), ech = ECHELONS.find(x => x.mark === view.echelon);
            lines.push(view.n === null ? `Ejército de ${g.nm(a.owner)}: ${ech.name} sin identificar (${ech.range} unidades)` : `Ejército de ${g.nm(a.owner)}: ${this.unitsLong(a.units)}`);
            const sides = sea ? 0 : g.hostileSides(a.owner, cell);   // en el mar no se rodea
            if (sides >= CONFIG.FLANKED_SIDES) lines.push(`<span class="warn-text">${sides >= CONFIG.SURROUNDED_SIDES ? 'Cercado' : 'Rodeado'} por ${sides} lados: ataque y defensa ×${g.flankFactor(a.owner, cell)}</span>`);
            if (a.owner === g.player || view.n !== null) for (const w of this.wearLines(a)) lines.push(`<span class="warn-text">${w}</span>`);
        }
        if (!sea && g.spies.has(G.prov[cell])) lines.push('Tienes un espía en esta provincia');
        if (g.player !== null && o === g.player && !g.inSupply(g.player, cell)) lines.push('<span style="color:#ffb347">Sin suministro</span>');
        if (this.reachInfo?.attacks.has(cell) && a && g.armyView(g.player, a).n === null) {
            lines.push('<b style="color:#ffd166">Clic para atacar a un ejército sin identificar</b>');
            lines.push('<span class="muted">Sin Reconocimiento 2 ni un espía en la provincia no hay previsión del combate.</span>');
        } else if (this.reachInfo?.attacks.has(cell) && a) {
            const mine = this.selectedArmy();
            const fx = g.combatFactors(g.player, this.send, this.reachInfo.from.get(cell) ?? mine.cell, a, cell, sameUnits(this.send, mine.units) ? mine.id : 0, mine.id);
            // Lo que no puedes saber (aislado bajo la niebla) no entra ni en las partes ni en la cuenta de la previsión.
            const defParts = this.isolationHidden(a) ? fx.defState.parts.filter(([k]) => k !== 'aislado') : fx.defState.parts;
            const dfn = defParts === fx.defState.parts ? fx.dfn : Math.max(0.5, fx.baseDef * fx.bonus * defParts.reduce((m, [, x]) => m * x, 1));
            const chance = g.winChance(fx.atk, dfn), r = fx.atk / dfn, n = countUnits(this.send);
            const winLeft = Math.round(n * (1 - Math.min(1, 0.3 / r))), loseLeft = Math.round(n * (1 - Math.min(1, 0.35 + 0.35 * (1 / r - 1))));
            const num = x => String(Math.round(x * 100) / 100).replace('.', ',');
            const state = parts => parts.map(([nm, x]) => `${nm} ×${num(x)}`);
            const factors = fx.parts.map(([nm, x]) => `${nm} ×${num(x)}`).concat(fx.capped ? [`tope ×${num(fx.cap)}`] : [], state(defParts)).join(', ');
            const color = chance >= 0.7 ? '#a8e38a' : chance >= 0.35 ? '#ffd166' : '#ff8a78';
            lines.push(`<b style="color:${color}">Clic para atacar: ${Math.round(chance * 100)} % de victoria</b>`);
            lines.push(`Tu ataque ${Math.round(fx.atk)}${fx.attState.parts.length + fx.attParts.length ? ` (${state([...fx.attState.parts, ...fx.attParts]).join(', ')})` : ''} contra su defensa ${Math.round(dfn)}${factors ? ` (${factors})` : ''}`);
            lines.push(`Si ganas te quedan unas ${winLeft} de ${n}; si pierdes, unas ${loseLeft}`);
        } else if (this.reachInfo?.attacks.has(cell)) lines.push('<b style="color:#ff8a78">Clic para atacar</b>');
        else if (this.reachInfo?.moves.has(cell)) lines.push(`<b style="color:#a8e38a">${afloat(cell) && isLand(this.selectedArmy()?.cell ?? -1) ? 'Clic para embarcar' : 'Clic para mover aquí'}</b>`);
        const prev = this.view.preview;
        if (prev && cell === this.view.hoverCell) {
            const what = prev.cls === 'fort' ? `Fortificar ${plural(prev.cells.length, 'casilla', 'casillas')}` : `${plural(prev.path.length - 1, 'tramo', 'tramos')} de ${prev.cls === 2 ? 'autopista' : 'carretera'}`;
            lines.push(`<b style="color:${prev.affordable ? '#a8e38a' : '#ff8a78'}">${what}: ${prev.cost} de oro${prev.affordable ? '' : ' (no te alcanza)'}</b>`);
        }
        tip.innerHTML = lines.join('<br>');
        tip.hidden = false;
        const box = this.view.canvas.parentElement.getBoundingClientRect();
        const x = e.clientX - box.left + 16, y = e.clientY - box.top + 16;
        tip.style.left = `${Math.min(x, box.width - tip.offsetWidth - 8)}px`;
        tip.style.top = `${Math.min(y, box.height - tip.offsetHeight - 8)}px`;
    }

    clickCell(cell, shift = false) {
        const g = this.game;
        if (this.replaying) return;
        if (this.ordering) { this.pickOrderTarget(cell); return; }
        // En el mar solo hacen algo la herramienta de mando (elegir un barco propio, moverlo o darle una orden) y la de
        // aviación (proteger la casilla o elegirla de blanco).
        const sea = cell >= 0 && afloat(cell);
        if (cell < 0 || (sea && (g.player === null || g.over || (this.tool !== 'command' && this.tool !== 'air')))) { if (this.tool === 'command') this.select(-1); return; }
        if (g.player === null) { this.choice = g.owner[cell]; this.render(); return; }
        if (g.over) return;
        if (this.proposal) { this.toggleProposal(cell); return; }
        if (this.tool === 'cities') { this.toggleCity(cell); return; }
        if (this.tool === 'op') { this.opClick(cell); return; }
        if (this.tool === 'air') { this.airClick(cell); return; }
        if (this.tool !== 'command') { this.buildClick(cell); return; }
        const army = this.selectedArmy();
        // Mayúsculas + clic: orden de marchar (o de atacar, si allí hay un enemigo) hasta esa casilla, en varios turnos.
        if (army && shift && cell !== army.cell) {
            const foe = g.armyOn(cell);
            this.ordering = { kind: foe && g.atWar(g.player, foe.owner) && g.sees(g.player, cell) ? 'attack' : 'march' };
            this.pickOrderTarget(cell);
            return;
        }
        if (army && this.reachInfo && (this.reachInfo.attacks.has(cell) || this.reachInfo.moves.has(cell))) {
            const result = g.playerMove(army, copyUnits(this.send), cell);
            const next = result && g.armies.has(result.id) && result.owner === g.player ? result.cell : cell;
            this.select(next);
            return;
        }
        if (sea) { const a = g.armyOn(cell); this.select(a && a.owner === g.player && cell !== this.selected ? cell : -1); return; }
        this.select(cell === this.selected ? -1 : cell);
    }

    // Herramienta Operación: cada clic añade un punto al eje (ofensiva), un tramo a la línea (defensa, por tu
    // territorio) o fija la zona de reunión (reserva).
    opClick(cell) {
        const g = this.game, d = this.opDraft;
        if (!d) return;
        const mine = g.owner[cell] === g.player;
        if (d.kind === 'reserva') {
            if (!mine) { this.flash('La zona de reunión tiene que estar en tu territorio.'); return; }
            d.cells = [cell];
        } else if (d.kind === 'defensa') {
            if (!mine) { this.flash('La línea de defensa va por tu territorio.'); return; }
            const last = d.cells[d.cells.length - 1];
            if (last === undefined) d.cells.push(cell);
            else if (cell !== last) {
                const plan = g.planFort(g.player, last, cell);
                if (!plan) { this.flash('No hay camino por tu territorio hasta esa casilla.'); return; }
                d.cells.push(...plan.path.slice(1));
            }
        } else {
            if (!d.cells.length && !mine && !g.allied(g.player, g.owner[cell])) { this.flash('La ofensiva sale de tu territorio o del de un aliado.'); return; }
            if (d.cells[d.cells.length - 1] !== cell && d.cells.length < 16) d.cells.push(cell);
        }
        this.selected = cell;
        this.render();
    }
    opDraftReady() {
        const d = this.opDraft;
        return !!d && (d.kind === 'ofensiva' ? d.cells.length >= 2 : d.cells.length >= 1);
    }
    // En la propuesta de las operaciones asistidas, un clic en un ejército lo deja fuera (o lo vuelve a meter).
    toggleProposal(cell) {
        const g = this.game, pr = this.proposal, a = g.armyOn(cell);
        if (!a || a.owner !== g.player || !a.op || !pr.ids.includes(a.op)) return;
        if (pr.skip.has(a.id)) { pr.skip.delete(a.id); a.direct = 0; } else { pr.skip.add(a.id); a.direct = g.turn; }
        pr.ghost = g.previewOps(g.player, pr.ids);
        this.render();
    }

    // Destino de la orden que se está dando: casilla para marchar o atacar, ejército propio para seguir.
    pickOrderTarget(cell) {
        const g = this.game, kind = this.ordering?.kind, army = this.selectedArmy();
        this.ordering = null;
        if (!army || cell < 0 || cell === army.cell) { this.render(); return; }
        let order;
        if (kind === 'follow') {
            const t = g.armyOn(cell);
            if (!t || t.owner !== g.player) { this.flash('Para seguir a un ejército, haz clic en otro ejército tuyo.'); return; }
            order = { kind, target: t.id };
        } else {
            const t = afloat(cell) ? g.armyOn(cell) : null;
            if (afloat(cell) && (kind !== 'march' || (t && t.owner !== g.player && g.sees(g.player, cell)))) {
                this.flash('En el mar solo se marcha, a una casilla libre o con un ejército tuyo. A un barco enemigo a tu alcance se le ataca con un clic.');
                return;
            }
            order = { kind, dest: cell, ratio: this.orderRatio, flee: this.orderFlee ?? true };
        }
        const before = army.id;
        g.playerOrder(army, order);
        const now = g.armies.get(before);
        this.select(now && now.owner === g.player ? now.cell : this.selected);
    }

    buildClick(cell) {
        const g = this.game;
        if (g.owner[cell] !== g.player) { this.flash('Solo puedes construir en tu territorio.'); return; }
        const fort = this.tool === 'fort';
        this.pending = null;
        this.stretch = fort ? null : g.roadStretch(g.player, cell);
        this.repair = fort ? null : g.repairPlan(g.player, cell);
        this.fortRepair = fort ? g.fortRepairPlan(g.player, cell) : null;   // una fortificación propia dañada: repararla
        this.view.stretch = this.stretch;
        if (this.anchor < 0 || (cell === this.anchor && !fort)) {
            this.anchor = cell;
        } else {
            const plan = this.planTo(cell);
            if (!plan) this.flash('No hay camino por tu territorio hasta esa casilla.');
            else if (this.touch) {
                // Sin ratón no hay vista previa al pasar por encima: se enseña el trazado y se pide confirmación.
                this.pending = { ...plan, to: cell };
                this.view.preview = { ...plan, affordable: plan.cost <= g.nations[g.player].gold };
                this.selected = cell;
                this.render();
                return;
            }
            else if (fort ? g.playerFortify(plan) : g.playerBuild(plan)) this.anchor = cell;
        }
        this.view.preview = null;
        this.view.hoverCell = -2;
        this.selected = cell;
        this.render();
    }

    confirmBuild() {
        const g = this.game, plan = this.pending;
        if (!plan) return;
        if (plan.cls === 'fort' ? g.playerFortify(plan) : g.playerBuild(plan)) this.anchor = plan.to;
        this.pending = null;
        this.view.preview = null;
        this.render();
    }

    myCities() { const g = this.game; return PROVINCES.filter(p => g.owner[p.city] === g.player && g.legal[p.city] === g.player); }
    toggleCity(cell) {
        const g = this.game;
        if (cell < 0 || !isLand(cell)) return;
        const p = PROVINCES[G.prov[cell]];
        if (g.owner[p.city] !== g.player || g.legal[p.city] !== g.player) { this.flash('Solo puedes seleccionar ciudades tuyas que no estén en disputa.'); return; }
        if (this.multi.has(p.id)) this.multi.delete(p.id); else this.multi.add(p.id);
        this.render();
    }
    // Cuántas unidades saldrían (y por cuánto oro) reclutando `qty` por ciudad en la selección, ciudad por ciudad.
    multiPlan(type, qty) {
        const g = this.game;
        let gold = g.nations[g.player].gold, units = 0, cost = 0;
        for (const pid of this.multi) {
            const p = PROVINCES[pid];
            if (!g.canRecruitAt(g.player, p)) continue;
            const c = g.unitCost(g.player, type, pid);
            for (let n = Math.min(qty, g.recruitLeft(g.player, p)); n > 0 && gold >= c; n--) { gold -= c; cost += c; units++; }
        }
        return { units, cost };
    }
    renderMultiCard() {
        const g = this.game, el = $('#card'), p0 = g.player, color = g.nations[p0].color;
        for (const pid of [...this.multi]) { const p = PROVINCES[pid]; if (g.owner[p.city] !== p0 || g.legal[p.city] !== p0) this.multi.delete(pid); }
        const list = [...this.multi].map(pid => PROVINCES[pid]);
        const qty = this.recruitQty ?? 1, gold = g.nations[p0].gold;
        const forts = list.map(p => p.city).filter(c => !g.fort[c] && !g.fortWork.has(c));
        const fortCost = g.rules(g.player).fortCost, canFort = Math.min(forts.length, Math.floor(gold / fortCost));
        el.hidden = false;
        el.style.setProperty('--owner', color);
        el.innerHTML = `
            <header class="card-head">
                <div><h2>${list.length ? plural(list.length, 'ciudad seleccionada', 'ciudades seleccionadas') : 'Selecciona ciudades'}</h2>
                <p class="small muted">Haz clic en tus provincias para añadirlas o quitarlas.</p></div>
                <button class="btn ghost" data-action="tool" data-tool="command" aria-label="Cerrar" title="Cerrar (Esc)">✕</button>
            </header>
            <section class="sec"><div class="row">
                <button class="btn" data-action="multi-all">Todas mis ciudades (${this.myCities().length})</button>
                <button class="btn ghost" data-action="multi-none" ${list.length ? '' : 'disabled'}>Ninguna</button></div>
                ${list.length ? `<p class="small muted" style="margin-top:8px">${list.slice(0, 12).map(p => esc(p.cityName)).join(', ')}${list.length > 12 ? ` y ${list.length - 12} más` : ''}</p>` : ''}
            </section>
            ${list.length ? `<section class="sec"><h3>Reclutar en todas</h3>
                <div class="row" style="margin-bottom:8px"><span class="small">Por ciudad</span><div class="seg" style="flex:1">
                    ${[['1', '×1'], ['5', '×5'], ['max', 'Máximo']].map(([v, label]) => `<button data-action="recruit-qty" data-qty="${v}" class="${String(qty) === v || (v === 'max' && qty === Infinity) ? 'on' : ''}">${label}</button>`).join('')}
                </div></div>
                <div class="recruit">${g.recruitTypes(p0).map(k => { const pl = this.multiPlan(k, qty); return `<button class="btn" data-action="multi-recruit" data-unit="${k}" ${pl.units ? '' : 'disabled'}>
                    ${unitIcon(k, color)}${CONFIG.TYPES[k].name}<b>${pl.units} uds</b><small>${pl.cost} oro</small></button>`; }).join('')}</div>
                <p class="note">Se recluta ciudad por ciudad hasta agotar el oro o el cupo de cada una.</p></section>
            <section class="sec"><h3>Fortificar</h3>
                <button class="btn" data-action="multi-fort" ${canFort ? '' : 'disabled'}>Fortificar ${plural(canFort, 'ciudad', 'ciudades')} (${canFort * fortCost} oro)</button>
                <p class="note">Listas en ${g.rules(g.player).fortTurns} turnos. No cuentan las que ya están fortificadas o en obras${canFort < forts.length ? '; no te llega el oro para todas' : ''}.</p></section>` : ''}`;
    }

    renderOpDraftCard() {
        const g = this.game, el = $('#card'), d = this.opDraft, p0 = g.player, redraw = d.redraw ? g.ops.get(d.redraw) : null;
        const used = g.opsOf(p0).length, cap = g.commandCap(p0), full = !redraw && used >= cap;
        const count = d.kind === 'ofensiva' ? (d.cells.length ? `${plural(d.cells.length, 'punto', 'puntos')}; objetivo: ${esc(g.placeName(d.cells[d.cells.length - 1]))}` : 'Sin puntos todavía')
