            else Object.assign(this.rel(lord, a), { state: 'guerra', since: this.turn });
        }
        this.warVersion++;
        return true;
    }
    makePeace(a, b, quiet = false) {
        Object.assign(this.rel(a, b), { state: 'paz', since: this.turn, truceUntil: this.turn + CONFIG.TRUCE_TURNS });
        this.warVersion++;
        if (!quiet) this.log(`PAZ entre ${this.nm(a)} y ${this.nm(b)} (tregua hasta el turno ${this.turn + CONFIG.TRUCE_TURNS}).`);
    }
    // Firma la paz entre el bando de `a` y el de `b` (cada uno con sus satélites) y reparte lo ocupado.
    // terms.mode: 'annex' (cada uno se anexiona lo que ocupa), 'satellite' (b pasa a ser satélite de a) o 'white' (todo vuelve).
    // terms.keep: en 'satellite', si a se queda lo que ocupó. terms.mine: satélite al que a cede lo que ocupó él (−1: para a).
    // terms.satGains: 'self' (lo ocupado por los satélites de a es para ellos) u 'overlord' (para a).
    settlePeace(a, b, terms = { mode: 'annex' }) {
        const sideA = new Set([a, ...this.satellitesOf(a)]), sideB = new Set([b, ...this.satellitesOf(b)]);
        for (const [c, s] of [...this.sieges]) if ((sideA.has(s.by) && sideB.has(s.prev)) || (sideB.has(s.by) && sideA.has(s.prev))) this.sieges.delete(c);
        let gainedA = 0, gainedB = 0;
        for (const i of G.land) {
            const o = this.owner[i], l = this.legal[i];
            if (o === l) continue;
            const aGain = sideA.has(o) && sideB.has(l), bGain = sideB.has(o) && sideA.has(l);
            if (!aGain && !bGain) continue;
            if (terms.mode === 'white' || (terms.mode === 'satellite' && (bGain || !terms.keep))) { this.owner[i] = l; continue; }
            if (aGain) {
                let to = o;
                if (o === a && terms.mine >= 0 && sideA.has(terms.mine)) to = terms.mine;
                else if (o !== a && terms.satGains === 'overlord') to = a;
                this.owner[i] = to;
                this.legal[i] = to;
                gainedA++;
            } else {
                this.legal[i] = o;
                gainedB++;
            }
        }
        for (const x of sideA) for (const y of sideB) if (this.atWar(x, y)) this.makePeace(x, y, true);
        const what = terms.mode === 'white' ? 'paz blanca: cada uno recupera lo suyo'
            : terms.mode === 'satellite' ? `${this.nm(b)} pasa a ser satélite de ${this.nm(a)}`
            : `${this.nm(a)} se anexiona ${plural(gainedA, 'casilla', 'casillas')} y ${this.nm(b)} ${gainedB}`;
        this.log(`PAZ entre ${this.nm(a)} y ${this.nm(b)}: ${what}. Tregua hasta el turno ${this.turn + CONFIG.TRUCE_TURNS}.`);
        this.version++;
        if (terms.mode === 'satellite') this.makeSatellite(b, a);
        this.evictArmies();
        this.checkGameOver();
    }
    makeSatellite(sat, lord) {
        const s = this.nations[sat];
        for (const bl of this.blocsOf(sat)) this.leaveBloc(bl, sat, ' al pasar a ser un estado satélite');
        s.overlord = lord;
        this.blocsChanged();
        // Hace la paz con quien no esté en guerra con su señor y entra en las guerras de su señor.
        for (const e of this.enemiesOf(sat)) if (!this.atWar(lord, e)) this.settlePeace(sat, e, { mode: 'annex' });
        for (const e of this.enemiesOf(lord)) if (!this.atWar(sat, e)) Object.assign(this.rel(sat, e), { state: 'guerra', since: this.turn });
        this.warVersion++;
        this.proposals = this.proposals.filter(p => p.from !== sat);
        this.version++;
    }
    // Tras un tratado, los ejércitos que han quedado en territorio de un país en paz vuelven a la casilla propia más cercana.
    // Los que están en el mar se quedan: en paz, la IA los lleva a su costa (aiSailHome).
    evictArmies() {
        for (const a of [...this.armies.values()]) {
            if (afloat(a.cell)) continue;   // el mar no es de nadie
            const o = this.owner[a.cell];
            if (o === a.owner || this.allied(a.owner, o) || this.atWar(a.owner, o)) continue;
            const seen = new Set([a.cell]), queue = [a.cell];
            let dest = -1;
            for (let i = 0; i < queue.length && dest < 0 && i < 4000; i++) {
                for (let d = 0; d < 6; d++) {
                    const v = G.nb[queue[i] * 6 + d];
                    if (v < 0 || seen.has(v)) continue;
                    seen.add(v);
                    if (isLand(v) && this.owner[v] === a.owner) { const other = this.armyOn(v); if (!other || other.owner === a.owner) { dest = v; break; } }
                    queue.push(v);
                }
            }
            this.removeArmy(a);
            if (dest >= 0) { a.cell = dest; a.used = 999; this.armies.set(a.id, a); this.settle(a); }
        }
    }
    // ¿Está `ai` claramente vencido por el jugador y sus satélites? (capital ocupada, el 40 % de su tierra o un tercio de su fuerza)
    isCrushed(ai) {
        const side = new Set([this.player, ...this.satellitesOf(this.player)]);
        let legalCells = 0, occupied = 0;
        for (const i of G.land) if (this.legal[i] === ai) { legalCells++; if (side.has(this.owner[i])) occupied++; }
        const powers = this.powers(), mine = [...side].reduce((s, x) => s + powers[x], 0);
        return side.has(this.owner[this.nations[ai].capitalCell]) || occupied >= legalCells * 0.4 || powers[ai] < mine * 0.35;
    }
    // Casillas ocupadas por cada bando en la guerra entre el jugador y `t`.
    occupation(t) {
        const sideA = new Set([this.player, ...this.satellitesOf(this.player)]), sideB = new Set([t, ...this.satellitesOf(t)]);
        let mine = 0, sats = 0, theirs = 0;
        const provs = new Set();
        for (const i of G.land) {
            const o = this.owner[i], l = this.legal[i];
            if (o === l) continue;
            if (sideA.has(o) && sideB.has(l)) { if (o === this.player) mine++; else sats++; provs.add(G.prov[i]); }
            else if (sideB.has(o) && sideA.has(l)) theirs++;
        }
        return { mine, sats, theirs, provinces: provs.size };
    }
    acceptsPeace(ai, terms, offered) {
        if (terms.mode === 'satellite') return this.isCrushed(ai);
        if (offered || this.wantsPeace(ai, this.player) || this.isCrushed(ai)) return true;
        const occ = this.occupation(ai);
        return terms.mode === 'annex' && occ.theirs > occ.mine + occ.sats && this.rng() < 0.6;   // si gana, acepta quedarse lo ocupado
    }
    wantsPeace(ai, other, powers = this.powers()) {
        const r = this.rel(ai, other);
        if (r.state !== 'guerra') return false;
        return powers[ai] < powers[other] * this.ai.peaceRatio || (this.turn - r.since >= this.ai.peaceAfter && this.rng() < 0.25);
    }
    // ¿Acepta `ai` entrar en `bloc` (o fundar uno con `inviter` si bloc es null)?
    acceptsBloc(ai, bloc, inviter) {
        const members = bloc ? [...bloc.members] : [inviter];
        if (members.includes(ai) || members.some(m => this.atWar(ai, m))) return false;
        if (members.some(m => this.enemiesOf(m).some(e => this.allied(ai, e)))) return false;   // chocaría con sus aliados
        const powers = this.powers();
        const shared = this.enemiesOf(ai).some(e => members.some(m => this.atWar(m, e)));
        const strength = members.reduce((s, m) => s + powers[m], 0);
        let p = shared ? 0.8 : 0.12;
        if (strength > 2 * powers[ai]) p += 0.15;
        if (bloc?.secret) p -= 0.05;
        return this.rng() < p;
    }
    // ¿Admite el bloque a `applicant`? Decide su miembro más fuerte.
    admits(bloc, applicant) {
        const members = [...bloc.members];
        if (members.some(m => this.atWar(m, applicant))) return false;
        const powers = this.powers();
        const shared = this.enemiesOf(applicant).some(e => members.some(m => this.atWar(m, e)));
        const leader = members.sort((x, y) => powers[y] - powers[x])[0];
        const p = 0.25 + (shared ? 0.45 : 0) + (powers[applicant] >= powers[leader] * 0.3 ? 0.15 : 0);
        return this.rng() < p;
    }

    // --- Acciones del jugador ---
    playerMove(army, send, dest) {
        if (this.over || army.owner !== this.player) return null;
        if (UNIT_KEYS.some(k => (send[k] || 0) < 0 || (send[k] || 0) > (army.units[k] || 0)) || countUnits(send) === 0) return null;
        const r = this.reach(army.owner, army.cell, this.moveBudget(army.owner, army.cell, send, army.used), army.used === 0);
        const isAttack = r.attacks.has(dest);
        if (!isAttack && !this.destinations(r).has(dest)) return null;
        const mover = this.split(army, copyUnits(send));
        mover.direct = this.turn;   // orden directa: este turno no cumple la suya
        if (isAttack) { this.attack(mover, r.attacks.get(dest), dest, r); return this.armyOn(dest) ?? this.armyOn(r.attacks.get(dest)); }
        return this.moveArmy(mover, dest, r);
    }
    // Da una orden de varios turnos a un ejército del jugador y la empieza a cumplir ya, si puede moverse.
    playerOrder(army, order) {
        if (this.over || army?.owner !== this.player) return null;
        if (!this.setOrder(army, order)) { this.log('No se puede dar esa orden: el destino tiene que ser tuyo, de un aliado o de un enemigo en guerra.'); return null; }
        army.direct = 0;   // una orden nueva vale ya, aunque lo hayas movido a mano este turno
        const res = this.stepOrder(army);
        if (res === 'arrived') this.log('El ejército ha llegado a su destino.');
        else if (res === 'cancelled') this.log('No hay paso hasta ese destino: la orden se cancela.');
        return res;
    }
    playerClearOrder(army) { if (army?.owner === this.player) this.clearOrder(army); }
    playerCommand(key, value) {
        const c = this.nations[this.player].command;
        if (key === 'posture') this.setPosture(this.player, value);
        else if (key === 'spend' || key === 'rear') c[key] = !c[key];
        else if (key === 'share') c.share = Math.max(0, Math.min(100, Math.round(+value) || 0));
        else if (key in BUDGET_KEYS) c.budget[key] = Math.max(0, Math.min(100, Math.round(+value) || 0));
        else if (key === 'priority') { const [nation, level] = String(value).split(':'); if (Object.hasOwn(PRIORITY, level)) c.priority[+nation] = level; }
        this.orderVersion++;
    }
    playerSaveTemplate(name, units) {
        const list = this.nations[this.player].templates;
        if (!countUnits(units) || list.length >= TPL_OWN_MAX) return false;
        const own = copyUnits(units);
        for (const k of Object.keys(own)) own[k] = Math.min(TPL_MAX, Math.max(0, Math.trunc(own[k] || 0)));
        list.push({ name: String(name).trim().slice(0, 40) || `Plantilla ${list.length + 1}`, units: own });
        return true;
    }
    playerDeleteTemplate(i) {
        const n = this.nations[this.player], key = `c${i}`;
        if (!n.templates[i]) return;
        n.templates.splice(i, 1);
        // Las operaciones que la usaban pasan a la sugerida; las que usaban una posterior, se corren un puesto.
        for (const op of this.opsOf(this.player)) {
            if (op.template === key) op.template = 'auto';
            else if (/^c\d+$/.test(op.template) && +op.template.slice(1) > i) op.template = `c${+op.template.slice(1) - 1}`;
        }
    }
    playerCreateOp(kind, cells) {
        if (this.over || this.player === null) return null;
        const op = this.createOp(this.player, kind, cells);
        if (!op) return null;
        const got = this.nearbyFree(op, kind === 'reserva' ? 2 : 3);
        for (const a of got) this.assignArmy(a, op.id);
        this.shareForces(this.player, { free: false });
        const from = new Set(got.map(a => G.prov[a.cell])).size;
        this.log(`Nueva operación: ${op.name}${got.length ? `, con ${plural(got.length, 'ejército', 'ejércitos')}${kind === 'ofensiva' && from > 1 ? ` de ${from} provincias` : ''}` : ''}.`);
        return op;
    }
    playerRedrawOp(op, cells) {
        if (!op || op.owner !== this.player) return null;
        const probe = this.createOp(this.player, op.kind, cells, { name: op.name, noCap: true });   // valida el trazado como si fuera nueva
        if (!probe) return null;
        this.ops.delete(probe.id);
        this.nextOpId--;
        op.cells = probe.cells;
        if (op.kind === 'defensa') { op.drawn = [...probe.cells]; op.state = 'aguanta'; }
        op.waiting = 0;
        this.orderVersion++;
        this.log(`${op.name}: nuevo trazado.`);
        return op;
    }
    playerOpSet(op, key, value) {
        if (!op || op.owner !== this.player) return;
        if (key === 'ratio' && [1, 1.3, 1.8].includes(value)) op.ratio = value;
        else if (key === 'auto' && ['manual', 'asistida', 'auto'].includes(value)) op.auto = value;
        else if (key === 'paused' || key === 'fortify') op[key] = !!value;
        else if (key === 'name') op.name = String(value).trim().slice(0, 60) || op.name;
        else if (key === 'gold' && OP_GOLD.includes(value)) op.gold = value;
        else if (key === 'template' && (value === 'auto' || this.templateOf(op.owner, value))) { op.template = value; if (op.form && !countUnits(op.form.recruited)) op.form = null; }
        this.orderVersion++;
    }

    // Recluta hasta `qty` unidades (Infinity: todas las que permitan el oro y el cupo).
    playerRecruit(p, type, qty = 1) {
        if (this.over) return;
        let n = 0;
        while (n < qty && this.recruit(this.player, p, type)) n++;
        if (n) this.log(`Reclutas ${n} ${n === 1 ? CONFIG.TYPES[type].name.toLowerCase() : `unidades de ${CONFIG.TYPES[type].name.toLowerCase()}`} en ${p.cityName}.`);
        else this.log("No se puede reclutar ahí (fondos o cupo de la provincia agotados).");
    }
    playerRecruitMany(pids, type, qty) {
        if (this.over) return 0;
        let units = 0, cities = 0;
        for (const pid of pids) {
            const p = PROVINCES[pid];
            let n = 0;
            while (n < qty && this.recruit(this.player, p, type)) n++;
            if (n) { units += n; cities++; }
        }
        if (units) this.log(`Reclutas ${units} ${units === 1 ? CONFIG.TYPES[type].name.toLowerCase() : `unidades de ${CONFIG.TYPES[type].name.toLowerCase()}`} en ${plural(cities, 'ciudad', 'ciudades')}.`);
        else this.log('No se pudo reclutar: sin oro o sin cupo en esas ciudades.');
        return units;
    }
    playerBuild(plan) {
        if (this.over || !plan) return false;
        if (plan.cost > this.nations[this.player].gold) { this.log(`Fondos insuficientes: la obra cuesta ${plan.cost}g.`); return false; }
        const built = this.buildRoad(this.player, plan);
        if (!built) { this.log(`Ese trazado ya es ${plan.cls === 2 ? 'autopista' : 'carretera'}.`); return true; }
        this.log(`Construyes ${plan.cls === 2 ? 'autopista' : 'carretera'}: ${built} tramos por ${plan.cost}g.`);
        return true;
    }
    playerUpgradeRoad(plan) {
        if (this.over || !plan) return false;
        if (plan.cost > this.nations[this.player].gold) { this.log(`Fondos insuficientes: la autopista cuesta ${plan.cost}g.`); return false; }
        const n = this.upgradeRoad(this.player, plan);
        if (n) this.log(`Pasas a autopista ${plural(n, 'tramo', 'tramos')} de carretera por ${plan.cost}g (solo la diferencia).`);
        return n > 0;
    }
    playerFortify(plan) {
        if (this.over || !plan) return false;
        if (!plan.cells.length) { this.log("Esas casillas ya están fortificadas o en obras."); return true; }
        if (plan.cost > this.nations[this.player].gold) { this.log(`Fondos insuficientes: la fortificación cuesta ${plan.cost}g.`); return false; }
        const n = this.buildFort(this.player, plan);
        this.log(`Empiezas a fortificar ${n} casilla${n > 1 ? 's' : ''} por ${plan.cost}g: listas en ${this.rules(this.player).fortTurns} turnos.`);
        return true;
    }
    playerDiplomacy(action, target) {
        const p = this.player;
        if (this.over || target === p || !this.nations[target].alive) return;
        if (action === 'war') {
            if (!this.declareWar(p, target)) this.log(`No puedes declarar la guerra a ${this.nm(target)} ahora.`);
        }
    }
    playerPeace(target, terms) {
        const p = this.player, key = `paz${target}`;
        const offered = this.proposals.findIndex(x => x.kind === 'paz' && x.from === target);
        if (this.over || !this.atWar(p, target) || (offered < 0 && this.proposedThisTurn.has(key))) return false;
        this.proposedThisTurn.add(key);
        if (!this.acceptsPeace(target, terms, offered >= 0)) {
            this.log(`${this.nm(target)} rechaza tus condiciones de paz.`);
            return false;
        }
        if (offered >= 0) this.proposals.splice(offered, 1);
        this.settlePeace(p, target, terms);
        return true;
    }
    // Pedir a un aliado que entre en la guerra contra `target`: probabilidad de que acepte (sin azar).
    callToWarOdds(ally, target) {
        const p = this.player;
        if (!this.nations[ally].alive || !this.allied(ally, p) || this.nations[ally].overlord >= 0 || this.atWar(ally, target)
            || !this.atWar(p, target) || this.turn < this.rel(ally, target).truceUntil) return 0;
        const powers = this.powers();
        const side = id => powers[id] + this.knownAllies(ally, id).filter(x => x !== ally && x !== p).reduce((s, x) => s + powers[x], 0);
        let odds = 0.3;
        if (this.borderSets()[ally].has(target)) odds += 0.2;
        if (powers[ally] + powers[p] > 1.5 * side(target)) odds += 0.2;
        if (this.enemiesOf(ally).length > this.ai.maxWars) odds -= 0.25;
        if (this.allied(ally, target)) odds -= 0.4;   // tendría que romper con un aliado suyo
        const mood = { pacifica: 0.5, normal: 1, agresiva: 1.3, caos: 1.6 }[this.settings.aggression] ?? 1;
        return Math.max(0, Math.min(0.95, odds * mood));
    }
    playerCallToWar(ally, target) {
        const key = `call${ally}:${target}`;
        if (this.over || this.proposedThisTurn.has(key)) return false;
        this.proposedThisTurn.add(key);
        if (this.rng() >= this.callToWarOdds(ally, target)) {
            this.log(`${this.nm(ally)} no quiere entrar en tu guerra contra ${this.nm(target)}.`);
            return false;
        }
        this.log(`${this.nm(ally)} acepta entrar en la guerra a tu lado contra ${this.nm(target)}.`);
        return this.declareWar(ally, target);
    }
    playerAnnexProvince(pid) {
        const p = PROVINCES[pid], sat = this.owner[p.city], me = this.player;
        if (this.over || sat < 0 || this.nations[sat].overlord !== me) return;
        for (const c of p.cells) {
            if (this.owner[c] !== sat) continue;
            this.owner[c] = me;
            this.legal[c] = me;
            const a = this.armyOn(c);
            if (a && a.owner === sat) this.changeOwner(a, me);
        }
        this.armyVersion++;
        this.version++;
        this.log(`Te anexionas ${p.name}, que era de tu satélite ${this.nm(sat)}.`);
        if (!PROVINCES.some(q => this.owner[q.city] === sat)) this.playerAnnexSatellite(sat);
        this.checkGameOver();
    }
    playerAnnexSatellite(sat) {
        const s = this.nations[sat], me = this.player;
        if (this.over || s.overlord !== me) return;
        for (const i of G.land) {
            if (this.owner[i] === sat) this.owner[i] = me;
            if (this.legal[i] === sat) this.legal[i] = this.owner[i] === me ? me : this.owner[i];
        }
        for (const a of this.armies.values()) if (a.owner === sat) this.changeOwner(a, me);
        for (const op of this.opsOf(sat)) this.endOp(op);
        for (const a of [...this.armies.values()]) if (a.owner === me) this.settle(a);
        this.nations[me].gold += s.gold;
        s.alive = false;
        s.overlord = -1;
        for (const o of this.nations) if (o.id !== sat) Object.assign(this.rel(sat, o.id), { state: 'paz' });
        this.warVersion++;
        this.blocsChanged();
        this.armyVersion++;
        this.version++;
        this.log(`Te anexionas ${s.name} entera: su territorio, su ejército y su tesoro pasan a ser tuyos.`);
        this.checkGameOver();
    }
    playerReleaseSatellite(sat) {
        const s = this.nations[sat];
        if (this.over || s.overlord !== this.player) return;
        s.overlord = -1;
        this.blocsChanged();
        this.log(`Concedes la independencia a ${s.name}.`);
    }
    playerCreateBloc(name, secret) {
        if (this.over) return null;
        const clean = name.trim().slice(0, 40) || `Pacto de ${this.nations[this.player].capitalName}`;
        const bloc = this.createBloc(this.player, clean, secret);
        this.blocsChanged();
        this.log(`Fundas ${secret ? 'el pacto secreto' : 'la alianza'} «${clean}».`);
        return bloc;
    }
    playerInvite(blocId, target) {
        const bloc = this.bloc(blocId), key = `inv${blocId}:${target}`;
        if (this.over || !bloc || !bloc.members.has(this.player) || bloc.members.has(target) || this.proposedThisTurn.has(key)) return;
        this.proposedThisTurn.add(key);
        if (this.acceptsBloc(target, bloc, this.player)) this.joinBloc(bloc, target);
        else this.log(`${this.nm(target)} rechaza unirse a ${bloc.name}.`);
    }
    playerRequestJoin(blocId) {
        const bloc = this.bloc(blocId), key = `req${blocId}`;
        if (this.over || !bloc || bloc.members.has(this.player) || this.proposedThisTurn.has(key)) return;
        this.proposedThisTurn.add(key);
        if (this.admits(bloc, this.player)) this.joinBloc(bloc, this.player);
        else this.log(`${bloc.name} rechaza tu solicitud de ingreso.`);
    }
    playerLeaveBloc(blocId) {
        const bloc = this.bloc(blocId);
        if (bloc) this.leaveBloc(bloc, this.player);
    }
    answerProposal(index, accept, ignored = false) {
        const pr = this.proposals.splice(index, 1)[0];
        if (!pr) return;
        const p = this.player, verb = ignored ? 'Ignoras' : 'Rechazas';
        if (pr.kind === 'llamada') {
            if (accept && !this.atWar(p, pr.against)) {
                for (const bl of this.sharedBlocs(p, pr.against)) this.leaveBloc(bl, p, ` para defender a ${this.nm(pr.from)}`);
                Object.assign(this.rel(p, pr.against), { state: 'guerra', since: this.turn });
                this.warVersion++;
                this.log(`Acudes en defensa de ${this.nm(pr.from)}: guerra contra ${this.nm(pr.against)}.`);
            } else if (!accept) {
                this.log(`${verb} la llamada de ${this.nm(pr.from)}.`);
                for (const bl of this.sharedBlocs(p, pr.from)) this.leaveBloc(bl, p, ` por abandonar a ${this.nm(pr.from)}`);
            }
            return;
        }
        if (!accept) { this.log(`${verb} la propuesta de ${pr.kind === 'paz' ? 'paz' : 'alianza'} de ${this.nm(pr.from)}.`); return; }
        if (pr.kind === 'paz' && this.atWar(pr.from, p)) this.settlePeace(p, pr.from, { mode: 'annex' });
        else if (pr.kind === 'bloque' && !this.atWar(pr.from, p)) {
            let bloc = pr.blocId ? this.bloc(pr.blocId) : null;
            if (!bloc) { bloc = this.createBloc(pr.from, `Pacto de ${this.nations[pr.from].capitalName}`, false); this.blocsChanged(); this.log(`Nace ${bloc.name}.`); }
            this.joinBloc(bloc, p);
        }
    }

    // --- IA ---
    aiTurn(id) {
        const powers = this.powers();
        this.aiDiplomacy(id, powers);
        this.aiResearch(id);
        this.aiForts(id);   // antes de reclutar: en guerra el reclutamiento gasta todo el oro
        this.aiRepairs(id);   // también antes de reclutar, por lo mismo
        this.aiAir(id);   // y su aviación, para la que aparta oro al reclutar
        this.aiPockets(id);   // antes de sus ataques: los que pasan hambre salen de la bolsa
        this.aiCommand(id, powers);
        this.aiRecruit(id);
        this.aiArmies(id);   // los ejércitos que no están en ninguna operación
        if (!this.over) this.aiRoads(id);
    }

    aiDiplomacy(id, powers) {
        const S = this.ai;
        if (this.nations[id].overlord >= 0) return;   // un satélite sigue la política de su señor
        for (const e of this.enemiesOf(id)) {
            if (this.nations[e].overlord >= 0 || !this.atWar(id, e) || !this.wantsPeace(id, e, powers)) continue;   // con un satélite se negocia a través de su señor
            if (e === this.player) { if (!this.proposals.some(p => p.kind === 'paz' && p.from === id)) this.proposals.push({ kind: 'paz', from: id }); }
            else if (this.wantsPeace(e, id, powers) || this.rng() < 0.3) this.settlePeace(id, e, { mode: 'annex' });
        }
        const enemies = this.enemiesOf(id);
        if (enemies.length <= S.maxWars && this.turn >= S.warFrom && this.rng() < S.warChance) {
            const side = t => powers[t] + this.knownAllies(id, t).filter(x => x !== id).reduce((s, x) => s + powers[x], 0);
            const target = [...this.borderSets()[id]]
                .filter(b => this.nations[b].alive && !this.atWar(id, b) && this.turn >= this.rel(id, b).truceUntil
                    && (!this.allied(id, b) || this.rng() < S.betrayChance))
                .sort((x, y) => side(x) - side(y))[0];
            if (target !== undefined && powers[id] > S.warRatio * side(target)) this.declareWar(id, target);
        }
        if (enemies.length && this.rng() < S.blocChance) {
            const partner = this.nations.find(n => n.alive && n.id !== id && !this.allied(id, n.id) && !this.atWar(id, n.id)
                && enemies.some(e => this.atWar(n.id, e)));
            if (!partner) return;
            const own = this.blocs.find(b => b.founder === id && b.members.has(id));
            if (partner.id === this.player) {
                if (!this.proposals.some(p => p.kind === 'bloque' && p.from === id)) this.proposals.push({ kind: 'bloque', from: id, blocId: own?.id ?? null });
            } else if (this.acceptsBloc(partner.id, own ?? null, id)) {
                const bloc = own ?? this.createBloc(id, `Pacto de ${this.nations[id].capitalName}`, false);
                if (!own) { this.blocsChanged(); this.log(`Nace ${bloc.name}.`); }
                this.joinBloc(bloc, partner.id);
            }
        }
    }

    // Distancia (en pasos) a `sources` por terreno transitable para la nación `id` (incluye el mar).
    field(id, sources) {
        const dist = new Int32Array(G.N).fill(1e9), queue = new Int32Array(G.N);
        let head = 0, tail = 0;
        for (const s of sources) { dist[s] = 0; queue[tail++] = s; }
        while (head < tail) {
            const u = queue[head++];
            for (let d = 0; d < 6; d++) {
                const v = G.nb[u * 6 + d];
                if (v < 0 || dist[v] <= dist[u] + 1) continue;
                if (isLand(v)) {
                    const o = this.owner[v];
                    if (!(o === id || this.allied(id, o) || this.atWar(id, o))) continue;
                }
                dist[v] = dist[u] + 1;
                queue[tail++] = v;
            }
        }
        return dist;
    }

    // En paz guarda cuatro turnos de renta, o lo que cueste la próxima investigación si tiene el laboratorio libre.
    aiReserve(id) {
        if (this.enemiesOf(id).length) return 0;
        const base = this.income(id) * 4;
        if (this.nations[id].tech.current.length >= this.rules(id).labs) return base;
        const next = this.aiTechChoice(id);
        return next && this.techState(id, next) === 'open' ? Math.max(base, this.researchCost(id, next)) : base;
    }

    // Qué investigaría la nación ahora: lo que tenga en pausa o la investigación disponible con más peso.
    // En guerra pesan su tipo de tropa, Doctrina y Fortificación; en paz, Ciencia, Industria, Infraestructura y
    // Movilización; Movilidad si su tierra es abrupta. No investiga Inteligencia (Reconocimiento ni Espionaje): con
    // niebla, la IA se arregla con lo que ve.
    // El desempate es fijo por nación (no consume azar), así ahorra para el mismo objetivo turno tras turno.
    aiTechChoice(id) {
        const key = `${this.turn}:${this.techVersion}:${this.version}:${this.blocVersion}:${this.airVersion}`, s = this.nations[id].tech;
        if (s.aiChoice?.key === key) return s.aiChoice.tech;
        let tech = TECHS.find(t => this.techState(id, t.id) === 'paused')?.id ?? null;
        if (!tech) {
            const war = this.enemiesOf(id).length > 0, fierce = ['agresiva', 'caos'].includes(this.settings.aggression);
            const troops = emptyUnits();
            for (const a of this.armies.values()) if (a.owner === id) for (const k of UNIT_KEYS) troops[k] += (a.units[k] || 0) * CONFIG.TYPES[k].cost;
            let land = 0, rough = 0;
            for (const i of G.land) if (this.owner[i] === id) { land++; if (['mountain', 'hills', 'forest', 'marsh'].includes(CELL_TERRAIN[i])) rough++; }
            // Aviación: la suya (escuadrones), la de sus enemigos y la de sus vecinos mueven Aviación, Defensa aérea y Espacio.
            const wings = new Array(this.nations.length).fill(0);
            for (const q of this.squadrons.values()) wings[q.owner]++;
            const air = wings[id], foeAir = this.enemiesOf(id).some(o => wings[o]), nearAir = [...this.borderSets()[id]].some(o => wings[o]);
            const main = UNIT_BRANCH[UNIT_KEYS.reduce((b, k) => (troops[k] > troops[b] ? k : b), 'infantry')];
            const weight = {
                infanteria: 1, blindados: 1, artilleria: 1, doctrina: war ? 2 : 0.6,
                movilizacion: war ? 1 : 2, ciencia: war ? 0.5 : 3, industria: war ? 0.5 : 2.5, infraestructura: war ? 0.5 : 2,
                movilidad: rough > land * 0.3 ? 2 : 0.5, naval: this.needsSea(id) ? 2 : 0.3, fortificacion: war ? 2 : 0.5, reconocimiento: 0, espionaje: 0,
                aviacion: air >= 2 ? (war ? 1.5 : 0.5) : 0.1,
                antiaerea: war && foeAir ? 1.5 : nearAir ? 0.5 : 0.2,
                espacio: war && air >= 6 ? 0.4 : 0
            };
            weight[main] += war ? 2 : 0.5;
            if (fierce) for (const b of ['infanteria', 'blindados', 'artilleria', 'doctrina']) weight[b] *= 1.5;
            let best = 0;
            TECHS.forEach((t, k) => {
                if (this.techState(id, t.id) !== 'open') return;
                const score = weight[t.branch] / t.tier * (1 + ((id * 7919 + k * 104729) % 1000) / 2000);
                if (score > best) { best = score; tech = t.id; }
            });
        }
        s.aiChoice = { key, tech };
        return tech;
    }
    // Empieza la investigación elegida si tiene laboratorio libre y oro: en guerra, solo si aun así le quedan tres
    // turnos de renta para reclutar.
    aiResearch(id) {
        const n = this.nations[id];
        if (n.tech.current.length >= this.rules(id).labs) return;
        const tech = this.aiTechChoice(id);
        if (!tech) return;
        if (this.techState(id, tech) === 'paused') { this.startResearch(id, tech); return; }
        const cost = this.researchCost(id, tech);
        const keep = this.enemiesOf(id).length ? this.income(id) * 3 : 0;
        if (n.gold >= cost + keep) this.startResearch(id, tech);
    }

    aiRecruit(id) {
        const n = this.nations[id];
        const enemies = this.enemiesOf(id);
        // En guerra, mientras le falte aviación (lo dice aiAir), aparta para ella una parte de su renta cada turno, hasta
        // el precio de un escuadrón; con eso aiAir lo compra. Si ya no le hace falta, lo apartado vuelve a las tropas.
        n.airFund = enemies.length && this.airSave?.get(id) === this.turn
            ? Math.min(CONFIG.AIR.SQUADRON_COST, n.airFund + Math.round(AI_AIR_SHARE * Math.max(0, this.income(id)))) : 0;
        const reserve = this.aiReserve(id) + n.airFund;
        let cities = this.citiesOf(id);
        if (!cities.length) return;
        if (enemies.length) {
            const dist = this.frontField(id);
            cities = cities.sort((x, y) => dist[x.city] - dist[y.city]);
        } else {
            // Barajado Fisher-Yates: consume siempre los mismos números aleatorios (sort con comparador aleatorio no).
            for (let i = cities.length - 1; i > 0; i--) {
                const j = Math.floor(this.rng() * (i + 1));
                [cities[i], cities[j]] = [cities[j], cities[i]];
            }
        }
        // Con Defensa aérea 3 y en guerra contra quien tiene escuadrones, de vez en cuando una antiaérea (con la misma
        // tirada que elige el tipo: no gasta números aleatorios de más).
        const aa = enemies.length && this.rules(id).mobileAA && [...this.squadrons.values()].some(q => enemies.includes(q.owner));
        for (let guard = 0; guard < 200 && n.gold - reserve >= this.unitCost(id, 'infantry'); guard++) {
            const p = cities.find(c => this.canRecruitAt(id, c));
            if (!p) break;
            const r = this.rng(), budget = n.gold - reserve;
            let type = 'infantry';
            if (aa && budget >= this.unitCost(id, 'antiair', p.id) && r >= AI_ANTIAIR) type = 'antiair';
            else if (budget >= this.unitCost(id, 'artillery', p.id) && r < 0.2) type = 'artillery';
            else if (budget >= this.unitCost(id, 'tank', p.id) && r < 0.55) type = 'tank';
            if (!this.recruit(id, p, type)) break;
        }
    }

    // Cada ejército libre ataca lo que tenga a tiro con ventaja (también un barco enemigo) o avanza hacia la ciudad
    // enemiga más cercana. El que tiene camino por tierra se guía por él y del mar solo usa los cruces cortos; el que no
    // lo tiene (una isla, otro continente) se guía por el mar y embarca. Nunca acaba el turno en un mar expuesto si no
    // es para atacar.
    aiArmies(id) {
        const enemies = this.enemiesOf(id);
        if (!enemies.length) { this.aiSailHome(id); return; }
        const targets = PROVINCES.filter(p => enemies.includes(this.owner[p.city])).map(p => p.city);
        if (!targets.length) { this.aiSailHome(id); return; }
        const land = this.landSteps(id, targets);
        let sea = null;   // pasos contando el mar: solo si algún ejército no tiene camino por tierra
        const mine = [...this.armies.values()].filter(a => a.owner === id && this.mp(a) > 0 && !a.op && !a.form)
            .sort((x, y) => unitPower(y.units, 'atk', this.rules(id)) - unitPower(x.units, 'atk', this.rules(id)));
        for (const army0 of mine) {
            if (this.over) return;
            if (!this.armies.has(army0.id) || army0.owner !== id || this.mp(army0) <= 0) continue;
            if (this.sieges.get(army0.cell)?.by === id) continue;   // mantiene el asedio
            let army = army0;
            const onCity = CITY_OF[army.cell] >= 0;
            if (onCity && unitPower(army.units, 'atk', this.rules(id)) <= 10) continue;               // guarnición
            if (onCity && army.units.infantry >= 1 && countUnits(army.units) > 1) {   // deja una infantería de guarnición
                const send = copyUnits(army.units); send.infantry--;
                army = this.split(army, send);
            }
            const r = this.reach(id, army.cell, this.mp(army), army.used === 0);
            const trapped = this.hostileSides(id, army.cell);
            const byLand = land[army.cell] < 1e9, dist = byLand ? land : (sea ??= this.field(id, targets));
            let best = null, bestScore = 0;
            for (const [target, from] of r.attacks) {
                const def = this.armyOn(target);
                const fx = this.combatFactors(id, army.units, from, def, target, army.id);
                // Rodeada, le basta una ventaja menor para atacar y prefiere romper el cerco antes que huir.
                const need = trapped >= CONFIG.FLANKED_SIDES ? 1.1 : 1.3;
                let ratio = fx.atk / fx.dfn, list = null;
                if (ratio < need) {   // sola no llega: prueba con los suyos libres que también llegan a esa casilla
                    const j = this.aiJoint(id, army, from, r, def, target, need, fx);
                    if (!j) continue;
                    ({ list, ratio } = j);
                }
                const score = 1000 + Math.min(ratio, 5) * 20 + (CITY_OF[target] >= 0 ? 300 : 0) + (trapped >= CONFIG.FLANKED_SIDES ? 200 : 0);
                if (score > bestScore) { bestScore = score; best = { kind: 'attack', target, from, list }; }
            }
            for (const v of this.destinations(r)) {
                if (afloat(v) && (byLand || this.exposedAtSea(id, v))) continue;   // por tierra no embarca; al mar expuesto, no
                const hostile = this.atWar(id, this.owner[v]);
                const gain = dist[army.cell] - dist[v];
                if (gain <= 0 && !(CITY_OF[v] >= 0 && hostile) && !(trapped >= CONFIG.FLANKED_SIDES && this.hostileSides(id, v) < trapped)) continue;
                const escape = trapped >= CONFIG.FLANKED_SIDES ? (trapped - this.hostileSides(id, v)) * 120 : 0;   // rodeada: retirarse vale más
                const score = gain * 10 + escape + (CITY_OF[v] >= 0 && hostile ? 600 : 0) + (RESOURCE_AT.has(v) && hostile ? 150 : 0) + (hostile ? 2 : 0);
                if (score > bestScore) { bestScore = score; best = { kind: 'move', target: v }; }
            }
            if (!best) { this.settle(army); continue; }
            if (best.kind === 'attack' && best.list) this.attackJoint(best.list, best.target);
            else if (best.kind === 'attack') this.attack(army, best.from, best.target, r);
            else this.moveArmy(army, best.target, r);
        }
    }
    // Ataque conjunto de la IA: a `army`, que sola no llega a `need` contra `def`, le suma sus ejércitos libres (sin
    // operación, formación ni orden; no los que guardan una ciudad o mantienen un asedio) que también pueden atacar
    // `target`, de más a menos ataque, hasta llegar. Devuelve { list, ratio } (list, para attackJoint), o null si ni con todos llega.
    // `fx` son los factores de `army` sola: antes de calcular alcances, descarta lo que ni sumando todo el ataque de los
    // libres que quizá lleguen (inStrike) podría llegar.
    aiJoint(id, army, from, r, def, target, need, fx) {
        const ids = new Set();
        let most = fx.atk;
        for (const a of this.armies.values()) {
            if (a.owner !== id || a === army || a.used >= 999 || a.op || a.form || a.order) continue;
            if (CITY_OF[a.cell] >= 0 || this.sieges.get(a.cell)?.by === id || this.armyOn(a.cell) !== a || !this.inStrike(a, target)) continue;
            ids.add(a.id); most += unitPower(a.units, 'atk', this.rules(id));
        }
        if (!ids.size || most < need * fx.dfn / CONFIG.RIVER_DEFENSE) return null;
        const part = x => ({ units: x.army.units, from: x.from, id: x.army.id });
        const others = this.jointCandidates(id, target, ids);
        const solo = new Map(others.map(x => [x, this.jointFactors(id, [part(x)], def, target).members[0].atk]));
        others.sort((x, y) => solo.get(y) - solo.get(x));
        const list = [{ army, from, r }];
        for (const x of others) {
            list.push(x);
            const j = this.jointFactors(id, list.map(part), def, target), ratio = j.atk / j.dfn;
            if (ratio >= need) return { list, ratio };
        }
        return null;
    }

    // Sin enemigos a los que ir, los ejércitos que han quedado en el mar navegan hacia la costa propia libre más cercana.
    // Los de una operación o una formación, y los que tienen orden, siguen lo suyo.
    aiSailHome(id) {
        for (const a of [...this.armies.values()]) {
            if (this.over) return;
            if (a.owner !== id || a.op || a.form || a.order || !afloat(a.cell) || !this.armies.has(a.id) || this.armyOn(a.cell) !== a || this.mp(a) <= 0) continue;
            const home = this.nearestCoast(id, a.cell);
            if (home >= 0) this.advance(a, home, this.reach(id, a.cell, this.mp(a), a.used === 0));
        }
    }
    // Casilla de tierra propia y libre más cercana a la casilla de mar `cell`, navegando sin cruzar barcos ajenos, o −1.
    nearestCoast(id, cell) {
        const seen = new Uint8Array(G.N), queue = [cell];
        seen[cell] = 1;
        for (let i = 0; i < queue.length; i++) {
            for (let d = 0; d < 6; d++) {
                const v = G.nb[queue[i] * 6 + d];
                if (v < 0 || seen[v]) continue;
                seen[v] = 1;
                const other = this.armyAt[v];
                if (isLand(v)) { if (this.owner[v] === id && !other) return v; continue; }
                if (!other || this.armies.get(other).owner === id) queue.push(v);
            }
        }
        return -1;
    }

    // Cada ejército que pasa hambre y no tiene una orden en marcha (aguantar no cuenta) intenta salir de la bolsa hacia
    // la casilla propia o aliada más cercana donde coma: atacando si tiene una previsión de al menos 1 o marchando si no.
    aiPockets(id) {
        for (const a of [...this.armies.values()]) {
            if (this.over) return;
            if (a.owner !== id || !this.armies.has(a.id) || this.armyOn(a.cell) !== a || !this.starving(id, a.cell)) continue;
            if ((a.order && a.order.kind !== 'hold') || a.direct === this.turn || this.mp(a) <= 0) continue;
            const home = this.nearestHome(id, a.cell);
            this.breakOut(id, a, home < 0 ? [] : [home]);
        }
    }
    // Tierra que `id` puede pisar: propia, aliada o de un país en guerra con él.
    enterable(id, c) { const o = this.owner[c]; return o === id || this.allied(id, o) || this.atWar(id, o); }
    // Casilla propia o aliada donde no pasaría hambre más cercana a `cell`, en pasos por tierra que pueda pisar, o −1.
    nearestHome(id, cell) {
        const seen = new Set([cell]), queue = [cell];
        for (let i = 0; i < queue.length; i++) {
            for (let d = 0; d < 6; d++) {
                const j = G.nb[queue[i] * 6 + d];
                if (j < 0 || !isLand(j) || seen.has(j) || !this.enterable(id, j)) continue;
                if ((this.owner[j] === id || this.allied(id, this.owner[j])) && !this.starving(id, j)) return j;
                seen.add(j); queue.push(j);
            }
        }
        return -1;
    }
    // ¿Le hace falta el mar? Tiene alguna provincia sin camino por tierra hasta su capital, o está en guerra con un país
    // con el que no comparte frontera de tierra. Se calcula una vez por país y turno.
    needsSea(id) {
        const key = `${this.turn}:${this.version}`, c = (this.seaNeed ??= new Map()).get(id);
        if (c?.key === key) return c.need;
        const cap = this.nations[id].capitalCell, dist = this.landSteps(id, [cap]);
        let need = false;
        const foes = new Set(this.enemiesOf(id)), touch = new Set();
        for (const i of G.land) {
            if (this.owner[i] !== id) continue;
            if (dist[i] >= 1e9) need = true;
            for (let d = 0; d < 6; d++) { const v = G.nb[i * 6 + d]; if (v >= 0 && isLand(v) && foes.has(this.owner[v])) touch.add(this.owner[v]); }
        }
        for (const e of foes) if (!touch.has(e)) need = true;
        this.seaNeed.set(id, { key, need });
        return need;
    }
    // Pasos hasta `sources` por tierra que `id` puede pisar (1e9 si no se llega).
    landSteps(id, sources) {
        const dist = new Int32Array(G.N).fill(1e9), queue = [];
        for (const c of sources) { dist[c] = 0; queue.push(c); }
        for (let i = 0; i < queue.length; i++) {
            const u = queue[i];
            for (let d = 0; d < 6; d++) {
                const v = G.nb[u * 6 + d];
                if (v < 0 || !isLand(v) || dist[v] <= dist[u] + 1 || !this.enterable(id, v)) continue;
                dist[v] = dist[u] + 1;
                queue.push(v);
            }
        }
        return dist;
    }

    // Pasos hasta la ciudad enemiga más cercana por donde puede ir `id` (field): uno por país y turno, que comparten
    // aiAir y aiRecruit. Cambia con las conquistas, las guerras y las alianzas.
    frontField(id) {
        const foes = this.enemiesOf(id), key = `${this.turn}:${this.version}:${this.blocVersion}:${foes.join()}`;
        const c = (this.frontDist ??= new Map()).get(id);
        if (c?.key === key) return c.dist;
        const set = new Set(foes), dist = this.field(id, PROVINCES.filter(p => set.has(this.owner[p.city])).map(p => p.city));
        this.frontDist.set(id, { key, dist });
        return dist;
    }
    // La aviación de la IA, solo en guerra. No recorre el mapa: sus ciudades y las listas de escuadrones, aeródromos y
    // antiaéreos; la distancia al frente sale de frontField.
    // - Quiere AI_AIR_RATIO escuadrones por cada uno de sus enemigos y AI_AIR_EXTRA más. Si le faltan y le quedan el precio
    //   de uno y su renta tras la reserva (o lo tiene apartado, airFund), compra uno en el aeródromo con sitio más cercano
    //   al frente.
    // - Empieza un aeródromo (uno a la vez) en su ciudad más cercana al frente que no lo tenga si le faltan escuadrones y
    //   no tiene sitio; o, si ninguno de sus aeródromos llega a sus operaciones, en la ciudad más cercana a ellas desde la
    //   que llegue.
    // - Si el enemigo tiene aviación, a veces (AI_AA_CHANCE) pone un antiaéreo en su ciudad más amenazada que no cubra
    //   ya uno suyo.
    // - Con Lanzadores y oro de sobra, un satélite sobre su ofensiva.
    aiAir(id) {
        const foes = new Set(this.enemiesOf(id)), n = this.nations[id], A = CONFIG.AIR;
        if (!foes.size) return;
        let mine = 0, theirs = 0;
        const based = new Map();   // escuadrones en cada aeródromo propio
        for (const q of this.squadrons.values()) {
            if (q.owner === id) { mine++; based.set(q.base, (based.get(q.base) ?? 0) + 1); } else if (foes.has(q.owner)) theirs++;
        }
        const cities = this.citiesOf(id), R = this.airRange(id), short = () => mine < AI_AIR_RATIO * theirs + AI_AIR_EXTRA;
        const dist = this.frontField(id), closer = (a, b) => b < 0 || dist[a] < dist[b] || (dist[a] === dist[b] && a < b);
        // Hasta dónde llega un aeródromo: al punto clave de alguna de sus operaciones o, si no tiene, a la ciudad enemiga
        // más cercana (por pasos, que en línea recta es igual o menos).
        const keys = this.opsOf(id).filter(op => op.kind !== 'reserva').map(op => this.opKey(op));
        const gap = c => (keys.length ? Math.min(...keys.map(k => hexDist(c, k))) : dist[c]);
        let room = -1, building = false, reach = false, spot = -1;
        for (const [c, f] of this.airfields) {
            if (f.owner !== id || this.owner[c] !== id) continue;
            if (gap(c) <= R) reach = true;
            if (f.left > 0) building = true;
            else if ((based.get(c) ?? 0) < A.PER_AIRFIELD && closer(c, room)) room = c;
        }
        if (!building && short() && room < 0) { for (const p of cities) if (this.planAirfield(id, p.city) && closer(p.city, spot)) spot = p.city; }
        else if (!building && !reach) {   // adelantarse, solo a una ciudad desde la que llegue
            let bg = R + 1;
            for (const p of cities) { const d = gap(p.city); if (d < bg && this.planAirfield(id, p.city)) { bg = d; spot = p.city; } }
        }
        const spare = n.gold - this.aiReserve(id) >= A.SQUADRON_COST + Math.max(0, this.income(id));
        if (short() && room >= 0 && (spare || n.airFund >= A.SQUADRON_COST) && this.buySquadron(id, room)) { mine++; n.airFund = Math.max(0, n.airFund - A.SQUADRON_COST); }
        else if (spot >= 0 && (spare || n.airFund >= A.AIRFIELD_COST) && this.buildAirfield(id, { cell: spot })) { building = true; spot = -1; n.airFund = Math.max(0, n.airFund - A.AIRFIELD_COST); }
        // ¿Le sigue faltando aviación y tiene (o tendrá) dónde ponerla, o un aeródromo que adelantar? Entonces, si no es
        // pobre, aiRecruit le aparta oro este turno.
        const save = ((short() && (room >= 0 || building)) || spot >= 0) && this.income(id) * AI_AIR_TURNS >= A.SQUADRON_COST;
        (this.airSave ??= new Map()).set(id, save ? this.turn : -1);
        // Con Lanzadores, sin ningún satélite en órbita y si le sobran tres turnos de renta tras pagarlo, lanza uno sobre el
        // objetivo de su primera ofensiva o, si no tiene, sobre la ciudad enemiga más cercana a su capital.
        if (this.rules(id).satMax && !this.sats.some(s => s.owner === id) && n.gold >= this.satCost(id) + 3 * this.income(id)) {
            const off = this.opsOf(id).find(op => op.kind === 'ofensiva');
            let at = off ? this.opKey(off) : -1, bd = Infinity;
            if (at < 0) for (const p of PROVINCES) {
                const d = foes.has(this.owner[p.city]) ? hexDist(n.capitalCell, p.city) : Infinity;
                if (d < bd) { bd = d; at = p.city; }
            }
            if (at >= 0) this.launchSat(id, at);
        }
        if (!theirs || this.rng() >= AI_AA_CHANCE) return;
        const cover = this.aaRadius(id), own = [];
        for (const [c, s] of this.aaSites) if (s.owner === id) own.push(c);   // también los que están en obra
        let best = -1, top = 0;
        for (const p of cities) {
            if (own.some(c => hexDist(c, p.city) <= cover) || !this.planAA(id, p.city)) continue;
            const t = this.threat(id, p.city);
            if (t > top) { top = t; best = p.city; }
        }
        if (best >= 0) this.buildAA(id, this.planAA(id, best));
    }
    // Escuadrones de la IA en sus operaciones `ops`, por ese orden: cada una recibe escuadrones sin encargo hasta tener
    // AI_WINGS, con su punto clave a su alcance (los demás se acercan). Si el enemigo tiene aeródromos (eso lo ve
    // cualquiera), sus ofensivas también protegen y escoltan a sus ejércitos, sobre todo a los que van por mar; si no, no
    // hace falta.
    aiWings(id, ops) {
        const foes = new Set(this.enemiesOf(id));
        let threat = false;
        for (const f of this.airfields.values()) if (foes.has(f.owner)) { threat = true; break; }
        for (const op of ops) {
            if (op.kind !== 'ofensiva' || op.aims.includes('patrol') === threat) continue;
            op.aims = threat ? [...op.aims, 'patrol'] : op.aims.filter(k => k !== 'patrol');
        }
        const free = [], held = new Map(), based = new Map();
        for (const q of this.squadrons.values()) {
            if (q.owner !== id) continue;
            based.set(q.base, (based.get(q.base) ?? 0) + 1);
            if (q.op) held.set(q.op, (held.get(q.op) ?? 0) + 1); else if (!q.task) free.push(q);
        }
        const R = this.airRange(id), keys = [];
        for (const op of ops) {
            if (op.kind === 'reserva' || !op.aims.length) continue;
            const key = this.opKey(op);
            keys.push(key);
            for (let i = 0, want = AI_WINGS - (held.get(op.id) ?? 0); i < free.length && want > 0;) {
                if (hexDist(free[i].base, key) > R) { i++; continue; }
                this.assignSquadron(free.splice(i, 1)[0], op.id);
                want--;
            }
        }
        // Los que se quedan sin operación se acercan a ellas: cada uno se traslada (gasta su vuelo del turno) al aeródromo
        // propio en servicio, con sitio y a su alcance que más cerca quede de algún punto clave, si mejora el suyo. Es lo
        // que les hace falta en el mapa del mundo, donde el alcance es corto.
        if (!free.length || !keys.length) return;
        const fields = [];
        for (const c of this.airfields.keys()) if (this.airfields.get(c).owner === id && this.airfieldUp(c)) fields.push(c);
        const gap = c => { let d = Infinity; for (const k of keys) d = Math.min(d, hexDist(c, k)); return d; };
        for (const q of free) {
            if (!this.canFly(q)) continue;
            let best = -1, bd = gap(q.base);
            for (const c of fields) if ((based.get(c) ?? 0) < CONFIG.AIR.PER_AIRFIELD && hexDist(q.base, c) <= R && gap(c) < bd) { best = c; bd = gap(c); }
            const from = q.base;
            if (best >= 0 && this.rebase(q, best)) { based.set(from, based.get(from) - 1); based.set(best, (based.get(best) ?? 0) + 1); }
        }
    }

    // La IA manda con el mismo sistema que el jugador: en cada frente, una ofensiva sobre la ciudad enemiga más cercana
    // si es lo bastante fuerte y una línea en la frontera si no lo es; les asigna los ejércitos cercanos y oro para
    // refuerzos, y las cumple solas. Al firmar la paz con un frente, sus operaciones terminan.
    aiCommand(id, powers = this.powers()) {
        const enemies = this.enemiesOf(id);
        for (const op of this.opsOf(id)) if (!enemies.includes(this.opFront(op))) this.endOp(op);
        if (!enemies.length) return;
        const ratio = { pacifica: 1.8, normal: 1.3, agresiva: 1.3, caos: 1 }[this.settings.aggression] ?? 1.3;
        const cap = this.commandCap(id), income = Math.max(0, this.income(id));
        const fronts = enemies.map(e => [e, powers[id] / Math.max(1, powers[e])]).sort((x, y) => y[1] - x[1]);
        for (const [e, strength] of fronts) {
            const mine = this.opsOf(id).filter(op => this.opFront(op) === e);
            const wantAttack = strength >= this.ai.warRatio * 0.9 && !mine.some(op => op.kind === 'ofensiva');
            const wantLine = strength < 1.2 && !mine.some(op => op.kind === 'defensa');
            if ((!wantAttack && !wantLine) || this.opsOf(id).length >= cap) continue;
            const k = id * this.nations.length + e;
            if ((this.noFront ??= new Map()).get(k) > this.turn) continue;
            const plan = this.frontPlan(id, e);
            if (!plan) { this.noFront.set(k, this.turn + 10); continue; }
            let op = null;
            if (wantAttack && plan.attack) {
                const gold = [...OP_GOLD].reverse().find(v => v <= income * 0.3) ?? 0;
                op = this.createOp(id, 'ofensiva', plan.attack, { ratio, auto: 'auto', gold });
            } else if (wantLine && plan.line.length && this.opsOf(id).length < cap) op = this.createOp(id, 'defensa', plan.line, { auto: 'auto' });
            if (op) op.front = e;
        }
        // Ejércitos libres cerca de cada operación (primero las ofensivas); las ciudades se quedan con una infantería.
        const ops = this.opsOf(id).sort((x, y) => (x.kind === 'ofensiva' ? 0 : 1) - (y.kind === 'ofensiva' ? 0 : 1));
        for (const op of ops) {
            const want = op.kind === 'defensa' ? op.cells.length - this.opMembers(op).length : 6 - this.opMembers(op).length;
            if (want <= 0) continue;
            for (const a of this.nearbyFree(op, op.kind === 'defensa' ? 4 : 6).slice(0, want)) this.assignArmy(a, op.id);
        }
        this.aiWings(id, ops);   // y escuadrones, en el mismo orden
        this.executeOrders(id);
    }

    // En guerra fortifica la ciudad propia más valiosa que tenga territorio enemigo a 3 casillas o menos (sin tocar el oro
    // apartado para la aviación).
    aiForts(id) {
        const enemies = this.enemiesOf(id), n = this.nations[id];
        const fortCost = this.rules(id).fortCost, gold = n.gold - n.airFund;   // lo apartado para la aviación no se toca
        if (!enemies.length || gold < fortCost * 4 || this.rng() > 0.35) return;
        const nearEnemy = cell => {
            const seen = new Set([cell]);
            let front = [cell];
            for (let r = 0; r < 3; r++) {
                const next = [];
                for (const u of front) for (let d = 0; d < 6; d++) {
                    const v = G.nb[u * 6 + d];
                    if (v < 0 || seen.has(v)) continue;
                    seen.add(v);
                    if (isLand(v) && enemies.includes(this.owner[v])) return true;
                    next.push(v);
                }
                front = next;
            }
            return false;
        };
        const free = c => c >= 0 && isLand(c) && this.owner[c] === id && !this.fort[c] && !this.fortWork.has(c);
        const city = this.citiesOf(id).filter(p => free(p.city) && nearEnemy(p.city)).sort((x, y) => y.value - x.value)[0];
        if (!city) return;
        const ring = [city.city, ...[0, 1, 2, 3, 4, 5].map(d => G.nb[city.city * 6 + d])].filter(free);
        const cells = ring.slice(0, Math.floor(gold * 0.4 / fortCost));
        if (cells.length) this.buildFort(id, { cells, cost: cells.length * fortCost });
    }

    // Repara sus carreteras rotas y después sus fortificaciones dañadas antes de reclutar (y aunque haya perdido la
    // capital). En guerra, con una cuarta parte del oro para las carreteras y un 15 % de lo que quede para las
    // fortificaciones, que el resto es para tropas; en paz, con lo que le sobra de la reserva, como las carreteras nuevas.
    aiRepairs(id) {
        const n = this.nations[id];
        if (this.enemiesOf(id).length) { this.aiRepairRoads(id, n.gold * 0.25); this.aiRepairForts(id, n.gold * 0.15); return; }
        const budget = n.gold - this.aiReserve(id) * 0.5;
        if (budget >= CONFIG.ROAD_COST * 2) this.aiRepairForts(id, budget * 0.7 - this.aiRepairRoads(id, budget * 0.7));
    }
    // Une a la red de carreteras la ciudad o el yacimiento más valioso que aún no lo esté (una obra por turno;
    // en guerra solo con el oro que sobre tras reclutar). Las reparaciones ya se han pagado antes, en aiRepairs.
    aiRoads(id) {
        const atWar = this.enemiesOf(id).length > 0;
        const n = this.nations[id], budget = atWar ? n.gold * 0.5 : n.gold - this.aiReserve(id) * 0.5;
        if (budget < CONFIG.ROAD_COST * 2) return;
        const e = this.economy(id);
        const cap = n.capitalCell;
        if (this.owner[cap] !== id) return;
        const targets = [
            ...this.citiesOf(id).filter(p => !e.connected.has(p.id)).map(p => ({ cell: p.city, value: p.value })),
            ...e.looseResources.map(r => ({ cell: r.cell, value: r.value * 2 }))   // con carretera abastece a más provincias
        ].sort((x, y) => y.value - x.value);
        const loose = targets[0];
        if (!loose) return;
        const plan = this.planRoad(id, loose.cell, c => e.seen[c] === 1, 1);
        if (plan && plan.cost <= budget * 0.7) this.buildRoad(id, plan);
    }
}

const PROP_SHAPE = { a: 0.25, b: 0.79, h: 0.375 };
function propellerPath(x, y, half) {
    const n = v => +v.toFixed(2), a = n(half * PROP_SHAPE.a), b = n(half * PROP_SHAPE.b), h = n(half * PROP_SHAPE.h);
    return `M${x} ${y}C${n(x - a)} ${n(y - h)} ${n(x - b)} ${n(y - h)} ${n(x - half)} ${y}C${n(x - b)} ${n(y + h)} ${n(x - a)} ${n(y + h)} ${x} ${y}`
        + `C${n(x + a)} ${n(y - h)} ${n(x + b)} ${n(y - h)} ${n(x + half)} ${y}C${n(x + b)} ${n(y + h)} ${n(x + a)} ${n(y + h)} ${x} ${y}z`;
}

// Curva suave (Catmull-Rom) por los puntos dados, en píxeles de pantalla.
function smoothLine(pts, n = 8) {
    if (pts.length < 2) return pts;
    if (pts.length === 2) { const [a, b] = pts; return Array.from({ length: n * 2 + 1 }, (_, i) => [a[0] + (b[0] - a[0]) * i / (n * 2), a[1] + (b[1] - a[1]) * i / (n * 2)]); }
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
