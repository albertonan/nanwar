    interceptors(owner, kind, cell) {
        const out = [];
        for (const q of this.squadrons.values()) {
            if (!this.atWar(owner, q.owner)) continue;
            if (q.patrol === cell || (kind === 'airfield' && q.base === cell && q.patrol < 0 && this.turn >= q.ready)) out.push(q);
        }
        return out.sort((a, b) => a.id - b.id);
    }
    // ¿Puede `owner` mandar esos escuadrones a esa misión contra `cell`? '' si puede; si no, el motivo. Solo cuenta lo que
    // `viewer` sabe: el ejército que ve y el antiaéreo que conoce.
    missionCheck(owner, sqs, kind, cell, viewer = owner) {
        const ready = sqs.filter(q => q && q.owner === owner && this.canFly(q)), R = this.airRange(owner);
        if (!ready.length) return 'Ningún escuadrón listo.';
        if (!ready.some(q => hexDist(q.base, cell) <= R)) return 'Fuera de alcance.';
        const war = 'Solo contra un país con el que estás en guerra.';
        let key = this.hitKey(kind, cell);
        switch (kind) {
            case 'patrol': {   // proteger no es un acierto: se puede repetir

                return afloat(cell) || o === owner || this.allied(owner, o) ? '' : 'Solo se protege una casilla tuya, de un aliado o de mar.';
            }
            case 'army': {
                const a = this.armyOn(cell);
                if (!a || a.owner === owner || this.allied(owner, a.owner) || (viewer === this.player && !this.sees(viewer, cell))) return 'No ves ningún ejército enemigo ahí.';
                if (!this.atWar(owner, a.owner)) return war;
                break;
            }
            case 'roads':
                if (!this.atWar(owner, this.owner[cell])) return war;
                if (![0, 1, 2, 3, 4, 5].some(d => this.road[cell * 6 + d] > 0)) return 'No hay carreteras intactas en esa casilla.';
                break;
            case 'fort':
                if (!this.atWar(owner, this.owner[cell])) return war;
                if (!this.fort[cell]) return 'No hay fortificación.';
                break;
            case 'aa': {
                const src = this.aaTarget(owner, cell, viewer);
                if (!src) return isLand(cell) && !this.atWar(owner, this.owner[cell]) ? war : 'No conoces ningún antiaéreo en esa casilla.';
                if (src.kind === 'integrated') key = this.hitKey('fort', cell);
                break;
            }
            case 'airfield': {
                const f = this.airfields.get(cell);
                if (!f || f.owner === owner || this.allied(owner, f.owner) || !this.airfieldUp(cell)) return 'No hay aeródromo enemigo que funcione.';
                if (!this.atWar(owner, f.owner)) return war;
                break;
            }
            default: return 'Esa misión no existe.';
        }
        return this.airHits.get(key) === this.turn ? AIR_BLOCKED : '';

    // Previsión de una misión con lo que `viewer` conoce: el antiaéreo que sabe que hay (y si puede haber más), la
    // probabilidad de acertar (a ciegas, la mitad), la de que caiga o vuelva dañado cada escuadrón, la fuerza que va y la
    // de los cazas enemigos que sabe que la esperan (solo con información exacta de la casilla).
    missionOdds(owner, sqs, kind, cell, viewer = owner) {
        const why = this.missionCheck(owner, sqs, kind, cell, viewer), fly = this.fliers(owner, sqs, cell), power = fly.length * this.airPower(owner);
        const out = { why, hit: 0, down: 0, damaged: 0, known: false, unknown: false, fire: 0, loss: 0, power, patrol: 0 };
        if (why) return out;
        if (kind === 'patrol') return { ...out, hit: 1, known: true };
        const c = this.aaCover(owner, [...new Set(fly.map(q => q.base))], cell, { viewer });

        const sees = this.knownCell(viewer, cell), known = kind === 'aa' || sees;
        const patrol = sees ? this.interceptors(owner, kind, cell).reduce((s, q) => s + this.airPower(q.owner), 0) : 0;
        return { why, hit: (1 - o.fail) * (known ? 1 : this.rules(owner).blindHit), down: o.down, damaged: o.damaged, known, get unknown() { return c.unknown; },
            fire: c.seen.fire, loss: c.seen.loss, power, patrol };
    }
    // Un escuadrón vuelve dañado: no vuela hasta pasado el próximo turno de su dueño, y deja de proteger su casilla. Queda
    // marcado como dañado hasta que vuelve a estar listo (en airTurn).
    damageSquadron(q) {
        q.damaged = true;
        q.ready = Math.max(q.ready, this.nextOwnTurn(q.owner) + 1);
        q.patrol = -1;
        this.airVersion++;
    }
    squadronDown(q) { this.squadrons.delete(q.id); this.airVersion++; }
    // Combate aéreo: fuerza contra fuerza, con la tirada de `battle`; el empate lo gana el que defiende. Después cada
    // escuadrón tira una vez, por id: del bando que pierde, cae o vuelve dañado; del que gana, alguno vuelve dañado.
    // Devuelve si gana el que ataca.
    dogfight(attackers, defenders) {
        const A = CONFIG.AIR, roll = () => 0.8 + this.rng() * 0.4;
        const force = qs => qs.reduce((s, q) => s + this.airPower(q.owner), 0);
        const atk = force(attackers) * roll(), dfn = force(defenders) * roll(), won = atk > dfn;
        const losers = new Set(won ? defenders : attackers);
        for (const q of [...attackers, ...defenders].sort((a, b) => a.id - b.id)) {
            const r = this.rng();
            if (!losers.has(q)) { if (r < A.DOG_WINNER) this.damageSquadron(q); }
            else if (r < A.DOG_DOWN * this.rules(q.owner).airEvade) this.squadronDown(q);

        }
        return won;
    }

    lowerFort(cell) {

        if (this.fortWork.get(cell)?.up) this.fortWork.delete(cell);
        this.fortVersion++;
        return this.fort[cell] ? `baja a ${FORT_LEVELS[this.fort[cell] - 1]}` : 'desaparece';
    }
    // Unidades que pierde el ejército `a` con un acierto de `owner`: del 10 al 15 % (más con Munición guiada), al menos una,
    // y el doble si está embarcado. `rand` (0 a 1) es la tirada; la previsión usa la media, 0,5.
    strikeLoss(owner, a, rand) {
        const A = CONFIG.AIR, n = countUnits(a.units);
        return Math.min(n, Math.max(1, Math.round(n * (A.STRIKE + A.STRIKE_RAND * rand) * this.rules(owner).airDamage * (afloat(a.cell) ? A.SEA_STRIKE : 1))));
    }
    // Lo que hace un acierto de `owner` en `cell`; devuelve cómo lo cuenta el parte.
    airEffect(owner, kind, cell, src) {
        const A = CONFIG.AIR;
        switch (kind) {
            case 'army': {   // primero caen tanques, artillería y antiaéreas; el doble a un ejército embarcado
                const a = this.armyOn(cell), lost = this.strikeLoss(owner, a, this.rng());
                let k = lost;
                for (const t of ['tank', 'artillery', 'antiair', 'infantry']) {
                    if (!a.units[t]) continue;
                    const x = Math.min(k, a.units[t]);
                    a.units[t] -= x; k -= x;
                }
                a.disorgUntil = this.nextOwnTurn(a.owner) + A.DISORG_TURNS - 1;
                this.armyVersion++;
                if (countUnits(a.units) > 0) return `pierde ${plural(lost, 'unidad', 'unidades')} y queda desorganizado`;
                this.removeArmy(a);
                return `pierde ${plural(lost, 'unidad', 'unidades')} y se disuelve`;
            }
            case 'roads': return plural(this.breakRoads(cell), 'tramo roto', 'tramos rotos');
            case 'fort': return this.lowerFort(cell);
            case 'aa': {
                if (src.kind === 'integrated') return `la ciudad ${this.lowerFort(cell)} y pierde su antiaéreo`;
                if (src.kind === 'mobile') {   // una parte de sus antiaéreas, el doble a un ejército embarcado
                    const a = src.army, lost = Math.min(a.units.antiair, Math.max(1, Math.round(a.units.antiair * A.MOBILE_HIT * (afloat(cell) ? A.SEA_STRIKE : 1))));
                    a.units.antiair -= lost;
                    this.armyVersion++;
                    if (countUnits(a.units) > 0) return `el ejército pierde ${plural(lost, 'antiaérea', 'antiaéreas')}`;
                    this.removeArmy(a);

                }

                if (++src.site.hits < A.AA_HITS) return 'queda dañado y dispara a media fuerza';

                return 'queda destruido';
            }
            case 'airfield': {
                const f = this.airfields.get(cell);
                f.downUntil = this.nextOwnTurn(f.owner) + A.DOWN_TURNS - 1;
                this.airVersion++;
                return `queda inservible hasta el turno ${f.downUntil + 1}`;
            }
        }
        return '';
    }
    // Misión de los escuadrones `ids` de `owner` contra `cell`, en este orden: los cazas enemigos que la esperan, el
    // antiaéreo (una tirada por escuadrón), el fracaso, la precisión (a ciegas rinde la mitad) y el efecto. Sale en el
    // parte si toca al jugador y desvela la casilla a quien la manda ese turno.
    airMission(owner, ids, kind, cell) {
        const r = this.rules(owner), sqs = [...new Set(ids)].map(id => this.squadrons.get(id));   // cada escuadrón, una vez
        const why = this.missionCheck(owner, sqs, kind, cell);
        if (why) return { result: why === AIR_BLOCKED ? 'blocked' : 'invalid', down: 0, damaged: 0, text: why };
        const fly = this.fliers(owner, sqs, cell), bases = [...new Set(fly.map(q => q.base))];
        const src = kind === 'aa' ? this.aaTarget(owner, cell) : null;
        const victim = kind === 'army' ? this.armyOn(cell).owner : kind === 'airfield' ? this.airfields.get(cell).owner : src ? src.owner : this.owner[cell];
        for (const q of fly) q.flown = this.turn;
        const ev = { kind: 'air', owner, from: bases, cell, mission: kind, result: null };   // la vista lo anima
        this.note(ev);
        this.airVersion++;
        let result = 'hit', effect = '', told = '', guards = [];   // told: el efecto contado al que ataca
        if (kind === 'patrol') for (const q of fly) q.patrol = cell;
        else {
            guards = this.interceptors(owner, kind, cell);
            if (guards.length && !this.dogfight(fly, guards)) result = 'intercepted';
            else {
                const c = this.aaCover(owner, bases, cell), S = fly.length * this.airPower(owner);
                const o = this.airOdds(c.fire / S, c.loss / S, r.airEvade);
                for (const x of c.sources) { const site = this.aaSites.get(x); if (site && site.left === 0) site.known.add(owner); }   // quien dispara se delata
                for (const q of fly) {
                    const x = this.rng();
                    if (x < o.down) this.squadronDown(q); else if (x < o.down + o.damaged) this.damageSquadron(q);
                }
                const known = kind === 'aa' || this.knownCell(owner, cell);
                if (this.rng() < o.fail || (!known && this.rng() < 1 - r.blindHit)) result = 'miss';
                else {
                    effect = told = this.airEffect(owner, kind, cell, src);
                    // El nivel al que baja una fortificación, solo si quien ataca conoce los niveles; que existe es público.
                    if (kind === 'fort' && this.fortLevel(owner, cell) === null) told = this.fort[cell] ? 'baja un nivel' : 'desaparece';
                    this.airHits.set(this.hitKey(src?.kind === 'integrated' ? 'fort' : kind, cell), this.turn);
                }
                this.airSeen.set(owner * G.N + cell, this.turn);
            }
        }
        ev.result = result;
        this.airVersion++;
        const down = fly.filter(q => !this.squadrons.has(q.id)).length, damaged = fly.filter(q => this.squadrons.has(q.id) && q.ready > this.turn).length;
        const text = this.airReport(owner, victim, kind, cell, fly.length, result, told, down, damaged, guards);
        if (owner === this.player) this.log(text);
        else this.airDefenseReport(owner, victim, kind, cell, result, effect, down, guards);
        return { result, down, damaged, text };
    }
    // Lo que vuelve de una misión, contado al que la manda: «Vuelven todos.», «Derriban 1 y otro vuelve dañado.»...
    // Con `subj`, con el sujeto delante («Tus 2 escuadrones vuelven todos.»).
    airFate(n, down, damaged, subj = false) {
        if (n === 1) return down ? (subj ? 'A tu escuadrón lo derriban.' : 'Lo derriban.') : `${subj ? 'Tu escuadrón vuelve' : 'Vuelve'} ${damaged ? 'dañado' : 'sin daños'}.`;
        if (down === n) return subj ? `Derriban tus ${n} escuadrones.` : 'Los derriban a todos.';
        const parts = [];
        if (down) parts.push(`derriban ${down}`);
        if (damaged) parts.push(damaged === 1 ? `${down ? 'otro' : 'uno'} vuelve dañado` : `${damaged} vuelven dañados`);
        if (!parts.length) return subj ? `Tus ${n} escuadrones vuelven todos.` : 'Vuelven todos.';
        const s = parts.join(' y ');
        return subj ? `De tus ${n} escuadrones, ${s}.` : `${s[0].toUpperCase()}${s.slice(1)}.`;
    }
    // Parte de una misión para quien la manda.
    airReport(owner, victim, kind, cell, n, result, effect, down, damaged, guards) {
        const X = this.placeName(cell), many = n > 1, subj = many ? `Tus ${n} escuadrones` : 'Tu escuadrón', v = (one, more) => (many ? more : one);
        if (kind === 'patrol') return `${subj} ${v('protege', 'protegen')} ${X} hasta tu próximo turno: ${v('sale', 'salen')} al paso de cualquier misión enemiga contra esa casilla.`;
        if (kind === 'roads' && result === 'hit') return `Bombardeada la carretera de ${X}: ${effect}. ${this.airFate(n, down, damaged, true)}`;
        const what = { army: `${v('ataca', 'atacan')} el ejército de ${this.nm(victim)} en ${X}`, roads: `${v('bombardea', 'bombardean')} las carreteras de ${X}`,
            fort: `${v('bombardea', 'bombardean')} la fortificación de ${X}`, aa: `${v('ataca', 'atacan')} el antiaéreo de ${X}`, airfield: `${v('ataca', 'atacan')} el aeródromo de ${X}` }[kind];
        const outcome = result === 'hit' ? effect : result === 'miss' ? 'fracasa' : `los cazas de ${this.nm(guards[0].owner)} ${v('lo', 'los')} interceptan`;
        return `${subj} ${what}: ${outcome}. ${this.airFate(n, down, damaged)}`;
    }
    // Parte de una misión enemiga para el jugador, si va contra lo suyo o sus cazas han salido a pararla.
    airDefenseReport(owner, victim, kind, cell, result, effect, down, guards) {
        const mine = guards.filter(q => q.owner === this.player);
        if (victim !== this.player && !mine.length) return;
        const X = this.placeName(cell), by = this.nm(owner), lost = mine.filter(q => !this.squadrons.has(q.id)).length;
        const tail = (mine.length && result !== 'intercepted' && victim === this.player ? ' Tus cazas no consiguen pararla.' : '')
            + (down ? ` ${down === 1 ? 'Cae uno de sus escuadrones' : `Caen ${down} de sus escuadrones`}.` : '') + (lost ? ` Pierdes ${plural(lost, 'escuadrón', 'escuadrones')} en el combate aéreo.` : '');
        if (victim !== this.player) { this.log(`Tus cazas salen al paso de ${by} sobre ${X}: ${result === 'intercepted' ? 'la interceptan' : 'no la paran'}.${tail}`); return; }
        if (kind === 'roads' && result === 'hit') { this.log(`Bombardeada la carretera de ${X}: ${effect} por la aviación de ${by}.${tail}`); return; }
        const what = { army: `ataca tu ejército en ${X} desde el aire`, roads: `bombardea tu carretera de ${X}`, fort: `bombardea tu fortificación de ${X}`,
            aa: `ataca tu antiaéreo de ${X}`, airfield: `bombardea tu aeródromo de ${X}` }[kind];
        const outcome = result === 'hit' ? effect : result === 'miss' ? 'fracasa' : mine.length ? 'tus cazas la interceptan' : `la interceptan los cazas de ${this.nm(guards[0].owner)}`;
        this.log(`${by} ${what}: ${outcome}.${tail}`);
    }
    // El jugador manda una misión; si no puede despegar, el parte dice por qué.
    playerAirMission(ids, kind, cell) {
        if (this.over || this.player === null) return null;
        const res = this.airMission(this.player, ids, kind, cell);
        if (res.result === 'invalid' || res.result === 'blocked') this.log(res.text);
        return res;
    }

    // --- Aviación en el mando: escuadrones en las operaciones, con sus fines, y órdenes de zona ---
    // sq.op = operación a la que vuela cada turno; sq.task = { cell, aims }, la orden de zona de un escuadrón suelto. Son
    // encargos excluyentes. Una misión a mano gasta el turno del escuadrón; al siguiente vuelve a su encargo.
    // Punto clave de una operación: el objetivo de la ofensiva, el centro de la línea o la zona de la reserva.
    opKey(op) { return op.kind === 'ofensiva' ? op.cells[op.cells.length - 1] : op.cells[Math.floor(op.cells.length / 2)]; }
    // Mete un escuadrón en una operación de su mismo dueño (0: en ninguna); deja su orden de zona.
    assignSquadron(sq, opId) {
        if (!sq) return false;
        const op = opId ? this.ops.get(opId) : null;
        if (opId && (!op || op.owner !== sq.owner)) return false;
        sq.op = op ? op.id : 0;
        if (op) sq.task = null;
        this.orderVersion++;
        return true;
    }
    // Orden de zona de varios turnos (null la quita): ataca con sus fines en AIR_ZONE_KM alrededor de `task.cell`. Sale de
    // su operación. Sin un fin válido no hay orden.
    setAirTask(sq, task) {
        if (!sq) return false;
        const cell = Number.isInteger(task?.cell) && task.cell >= 0 && task.cell < G.N ? task.cell : -1;
        const aims = [...new Set((Array.isArray(task?.aims) ? task.aims : []).filter(k => Object.hasOwn(OP_AIMS, k)))];
        if (task && (cell < 0 || !aims.length)) return false;
        sq.task = task ? { cell, aims } : null;
        if (sq.task) sq.op = 0;
        this.orderVersion++;
        return true;
    }
    // Blancos para los fines `aims` en las casillas `cells`, con lo que `owner` ve, los mejores primero (como mucho
    // AIR_TARGETS). Cada uno pasa por missionCheck con los escuadrones `pool` (por defecto, todos los suyos que pueden
    // volar), así que solo quedan los que están a su alcance, en guerra y sin acierto este turno.
    // - army: la fuerza de ataque del ejército enemigo que ve, el doble en el mar (allí pierde el doble); solo si
    //   sabe que tiene `minArmy` unidades o más (sin conocer su número, por lo menos de su escalón: leastUnits).
    // - fort: el nivel que conoce (si no, 1) × 10, y 20 más en el objetivo `obj`.
    // - roads: los tramos intactos × 3, y 10 más a 4 casillas del objetivo o menos.
    // - aa: la fuerza del antiaéreo que conoce × 2.
    // - patrol: primero las casillas de mar de sus ejércitos `members` (escolta); luego sus casillas de `cells` según
    //   la amenaza.
    airTargets(owner, cells, aims, { obj = -1, members = [], pool = null, minArmy = 1 } = {}) {
        const sqs = pool ?? [...this.squadrons.values()].filter(q => q.owner === owner && this.canFly(q)), out = [];
        if (!sqs.length) return out;
        const want = new Set(aims), add = (kind, cell, score) => { if (score > 0 && !this.missionCheck(owner, sqs, kind, cell)) out.push({ kind, cell, score }); };
        for (const c of cells) {
            if (want.has('army')) {
                const a = this.armyOn(c);
                if (a && this.atWar(owner, a.owner) && this.sees(owner, c) && this.leastUnits(owner, a) >= minArmy)
                    add('army', c, this.seenPower(owner, a, 'atk') * (afloat(c) ? 2 : 1));
            }
            if (!isLand(c) || !this.atWar(owner, this.owner[c])) continue;
            if (want.has('fort') && this.fort[c]) add('fort', c, ((this.fortLevel(owner, c) ?? 0) + 1) * 10 + (c === obj ? 20 : 0));
            if (want.has('roads')) {
                let n = 0;
                for (let d = 0; d < 6; d++) if (this.road[c * 6 + d] > 0) n++;
                if (n) add('roads', c, n * 3 + (obj >= 0 && hexDist(c, obj) <= 4 ? 10 : 0));
            }
        }
        if (want.has('aa')) {   // de la lista del antiaéreo, no casilla a casilla
            const zone = new Set(cells), done = new Set();
            for (const src of this.aaList()) {
                if (done.has(src.cell) || !zone.has(src.cell) || !this.atWar(owner, src.owner)) continue;
                const t = this.aaTarget(owner, src.cell);
                if (t) { done.add(src.cell); add('aa', src.cell, t.power * 2); }
            }
        }
        if (want.has('patrol')) {
            const guard = new Set();
            for (const a of members) if (afloat(a.cell) && !guard.has(a.cell)) { guard.add(a.cell); add('patrol', a.cell, 100 + countUnits(a.units)); }
            for (const c of new Set(cells)) if (isLand(c) && (this.owner[c] === owner || this.allied(owner, this.owner[c]))) add('patrol', c, this.threat(owner, c));
        }
        return out.sort(airTargetOrder).slice(0, AIR_TARGETS);
    }
    // Vuela contra los blancos `targets`, por orden, con los escuadrones `pool`: para cada uno, el grupo más pequeño (de 1
    // a 3, los de base más cercana primero) con el blanco a su alcance cuya previsión dé al menos AIR_MIN_HIT de acierto y
    // como mucho AIR_MAX_DOWN de derribo por escuadrón; si no lo hay, no se arriesga. Proteger va de 1 en 1 y en
    // AIR_PATROLS casillas como mucho. Los blancos ya alcanzados se saltan. Devuelve los escuadrones que han volado, los
    // aciertos, las misiones de ataque y el parte de cada misión.
    flyTargets(owner, pool, targets) {
        const out = { flown: 0, hits: 0, strikes: 0, notes: [] }, R = this.airRange(owner);
        let free = pool.filter(q => q && q.owner === owner), patrols = 0;
        for (const t of targets) {
            free = free.filter(q => this.squadrons.has(q.id) && this.canFly(q));
            if (!free.length) break;
            if (t.kind === 'patrol' && patrols >= AIR_PATROLS) continue;
            const near = free.filter(q => hexDist(q.base, t.cell) <= R).sort((x, y) => hexDist(x.base, t.cell) - hexDist(y.base, t.cell) || x.id - y.id);
            let group = null;
            for (let k = 1; k <= Math.min(t.kind === 'patrol' ? 1 : 3, near.length); k++) {
                const o = this.missionOdds(owner, near.slice(0, k), t.kind, t.cell);
                if (o.why) break;   // ya alcanzado, o el blanco ya no está
                if (o.hit >= AIR_MIN_HIT && o.down <= AIR_MAX_DOWN) { group = near.slice(0, k); break; }
            }
            if (!group) continue;
            const res = this.airMission(owner, group.map(q => q.id), t.kind, t.cell);
            if (res.result === 'invalid' || res.result === 'blocked') continue;
            out.flown += group.filter(q => q.flown === this.turn).length;
            out.notes.push(res.text);
            if (t.kind === 'patrol') patrols++;
            else { out.strikes++; if (res.result === 'hit') out.hits++; }
            free = free.filter(q => !group.includes(q));
        }

    }
    // La aviación de una operación este turno: sus escuadrones que pueden volar, contra los blancos de sus fines en su
    // zona. Ofensiva: a 3 casillas de su objetivo y a 2 de sus ejércitos (lo que defiende el objetivo y el camino), y
    // protege a sus ejércitos. Línea: a 3 casillas de la línea, y protege sus casillas más amenazadas. En manual, en pausa
    // o en la reserva no vuela. Las de la IA no atacan ejércitos de menos de AI_MIN_ARMY unidades.
    opAir(op) {
        const id = op.owner, aims = op.aims ?? [];
        if (op.kind === 'reserva' || op.auto === 'manual' || op.paused || !aims.length || this.over) return { flown: 0, hits: 0, strikes: 0, notes: [] };
        const pool = [];
        for (const q of this.squadrons.values()) if (q.op === op.id && q.owner === id && this.canFly(q)) pool.push(q);
        if (!pool.length) return { flown: 0, hits: 0, strikes: 0, notes: [] };
        const members = this.opMembers(op), zone = new Set(), obj = op.kind === 'ofensiva' ? op.cells[op.cells.length - 1] : -1;
        const around = (c, k) => { for (const x of this.nearCells(c, k).keys()) zone.add(x); };
        if (obj >= 0) { around(obj, 3); for (const a of members) around(a.cell, 2); } else for (const c of op.cells) around(c, 3);
        const strike = aims.filter(k => k !== 'patrol'), opts = { obj, members, pool, minArmy: id === this.player ? 1 : AI_MIN_ARMY };
        let targets = strike.length ? this.airTargets(id, [...zone], strike, opts) : [];
        if (aims.includes('patrol')) targets = [...targets, ...this.airTargets(id, obj >= 0 ? members.map(a => a.cell) : op.cells, ['patrol'], opts)].sort(airTargetOrder).slice(0, AIR_TARGETS);
        return this.flyTargets(id, pool, targets);
    }
    // Las órdenes de zona de los escuadrones sueltos de `id`: los que comparten zona y fines vuelan juntos.
    stepAirTasks(id) {
        const groups = new Map();
        for (const q of this.squadrons.values()) {
            if (q.owner !== id || q.op || !q.task || !this.canFly(q)) continue;
            const k = `${q.task.cell}:${q.task.aims.join()}`;
            if (!groups.has(k)) groups.set(k, []);
            groups.get(k).push(q);
        }
        for (const pool of groups.values()) {
            if (this.over) return;
            const { cell, aims } = pool[0].task;
            this.flyTargets(id, pool, this.airTargets(id, [...this.nearCells(cell, kmCells(AIR_ZONE_KM)).keys()], aims, { pool }));
        }
    }
    playerAssignSquadron(sqId, opId) {
        const q = this.squadrons.get(sqId);
        return !!q && q.owner === this.player && !this.over && this.assignSquadron(q, opId);
    }
    // Orden de zona del jugador (null la quita); el parte la confirma.
    playerAirTask(sqId, task) {
        const q = this.squadrons.get(sqId);
        if (!q || q.owner !== this.player || this.over || !this.setAirTask(q, task)) return false;
        if (q.task) this.log(`Orden de zona: el escuadrón ${q.id} vuela cada turno a ${plural(kmCells(AIR_ZONE_KM), 'casilla', 'casillas')} de ${this.placeName(q.task.cell)} (${q.task.aims.map(k => OP_AIMS[k].toLowerCase()).join(', ')}).`);
        return true;
    }
    // Marca o desmarca un fin de una operación del jugador (la reserva no tiene).
    playerOpAim(opId, aim) {
        const op = this.ops.get(opId);
        if (!op || op.owner !== this.player || op.kind === 'reserva' || !Object.hasOwn(OP_AIMS, aim)) return false;
        op.aims = op.aims.includes(aim) ? op.aims.filter(k => k !== aim) : [...op.aims, aim];
        this.orderVersion++;
        return true;
    }

    // Hay un ejército enemigo (en guerra) en `u`, en `v` o en sus vecinas: no se trabaja en el tramo.
    repairBlocked(id, u, v) {
        const foes = this.enemiesOf(id);
        if (!foes.length) return false;
        for (const c of [u, v]) {
            for (let k = -1; k < 6; k++) {
                const j = k < 0 ? c : G.nb[c * 6 + k];
                const a = j >= 0 ? this.armyOn(j) : null;
                if (a && foes.includes(a.owner)) return true;
            }
        }
        return false;
    }
    // Tramos rotos de la casilla que `id` puede reparar: de su territorio, sin obra empezada y sin enemigos al lado.
    // Cuesta la mitad de lo que costaría construirlos.
    repairPlan(id, cell) {
        if (cell < 0 || this.owner[cell] !== id) return null;
        const edges = [], mult = this.rules(id).roadCost;
        let cost = 0;
        for (let d = 0; d < 6; d++) {
            const cls = this.broken[cell * 6 + d], v = G.nb[cell * 6 + d];
            if (!cls || v < 0 || this.owner[v] !== id || this.roadWork.has(edgeKey(cell, d)) || this.repairBlocked(id, cell, v)) continue;
            edges.push([cell, d]);
            cost += this.roadEdgeCost(cell, d, cls, mult) / 2;
        }
        return edges.length ? { edges, cost: Math.round(cost), cls: 'repair' } : null;
    }
    // Pone en obra los tramos del plan que aún se puedan reparar y cobra solo esos (la mitad de construirlos); devuelve
    // cuántos. Se salta los que ya no están rotos, ya están en obra, tienen una casilla ajena o un enemigo al lado.
    startRepair(id, plan) {
        const n = this.nations[id], mult = this.rules(id).roadCost;
        if (!plan?.edges?.length) return 0;
        const go = [];
        let cost = 0;
        for (const [u, d] of plan.edges) {
            const cls = this.broken[u * 6 + d], key = edgeKey(u, d), v = G.nb[u * 6 + d];
            if (!cls || this.roadWork.has(key) || this.owner[u] !== id || this.owner[v] !== id || this.repairBlocked(id, u, v)) continue;
            go.push([key, cls]);
            cost += this.roadEdgeCost(u, d, cls, mult) / 2;
        }
        cost = Math.round(cost);
        if (!go.length || cost > n.gold) return 0;
        for (const [key, cls] of go) this.roadWork.set(key, { owner: id, left: this.rules(id).fortTurns, cls });
        this.roadVersion++;
        n.gold -= cost;
        return go.length;
    }
    playerRepair(plan) {
        if (this.over || !plan) return false;
        const nat = this.nations[this.player], gold = nat.gold;
        if (plan.cost > gold) { this.log(`Fondos insuficientes: la reparación cuesta ${plan.cost}g.`); return false; }
        const n = this.startRepair(this.player, plan);
        if (n) this.log(`Reparas ${plural(n, 'tramo', 'tramos')} de carretera por ${gold - nat.gold}g.`);
        return n > 0;
    }
    // La IA repara primero lo que toca ciudades o yacimientos y luego el resto, hasta agotar el presupuesto; devuelve el oro gastado.
    aiRepairRoads(id, budget) {
        const todo = [];
        for (const c of G.land) {
            if (this.owner[c] !== id) continue;
            for (let d = 0; d < 3; d++) {
                if (!this.broken[c * 6 + d]) continue;
                const v = G.nb[c * 6 + d], key = edgeKey(c, d);
                if (v < 0 || this.owner[v] !== id || this.roadWork.has(key)) continue;
                const hot = CITY_OF[c] >= 0 || CITY_OF[v] >= 0 || RESOURCE_AT.has(c) || RESOURCE_AT.has(v);
                todo.push({ c, d, hot });
            }
        }
        todo.sort((x, y) => y.hot - x.hot);
        let spent = 0;
        for (const { c, d } of todo) {
            const v = G.nb[c * 6 + d];
            if (this.repairBlocked(id, c, v)) continue;
            const cost = Math.round(this.roadEdgeCost(c, d, this.broken[c * 6 + d], this.rules(id).roadCost) / 2);
            if (cost > budget - spent) continue;   // otro tramo más barato puede caber aún
            if (this.startRepair(id, { edges: [[c, d]], cost, cls: 'repair' })) spent += cost;
        }
        return spent;
    }
    // Al tomar una casilla por la fuerza se rompen sus carreteras y se arrasa su fortificación.
    wreck(cell, prev, a) {
        const cut = this.breakRoads(cell) > 0;
        const pname = PROVINCES[G.prov[cell]].name;
        if (cut) {
            const key = `${this.turn}:${prev}:${G.prov[cell]}`;
            if (prev === this.player && !this.cutLogged.has(key)) { this.cutLogged.add(key); this.log(`${this.nm(a)} rompe tu carretera en ${pname}.`); }
        }
        if (this.fort[cell] || this.fortWork.has(cell)) {
            this.fort[cell] = 0;
            this.fortWork.delete(cell);
            this.fortVersion++;
            if (this.involvesPlayer(a, prev)) this.log(`${this.nm(a)} arrasa la fortificación de ${pname}.`);
        }
    }

    buildRoad(id, plan) {
        const n = this.nations[id];
        if (!plan || plan.cost > n.gold) return 0;
        let built = 0;
        for (let i = 0; i + 1 < plan.path.length; i++) {
            const a = plan.path[i], b = plan.path[i + 1], d = G.dirTo(a, b);
            if (d < 0 || this.road[a * 6 + d] >= plan.cls) continue;
            this.road[a * 6 + d] = plan.cls;
            this.road[b * 6 + (d + 3) % 6] = plan.cls;
            this.broken[a * 6 + d] = 0; this.broken[b * 6 + (d + 3) % 6] = 0;
            this.roadWork.delete(edgeKey(a, d));   // la obra de reparación (si la hay) sobra
            built++;
        }
        if (!built) return 0;
        n.gold -= plan.cost;
        this.roadVersion++;
        return built;
    }

    // --- Ejércitos ---
    newArmy(owner, cell, units, used) {
        const a = { id: this.nextArmyId++, owner, cell, units: fullUnits(units), used, from: 0, hunger: 0, disorgUntil: 0 };
        this.armies.set(a.id, a);
        return a;
    }
    // Subpuntos de movimiento que quedan. Sin suministro solo queda 1 subpunto: no basta para ningún tramo, así que
    // el ejército únicamente puede dar el paso mínimo garantizado de reach() (una casilla por turno) o atacar a un vecino.
    // Lados de la casilla con ejércitos de países en guerra con `owner`.
    hostileSides(owner, cell) {
        if (afloat(cell)) return 0;   // en el mar no se rodea
        let n = 0;
        for (let d = 0; d < 6; d++) {
            const j = G.nb[cell * 6 + d];
            if (j >= 0 && isLand(j) && this.armyAt[j] && this.atWar(owner, this.armies.get(this.armyAt[j]).owner)) n++;
        }
        return n;
    }
    // Penalización por estar rodeado: multiplicador de ataque y defensa (1 si no lo está).
    flankFactor(owner, cell) {
        const r = this.rules(owner);
        if (this.fort[cell] && FORT_FX[this.fort[cell]].flankImmune && this.owner[cell] === owner) return 1;   // casamatas
        const n = this.hostileSides(owner, cell);
        return n >= CONFIG.SURROUNDED_SIDES ? r.surrounded : n >= CONFIG.FLANKED_SIDES ? r.flanked : 1;
    }
    // Apoyo mutuo: fuera de una ciudad, sin ningún ejército propio o aliado en las 6 vecinas, está aislado. `selfId` es
    // el propio ejército: si ataca desde la casilla de al lado de la suya, no se cuenta a sí mismo como apoyo.
    isolated(owner, cell, selfId = 0) {
        if (CITY_OF[cell] >= 0) return false;
        for (let d = 0; d < 6; d++) {
            const j = G.nb[cell * 6 + d], id = j >= 0 && isLand(j) ? this.armyAt[j] : 0;   // un barco no es apoyo
            if (!id || id === selfId) continue;
            const o = this.armies.get(id).owner;
            if (o === owner || this.allied(owner, o)) return false;
        }
        return true;
    }
    // ¿Llega con su movimiento completo de un turno (sin el recorte por suministro ni por rodeado) a alguna casilla con
    // un tramo de carretera intacto, de cualquier dueño? Pasa por territorio propio, aliado o enemigo sin mirar ejércitos,
    // y la propia casilla cuenta. Se guarda por dueño, casilla y velocidad hasta que cambie el mapa, la red, las reglas o
    // quién está en guerra con quién.
    roadInReach(owner, cell, units) {
        const budget = speedOf(units, this.rules(owner)) * MOVE;
        const stamp = `${this.version}:${this.roadVersion}:${this.techVersion}:${this.blocVersion}:${this.fortVersion}:${this.warVersion}`;
        if (stamp !== this.roadReachStamp) { this.roadReach.clear(); this.roadReachStamp = stamp; }
        const key = `${owner}:${cell}:${budget}`;
        let hit = this.roadReach.get(key);
        if (hit !== undefined) return hit;
        hit = false;
        const dist = new Map([[cell, 0]]), heap = new MinHeap();
        heap.push(0, cell);
        search: while (heap.size) {
            const [k, v] = heap.pop();
            if (k > dist.get(v)) continue;
            for (let d = 0; d < 6; d++) if (this.road[v * 6 + d] > 0) { hit = true; break search; }
            for (let d = 0; d < 6; d++) {
                const u = G.nb[v * 6 + d];
                if (u < 0 || !isLand(u)) continue;
                const o = this.owner[u], hostile = this.atWar(owner, o);
                if (!(o === owner || hostile || this.allied(owner, o))) continue;
                const c = k + this.stepCost(owner, v, d, hostile);
                if (c <= budget && c < (dist.get(u) ?? Infinity)) { dist.set(u, c); heap.push(c, u); }
            }
        }
        this.roadReach.set(key, hit);
        return hit;
    }
    // Lo que pesa la situación de un ejército en su ataque y su defensa: rodeado o cercado, aislado y, en territorio
    // enemigo, sin carretera al alcance; y, también en el mar, desorganizado por un ataque aéreo (el del ejército
    // `selfId` o, si se manda solo una parte de un ejército, el de `fromId`, del que sale). Cada parte es [nombre, factor]
    // y `mult` es su producto.
    armyState(owner, cell, units, selfId = 0, fromId = selfId) {
        const parts = [];
        if (!afloat(cell)) {   // en el mar no hay rodeo, aislamiento ni carretera
            const flank = this.flankFactor(owner, cell);
            if (flank < 1) parts.push([this.hostileSides(owner, cell) >= CONFIG.SURROUNDED_SIDES ? 'cercado' : 'rodeado', flank]);
            if (this.isolated(owner, cell, selfId)) parts.push(['aislado', CONFIG.ISOLATED_FACTOR]);
            if (this.atWar(owner, this.legal[cell]) && !this.roadInReach(owner, cell, units)) parts.push(['sin carretera', CONFIG.NO_ROAD_FACTOR]);
        }
        const self = fromId ? this.armies.get(fromId) : null;
        if (self && this.turn <= self.disorgUntil) parts.push(['desorganizado', CONFIG.AIR.DISORG]);
        return { mult: parts.reduce((m, [, x]) => m * x, 1), parts };
    }
    moveBudget(owner, cell, units, used) {
        if (afloat(cell)) return Math.max(0, this.rules(owner).seaSpeed * MOVE - used);
        if (!this.inSupply(owner, cell)) return Math.max(0, 1 - used);
        const sides = this.hostileSides(owner, cell);
        if (sides >= CONFIG.SURROUNDED_SIDES) return Math.max(0, 1 - used);   // cercado: solo el paso mínimo
        const full = speedOf(units, this.rules(owner)) * MOVE * (sides >= CONFIG.FLANKED_SIDES ? 0.5 : 1);
        return Math.max(0, Math.floor(full) - used);
    }
    mp(a) { return this.moveBudget(a.owner, a.cell, a.units, a.used); }
    // Sin víveres: la casilla es del ejército pero su dueño legal es un enemigo en guerra, y las seis vecinas son mar, borde
    // del mapa o tierra controlada por enemigos en guerra. Una vecina propia, aliada, neutral o en paz basta para comer.
    starving(owner, cell) {
        if (this.owner[cell] !== owner || !this.atWar(owner, this.legal[cell])) return false;
        for (let d = 0; d < 6; d++) {
            const j = G.nb[cell * 6 + d];
            if (j >= 0 && isLand(j) && !this.atWar(owner, this.owner[j])) return false;
        }
        return true;
    }
    // Turnos que faltan para perder la próxima unidad, o null si el ejército no pasa hambre.
    hungerLeft(a) { return this.starving(a.owner, a.cell) ? Math.max(1, this.rules(a.owner).hungerTurns - (a.hunger || 0)) : null; }
    // Al empezar el turno del país: el ejército sin víveres cuenta un turno más y, al llegar al límite, pierde una unidad.
    feedArmies(id) {
        for (const a of [...this.armies.values()]) {
            if (a.owner !== id) continue;
            if (!this.starving(id, a.cell)) { a.hunger = 0; continue; }
            if (++a.hunger < this.rules(id).hungerTurns) continue;
            a.hunger = 0;
            const k = ['infantry', 'artillery', 'tank', 'antiair'].find(u => a.units[u] > 0);
            a.units[k]--;
            const where = this.placeName(a.cell), gone = countUnits(a.units) === 0;
            if (gone) this.removeArmy(a);
            if (id === this.player) this.log(`Tu ejército en ${where} pasa hambre: pierde ${k === 'infantry' ? 'una infantería' : k === 'tank' ? 'un tanque' : k === 'antiair' ? 'una antiaérea' : 'una artillería'}${gone ? ' y se disuelve' : ''}.`);
            else if (this.player !== null && this.atWar(this.player, id) && this.sees(this.player, a.cell)) this.log(`El ejército enemigo en ${where} pierde una unidad por hambre.`);
            this.armyVersion++;
        }
    }
    armyOn(cell) { const id = this.armyAt[cell]; return id ? this.armies.get(id) : null; }
    removeArmy(a) {
        this.armyVersion++;
        if (this.armyAt[a.cell] === a.id) this.armyAt[a.cell] = 0;
        this.armies.delete(a.id);
    }
    settle(a) {
        this.armyVersion++;
        const other = this.armyAt[a.cell];
        if (!other) { this.armyAt[a.cell] = a.id; return a; }
        if (other === a.id) return a;
        const o = this.armies.get(other);
        for (const k of UNIT_KEYS) if (a.units[k]) o.units[k] = (o.units[k] || 0) + a.units[k];
        o.used = Math.max(o.used, a.used);
        o.hunger = Math.max(o.hunger || 0, a.hunger || 0);
        o.disorgUntil = Math.max(o.disorgUntil || 0, a.disorgUntil || 0);   // desorganizado: el que más dure
        if (!o.op && a.op) o.op = a.op;   // quien se une a un ejército sin operación se la lleva
        this.armies.delete(a.id);
        return o;
    }
    split(a, send) {
        if (sameUnits(a.units, send)) return a;
        for (const k of UNIT_KEYS) if (send[k]) a.units[k] -= send[k];
        const b = this.newArmy(a.owner, a.cell, send, a.used);
        b.disorgUntil = a.disorgUntil || 0;
        if (a.op) b.op = a.op;
        return b;
    }

    // --- Órdenes de ejército: duran varios turnos y se cumplen solas al terminar el turno (o con «Ejecutar órdenes») ---
    // army.order = { kind, dest, target, ratio, flee, since, stuck, path, eta }
    //   march: ir a `dest`; attack: ir a `dest` y atacar lo que haya si la relación de fuerzas llega a `ratio`;
    //   hold: quedarse; fortify: fortificar su casilla y quedarse; follow: ir detrás del ejército `target`.
    //   flee: si queda rodeado, se aparta antes de seguir. stuck: turnos seguidos sin poder avanzar.
    // army.direct = turno en que el jugador lo movió a mano: ese turno no cumple su orden.

    // Coste en subpuntos de ir de cada casilla hasta `dest` para un ejército de `owner`: Dijkstra hacia atrás desde el
    // destino que solo avanza lo que se le pide (sirve para muchos ejércitos con el mismo destino). Los ejércitos ajenos
    // cortan el paso, salvo en el propio destino; el mar cuesta el triple para que prefiera ir por tierra.
    orderField(owner, dest) {
        // Durante una pasada de órdenes (passStamp) los caminos valen para toda la pasada: rehacerlos tras cada
        // movimiento propio costaría mucho en el mapa del mundo y apenas cambia nada.
        const stamp = this.passStamp ?? `${this.version}:${this.armyVersion}:${this.roadVersion}:${this.fortVersion}:${this.techVersion}:${this.blocVersion}`;
        if (stamp !== this.fieldStamp) { this.fields.clear(); this.fieldStamp = stamp; }
        const key = owner * G.N + dest;
        let f = this.fields.get(key);
        if (f) return f;
        const dist = new Float64Array(G.N).fill(Infinity), next = new Int32Array(G.N).fill(-1), done = new Uint8Array(G.N), heap = new MinHeap();
        const open = c => {
            if (c === dest) return true;
            const o = this.owner[c];
            if (isLand(c) && !(o === owner || this.allied(owner, o) || this.atWar(owner, o))) return false;
            const id = this.armyAt[c];
            return !id || this.armies.get(id).owner === owner;
        };
        dist[dest] = 0; heap.push(0, dest);
        const to = cell => {   // completa el cálculo hasta conocer la distancia de `cell`
            while (!done[cell] && heap.size) {
                const [k, v] = heap.pop();
                if (done[v] || k > dist[v]) continue;
                done[v] = 1;
                const hostile = isLand(v) && this.atWar(owner, this.owner[v]);
                for (let d = 0; d < 6; d++) {
                    const u = G.nb[v * 6 + d];
                    if (u < 0 || done[u] || !open(u)) continue;
                    const cost = isLand(v) ? this.stepCost(owner, u, (d + 3) % 6, hostile) : MOVE * 3;
                    if (k + cost < dist[u]) { dist[u] = k + cost; next[u] = v; heap.push(dist[u], u); }
                }
            }
            return done[cell] ? dist[cell] : Infinity;
        };
        f = { dest, dist, next, done, to };
        this.fields.set(key, f);
        return f;
    }
    // Camino de casillas desde `from` hasta el destino del campo (vacío si no hay paso).
    fieldPath(f, from) {
        if (f.to(from) === Infinity) return [];
        const path = [from];
        for (let c = from; c !== f.dest && path.length < 2000; ) { c = f.next[c]; if (c < 0) return []; path.push(c); }
        return path;
    }
    // Relación de fuerzas que espera `owner` al atacar `def` en `cell`. Si no conoce el ejército (niebla de guerra),
    // supone lo peor de su escalón en infantería, para que la orden no use información que el jugador no tiene.
    expectedRatio(owner, units, from, def, cell, attId = 0) {
        if (this.intel(owner, def.owner, cell).exact) { const fx = this.combatFactors(owner, units, from, def, cell, attId); return fx.atk / fx.dfn; }
        const fx = this.combatFactors(owner, units, from, { owner: def.owner, units: { infantry: echelonCeil(countUnits(def.units)), tank: 0, artillery: 0 } }, cell, attId);
        return fx.atk / fx.dfn;
    }
    orderTarget(a) {
        const o = a.order;
        if (!o) return -1;
        if (o.kind === 'follow') { const t = this.armies.get(o.target); return t && t.owner === a.owner ? t.cell : -1; }
        return o.kind === 'march' || o.kind === 'attack' ? o.dest : -1;
    }
    // Recalcula el camino y los turnos que faltan (para dibujarlos y para la ficha).
    refreshOrder(a) {
        const o = a.order, dest = this.orderTarget(a);
        if (!o) return;
        if (dest < 0 || dest === a.cell) { o.path = [a.cell]; o.eta = 0; return; }
        const f = this.orderField(a.owner, dest);
        o.path = this.fieldPath(f, a.cell);
        o.eta = o.path.length ? this.pathTurns(a.owner, a.units, o.path, f.dist) : null;
    }
    // Turnos para recorrer un camino: con suministro, lo que dé su velocidad (al menos una casilla); sin él, una casilla.
    // Mar, como en reach: embarcar acaba el turno; embarcado navega `seaSpeed` casillas y desembarca si llega a la costa
    // antes de agotarlas (eso también acaba el turno). Un cruce de una sola casilla de mar desembarca en la otra orilla
    // el mismo turno si le llega el movimiento para la casilla de mar y el desembarco.
    pathTurns(owner, units, path, dist) {
        const rl = this.rules(owner), per = speedOf(units, rl) * MOVE, last = path.length - 1;
        let i = 0, turns = 0;
        while (i < last && turns < 500) {
            turns++;
            if (afloat(path[i])) {   // embarcado: navega y, si alcanza la costa con casillas de sobra, desembarca
                let k = 0;
                while (i < last && afloat(path[i + 1]) && k < rl.seaSpeed) { i++; k++; }
                if (i < last && k < rl.seaSpeed) i++;
                continue;
            }
            if (!this.inSupply(owner, path[i])) { i++; continue; }
            const start = dist[path[i]];
            for (let first = true; i < last; first = false) {
                const v = path[i + 1];
                if (afloat(v)) {   // embarca (fin del turno) o cruza una casilla y desembarca enfrente
                    const used = start - dist[path[i]];
                    if (used >= per) break;   // sin movimiento no embarca: lo hará al turno siguiente (como en reach)
                    i++;
                    if (i < last && !afloat(path[i + 1]) && used + MOVE + dist[path[i]] - dist[path[i + 1]] <= per) i++;
                    break;
                }
                if (!first && start - dist[v] > per) break;
                i++;
            }
        }
        return Math.max(1, turns);
    }
    setOrder(a, order) {
        if (!a || !this.armies.has(a.id)) return false;
        const o = { kind: order.kind, dest: order.dest ?? -1, target: order.target ?? 0, ratio: order.ratio ?? 1.3, flee: order.flee ?? true, since: this.turn, stuck: 0, path: [], eta: null };
        if (!['march', 'attack', 'hold', 'fortify', 'follow'].includes(o.kind)) return false;
        if (o.kind === 'march' || o.kind === 'attack') {
            const d = o.dest;
            if (d < 0) return false;
            if (afloat(d)) {   // al mar solo se marcha, a una casilla libre o con un ejército propio (o que no se ve)
                const id = this.armyAt[d];
                if (o.kind !== 'march' || (id && this.armies.get(id).owner !== a.owner && this.sees(a.owner, d))) return false;
            } else {
                const ow = this.owner[d];
                if (!(ow === a.owner || this.allied(a.owner, ow) || this.atWar(a.owner, ow))) return false;
            }
        }
        if (o.kind === 'follow') { const t = this.armies.get(o.target); if (!t || t.owner !== a.owner || t === a) return false; }
        a.order = o;
        this.refreshOrder(a);
        this.orderVersion++;
        return true;
    }
    clearOrder(a) { if (a?.order) { a.order = null; this.orderVersion++; } }

    // Cumple la orden de un ejército este turno con el movimiento que le quede. Devuelve lo que ha pasado:
    // 'moved', 'arrived', 'attacked', 'waiting' (sin ventaja suficiente), 'blocked', 'fled', 'cancelled' o null.
    stepOrder(a) {
        const o = a.order, owner = a.owner;
        if (!o || this.over) return null;
        if (o.kind === 'hold') return null;
        if (o.kind === 'fortify') {
            const r = this.rules(owner);
            if (this.fort[a.cell] || this.fortWork.has(a.cell)) { a.order = { ...o, kind: 'hold' }; this.orderVersion++; return null; }
            if (this.owner[a.cell] !== owner) { this.clearOrder(a); return 'cancelled'; }
            if (this.nations[owner].gold < r.fortCost) return 'waiting';
            this.buildFort(owner, { cells: [a.cell], path: [a.cell], cost: r.fortCost, cls: 'fort' });
            a.order = { ...o, kind: 'hold' };
            this.orderVersion++;
            return 'fortified';
        }
        const dest = this.orderTarget(a);
        if (dest < 0) { this.clearOrder(a); return 'cancelled'; }
        if (o.kind !== 'follow' && a.cell === dest) { this.clearOrder(a); return 'arrived'; }
        const mp = this.mp(a);
        if (mp <= 0) return null;
        const r = this.reach(owner, a.cell, mp, a.used === 0);
        if (o.flee && this.flee(a, r)) { this.refreshOrder(a); return 'fled'; }
        if (o.kind === 'attack' && r.attacks.has(dest)) {
            const def = this.armyOn(dest), from = r.attacks.get(dest);
            if (this.expectedRatio(owner, a.units, from, def, dest, a.id) >= o.ratio) {
                this.attack(a, from, dest, r);
                const after = this.armies.get(a.id);
                if (after && after.cell === dest) { this.clearOrder(after); return 'arrived'; }
                if (after) this.refreshOrder(after);
                return 'attacked';
            }
            if (from !== a.cell) { const moved = this.moveArmy(a, from, r); if (moved.order) this.refreshOrder(moved); }
            return 'waiting';
        }
        if (o.kind === 'follow' && G.dirTo(a.cell, dest) >= 0) return null;   // ya va pegado detrás
        if (this.holdLanding(a, dest)) return 'waiting';
        const res = this.advance(a, dest, r, o.kind !== 'follow');           // sigue al otro ejército sin juntarse con él
        if (res === 'blocked') {
            if (o.stuckTurn !== this.turn) { o.stuckTurn = this.turn; o.stuck++; }
            if (o.stuck >= 3 && o.kind !== 'follow') { this.clearOrder(a); return 'cancelled'; }
            return 'blocked';
        }
        o.stuck = 0;
        if (res === 'merged') return 'arrived';   // se ha unido a otro ejército en el destino
        if (res === 'arrived') { this.clearOrder(a); return 'arrived'; }
        this.refreshOrder(a);
        return 'moved';
    }
    // Un paso de turno hacia `dest` por el camino más rápido, sin juntarse con otros ejércitos por el camino (en el
    // destino, solo si `merge`). Devuelve 'moved', 'arrived', 'merged' o 'blocked'.
    // Con `avoid`, una casilla junto a un ejército enemigo cuenta como tres casillas más (para replegarse sin rozarlo).
    // Una casilla de mar expuesta (exposedAtSea) cuenta, con o sin `avoid`, como tres casillas de mar más (cada una vale
    // MOVE * 3 en orderField): embarcado apenas se defiende. Sin `avoid`, si solo puede avanzar por mar expuesto, avanza.
    advance(a, dest, r, merge = true, avoid = false) {
        const f = this.orderField(a.owner, dest), here = f.to(a.cell);
        let best = -1, bestD = here, risk = -1, riskD = here;
        for (const v of this.destinations(r)) {
            if (this.armyAt[v] && !(merge && v === dest)) continue;   // con otro ejército solo se entra en el destino, y si `merge`
            if (!f.done[v] || f.dist[v] >= here) continue;            // solo están calculadas las más cercanas que `here`
            const exposed = v !== dest && this.exposedAtSea(a.owner, v);
            const risky = exposed || (avoid && v !== dest && this.zoc(v, a.owner));
            const d = f.dist[v] + (risky ? (afloat(v) ? 3 * 3 * MOVE : 3 * MOVE) : 0);
            if (d < bestD) { bestD = d; best = v; }
            if (exposed && !avoid && f.dist[v] < riskD) { riskD = f.dist[v]; risk = v; }
        }
        if (best < 0) best = risk;
        if (best < 0) return 'blocked';
        const moved = this.moveArmy(a, best, r);
        if (moved !== a || !this.armies.has(a.id)) return 'merged';
        return a.cell === dest ? 'arrived' : 'moved';
    }
    // ¿Está `cell` en el mar con un ejército de un país en guerra con `owner` al lado (en tierra o en el mar)?
    exposedAtSea(owner, cell) {
        if (!afloat(cell)) return false;
        for (let d = 0; d < 6; d++) {
            const j = G.nb[cell * 6 + d], id = j >= 0 ? this.armyAt[j] : 0;
            if (id && this.atWar(owner, this.armies.get(id).owner)) return true;
        }
        return false;
    }
    // Desembarco a la vez: un ejército de una ofensiva que ya está en el mar junto a la costa por la que entra hacia
    // `dest` espera (true) si otro de su operación aún navega hacia allí, con camino, a 2 turnos de esa costa o menos, y
    // lleva menos de 2 turnos esperando. El reloj solo empieza cuando hay a quién esperar. Al que también está ya junto a

    holdLanding(a, dest) {

        return [...this.armies.values()].filter(a => a.owner === id && !a.op && !a.order && !a.form && this.armyOn(a.cell) === a
            && cost.get(a.cell) <= OP_GATHER_TURNS * MOVE * speedOf(a.units, rules)
            && !(CITY_OF[a.cell] >= 0 && countUnits(a.units) <= 1) && !otherFront(a))
            .sort((x, y) => cost.get(x.cell) - cost.get(y.cell) || x.id - y.id);
    }
    // Coste de marcha hasta `dest` desde cada casilla propia o aliada a `limit` subpuntos o menos: como orderField
    // pero acotado, para buscar fuerzas sin recorrer el mapa entero.
    marchCosts(owner, dest, limit) {
        const dist = new Map(), heap = new MinHeap();
        for (const d of Array.isArray(dest) ? dest : [dest]) { dist.set(d, 0); heap.push(0, d); }
        while (heap.size) {
            const [k, v] = heap.pop();
            if (k > dist.get(v)) continue;
            for (let d = 0; d < 6; d++) {
                const u = G.nb[v * 6 + d];
                if (u < 0 || !isLand(u) || !(this.owner[u] === owner || this.allied(owner, this.owner[u]))) continue;
                const c = k + this.stepCost(owner, u, (d + 3) % 6, false);
                if (c <= limit && c < (dist.get(u) ?? Infinity)) { dist.set(u, c); heap.push(c, u); }
            }
        }
        return dist;
    }
    assignArmy(a, opId) {
        if (!a) return;
        a.form = 0;
        const op = opId ? this.ops.get(opId) : null;
        if (opId && (!op || op.owner !== a.owner)) return;
        a.op = op ? op.id : 0;
        if (op && a.order && a.order.kind !== 'hold') a.order = null;   // al entrar en una operación, la manda ella
        this.orderVersion++;
    }
    endOp(op, why = '') {
        if (!this.ops.has(op.id)) return;
        for (const a of this.armies.values()) { if (a.op === op.id) a.op = 0; if (a.form === op.id) a.form = 0; if (a.from === op.id) a.from = 0; }
        for (const q of this.squadrons.values()) if (q.op === op.id) q.op = 0;
        this.ops.delete(op.id);
        this.orderVersion++;
        if (op.owner === this.player) this.log(`${op.name}: ${why || 'operación terminada'}. Sus ejércitos quedan sin operación.`);
    }
    // Cuánta ayuda pide una operación: ofensiva, los ejércitos que esperaban ventaja (o 1 si no tiene ninguno);
    // defensa, las casillas de su línea sin tropas.
    opNeed(op) {
        if (op.paused || op.kind === 'reserva') return 0;
        if (op.kind === 'defensa') return op.cells.filter(c => { const id = this.armyAt[c]; return !id || this.armies.get(id).owner !== op.owner; }).length;
        return this.opMembers(op).length ? op.waiting : 1;
    }
    // Un ejército que pasa a otro país llega sin orden ni operación.
    changeOwner(a, owner) {
        a.owner = owner;
        a.order = null; a.op = 0; a.form = 0; a.from = 0;
        this.orderVersion++;
    }
    // Al salir de una ciudad suya, un ejército deja una infantería de guarnición fuera de la operación (como la IA).
    // Devuelve lo que sale; si al final no se mueve, reattach() lo vuelve a juntar con la guarnición.
    detach(a) {
        if (CITY_OF[a.cell] < 0 || this.owner[a.cell] !== a.owner || countUnits(a.units) < 2) return a;
        const send = copyUnits(a.units);
        send[UNIT_KEYS.find(k => a.units[k] > 0)]--;   // una infantería o, si no hay, la primera unidad que tenga
        const b = this.split(a, send);
        a.op = 0;
        return b;
    }
    reattach(b) { if (this.armies.has(b.id) && this.armyAt[b.cell] !== b.id) this.settle(b); }
    executeOps(id, ids) {
        const rank = { ofensiva: 0, defensa: 1, reserva: 2 };
        const list = ids.map(x => this.ops.get(x)).filter(op => op && op.owner === id && !op.paused).sort((x, y) => rank[x.kind] - rank[y.kind] || x.id - y.id);
        const outer = this.passStamp;
        this.passStamp ??= `pasada ${this.passN = (this.passN ?? 0) + 1}`;
        try { for (const op of list) { if (this.over) return; if (this.ops.has(op.id)) this.executeOp(op); } } finally { this.passStamp = outer; }
    }
    // Cumple una operación este turno con los ejércitos que tenga libres (sin orden propia ni movidos a mano).
    executeOp(op) {
        const id = op.owner, rules = this.rules(id);
        const free = this.opMembers(op).filter(a => !a.order && a.direct !== this.turn)
            .sort((x, y) => unitPower(y.units, 'atk', rules) - unitPower(x.units, 'atk', rules) || x.id - y.id);
        const tally = { moved: 0, attacked: 0, waiting: 0, fortified: 0, sent: [], sentAir: [], notes: [], air: null };
        const live = a => this.armies.has(a.id) && a.owner === id && this.armyOn(a.cell) === a && this.mp(a) > 0;
        if (op.kind === 'ofensiva') {
            const obj = op.cells[op.cells.length - 1];
            if (this.owner[obj] === id) { this.endOp(op, `objetivo cumplido, ${this.placeName(obj)} es tuya`); return tally; }
            const far = c => Math.hypot(G.cx[c] - G.cx[obj], G.cy[c] - G.cy[obj]) / G.W;   // casillas en línea recta
            for (const a0 of free) {
                if (this.over) break;
                if (!live(a0)) continue;
                const a = this.detach(a0);
                const r = this.reach(id, a.cell, this.mp(a), a.used === 0);
                if (this.flee(a, r)) { tally.moved++; continue; }
                let best = null, bestScore = -Infinity, wanted = false;
                for (const [target, from] of r.attacks) {
                    if (far(target) > far(a.cell) + 0.5) continue;   // no se desvía hacia atrás
                    const ratio = this.expectedRatio(id, a.units, from, this.armyOn(target), target, a.id);
                    if (ratio < op.ratio) { wanted = true; continue; }
                    const score = Math.min(ratio, 5) + (CITY_OF[target] >= 0 ? 1 : 0) + (target === obj ? 5 : 0) - far(target) * 0.05;
                    if (score > bestScore) { bestScore = score; best = { target, from }; }
                }
                if (best) { this.attack(a, best.from, best.target, r); this.reattach(a); tally.attacked++; continue; }
                if (this.holdLanding(a, obj)) continue;   // en el mar, espera a los demás para desembarcar a la vez
                const res = this.advance(a, obj, r);
                if (res === 'blocked') { this.reattach(a); if (wanted) tally.waiting++; } else tally.moved++;
            }
            op.waiting = tally.waiting;
            if (this.owner[obj] === id) this.endOp(op, `objetivo cumplido, ${this.placeName(obj)} es tuya`);
        } else if (op.kind === 'defensa') {
            this.defenseStep(op, free, tally, live);
            op.uncovered = this.opNeed(op);
        } else {
            const zone = op.cells[0], near = this.nearCells(zone, 2);
            for (const a0 of free) {
                if (!live(a0) || near.has(a0.cell)) continue;
                const a = this.detach(a0), r = this.reach(id, a.cell, this.mp(a), a.used === 0);
                if (this.advance(a, zone, r, false) !== 'blocked') tally.moved++; else this.reattach(a);
            }
            // Manda ejércitos a las operaciones que piden ayuda, uno a cada una, empezando por la que más pide.
            if (op.auto !== 'manual') {
                const strength = a => unitPower(a.units, 'atk', rules) + unitPower(a.units, 'def', rules);
                const pool = this.opMembers(op).filter(a => !a.order).sort((x, y) => strength(y) - strength(x));
                const needy = this.opsOf(id).filter(o => o !== op && o.kind !== 'reserva' && !o.paused).map(o => [o, this.opNeed(o) * this.priorityOf(o)]).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]);
                for (const [o] of needy) {
                    const a = pool.shift();
                    if (!a) break;
                    a.op = o.id;
                    tally.sent.push(o.name);
                    this.orderVersion++;
                }
                // Y escuadrones, en el mismo orden: uno a cada operación con fines que tenga su punto clave a su alcance (no a
                // las que van en manual, donde no vuelan).
                const R = this.airRange(id), wings = [...this.squadrons.values()].filter(q => q.op === op.id && q.owner === id).sort((x, y) => x.id - y.id);
                for (const [o] of needy) {
                    if (!wings.length) break;
                    const key = this.opKey(o), i = o.aims?.length && o.auto !== 'manual' ? wings.findIndex(q => hexDist(q.base, key) <= R) : -1;
                    if (i < 0) continue;
                    wings.splice(i, 1)[0].op = o.id;
                    tally.sentAir.push(o.name);
                    this.orderVersion++;
                }
            }
        }
        // La aviación de la operación vuela al final, con lo que ya han hecho sus ejércitos.
        if (this.ops.has(op.id)) tally.air = this.opAir(op);
        if (id === this.player) {
            const parts = [];
            if (tally.moved) parts.push(plural(tally.moved, 'ejército se mueve', 'ejércitos se mueven'));
            if (tally.attacked) parts.push(plural(tally.attacked, 'ataque', 'ataques'));
            if (tally.waiting) parts.push(`${tally.waiting} esperan una ventaja de ${decimal(op.ratio)} a 1`);
            if (tally.fortified) parts.push(plural(tally.fortified, 'casilla fortificada', 'casillas fortificadas'));
            if (op.kind === 'defensa' && op.uncovered) parts.push(`${plural(op.uncovered, 'casilla', 'casillas')} de la línea sin tropas`);
            for (const n of tally.sent) parts.push(`manda un ejército a ${n}`);
            for (const n of tally.sentAir) parts.push(`manda un escuadrón a ${n}`);
            const air = tally.air;
            if (air?.notes.length) parts.push(air.strikes ? `${plural(air.notes.length, 'misión aérea', 'misiones aéreas')}, ${plural(air.hits, 'acierto', 'aciertos')}`
                : plural(air.notes.length, 'misión aérea de protección', 'misiones aéreas de protección'));
            parts.unshift(...tally.notes);
            if (parts.length && this.ops.has(op.id)) this.log(`${op.name}: ${parts.join(', ')}.`);
        }
        return tally;
    }

    // --- Reparto de esfuerzos entre operaciones ---
    // Ejércitos que una operación no cede: una línea (aunque esté en pausa), los que cubren sus casillas y le dan una
    // relación de al menos LINE_HOLD (uno más de los que tiene si no llegan); una ofensiva en marcha, todos; la reserva y
    // las ofensivas en pausa, ninguno.
    opMinimum(op) {
        if (op.kind === 'reserva' || (op.paused && op.kind === 'ofensiva')) return 0;
        const members = this.opMembers(op);
        if (op.kind === 'ofensiva') return members.length;
        const ev = this.lineEval(op, op.cells, members);
        if (!ev.enemy) return op.cells.length;
        const rules = this.rules(op.owner), line = new Set(op.cells);
        const power = members.map(a => unitPower(a.units, 'def', rules) * (line.has(a.cell) ? this.defBonus(op.owner, a.cell) : ev.mean)).sort((x, y) => y - x);
        let sum = 0, k = 0;
        while (k < power.length && sum < ev.enemy * LINE_HOLD) sum += power[k++];
        return Math.max(op.cells.length, sum >= ev.enemy * LINE_HOLD ? k : members.length + 1);
    }
    // Cuántos ejércitos más pide una operación: una línea, hasta su mínimo; una ofensiva, OP_MIN_ARMIES o los que esperan ventaja.
    opWant(op) {
        if (op.paused || op.kind === 'reserva') return 0;
        const n = this.opMembers(op).length;
        return op.kind === 'defensa' ? Math.max(0, this.opMinimum(op) - n) : Math.max(op.waiting ?? 0, OP_MIN_ARMIES - n);
    }
    // Reparte ejércitos entre las operaciones que piden, por rondas (uno a cada una, primero la de más prioridad × necesidad):
    // de la reserva, del sobrante de las líneas y de las ofensivas en pausa, a OP_GATHER_TURNS turnos de marcha o menos.
    // Con `free`, también los ejércitos libres (al crear una operación y en la IA). No toca las operaciones manuales,
    // los ejércitos con orden propia ni los movidos a mano este turno.
    shareForces(id, { free = id !== this.player } = {}) {
        const ops = this.opsOf(id), rules = this.rules(id);
        const takers = ops.filter(o => o.auto !== 'manual' && o.kind !== 'reserva' && !o.paused).map(op => ({ op, want: this.opWant(op) })).filter(t => t.want > 0)
            .sort((x, y) => this.priorityOf(y.op) * (1 + y.want) - this.priorityOf(x.op) * (1 + x.want) || x.op.id - y.op.id);
        if (!takers.length) return;
        const offer = [];
        if (free) for (const a of this.armies.values()) if (a.owner === id && !a.op && !a.order && !a.form && a.direct !== this.turn && this.armyOn(a.cell) === a && !(CITY_OF[a.cell] >= 0 && countUnits(a.units) <= 1)) offer.push({ a, from: null, rank: 0 });
        for (const o of ops) {
            if (o.auto === 'manual' || takers.some(t => t.op === o)) continue;
            const members = this.opMembers(o).filter(a => !a.order && a.direct !== this.turn);
            let spare = [];
            if (o.kind === 'reserva' || (o.paused && o.kind === 'ofensiva')) spare = members;
            else if (o.kind === 'defensa') {
                const k = members.length - this.opMinimum(o), line = new Set(o.cells);
                if (k > 0) spare = members.sort((x, y) => line.has(x.cell) - line.has(y.cell) || this.threat(id, x.cell) - this.threat(id, y.cell)).slice(0, k);
            }
            for (const a of spare) offer.push({ a, from: o, rank: o.kind === 'reserva' ? 1 : o.kind === 'defensa' ? 2 : 3 });
        }
        if (!offer.length) return;
        const fastest = Math.max(...UNIT_KEYS.map(k => rules.types[k].speed)), costs = new Map(), moved = new Map();
        // Un ejército libre con otro enemigo a 2 casillas o menos ya guarda otro frente.
        const otherFront = (a, front) => { for (const c of this.nearCells(a.cell, 2).keys()) { const e = this.armyOn(c); if (e && e.owner !== front && this.atWar(id, e.owner)) return true; } return false; };
        for (let busy = true; busy;) {

                const cost = costs.get(t), front = this.opFront(t.op);

                for (const x of offer) {

                    if (c === undefined || c > OP_GATHER_TURNS * MOVE * speedOf(x.a.units, rules) || (!x.from && otherFront(x.a, front))) continue;

                best.used = true; t.want--; busy = true;

                if (best.from) { const k = `${best.from.id}>${t.op.id}`; moved.set(k, [best.from, t.op, (moved.get(k)?.[2] ?? 0) + 1]); }

        }

    }
    // Por qué una ofensiva sin ejércitos no recibe ninguno, para su ficha.
    opWaitNote(op) {

        const p = this.formProgress(op), coming = p ? p.moving + p.waiting + p.ready : 0;
        const who = lines.length ? `${lines.map(o => o.name).join(', ')} ${lines.length === 1 ? 'necesita' : 'necesitan'} todas sus tropas` : 'No hay ejércitos libres cerca';
        return `${who}; ${op.form ? `esperando reclutas (${coming} en camino)` : 'dale oro para reclutar o asígnale ejércitos'}.`;
    }

    // --- Línea de defensa: aguanta, se repliega o vuelve a la línea dibujada ---
    // Qué haría la línea este turno, sin hacerlo (sirve también para enseñarlo en las manuales):
    // { state, cells: línea activa, ev: lineEval de la actual, cand: la línea nueva si se repliega, stuck: sin nada mejor detrás }.
    defenseDecide(op) {
        const id = op.owner, members = this.opMembers(op), ev = this.lineEval(op, op.cells, members);
        const drawn = op.drawn ?? op.cells, line = new Set(op.cells), moving = members.some(a => !line.has(a.cell));
        if (!members.length) return { state: 'aguanta', cells: op.cells, ev };
        const atDrawn = drawn.length === op.cells.length && drawn.every((c, i) => c === op.cells[i]);
        if (!atDrawn && !ev.breach && drawn.every(c => this.owner[c] === id || this.atWar(id, this.owner[c]))) {
            const evD = this.lineEval(op, drawn, members);
            if (evD.rel === null || evD.rel >= LINE_RETURN) return { state: 'restablece', cells: drawn, ev, evD };

        const retaking = op.state === 'restablece' && atDrawn, broken = retaking ? ev.rear : ev.breach;
        if (broken || (ev.rel !== null && ev.rel < LINE_HOLD)) {

            const cand = this.bestLine(id, { ref: op.cells, forces: members, enemy: ev.enemy, dir: this.lineDir(id, drawn), limit: LINE_STEP_TURNS * slow * MOVE,

            if (cand && !cand.same) return { state: 'repliega', cells: cand.cells, ev, cand };

        }
        if (retaking && ev.lost) return { state: 'restablece', cells: op.cells, ev };   // sigue hasta retomar toda la línea
        return { state: (op.state === 'repliega' || op.state === 'restablece') && moving ? op.state : 'aguanta', cells: op.cells, ev };
    }
    // Nombre corto de una línea para el parte: su lugar central y su terreno («colinas y río»).
    lineLabel(owner, cells) {
        const dir = this.lineDir(owner, cells), count = new Map();
        for (const c of cells) if (CELL_TERRAIN[c] !== 'plain') count.set(CELL_TERRAIN[c], (count.get(CELL_TERRAIN[c]) ?? 0) + 1);
        const top = [...count].sort((x, y) => y[1] - x[1])[0], parts = [top ? CONFIG.TERRAIN[top[0]].name.toLowerCase() : 'llanura'];
        if (cells.some(c => this.riverFront(c, dir) > 1)) parts.push('río');
        return `${this.placeName(cells[Math.floor(cells.length / 2)])} (${parts.join(' y ')})`;
    }
    // Cumple una línea de defensa este turno con sus ejércitos libres.
    // Saca a un ejército de una bolsa. Rodeado o sin víveres, rompe el cerco atacando, con una previsión de al menos 1, la
    // casilla que más lo acerque a `towards`. Si no puede, marcha a la casilla que alcance este turno que más valga según
    // `value` (de entre las de igual valor, la de menos coste de movimiento); por defecto, la propia o aliada donde no pase
    // hambre. Si no alcanza ninguna que valga y pasa hambre, da el paso que más lo acerque a `towards` por tierra que pueda
    // pisar (propia, aliada o en guerra). Devuelve null si ha atacado; si no, el ejército, se haya movido o no.
    breakOut(id, a, towards, value = c => (this.owner[c] === id || this.allied(id, this.owner[c])) && !this.starving(id, c) ? 1 : 0) {
        const r = this.reach(id, a.cell, this.mp(a), a.used === 0);
        const near = c => towards.length ? Math.min(...towards.map(t => (G.cx[t] - G.cx[c]) ** 2 + (G.cy[t] - G.cy[c]) ** 2)) : 0;
        const hungry = this.starving(id, a.cell);
        if (hungry || this.hostileSides(id, a.cell) >= CONFIG.FLANKED_SIDES) {
            let best = null, bd = Infinity;
            for (const [target, from] of r.attacks) {
                if (this.expectedRatio(id, a.units, from, this.armyOn(target), target, a.id) < 1) continue;
                const d = near(target);
                if (d < bd) { bd = d; best = { target, from }; }
            }
            if (best) { this.attack(a, best.from, best.target, r); return null; }
        }
        let best = a.cell, bv = value(a.cell), bc = 0;
        for (const v of this.destinations(r)) {
            if (this.armyAt[v] || !isLand(v)) continue;
            const val = value(v), cost = this.entry(r, v)?.cost ?? Infinity;
            if (val > bv || (val === bv && val > 0 && cost < bc)) { best = v; bv = val; bc = cost; }
        }
        if (best === a.cell && hungry && towards.length) {
            const steps = this.landSteps(id, towards);
            let bd = steps[a.cell];
            for (const v of this.destinations(r)) {
                if (this.armyAt[v] || !isLand(v)) continue;
                if (steps[v] < bd) { bd = steps[v]; best = v; }
            }
        }
        return best !== a.cell ? this.moveArmy(a, best, r) : a;
    }
    defenseStep(op, free, tally, live) {
        const id = op.owner, rules = this.rules(id);
        const held = c => { const x = this.armyAt[c]; return x && this.armies.get(x).owner === id; };
        const counter = (cells, anyFrom) => {
            const line = new Set(cells);
            for (const a of free) {
                if (!live(a) || a.op !== op.id || (!anyFrom && !line.has(a.cell))) continue;
                const r = this.reach(id, a.cell, this.mp(a), a.used === 0);
                for (const [target, from] of r.attacks) {
                    if (!line.has(target) || (!anyFrom && from !== a.cell)) continue;
                    if (this.expectedRatio(id, a.units, from, this.armyOn(target), target, a.id) >= op.ratio) { this.attack(a, from, target, r); tally.attacked++; break; }
                }
            }
        };
        // Contraataque desde la línea contra sus casillas ocupadas, con ventaja y sin estar en inferioridad.
        const ev0 = this.lineEval(op);
        if (op.state !== 'repliega' && (ev0.rel === null || ev0.rel >= LINE_HOLD)) counter(op.cells, false);
        const dec = this.defenseDecide(op), dir = this.lineDir(id, op.drawn ?? op.cells);
        const ratioText = ev => ev.rel === null ? '' : `relación ${decimal(ev.rel)} a 1`;
        op.rel = dec.ev.rel;
        if (dec.state === 'repliega' && dec.cand) {
            op.cells = [...dec.cells];
            this.orderVersion++;
            const why = [dec.ev.breach ? 'brecha en la línea' : '', ratioText(dec.ev)].filter(Boolean).join(' y ');
            tally.notes.push(`${why}; se repliega a ${this.lineLabel(id, op.cells)}${dec.cand.rel !== null ? `, ${decimal(dec.cand.rel)} a 1 prevista` : ''}${dec.cand.rel !== null && dec.cand.rel < LINE_HOLD ? '; ninguna posición cercana da superioridad: hacen falta refuerzos' : ''}`);
        } else if (dec.state === 'restablece' && op.cells !== op.drawn && op.cells.join() !== op.drawn.join()) {
            op.cells = [...op.drawn];
            this.orderVersion++;
            tally.notes.push(`${dec.evD.rel === null ? 'sin enemigos a la vista' : ratioText(dec.evD)}; vuelve a la línea dibujada`);
            // Vuelven a la operación las guarniciones y los cortados que quedan en la línea o detrás (la última unidad de una ciudad se queda).
            for (const a of this.armies.values()) {
                if (a.owner !== id || a.from !== op.id || this.lineSide(op.cells, dir, a.cell) > 0) continue;
                a.from = 0;
                if (CITY_OF[a.cell] >= 0 && countUnits(a.units) <= 1) continue;
                a.op = op.id;
                if (a.order?.kind === 'hold') a.order = null;
                if (!a.order && a.direct !== this.turn) free.push(a);
            }
        } else if (dec.stuck && op.stuckTurn !== this.turn) {
            op.stuckTurn = this.turn;
            tally.notes.push(`${ratioText(dec.ev) || 'brecha en la línea'}; ninguna posición detrás es mejor: hacen falta refuerzos`);
        }
        op.state = dec.state;
        const line = new Set(op.cells), danger = new Map(op.cells.map(c => [c, this.threat(id, c)]));
        const stay = (a, why) => {
            a.op = 0; a.from = op.id;
            this.setOrder(a, { kind: 'hold' });
            why.push(this.placeName(a.cell));
            if (op.fortify && CITY_OF[a.cell] >= 0 && !this.fort[a.cell] && !this.fortWork.has(a.cell) && this.nations[id].gold >= rules.fortCost)
                this.buildFort(id, { cells: [a.cell], path: [a.cell], cost: rules.fortCost, cls: 'fort' });
        };
        const garrisons = [], cut = [];
        if (op.state === 'repliega') {
            // Ciudades que quedan delante: quien sea su única guarnición se queda; de las demás sale todo menos una unidad (detach).
            for (const a of free) {
                if (!live(a) || a.op !== op.id || line.has(a.cell)) continue;
                if (CITY_OF[a.cell] >= 0 && this.owner[a.cell] === id && countUnits(a.units) <= 1 && this.lineSide(op.cells, dir, a.cell) > 0) stay(a, garrisons);
            }
            // Cortados: rodeados, o sin camino por tierra propia hasta la línea en LINE_STEP_TURNS turnos.
            const fastest = Math.max(...UNIT_KEYS.map(k => rules.types[k].speed));
            const costs = this.marchCosts(id, op.cells.filter(c => this.owner[c] === id), LINE_STEP_TURNS * fastest * MOVE);
            for (const a0 of free) {
                if (!live(a0) || a0.op !== op.id || line.has(a0.cell)) continue;
                if (this.hostileSides(id, a0.cell) < CONFIG.FLANKED_SIDES && (costs.get(a0.cell) ?? Infinity) <= LINE_STEP_TURNS * speedOf(a0.units, rules) * MOVE) continue;
                // Rompe el cerco hacia la línea o va a la ciudad, la montaña o la colina propia más cercana que alcance, y aguanta allí.
                const a = this.breakOut(id, a0, op.cells, c => this.owner[c] !== id ? 0 : CITY_OF[c] >= 0 ? 3 : CELL_TERRAIN[c] === 'mountain' ? 2 : CELL_TERRAIN[c] === 'hills' ? 1 : 0);
                if (!a) { tally.attacked++; continue; }
                if (this.armies.has(a.id) && a.owner === id) stay(a, cut);
            }
        }
        // Cubrir la línea: primero las casillas más amenazadas, con el ejército libre más cercano.
        const idle = free.filter(a => live(a) && a.op === op.id && !line.has(a.cell));
        const leave = (pick, a) => { if (a !== pick && op.state === 'repliega' && this.lineSide(op.cells, dir, pick.cell) > 0) stay(pick, garrisons); };
        if (op.state === 'restablece') counter(op.cells, true);   // retoma la línea dibujada con la ventaja de la operación
        const empty = op.cells.filter(c => !held(c) && (this.owner[c] === id || this.atWar(id, this.owner[c]))).sort((x, y) => danger.get(y) - danger.get(x));
        for (const c of empty) {
            let pick = null, pd = Infinity;
            for (const a of idle) { const d = (G.cx[a.cell] - G.cx[c]) ** 2 + (G.cy[a.cell] - G.cy[c]) ** 2; if (d < pd) { pd = d; pick = a; } }
            if (!pick) break;
            idle.splice(idle.indexOf(pick), 1);
            if (!live(pick)) continue;
            const a = this.detach(pick), r = this.reach(id, a.cell, this.mp(a), a.used === 0);
