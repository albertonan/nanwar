            const p = PROVINCES[G.prov[c]]; return esc(CITY_OF[c] >= 0 ? p.cityName : p.name);
        };
        const eta = o.eta ? `; llega en ${o.eta === 1 ? 'este turno o el siguiente' : `unos ${o.eta} turnos`}` : '';
        const stuck = o.stuck ? ` <span class="warn-text">Sin paso desde hace ${plural(o.stuck, 'turno', 'turnos')}: se cancela a los 3.</span>` : '';
        const ratio = o.ratio ? `con una relación de fuerzas de ${decimal(o.ratio)} a 1 o más` : 'a toda costa';
        switch (o.kind) {
            case 'march': return `Marcha hacia ${place(o.dest)}${eta}.${stuck}`;
            case 'attack': return `Va a por ${place(o.dest)} y ataca lo que haya ${ratio}${eta}.${stuck}`;
            case 'hold': return 'Mantiene la posición: no se mueve hasta que le des otra orden.';
            case 'fortify': return `Fortificará su casilla en cuanto tengas ${g.rules(g.player).fortCost} de oro.`;
            case 'follow': { const t = g.armies.get(o.target); return t ? `Sigue al ejército ${afloat(t.cell) ? 'que está en' : 'de'} ${place(t.cell)} (${countUnits(t.units)} unidades), una casilla por detrás.` : 'Sigue a un ejército que ya no existe.'; }
        }
        return '';
    }
    // Órdenes de varios turnos en la ficha del ejército.
    orderSection(a) {
        const o = a.order, flee = o ? o.flee : (this.orderFlee ?? true), ratio = o?.kind === 'attack' ? o.ratio : this.orderRatio;
        const btn = (kind, label, title, off = false) => `<button class="btn ${o?.kind === kind ? 'on' : ''}" data-action="order" data-kind="${kind}" title="${title}" ${off ? 'disabled' : ''}>${label}</button>`;
        return `<section class="sec">
            <h3>Orden de varios turnos</h3>
            ${(() => { const g = this.game, ops = g.opsOf(g.player); return ops.length ? `<div class="row" style="margin-bottom:8px"><span class="small">Operación</span>
                <select data-op-assign style="flex:1"><option value="0">Ninguna</option>${ops.map(o => `<option value="${o.id}" ${a.op === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select></div>` : ''; })()}
            ${o ? `<p class="small">${this.orderText(a)}</p>
                <div class="row" style="margin:6px 0 8px"><button class="btn ghost" data-action="order-cancel">Cancelar la orden</button></div>`
                : a.op ? `<p class="small muted">Sin orden propia: lo mueve su operación${this.game.ops.get(a.op)?.auto === 'manual' ? ' (en manual: no lo mueve)' : ''}.</p>` : '<p class="small muted">Sin orden: solo se mueve cuando lo mueves tú.</p>'}
            <div class="orders">
                ${btn('march', 'Marchar a…', 'Elige un destino; va hasta allí aunque tarde varios turnos, por el camino más rápido')}
                ${btn('attack', 'Atacar…', 'Elige un objetivo; va hasta allí y ataca cuando tenga la ventaja que marques')}
                ${btn('hold', 'Mantener', 'Se queda donde está; «Siguiente ejército» deja de pedirte que lo muevas')}
                ${btn('fortify', 'Fortificar aquí', afloat(a.cell) ? 'En el mar no se puede fortificar' : 'Fortifica su casilla y se queda en ella', afloat(a.cell))}
                ${btn('follow', 'Seguir a…', 'Va una casilla por detrás de otro ejército tuyo, por ejemplo artillería tras los tanques')}
            </div>
            <div class="row" style="margin-top:8px"><span class="small">Atacar con</span><div class="seg" style="flex:1">
                ${[[1.8, '1,8 : 1'], [1.3, '1,3 : 1'], [1, '1 : 1'], [0, 'Siempre']].map(([v, l]) => `<button data-action="order-ratio" data-value="${v}" class="${ratio === v ? 'on' : ''}" title="${v ? `Solo ataca si su fuerza es al menos ${decimal(v)} veces la del defensor` : 'Ataca sin mirar la relación de fuerzas'}">${l}</button>`).join('')}
            </div></div>
            <label class="check small" style="margin-top:8px"><input type="checkbox" data-action="order-flee" ${flee ? 'checked' : ''}> Apartarse si lo rodean (3 lados o más)</label>
            <p class="note">Las órdenes son para todo el ejército y se cumplen solas al terminar tu turno, o ya con «Ejecutar órdenes» (O). Si lo mueves a mano, ese turno manda lo tuyo. Con niebla, la ventaja se calcula con lo peor de su escalón.</p>
        </section>`;
    }

    // Botones de diplomacia con una nación (en la ficha y en el panel de países).
    diplomacyActions(t, pid = -1) {
        const g = this.game, p0 = g.player, r = g.rel(p0, t);
        let html = `<h3>Diplomacia con ${g.nm(t)}</h3>`;
        if (g.nations[t].overlord === p0) {
            const p = pid >= 0 ? PROVINCES[pid] : null;
            return html + `<p class="small muted">Es tu satélite: te paga ${Math.round(g.economy(t).total * CONFIG.TRIBUTE)} de oro por turno, entra en tus guerras y nunca te ataca.</p>
                <div class="row" style="margin-top:8px">
                    ${p && g.owner[p.city] === t ? `<button class="btn" data-action="sat-annex-prov" data-pid="${p.id}">Anexionar ${esc(p.name)}</button>` : ''}
                    <button class="btn" data-action="sat-annex" data-target="${t}">Anexionar todo el país</button>
                    <button class="btn ghost" data-action="sat-release" data-target="${t}">Conceder la independencia</button>
                </div>`;
        }
        if (g.atWar(p0, t)) {
            const asked = g.proposedThisTurn.has(`paz${t}`);
            html += `<p class="small muted">En guerra desde el turno ${r.since}.</p>
                <div class="row" style="margin-top:8px"><button class="btn" data-action="peace-open" data-target="${t}" ${asked ? 'disabled' : ''}>${asked ? 'Paz ya propuesta este turno' : 'Negociar la paz'}</button></div>`;
            const helpers = g.nations.filter(n => n.alive && n.id !== p0 && g.allied(p0, n.id) && n.overlord < 0 && !g.atWar(n.id, t));
            if (helpers.length) {
                const label = x => { const o = g.callToWarOdds(x, t); return o >= 0.6 ? 'probable' : o >= 0.3 ? 'dudoso' : o > 0 ? 'improbable' : 'no puede'; };
                const sel = this.callAlly && helpers.some(n => n.id === this.callAlly) ? this.callAlly : helpers.sort((a, b) => g.callToWarOdds(b.id, t) - g.callToWarOdds(a.id, t))[0].id;
                const asked2 = g.proposedThisTurn.has(`call${sel}:${t}`);
                html += `<p class="small" style="margin-top:12px">Pedir a un aliado que entre en la guerra contra ${g.nm(t)}:</p>
                    <div class="row" style="margin-top:6px">
                        <select data-call-war="${t}" style="flex:1">${helpers.map(n => `<option value="${n.id}" ${n.id === sel ? 'selected' : ''}>${n.name} (${label(n.id)})</option>`).join('')}</select>
                        <button class="btn" data-action="call-war" data-target="${t}" ${asked2 || !g.callToWarOdds(sel, t) ? 'disabled' : ''}>${asked2 ? 'Ya se lo has pedido' : 'Pedir ayuda'}</button>
                    </div>
                    <p class="note">Acepta más si tiene frontera con ${g.nm(t)} y si juntos sois más fuertes. Si entra, los aliados de ${g.nm(t)} irán contra él.</p>`;
            }
            return html;
        }
        const allies = g.knownAllies(p0, t).filter(x => x !== p0);
        const shared = g.sharedBlocs(p0, t);
        const truce = g.turn < r.truceUntil;
        const invites = g.blocsOf(p0).filter(b => !b.members.has(t));
        if (allies.length) html += `<p class="small muted">Si le atacas, también te declaran la guerra: ${allies.map(x => g.nm(x)).join(', ')}.</p>`;
        if (shared.length) html += `<p class="note warn">Sois aliados: atacarle te expulsa de ${shared.map(b => esc(b.name)).join(', ')}.</p>`;
        html += `<div class="row" style="margin-top:8px">
            <button class="btn war" data-action="diplo" data-kind="war" data-target="${t}" ${truce ? 'disabled' : ''}>${truce ? `Tregua hasta el turno ${r.truceUntil}` : 'Declarar la guerra'}</button>
            ${invites.map(b => {
                const asked = g.proposedThisTurn.has(`inv${b.id}:${t}`);
                return `<button class="btn" data-action="invite" data-bloc="${b.id}" data-target="${t}" ${asked ? 'disabled' : ''}>Invitar a ${esc(b.name)}</button>`;
            }).join('')}</div>`;
        return html;
    }

    // Aviso pasajero (unos segundos) con un botón opcional.
    // Aviso flotante durante 6 segundos. Con `opts.key`, sustituye al aviso anterior de la misma clave (el parte de
    // operaciones de un turno al del siguiente); `opts.id` va como data-id en el botón.
    notify(html, action, label, opts = {}) {
        const note = { html, action, label, key: opts.key, data: opts.id, id: (this.flashId = (this.flashId ?? 0) + 1) };
        this.flashes = (this.flashes ?? []).filter(x => !opts.key || x.key !== opts.key);
        this.flashes.push(note);
        setTimeout(() => { this.flashes = this.flashes.filter(x => x !== note); this.renderToasts(); }, 6000);
        this.renderToasts();
    }
    // Lo que en la leyenda depende de tus investigaciones: costes de terreno, carreteras, ríos, asedios y el mar.
    renderLegend() {
        const key = `${this.game.player}:${this.game.techVersion}`;
        if (this.legendKey === key) return;
        this.legendKey = key;
        const r = this.myRules(), set = (k, html) => { const el = $(`#legend [data-legend="${k}"]`); if (el) el.innerHTML = html; };
        set('terrain', Object.entries(CONFIG.TERRAIN).map(([k, t]) => `${t.name.toLowerCase()} ${decimal(r.terrainCost[k])}${t.def > 1 ? ` ×${decimal(t.def)}` : ''}`).join(', '));
        set('road', moveFraction(r.roadMove[1]));
        set('highway', moveFraction(r.roadMove[2]));
        set('river', r.riverCrossing ? `cruzarlo sin carretera cuesta ${moveFraction(r.riverCrossing)} punto más` : 'tus pontoneros lo cruzan sin coste extra');
        set('siege', r.siegeTurns);
        set('hunger', r.hungerTurns);
        set('sea', r.seaSpeed);
        set('amphibious', decimal(r.amphibious));
        set('air-range', `${plural(kmCells(r.airRangeKm), 'casilla', 'casillas')} (${r.airRangeKm} km)`);
        set('air-power', decimal(this.game.player !== null ? this.game.airPower(this.game.player) : CONFIG.AIR.POWER));
        set('aa-range', `${plural(kmCells(r.aaRangeKm), 'casilla', 'casillas')} (${r.aaRangeKm} km)`);
        set('aa-power', r.aaPower);
        set('sat-range', `${plural(kmCells(r.satRangeKm), 'casilla', 'casillas')}, ${r.satRangeKm} km`);
    }
    // Lo que sabes de la investigación de otro país: cuántas ha terminado y, si un espía informa, cuáles y qué investiga.
    researchText(id) {
        const g = this.game, s = g.nations[id].tech;
        const head = plural(s.done.size, 'terminada', 'terminadas');
        if (!g.knowsResearch(g.player, id)) return `${head}<br><span class="small muted">Un espía en su capital te diría cuáles.</span>`;
        const names = [...s.done].map(x => TECH_BY_ID.get(x).name).join(', ');
        const now = s.current.map(x => `${TECH_BY_ID.get(x).name} (faltan ${g.techTurns(id, x) - g.techProgress(id, x)})`).join(' y ');
        return `${head}${names ? `: ${names}` : ''}<br><span class="small muted">${now ? `Investiga ${now}.` : 'No investiga nada ahora.'}</span>`;
    }
    myRules() { return this.game.player !== null ? this.game.rules(this.game.player) : BASE_RULES; }

    // --- Investigación ---
    renderResearchFigure() {
        const g = this.game, p0 = g.player, fig = $('#fig-research');
        fig.hidden = p0 === null || g.over;
        $('#end-turn').classList.toggle('nudge', p0 !== null && !g.over && g.nations[p0].tech.current.length < g.rules(p0).labs);
        if (fig.hidden) return;
        const cur = g.nations[p0].tech.current;
        if (!cur.length) {
            fig.className = 'figure research idle';
            fig.innerHTML = '<span>Investigación</span><b>Laboratorio libre</b>';
            return;
        }
        const t = TECH_BY_ID.get(cur[0]), p = g.techProgress(p0, t.id), turns = g.techTurns(p0, t.id);
        fig.className = 'figure research';
        fig.innerHTML = `<span>Investigando${cur.length > 1 ? ' (2)' : ''}</span><b>${t.name} · ${turns - p} t</b><div class="mini"><i style="width:${Math.round(100 * p / turns)}%"></i></div>`;
    }
    openResearch(techId) {
        if (this.game.player === null || this.game.over) return;
        if (techId) this.researchSel = techId;
        this.renderResearch();
        if (!$('#research-dialog').open) $('#research-dialog').showModal();
        $('#research-dialog .rs-node.sel')?.focus();
    }
    // Casillas visibles con el filtro actual, por filas (ramas) y columnas (niveles), para moverse con las flechas.
    researchGrid() {
        const area = this.researchFilter ?? 'Todas';
        return RESEARCH_BRANCHES.filter(b => area === 'Todas' || b.area === area).map(b => [1, 2, 3].map(i => `${b.id}${i}`));
    }
    onResearchKey(e) {
        if (e.key === 'i' || e.key === 'I') { $('#research-dialog').close(); return; }
        const grid = this.researchGrid(), sel = this.researchSel;
        const r = grid.findIndex(row => row.includes(sel)), c = r >= 0 ? grid[r].indexOf(sel) : 0;
        const move = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
        if (move) {
            e.preventDefault();
            const nr = Math.max(0, Math.min(grid.length - 1, (r < 0 ? 0 : r) + move[0])), nc = Math.max(0, Math.min(2, c + move[1]));
            this.researchSel = grid[nr][nc];
            this.renderResearch();
            $('#research-dialog .rs-node.sel')?.focus();
        } else if (e.key === 'Enter' && e.target.closest?.('.rs-node')) {
            e.preventDefault();
            $('#research-dialog .rs-card [data-action="rs-start"], #research-dialog .rs-card [data-action="rs-pause"]')?.click();
        }
    }
    renderResearch() {
        const g = this.game, p0 = g.player;
        if (p0 === null) return;
        const s = g.nations[p0].tech, rules = g.rules(p0), gold = g.nations[p0].gold;
        if (!TECH_BY_ID.has(this.researchSel)) this.researchSel = s.current[0] ?? TECHS.find(t => g.techState(p0, t.id) === 'open')?.id ?? TECHS[0].id;
        const area = this.researchFilter ?? 'Todas';
        if (area !== 'Todas' && TECH_BY_ID.get(this.researchSel) && BRANCH_BY_ID.get(TECH_BY_ID.get(this.researchSel).branch).area !== area)
            this.researchSel = `${RESEARCH_BRANCHES.find(b => b.area === area).id}1`;
        const ring = (p, t) => {
            const c = 2 * Math.PI * 18;
            return `<svg class="rs-ring" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="18"/>
                <circle class="fg" cx="22" cy="22" r="18" stroke-dasharray="${(c * p / t).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 22 22)"/>
                <text x="22" y="26.5" text-anchor="middle">${t - p}</text></svg>`;
        };
        const bar = (p, t) => `<div class="rs-bar"><i style="width:${Math.round(100 * p / t)}%"></i></div>`;
        let labs = '';
        for (let k = 0; k < rules.labs; k++) {
            const id = s.current[k];
            if (id) {
                const t = TECH_BY_ID.get(id), p = g.techProgress(p0, id), turns = g.techTurns(p0, id);
                labs += `<button class="rs-lab" type="button" data-action="rs-select" data-tech="${id}">${ring(p, turns)}<span><small>Laboratorio ${k + 1}</small><b>${t.name}</b><small>Termina en el turno ${g.turn + turns - p}</small></span></button>`;
            } else labs += `<div class="rs-lab free"><span class="rs-slot">${uiIcon('flask', 20)}</span><span><small>Laboratorio ${k + 1}</small><b>Libre</b><small>Elige una investigación</small></span></div>`;
        }
        if (rules.labs === 1) labs += `<div class="rs-lab locked"><span class="rs-slot">${uiIcon('lock', 18)}</span><span><small>Laboratorio 2</small><b>Cerrado</b><small>Se abre con ${TECH_BY_ID.get('ciencia3').name}</small></span></div>`;

        const rows = RESEARCH_BRANCHES.filter(b => area === 'Todas' || b.area === area).map(b => `<div class="rs-row">
            <div class="rs-name"><span class="rs-patch">${rsIcon(b.icon)}</span><span><b>${b.name}</b><small>${b.sub}</small></span></div>
            ${[1, 2, 3].map(i => {
                const id = `${b.id}${i}`, t = TECH_BY_ID.get(id), st = g.techState(p0, id), p = g.techProgress(p0, id), turns = g.techTurns(p0, id);
                let line;
                if (st === 'done') line = `${uiIcon('check', 14)} Hecha`;
                else if (st === 'current') line = `En curso · faltan ${turns - p}`;
                else if (st === 'paused') line = `${uiIcon('pause', 13)} En pausa · ${p}/${turns}`;
                else if (st === 'locked') line = `${uiIcon('lock', 13)} Tras el nivel ${i - 1}`;
                else { const c = g.researchCost(p0, id); line = `${turns} turnos · <span class="${c > gold ? 'short' : ''}">${c} oro</span>`; }
                const after = i > 1 && s.done.has(`${b.id}${i - 1}`) ? ' after-done' : '';
                return `<button class="rs-node ${st}${after}${this.researchSel === id ? ' sel' : ''}" type="button" data-action="rs-select" data-tech="${id}" aria-pressed="${this.researchSel === id}">
                    ${galones(i)}<span class="n">${t.name}</span><span class="st">${line}</span>${st === 'current' || st === 'paused' ? bar(p, turns) : ''}</button>`;
            }).join('')}</div>`).join('');

        const t = TECH_BY_ID.get(this.researchSel), br = BRANCH_BY_ID.get(t.branch), st = g.techState(p0, t.id);
        const p = g.techProgress(p0, t.id), turns = g.techTurns(p0, t.id);
        const swap = s.current.length >= rules.labs ? s.current[0] : null;
        const swapNote = swap && (st === 'open' || st === 'paused')
            ? `<p class="swap">${TECH_BY_ID.get(swap).name} quedará en pausa con sus ${g.techProgress(p0, swap)} de ${g.techTurns(p0, swap)} turnos; no se vuelve a pagar.</p>` : '';
        let action;
        if (st === 'done') action = `<p class="status" style="color:var(--go)">${uiIcon('check')} Investigada. El efecto ya se aplica.</p>`;
        else if (st === 'current') action = `<p class="status">En curso: ${p} de ${turns} turnos. Termina en el turno ${g.turn + turns - p}.</p><button class="btn" data-action="rs-pause" data-tech="${t.id}">${uiIcon('pause')} Pausar</button>`;
        else if (st === 'paused') action = `<p class="status">En pausa: ${p} de ${turns} turnos, ya pagada.</p><button class="btn primary" data-action="rs-start" data-tech="${t.id}">Reanudar · ${plural(turns - p, 'turno', 'turnos')}</button>${swapNote}`;
        else if (st === 'locked') action = `<p class="status muted">${uiIcon('lock')} Antes, ${TECH_BY_ID.get(`${t.branch}${t.tier - 1}`).name} (nivel ${t.tier - 1}).</p>`;
        else {
            const c = g.researchCost(p0, t.id);
            action = c > gold ? `<button class="btn" disabled>Te faltan ${c - gold} de oro</button>`
                : `<button class="btn primary" data-action="rs-start" data-tech="${t.id}">Investigar · ${c} oro · ${plural(turns, 'turno', 'turnos')}</button>${swapNote}`;
        }
        const card = `<div class="rs-card"><div class="rs-who"><span class="rs-patch lg">${rsIcon(br.icon)}</span><div><div class="rs-crumb">${br.name} · ${galones(t.tier)} nivel ${t.tier}</div><h3>${t.name}</h3></div></div>
            <div class="rs-deltas">${t.changes.map(([k, a, b]) => `<div><span>${k}</span><b><s>${a}</s>${uiIcon('arrow', 14)}<em>${b}</em></b></div>`).join('')}</div>
            ${action}<p class="tip">${t.note}</p></div>`;

        const growth = Math.round(CONFIG.RESEARCH.COST_GROWTH * 100 * s.done.size);
        $('#research-body').innerHTML = `<div class="rs-head"><h2>Investigación</h2>
            <span class="muted">${plural(s.done.size, 'terminada', 'terminadas')}${growth ? ` · cada nueva cuesta un ${growth} % más` : ''}</span>
            <button class="btn ghost" data-action="close-research" aria-label="Cerrar">Cerrar <kbd>Esc</kbd></button></div>
            <div class="rs-labs">${labs}</div>
            <div class="rs-filter" role="group" aria-label="Filtrar por área">${['Todas', ...RESEARCH_AREAS].map(a => `<button data-action="rs-filter" data-area="${a}" class="${area === a ? 'on' : ''}" aria-pressed="${area === a}">${a}</button>`).join('')}</div>
            <div class="rs-body"><div class="rs-rows">${rows}</div>${card}</div>`;
    }

    renderToasts() {
        const g = this.game;
        $('#toasts').innerHTML = (this.flashes ?? []).map(f => `<div class="toast float done"><p>${f.html}</p>
            ${f.action ? `<div class="row"><button class="btn" data-action="${f.action}"${f.data ? ` data-id="${f.data}"` : ''}>${f.label}</button></div>` : ''}</div>`).join('') + g.proposals.map((pr, i) => {
            const who = `<b>${g.nm(pr.from)}</b>`;
            let text, yes = 'Aceptar', no = 'Rechazar';
            if (pr.kind === 'paz') text = `${who} te propone la paz.`;
            else if (pr.kind === 'bloque') text = `${who} te invita a ${pr.blocId && g.bloc(pr.blocId) ? `unirte a ${esc(g.bloc(pr.blocId).name)}` : 'formar una alianza'}.`;
            else { text = `${who}, tu aliado, ha sido atacado por <b>${g.nm(pr.against)}</b>. Si no acudes, saldrás de vuestras alianzas.`; yes = 'Ir a la guerra'; no = 'No intervenir'; }
            const yesAction = pr.kind === 'paz' ? `data-action="peace-open" data-target="${pr.from}"` : `data-action="accept" data-index="${i}"`;
            if (pr.kind === 'paz') yes = 'Negociar';
            return `<div class="toast float" style="border-left-color:${g.nations[pr.from].color}"><p>${text}</p>
                <div class="row"><button class="btn primary" ${yesAction}>${yes}</button>
                <button class="btn" data-action="reject" data-index="${i}">${no}</button></div></div>`;
        }).join('');
    }

    renderConfirm() {
        const g = this.game, el = $('#confirm'), plan = this.pending;
        el.classList.toggle('road', this.tool === 'road' && g.player !== null && !g.over && !this.proposal);
        if (this.proposal) {
            const pr = this.proposal, count = k => pr.ghost.filter(e => e.kind === k).length, moves = count('move'), fights = count('battle'), air = count('air');
            const names = pr.ids.map(id => g.ops.get(id)?.name).filter(Boolean).map(esc).join(', ');
            const parts = [moves || !air ? plural(moves, 'movimiento', 'movimientos') : '', fights ? plural(fights, 'ataque', 'ataques') : '', air ? plural(air, 'misión aérea', 'misiones aéreas') : ''].filter(Boolean);
            const what = parts.length > 1 ? `${parts.slice(0, -1).join(', ')} y ${parts[parts.length - 1]}` : parts[0];
            el.hidden = false;
            el.innerHTML = `<span><b>${names}</b>: ${what} ${parts.length === 1 && air ? (air === 1 ? 'propuesta' : 'propuestas') : 'propuestos'}.
                <span class="small muted">Toca un ejército para dejarlo fuera.</span></span>
                <button class="btn primary" data-action="assist-yes">Confirmar y terminar el turno</button>
                <button class="btn" data-action="assist-no">Terminar sin ellos</button>
                <button class="btn ghost" data-action="assist-back">Volver</button>`;
            return;
        }
        if (this.tool === 'road' && g.player !== null && !g.over) { this.renderRoadBar(el); return; }
        if (!plan || g.player === null) {
            // Una fortificación propia dañada elegida con Fortificar: repararla un nivel. El plan se rehace en cada dibujo:
            // tras los turnos de la IA puede haber dejado de valer (un enemigo al lado) y entonces se dice por qué.
            const cell = this.tool === 'fort' && g.player !== null && !g.over && this.fortRepair ? this.fortRepair.cell : -1;
            const fr = cell >= 0 ? g.fortRepairPlan(g.player, cell) : null;
            const damaged = cell >= 0 && g.owner[cell] === g.player && g.fort[cell] > 0 && g.fort[cell] < g.fortMax(g.player);
            const why = !fr && damaged ? g.fortRepairWhy(g.player, cell) : '';
            if (cell >= 0) this.fortRepair = fr ?? (why ? this.fortRepair : null);
            // Con el dedo, mientras se construye, un botón visible para terminar (no hay clic derecho ni Esc).
            const stop = this.touch && ['road', 'fort'].includes(this.tool) && g.player !== null;
            el.hidden = !fr && !why && !stop;
            if (el.hidden) { el.innerHTML = ''; return; }
            const r = this.myRules(), frOk = fr && fr.cost <= g.nations[g.player].gold;
            const state = cell >= 0 ? `Fortificación dañada: ${FORT_LEVELS[g.fort[cell] - 1]}; las tuyas nuevas son de ${FORT_LEVELS[g.fortMax(g.player) - 1]}` : '';
            el.innerHTML = `${fr ? `<span class="small">${state}.</span>
                <button class="btn primary" data-action="repair-fort" ${frOk ? '' : 'disabled'} title="Cuesta la mitad que fortificar">Reparar un nivel (${fr.cost} de oro, ${plural(r.fortTurns, 'turno', 'turnos')})</button>`
                : why ? `<span class="small">${state}. Ahora no se puede reparar: ${why}.</span>`
                : `<span class="small">${this.anchor < 0 ? 'Toca una casilla tuya para empezar' : 'Toca dónde termina la obra'}</span>`}
                ${stop ? '<button class="btn" data-action="stop-build">Terminar obras</button>' : ''}`;
            return;
        }
        const ok = plan.cost <= g.nations[g.player].gold;
        const what = plan.cls === 'fort' ? `Fortificar ${plural(plan.cells.length, 'casilla', 'casillas')}` : `${plural(plan.path.length - 1, 'tramo', 'tramos')} de ${plan.cls === 2 ? 'autopista' : 'carretera'}`;
        el.hidden = false;
        el.innerHTML = `<span>${what}: <b style="color:${ok ? 'var(--signal)' : 'var(--war)'}">${plan.cost} de oro</b></span>
            <button class="btn primary" data-action="confirm-build" ${ok ? '' : 'disabled'}>Confirmar</button>
            <button class="btn" data-action="cancel-build">Cancelar</button>`;
    }

    // Panel de la herramienta Carretera: carretera o autopista, qué hacer, lo que cuesta el trazado (nuevo y mejorado)
    // y, si la casilla elegida ya tiene carretera, pasar a autopista todo su tramo.
    renderRoadBar(el) {
        const g = this.game, r = this.myRules(), gold = g.nations[g.player].gold, plan = this.pending;
        const per = cls => decimal((cls === 1 ? CONFIG.ROAD_COST : CONFIG.ROAD_COST + CONFIG.HIGHWAY_COST) * r.roadCost);
        let body;
        if (plan) {
            const sp = g.roadSplit(plan), ok = plan.cost <= gold;
            body = `<span>${[sp.fresh ? plural(sp.fresh, 'tramo nuevo', 'tramos nuevos') : '', sp.up ? `${plural(sp.up, 'tramo mejorado', 'tramos mejorados')} (solo la diferencia)` : ''].filter(Boolean).join(' y ') || 'Ya está hecho'}
                de ${plan.cls === 2 ? 'autopista' : 'carretera'}: <b style="color:${ok ? 'var(--signal)' : 'var(--war)'}">${plan.cost} de oro</b></span>
                <button class="btn primary" data-action="confirm-build" ${ok ? '' : 'disabled'}>Confirmar</button>
                <button class="btn" data-action="cancel-build">Cancelar</button>`;
        } else body = `<span class="small">${this.anchor < 0 ? `${this.touch ? 'Toca' : 'Haz clic en'} una casilla tuya para empezar, en una carretera para mejorar su tramo o en el extremo de un tramo roto para repararlo.`
            : `${this.touch ? 'Toca' : 'Haz clic en'} donde termina el tramo: se construye el camino más barato.`}</span>`;
        const st = this.stretch, stOk = st && st.cost <= gold, rp = this.repair, rpOk = rp && rp.cost <= gold;
        el.hidden = false;
        el.innerHTML = `<button class="tool tick road-tick ${this.highway ? 'on' : ''}" data-action="highway" aria-pressed="${this.highway}" title="Construir como autopista, o mejorar a autopista la carretera que ya haya (tecla A)">
                <span class="box" aria-hidden="true">${this.highway ? '✓' : ''}</span>Autopista<kbd>A</kbd></button>
            <span class="small muted road-price">${this.highway ? `⅓ de punto por tramo, ${per(2)} de oro (${decimal(CONFIG.HIGHWAY_COST * r.roadCost)} si ya hay carretera)` : `½ punto por tramo, ${per(1)} de oro`} × terreno</span>
            ${body}
            ${st && !plan ? `<button class="btn" data-action="upgrade-stretch" ${stOk ? '' : 'disabled'} title="De ciudad o cruce a ciudad o cruce">Pasar a autopista este tramo (${plural(st.edges.length, 'tramo', 'tramos')}, ${st.cost} de oro)</button>` : ''}
            ${rp && !plan ? `<button class="btn" data-action="repair-roads" ${rpOk ? '' : 'disabled'} title="Cuesta la mitad que construirlos">Reparar ${plural(rp.edges.length, 'tramo', 'tramos')} (${rp.cost} de oro, ${plural(r.fortTurns, 'turno', 'turnos')})</button>` : ''}
            ${plan ? '' : '<button class="btn ghost" data-action="stop-build">Terminar obras</button>'}`;
    }

    renderHint() {
        const g = this.game, el = $('#hint');
        let text;
        if (this.hintOverride) text = this.hintOverride;
        else if (g.player === null) text = 'Haz clic en un país para elegirlo. Rueda del ratón: zoom; arrastrar: mover el mapa.';
        else if (g.over) text = '';
        else if (this.tool === 'cities') text = 'Ciudades: haz clic en tus provincias para añadirlas o quitarlas de la selección.';
        else if (this.tool === 'fort') text = this.anchor < 0 ? 'Fortificar: haz clic en una casilla tuya.' : 'Clic en otra casilla para fortificar la línea, o en la misma para solo esa. Clic derecho para terminar.';
        else if (this.tool === 'road') text = '';   // lo explica su panel
        else if (this.proposal) text = 'Líneas blancas: lo que harían tus operaciones asistidas (en azul, sus misiones aéreas). Confirma, termina sin ellas o vuelve al turno.';
        else if (this.tool === 'op') text = `${OP_KINDS[this.opDraft.kind].name}: ${OP_KINDS[this.opDraft.kind].how}`;
        else if (this.tool === 'air' && this.air.mode === 'sat') text = `Satélite: ${this.touch ? 'toca' : 'haz clic en'} el centro de la región que quieres vigilar.${this.touch ? '' : ' Esc para cancelar.'}`;
        else if (this.tool === 'air' && this.air.mode === 'zone') text = `Orden de zona: ${this.touch ? 'toca' : 'haz clic en'} el centro de la zona del escuadrón ${this.air.zoneSq}.${this.touch ? '' : ' Esc para cancelar.'}`;
        else if (this.tool === 'air') text = 'Aviación: elige uno de tus aeródromos y luego un blanco a su alcance. En tu territorio, construye aeródromos y antiaéreo.';
        else if (this.ordering) text = this.ordering.kind === 'follow' ? 'Haz clic en el ejército tuyo al que debe seguir. Esc para cancelar.'
            : `Haz clic en el destino: ${this.ordering.kind === 'attack' ? 'irá hasta allí y atacará lo que haya cuando tenga ventaja' : 'irá hasta allí aunque tarde varios turnos'}.${this.touch ? '' : ' Esc para cancelar.'}`;
        else if (this.reachInfo) text = `${this.view.isRealistic() ? 'Zona clara: mover' : 'Verde: mover'}. Rojo: atacar.${this.touch ? ' Más lejos: «Marchar a…» en la ficha.' : ' Mayúsculas + clic más lejos: marchar en varios turnos. Esc para cancelar.'}`;
        else text = this.touch ? 'Toca un ejército tuyo para darle órdenes, o una provincia para ver qué puedes hacer.'
            : 'Clic en un ejército tuyo para darle órdenes (con Mayúsculas + clic, marcha hasta allí en varios turnos), o en una provincia para ver qué puedes hacer.';
        el.textContent = text;
        el.hidden = !text;
        el.classList.toggle('beside-card', !$('#card').hidden);
    }

    renderDrawer() {
        const g = this.game, el = $('#drawer');
        el.hidden = g.player === null;
        el.classList.toggle('closed', !this.drawerOpen);
        if (g.player === null) return;
        const unread = g.logs.length - this.seenLog;
        if (this.tab === 'registro' && this.drawerOpen) this.seenLog = g.logs.length;
        const tabs = [['paises', 'Países'], ['mando', 'Mando'], ['alianzas', 'Alianzas'], ['registro', 'Registro']];
        el.innerHTML = `<div class="sheet-grip" data-sheet-grip role="button" aria-label="Agrandar o achicar el panel"><i></i></div><div class="tabs">
            ${tabs.map(([id, label]) => `<button data-action="tab" data-tab="${id}" class="${this.tab === id ? 'on' : ''}">${label}${id === 'registro' && unread > 0 && this.tab !== 'registro' ? `<span class="count">${unread}</span>` : ''}</button>`).join('')}
            <button class="toggle" data-action="drawer" title="${this.drawerOpen ? 'Ocultar el panel' : 'Mostrar el panel'}" aria-label="${this.drawerOpen ? 'Cerrar' : 'Abrir'}">${isMobile() ? '✕' : this.drawerOpen ? '›' : '‹'}</button></div>
            <div class="drawer-body" id="drawer-body"></div>`;
        if (!this.drawerOpen) return;
        if (this.tab === 'paises') this.renderNations();
        else if (this.tab === 'mando') this.renderCommand();
        else if (this.tab === 'alianzas') this.renderBlocs();
        else this.renderLog();
    }

    renderNations() {
        const g = this.game, body = $('#drawer-body');
        if (this.focusNation !== null) {
            const t = this.focusNation, n = g.nations[t], lands = g.landCounts(), powers = g.powers();
            const blocs = g.visibleBlocs(g.player).filter(b => b.members.has(t));
            body.innerHTML = `<button class="btn ghost" data-action="nation-back">‹ Todos los países</button>
                <div class="pick" style="border-left-color:${n.color}">
                    <h3>${n.name}</h3><p class="row" style="margin-top:4px">${this.relationChip(t)}</p>
                    <dl class="facts" style="margin-top:8px">
                        <dt>Capital</dt><dd>${esc(n.capitalName)}${g.owner[n.capitalCell] !== t ? ` (en manos de ${g.nm(g.owner[n.capitalCell])})` : ''}</dd>
                        <dt>Territorio</dt><dd>${(100 * lands[t] / G.land.length).toFixed(1)} % ${MAP.of}</dd>
                        <dt>Fuerza</dt><dd>${this.powerText(t, powers)}</dd>
                        <dt>Investigación</dt><dd>${this.researchText(t)}</dd>
                        <dt>Alianzas</dt><dd>${blocs.map(b => esc(b.name) + (b.secret ? ' (secreta)' : '')).join(', ') || 'ninguna conocida'}</dd>
                        ${n.overlord >= 0 ? `<dt>Señor</dt><dd>${g.nm(n.overlord)}</dd>` : ''}
                        ${n.overlord === g.player ? `<dt>Tributo</dt><dd>${Math.round(g.economy(t).total * CONFIG.TRIBUTE)} de oro por turno</dd>` : ''}
                        ${g.satellitesOf(t).length ? `<dt>Satélites</dt><dd>${g.satellitesOf(t).map(x => g.nm(x)).join(', ')}</dd>` : ''}
                    </dl>
                    ${t === g.player ? this.economyFacts(t) : ''}
                    <button class="btn" style="margin-top:10px" data-action="goto" data-cell="${n.capitalCell}" ${n.alive ? '' : 'disabled'}>Ver en el mapa</button>
                </div>
                ${n.alive && t !== g.player ? `<div style="margin-top:12px">${this.diplomacyActions(t)}</div>` : ''}`;
            return;
        }
        body.innerHTML = `<input type="search" id="nation-search" placeholder="Buscar país" value="${esc(this.filter)}" aria-label="Buscar país">
            <div id="nation-list"></div>`;
        this.renderNationList();
    }

    // Con niebla de guerra solo se conoce la fuerza propia y la de los aliados.
    powerText(id, powers) {
        const g = this.game;
        return !g.settings.fog || id === g.player || g.allied(g.player, id) ? String(powers[id]) : '?';
    }

    // Desglose de la renta y de los precios de las tropas (para tu país).
    economyFacts(id) {
        const g = this.game, e = g.economy(id), tr = g.tribute(id);
        const counts = Object.entries(e.byType).map(([k, n]) => `${CONFIG.RESOURCE_ICON[k]} ${n}`).join(' ');
        return `<h3 style="margin-top:12px">Economía</h3><dl class="facts">
            <dt>Provincias</dt><dd>${e.base} de oro</dd>
            <dt>Desarrollo</dt><dd>+${e.dev}</dd>
            <dt>Industria</dt><dd>+${e.industry}${e.access.size ? ` (${plural(e.access.size, 'provincia abastecida', 'provincias abastecidas')} por yacimientos)` : ''}</dd>
            <dt>Carreteras</dt><dd>+${e.road}</dd>
            <dt>Imperio</dt><dd>+${e.empire}${e.empireRate > 0 ? ` (+${Math.round(e.empireRate * 100)} % por ${e.legalProvinces - START_PROVINCES[id]} provincias ganadas)` : ' (crece al anexionar provincias)'}</dd>
            <dt>Recursos</dt><dd>+${e.res}${counts ? ` (${counts})` : ''}${e.looseResources.length ? `<br><span class="small muted">${plural(e.looseResources.length, 'yacimiento', 'yacimientos')} sin carretera: solo abastecen a su provincia</span>` : ''}</dd>
            ${tr.in || tr.out ? `<dt>Tributo</dt><dd>${tr.in ? `+${tr.in}` : ''}${tr.out ? ` −${tr.out}` : ''}</dd>` : ''}
            ${e.capitalLost ? `<dt>Capital</dt><dd class="warn-text">perdida: tus yacimientos y tu industria rinden la mitad hasta que la recuperes</dd>` : ''}
            <dt>Total</dt><dd><b>${g.income(id)} de oro por turno</b></dd>
            <dt>Precios en la capital</dt><dd>${g.recruitTypes(id).map(k => `${CONFIG.TYPES[k].name.toLowerCase()} ${g.unitCost(id, k, G.prov[g.nations[id].capitalCell])}`).join(', ')}</dd>
        </dl>`;
    }

    renderNationList() {
        const g = this.game, p0 = g.player, list = $('#nation-list');
        if (!list) return;
        const lands = g.landCounts(), powers = g.powers();
        const spies = [...g.spies].map(([pid, s]) => { const p = PROVINCES[pid]; return `<button class="nation-row" data-action="goto" data-cell="${p.city}">
            <span class="sw" style="background:${g.nations[g.owner[p.city]].color}"></span><span>${esc(p.name)}</span>
            <span class="num">${s.revealedTurn === g.turn ? 'informa' : 'sin noticias'}</span><span class="num">espía</span></button>`; }).join('');
        const q = this.filter.trim().toLowerCase();
        const groups = [
            ['Tu país', n => n.id === p0],
            ['Tus satélites', n => n.alive && n.overlord === p0],
            ['En guerra contigo', n => n.alive && g.atWar(p0, n.id)],
            ['Aliados', n => n.alive && g.allied(p0, n.id) && !g.atWar(p0, n.id) && n.overlord !== p0],
            [`Resto ${MAP.of}`, n => n.alive && n.id !== p0 && !g.atWar(p0, n.id) && !g.allied(p0, n.id)],
            ['Eliminados', n => !n.alive]
        ];
        list.innerHTML = (spies && !q ? `<p class="group-title">Tus espías</p>${spies}` : '') + groups.map(([title, test]) => {
            const rows = g.nations.filter(n => test(n) && (!q || n.name.toLowerCase().includes(q)))
                .sort((a, b) => (g.settings.fog ? lands[b.id] - lands[a.id] : powers[b.id] - powers[a.id]))
                .map(n => `<button class="nation-row" data-action="nation" data-id="${n.id}">
                    <span class="sw" style="background:${n.color}"></span><span>${n.name}</span>
                    <span class="num" title="Parte ${MAP.of}">${(100 * lands[n.id] / G.land.length).toFixed(1)} %</span>
                    <span class="num" title="Fuerza militar">${this.powerText(n.id, powers)}</span></button>`).join('');
            return rows ? `<p class="group-title">${title}</p>${rows}` : '';
        }).join('') || '<p class="note">Ningún país coincide con la búsqueda.</p>';
    }

    // Estado de una operación en una palabra o dos, con su clase de aviso.
    opState(op) {
        const g = this.game, n = g.opMembers(op).length;
        if (op.paused) return ['En pausa', ''];
        if (op.kind === 'reserva') return [plural(n, 'ejército', 'ejércitos'), ''];
        if (!n) return ['Sin ejércitos', 'warn'];
        if (op.kind === 'defensa') {
            if (op.state === 'repliega') return ['Se repliega', 'warn'];
            if (op.state === 'restablece') return ['Vuelve a su línea', 'ok'];
            const k = g.opNeed(op); return k ? [`Faltan ${k}`, 'warn'] : ['Línea cubierta', 'ok'];
        }
        return op.waiting ? ['Espera ventaja', 'warn'] : [op.auto === 'manual' ? 'Manual' : 'Avanzando', 'ok'];
    }
    // Qué haría una línea manual (sin hacerlo), guardado por turno y versión de la partida para no recalcularlo al dibujar.
    defenseHint(op) {
        const g = this.game, key = `${op.id}:${g.turn}:${g.version}:${g.armyVersion}:${g.orderVersion}:${op.cells.join()}`;
        if ((this._hints ??= new Map()).has(key)) return this._hints.get(key);
        if (this._hints.size > 50) this._hints.clear();
        const h = g.defenseDecide(op);
        this._hints.set(key, h);
        return h;
    }
    // Por qué pide atención una operación, en una frase para el parte de operaciones.
    opWhy(op) {
        const g = this.game, n = g.opMembers(op).length;
        if (!n) return op.kind === 'ofensiva' ? `no tiene ejércitos; añade los libres a ${OP_GATHER_TURNS} turnos de marcha o asígnaselos desde su ficha`
            : 'no tiene ejércitos; asígnale alguno desde su ficha o desde la pestaña Mando';
        if (op.kind === 'defensa') { const k = g.opNeed(op); return `${k} de sus ${plural(op.cells.length, 'casilla', 'casillas')} de línea ${k === 1 ? 'está' : 'están'} sin tropas; le ${k === 1 ? 'falta 1 ejército' : `faltan ${k} ejércitos`}, o acorta la línea`; }
        return `${plural(op.waiting, 'ejército espera', 'ejércitos esperan')} una ventaja de ${decimal(op.ratio)} a 1 que no tiene${op.waiting === 1 ? '' : 'n'}; dale más fuerzas o una postura más agresiva`;
    }
    // Escuadrones sueltos del jugador (sin operación ni orden de zona) con el punto clave de la operación a su alcance.
    freeSquadrons(op) {
        const g = this.game, R = g.airRange(g.player), key = g.opKey(op);
        return [...g.squadrons.values()].filter(q => q.owner === g.player && !q.op && !q.task && hexDist(q.base, key) <= R).sort((a, b) => a.id - b.id);
    }
    // Escuadrones de una operación y sus fines; la reserva no tiene fines: manda sus escuadrones a las que piden ayuda.
    opAirSection(op) {
        const g = this.game, p0 = g.player, R = g.airRange(p0), key = g.opKey(op), free = this.freeSquadrons(op).length;
        const sqs = [...g.squadrons.values()].filter(q => q.op === op.id && q.owner === p0).sort((a, b) => a.id - b.id);
        const rows = sqs.map(q => `<div class="op-member"><button class="link" data-action="air-open" data-cell="${q.base}" title="Abrir su aeródromo en la herramienta Aviación">Escuadrón ${q.id} · ${esc(g.placeName(q.base))}</button>
            <span class="small muted">${this.squadronState(q)}${hexDist(q.base, key) > R ? ' · no llega a su punto clave' : ''}</span>
            <button class="btn ghost" data-action="op-air-unassign" data-sq="${q.id}" title="Sacarlo de la operación" aria-label="Quitar">✕</button></div>`).join('');
        const mode = op.auto === 'manual' ? ' En manual no vuelan.' : op.auto === 'asistida' ? ' En asistida vuelan al confirmar la propuesta.' : '';
        const aims = op.kind === 'reserva' ? `<p class="note">La reserva no vuela: manda sus escuadrones, uno a cada operación que pide ayuda y tiene su objetivo o su línea a su alcance.${op.auto === 'manual' ? ' En manual no los manda.' : ''}</p>`
            : `<p class="group-title">Fines de la aviación</p>
            <div class="air-aims">${Object.entries(OP_AIMS).map(([k, v]) => `<label class="check small"><input type="checkbox" data-action="op-aim" data-id="${op.id}" data-aim="${k}" ${op.aims.includes(k) ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div>
            <p class="note">${op.kind === 'ofensiva' ? 'Cada turno buscan blancos a 3 casillas del objetivo y a 2 de sus ejércitos; proteger escolta a los que van por mar.' : 'Cada turno buscan blancos a 3 casillas de la línea; proteger cubre sus casillas más amenazadas.'}
                Solo atacan lo que conoces, y si la previsión da al menos un ${Math.round(AIR_MIN_HIT * 100)} % de acierto y poco riesgo de derribo.${mode}</p>`;
        return `<p class="group-title">Escuadrones (${sqs.length})</p>
            <div class="op-members">${rows || '<p class="note">Sin escuadrones. Añade los libres o dales este encargo desde su ficha de Aviación.</p>'}</div>
            <button class="btn" style="margin-top:6px" data-action="op-add-air" data-id="${op.id}" ${free ? '' : 'disabled'}>Añadir ${free ? plural(free, 'escuadrón libre', 'escuadrones libres') : 'escuadrones libres'} a su alcance</button>
            ${aims}`;
    }
    // Pestaña Mando: operaciones del jugador y la abierta, con sus ejércitos y ajustes.
    renderCommand() {
        const g = this.game, p0 = g.player, body = $('#drawer-body'), ops = g.opsOf(p0), cap = g.commandCap(p0);
        if (this.focusOp && !g.ops.has(this.focusOp)) this.focusOp = null;
        const rules = g.rules(p0), units = a => `${countUnits(a.units)} (${unitText(a.units)})`;
        const row = op => { const [st, cls] = this.opState(op); return `<button class="op-row ${this.focusOp === op.id ? 'on' : ''}" data-action="op-focus" data-id="${op.id}">
            <i style="background:${opColor(op)}"></i><span><b>${esc(op.name)}</b><small>${OP_KINDS[op.kind].name} · ${plural(g.opMembers(op).length, 'ejército', 'ejércitos')}</small></span>
            <span class="chip ${cls}">${st}</span></button>`; };
        let detail = '';
        const op = this.focusOp ? g.ops.get(this.focusOp) : null;
        if (op) {
            const members = g.opMembers(op), atk = members.reduce((s, a) => s + unitPower(a.units, 'atk', rules), 0), def = members.reduce((s, a) => s + unitPower(a.units, 'def', rules), 0);
            const near = g.nearbyFree(op, 4).length;
            let front = '';
            if (op.kind === 'ofensiva') {
                // Relación con los enemigos a la vista junto a sus ejércitos (con niebla, lo peor de su escalón).
                const foes = new Map();
                for (const a of members) for (let d = 0; d < 6; d++) { const c = G.nb[a.cell * 6 + d], e = c >= 0 ? g.armyOn(c) : null; if (e && g.atWar(p0, e.owner) && g.sees(p0, c)) foes.set(e.id, [e, a]); }
                let dfn = 0;
                for (const [e, a] of foes.values()) { const r = g.expectedRatio(p0, a.units, a.cell, e, e.cell, a.id); dfn += unitPower(a.units, 'atk', rules) * g.armyState(p0, a.cell, a.units, a.id).mult / Math.max(0.01, r); }
                const ratio = dfn ? atk / dfn : null, pct = x => Math.max(3, Math.min(100, x / 3 * 100));
                front = ratio === null ? '<p class="small muted">Aún no toca al enemigo: no hay relación de fuerzas que calcular.</p>'
                    : `<div class="meter op-meter"><i style="width:${pct(ratio)}%;background:${ratio >= op.ratio ? 'var(--go)' : 'var(--signal)'}"></i><b style="left:${pct(op.ratio)}%"></b></div>
                       <p class="small">Relación de fuerzas en el frente: <b>${decimal(ratio)} a 1</b> contra ${plural(foes.size, 'ejército enemigo', 'ejércitos enemigos')} (la raya es la ventaja que pide: ${decimal(op.ratio)}).</p>`;
            }
            if (op.kind === 'ofensiva' && !members.length) front += `<p class="small warn-text">${esc(g.opWaitNote(op))}</p>`;
            if (op.kind === 'defensa') {
                // Estado de la línea y relación de fuerzas en su franja; las rayas: 1 (por debajo se repliega) y 1,5 (vuelve).
                const hint = op.auto === 'manual' ? this.defenseHint(op) : null, rel = hint ? hint.ev.rel : op.rel ?? g.lineEval(op).rel;
                const pct = x => Math.max(3, Math.min(100, x / 3 * 100));
                front = `<p class="small" style="margin-top:6px">Estado: <b>${OP_LINE_STATES[op.state] ?? 'Aguanta'}</b>${op.drawn && op.drawn.join() !== op.cells.join() ? ` · replegada a ${esc(g.lineLabel(p0, op.cells))}; la línea dibujada se guarda y vuelve a ella cuando tenga 1,5 a 1` : ''}.</p>
                    ${hint?.state === 'repliega' ? `<p class="small warn-text">Se replegaría a ${esc(g.lineLabel(p0, hint.cells))}: está en manual y no se mueve sola.</p>` : ''}
                    ${rel === null ? '<p class="small muted">Sin enemigos a la vista en su franja.</p>'
                    : `<div class="meter op-meter"><i style="width:${pct(rel)}%;background:${rel >= LINE_HOLD ? 'var(--go)' : 'var(--signal)'}"></i><b style="left:${pct(LINE_HOLD)}%"></b><b style="left:${pct(LINE_RETURN)}%"></b></div>
                       <p class="small">Relación de fuerzas en su franja: <b>${decimal(rel)} a 1</b> (por debajo de ${decimal(LINE_HOLD)} se repliega; con ${decimal(LINE_RETURN)} en la línea dibujada, vuelve).</p>`}`;
            }
            const where = op.kind === 'ofensiva' ? `Objetivo: ${esc(g.placeName(op.cells[op.cells.length - 1]))}` : op.kind === 'defensa' ? `${plural(op.cells.length, 'casilla', 'casillas')} de línea` : `Zona de reunión: ${esc(g.placeName(op.cells[0]))}`;
            detail = `<div class="bloc mine op-detail" style="border-left-color:${opColor(op)}">
                <div class="row"><input type="text" id="op-name" maxlength="60" value="${esc(op.name)}" aria-label="Nombre de la operación" style="flex:1">
                    <button class="btn ghost" data-action="op-close" aria-label="Cerrar" title="Cerrar">✕</button></div>
                <p class="small" style="margin-top:6px">${OP_KINDS[op.kind].name} desde el turno ${op.since}. ${where}.</p>
                ${front}
                <p class="group-title">Ejércitos (${members.length}) · ataque ${Math.round(atk)}, defensa ${Math.round(def)}</p>
                <div class="op-members">${members.map(a => `<div class="op-member"><button class="link" data-action="goto" data-cell="${a.cell}">${esc(g.placeName(a.cell))}</button>
                    <span class="small muted">${units(a)}${a.order ? ' · con orden propia' : ''}</span>
                    <button class="btn ghost" data-action="op-unassign" data-army="${a.id}" title="Sacarlo de la operación" aria-label="Quitar">✕</button></div>`).join('') || '<p class="note">Sin ejércitos. Añade los cercanos o asígnalos desde su ficha.</p>'}</div>
                <button class="btn" style="margin-top:6px" data-action="op-add-near" data-id="${op.id}" ${near ? '' : 'disabled'}>Añadir los ${near || ''} ${op.kind === 'ofensiva' ? `libres a ${OP_GATHER_TURNS} turnos de marcha` : 'cercanos sin operación'}</button>
                ${this.opAirSection(op)}
                ${op.kind === 'reserva' ? '' : `<p class="group-title">Postura</p><div class="seg">${OP_STANCES.map(([v, l, t]) => `<button data-action="op-set" data-id="${op.id}" data-key="ratio" data-value="${v}" class="${op.ratio === v ? 'on' : ''}" title="${t}">${l}</button>`).join('')}</div>`}
                <p class="group-title">Automatización</p>
                <div class="seg">${OP_AUTO.map(([v, l, t]) => `<button data-action="op-set" data-id="${op.id}" data-key="auto" data-value="${v}" class="${op.auto === v ? 'on' : ''}" title="${t}">${l}</button>`).join('')}</div>
                <p class="note">${OP_AUTO.find(([v]) => v === op.auto)[2]}.${op.kind === 'reserva' ? ' En manual no manda refuerzos.' : ''}</p>
                ${this.reinforceSection(op)}
                ${op.kind === 'defensa' ? `<label class="check small" style="margin-top:8px"><input type="checkbox" data-action="op-set" data-id="${op.id}" data-key="fortify" ${op.fortify ? 'checked' : ''}><span>Fortificar las casillas de la línea que ocupe (hasta 2 por turno, ${rules.fortCost} de oro cada una)</span></label>` : ''}
                <div class="row" style="margin-top:10px;flex-wrap:wrap">
                    <button class="btn" data-action="op-set" data-id="${op.id}" data-key="paused">${op.paused ? 'Reanudar' : 'Pausar'}</button>
                    <button class="btn" data-action="op-goto" data-id="${op.id}">Ver en el mapa</button>
                    <button class="btn" data-action="op-redraw" data-id="${op.id}">Redibujar</button>
                    <button class="btn ghost" data-action="op-end" data-id="${op.id}">Terminar</button></div>
            </div>`;
        }
        // Operaciones agrupadas por teatro (país enemigo), con su prioridad; y propuestas para los frentes sin ninguna.
        const command = g.nations[p0].command, groups = new Map();
        for (const o of ops) { const f = g.opFront(o); if (!groups.has(f)) groups.set(f, []); groups.get(f).push(o); }
        const theatre = ([f, list]) => `<div class="theatre"><div class="theatre-head"><span>${f >= 0 ? `Frente con ${this.nationChip(f)}` : 'Sin frente'}</span>
            ${f >= 0 ? `<div class="seg small-seg">${Object.keys(PRIORITY).map(k => `<button data-action="cmd" data-key="priority" data-value="${f}:${k}" class="${(command.priority[f] ?? 'media') === k ? 'on' : ''}" title="Prioridad ${k}: los refuerzos y la reserva van antes a los frentes de prioridad alta">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>` : ''}</div>
            ${list.map(row).join('')}</div>`;
        const sug = g.frontSuggestions(p0).map(sg => `<div class="suggest"><p class="small">Frente con <b>${g.nm(sg.enemy)}</b> sin operaciones.</p><div class="row">
            <button class="btn" data-action="op-suggest" data-enemy="${sg.enemy}" data-kind="defensa" data-preview="${sg.enemy}" ${ops.length >= cap ? 'disabled' : ''}>Línea propuesta</button>
            ${sg.attack ? `<button class="btn" data-action="op-suggest" data-enemy="${sg.enemy}" data-kind="ofensiva" ${ops.length >= cap ? 'disabled' : ''}>Ofensiva sobre ${esc(sg.target)}</button>` : ''}</div>
            <p class="small muted">Línea: ${esc(sg.lineInfo.label)} · ${sg.lineInfo.rel === null ? 'sin enemigos a la vista' : `${decimal(sg.lineInfo.rel)} a 1 prevista${sg.lineInfo.rel < 1 ? ', no basta: hacen falta refuerzos' : ''}`}${sg.lineInfo.front.length ? ` · deja delante ${esc(sg.lineInfo.front.join(', '))} (con guarnición)` : ''}</p></div>`).join('');
        body.innerHTML = `
            ${this.directiveSection()}
            <p class="group-title">Operaciones · ${ops.length} de ${cap}</p>
            <div class="row">${Object.entries(OP_KINDS).map(([k, v]) => `<button class="btn" data-action="op-new" data-kind="${k}" ${ops.length >= cap ? 'disabled' : ''}>${v.icon.replace('<svg ', '<svg width="15" height="15" aria-hidden="true" ')}${v.name}</button>`).join('')}</div>
            ${sug}
            <div class="op-list">${[...groups].map(theatre).join('') || '<p class="note" style="margin:8px">Sin operaciones. Dibuja una flecha de ofensiva, una línea de defensa o una zona de reserva (tecla 5) y asígnale ejércitos: se moverán solos turno a turno.</p>'}</div>
            ${detail}
            <p class="note" style="margin-top:10px">Tu estado mayor lleva ${cap} operaciones a la vez: ${rules.commandOps} por Doctrina y una más por cada 20 provincias.</p>
            ${this.templatesSection()}`;
    }
    // Directiva nacional: postura, objetivos estratégicos, presupuesto opcional y retaguardia.
    directiveSection() {
        const g = this.game, p0 = g.player, c = g.nations[p0].command, inc = g.income(p0);
        const total = Object.values(c.budget).reduce((x, y) => x + y, 0) || 1, spend = Math.floor(Math.max(0, inc) * c.share / 100);
        const goals = g.goalProgress(p0);
        return `<details class="tpl-box directive" ${this.dirOpen ? "open" : ""} data-dir-box>
            <summary>Directiva nacional · ${POSTURES[c.posture].name}</summary>
            <div class="seg" style="margin:6px 8px 0">${Object.entries(POSTURES).map(([k, v]) => `<button data-action="cmd" data-key="posture" data-value="${k}" class="${c.posture === k ? 'on' : ''}">${v.name}</button>`).join('')}</div>
            <p class="note" style="margin:4px 8px">${POSTURES[c.posture].desc}</p>
            <p class="group-title">Objetivos estratégicos</p>
            ${goals.length ? goals.map(gp => `<div class="goal"><span>${g.nm(gp.nation)}: ${gp.held} de ${plural(gp.total, 'provincia', 'provincias')}</span>
                <div class="meter"><i style="width:${Math.round(100 * gp.held / gp.total)}%"></i></div></div>`).join('')
                : '<p class="note" style="margin:0 8px">Sin objetivos. Marca provincias como objetivo desde su ficha («Objetivo estratégico»): al tenerlas todas, te avisará de que es buen momento para la paz.</p>'}
            <p class="group-title">Presupuesto</p>
            <label class="check small" style="margin:0 8px"><input type="checkbox" data-action="cmd" data-key="spend" ${c.spend ? 'checked' : ''}><span>La directiva gasta por ti una parte de la renta</span></label>
            ${c.spend ? `<div class="budget">
                <label class="small" for="cmd-share">Parte de la renta: <output>${c.share} % · ${spend} de oro por turno</output></label>
                <input type="range" id="cmd-share" min="0" max="100" step="5" value="${c.share}" data-cmd="share">
                <div class="budget-bar">${Object.keys(BUDGET_KEYS).map(k => `<i style="flex:${c.budget[k]}" class="b-${k}"></i>`).join('')}</div>
                ${Object.entries(BUDGET_KEYS).map(([k, label]) => `<label class="small" for="cmd-${k}"><i class="dot b-${k}"></i>${label}: <output>${Math.round(100 * c.budget[k] / total)} % · ${Math.floor(spend * c.budget[k] / total)} de oro</output></label>
                    <input type="range" id="cmd-${k}" min="0" max="100" step="5" value="${c.budget[k]}" data-cmd="${k}">`).join('')}
                <p class="note">Reclutar va a los refuerzos de tus operaciones (más a las de prioridad alta y a las que piden ayuda). Investigar elige lo que investigaría la IA en tu lugar; Fortificar, tus ciudades más amenazadas; Carreteras, primero los tramos rotos y luego la ciudad más valiosa sin unir a la capital. Guardado: ${c.pools.research} para investigar, ${c.pools.forts} para fortificar, ${c.pools.roads} para carreteras.</p>
            </div>` : '<p class="note" style="margin:4px 8px">Apagado: el oro lo gastas tú. Las operaciones usan solo el oro por turno que les des.</p>'}
            <label class="check small" style="margin:8px"><input type="checkbox" data-action="cmd" data-key="rear" ${c.rear ? 'checked' : ''}><span>Retaguardia: en guerra, lo que sobre en las ciudades sin peligro va a tu reserva (deja una infantería)</span></label>
        </details>`;
    }
    // Refuerzos de una operación: oro por turno, plantilla y cómo va la formación.
    reinforceSection(op) {
        const g = this.game, tpl = g.opTemplate(op), n = g.nations[g.player], pr = g.formProgress(op), cost = g.templateCost(g.player, tpl.units);
        const opts = [['auto', `Automática: ${tpl.auto ? tpl.name : g.templateOf(g.player, g.suggestTemplate(op).key).name}`],
            ...Object.entries(TEMPLATES).map(([k, t]) => [k, t.name]), ...n.templates.map((t, i) => [`c${i}`, `${t.name} (propia)`])];
        const status = pr ? `Formando ${esc(op.form.name.toLowerCase())} en ${esc(g.placeName(op.form.zone))}: ${pr.done} de ${pr.total} reclutadas${pr.waiting ? `, ${pr.waiting} salen el turno que viene` : ''}${pr.moving ? `, ${pr.moving} en camino` : ''}${pr.ready ? `, ${pr.ready} en la zona` : ''}.`
            : op.gold ? 'La primera formación empieza al terminar el turno.' : 'Sin oro para refuerzos.';
        return `<p class="group-title">Refuerzos</p>
            <div class="seg">${OP_GOLD.map(v => `<button data-action="op-set" data-id="${op.id}" data-key="gold" data-value="${v}" class="${op.gold === v ? 'on' : ''}">${v ? `${v}` : 'Nada'}</button>`).join('')}</div>
            <p class="note">Oro por turno, de tus ${g.income(g.player)} de renta${op.gold > g.income(g.player) ? ' (más de lo que ingresas: tirará del tesoro)' : ''}. ${op.gold ? `Una ${esc(tpl.name.toLowerCase())} (${cost} de oro) cada unos ${Math.ceil(cost / op.gold)} turnos.` : ''}</p>
            <select data-op-template="${op.id}" style="width:100%;margin-top:6px" aria-label="Plantilla de refuerzo">${opts.map(([v, l]) => `<option value="${v}" ${op.template === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
            <p class="note">${esc(tpl.why)} Se recluta en las ciudades más cercanas a la zona de reunión y las tropas marchan hasta ella; completa, entra en la operación.</p>
            <p class="small" style="margin-top:4px">${status}${op.formed ? ` Formadas: ${op.formed}.` : ''}${op.pool ? ` Guardado: ${op.pool} de oro.` : ''}</p>`;
    }
    // Plantillas de serie y propias, con su fuerza, y un editor para crear la tuya.
    // Cifras de una plantilla: tamaño, escalón, fuerza, velocidad y coste.
    tplFacts(u) {
        const g = this.game, r = g.rules(g.player), k = countUnits(u);
        return `${k} · ${echelonOf(k).mark} · ataque ${unitPower(u, 'atk', r)}, defensa ${unitPower(u, 'def', r)}, velocidad ${k ? speedOf(u, r) : 0} · ${g.templateCost(g.player, u)} de oro`;
    }
    templatesSection() {
        const g = this.game, n = g.nations[g.player];
        const d = this.tplDraft ??= { name: '', units: { infantry: 6, tank: 2, artillery: 1 } };
        const facts = u => this.tplFacts(u);
        const row = (name, u, extra = '') => `<div class="tpl-row">${unitIcon(dominantType(u), g.nations[g.player].color)}<span><b>${esc(name)}</b><small>${unitText(u)} · ${facts(u)}</small></span>${extra}</div>`;
        return `<details class="tpl-box" ${this.tplOpen ? 'open' : ''} data-tpl-box>
            <summary>Plantillas de ejército</summary>
            ${Object.values(TEMPLATES).map(t => row(t.name, t.units)).join('')}
            ${n.templates.map((t, i) => row(t.name, t.units, `<button class="btn ghost" data-action="tpl-del" data-index="${i}" aria-label="Borrar" title="Borrar">✕</button>`)).join('')}
            <div class="tpl-edit">
                <input type="text" id="tpl-name" maxlength="40" placeholder="Nombre de tu plantilla" value="${esc(d.name)}" aria-label="Nombre de la plantilla">
                ${g.recruitTypes(g.player).map(k => `<div class="unit-row">${unitIcon(k, g.nations[g.player].color)}<div>${CONFIG.TYPES[k].name}</div>
                    <div class="stepper">${[-100, -10, -1].map(v => `<button data-action="tpl-step" data-unit="${k}" data-delta="${v}" ${d.units[k] ? '' : 'disabled'} aria-label="${-v} menos">${v < 0 ? '−' : '+'}${Math.abs(v)}</button>`).join('')}
                    <input type="number" min="0" max="${TPL_MAX}" step="1" value="${d.units[k] || 0}" data-tpl-unit="${k}" aria-label="${CONFIG.TYPES[k].name}">
                    ${[1, 10, 100].map(v => `<button data-action="tpl-step" data-unit="${k}" data-delta="${v}" aria-label="${v} más">+${v}</button>`).join('')}</div></div>`).join('')}
                <p class="small muted" data-tpl-facts>${facts(d.units)}</p>
                <button class="btn" data-action="tpl-save" ${countUnits(d.units) && n.templates.length < TPL_OWN_MAX ? '' : 'disabled'}>Guardar plantilla</button>
            </div>
            <p class="note">La artillería frena a todo el ejército a velocidad 3 y la infantería a 4: para ir rápido, tanques solos. La infantería es la defensa más barata; la artillería, el ataque más barato pero muy frágil.</p>
        </details>`;
    }

    renderBlocs() {
        const g = this.game, p0 = g.player, body = $('#drawer-body');
        const visible = g.visibleBlocs(p0);
        const mine = visible.filter(b => b.members.has(p0));
        const others = visible.filter(b => !b.members.has(p0));
        const memberChips = b => `<div class="members">${[...b.members].map(m => this.nationChip(m)).join('')}</div>`;
        const eligible = b => g.nations.filter(n => n.alive && !b.members.has(n.id) && !g.atWar(p0, n.id)).sort((x, y) => x.name.localeCompare(y.name, 'es'));
        body.innerHTML = `
            <p class="group-title" style="margin-top:0">Tus alianzas</p>
            ${mine.map(b => `<div class="bloc mine">
                <h3>${esc(b.name)}${b.secret ? ' <span class="chip">secreta</span>' : ''}</h3>
                ${memberChips(b)}
                <div class="row"><select data-bloc-invite="${b.id}" style="flex:1">${eligible(b).map(n => `<option value="${n.id}">${n.name}</option>`).join('')}</select>
                <button class="btn" data-action="bloc-invite" data-bloc="${b.id}">Invitar</button></div>
                <button class="btn ghost" style="margin-top:6px" data-action="bloc-leave" data-bloc="${b.id}">Abandonar la alianza</button>
            </div>`).join('') || '<p class="note" style="margin:0 0 8px 8px">No perteneces a ninguna alianza.</p>'}
            <div class="bloc">
                <h3>Fundar una alianza</h3>
                <div class="stack">
                    <input type="text" id="bloc-name" maxlength="40" placeholder="Pacto de ${esc(g.nations[p0].capitalName)}" value="${esc(this.blocName)}" aria-label="Nombre de la alianza">
                    <label class="check small"><input type="checkbox" id="bloc-secret" ${this.blocSecret ? 'checked' : ''}><span>Secreta: solo la conocen sus miembros hasta que una guerra la active</span></label>
                    <button class="btn primary" data-action="bloc-create">Fundar alianza</button>
                </div>
                <p class="note">Puedes estar en varias a la vez, OTAN incluida. Si atacan a un miembro, los demás entran en guerra.</p>
            </div>
            ${others.length ? `<p class="group-title">Otras alianzas</p>${others.map(b => `<div class="bloc">
                <h3>${esc(b.name)}</h3>${memberChips(b)}
                <button class="btn" data-action="bloc-request" data-bloc="${b.id}" ${g.proposedThisTurn.has(`req${b.id}`) ? 'disabled' : ''}>Pedir el ingreso</button></div>`).join('')}` : ''}`;
    }

    renderLog() {
        const body = $('#drawer-body');
        const entries = this.game.logs.slice(-250).reverse();
        let html = '', turn = null;
        for (const { turn: t, msg } of entries) {
            if (msg.startsWith('— TURNO')) continue;
            if (t !== turn) { html += `<p class="log-turn">Turno ${t}</p>`; turn = t; }
            html += `<p class="log-line">${esc(msg)}</p>`;
        }
        body.innerHTML = html || '<p class="note">Todavía no ha pasado nada.</p>';
    }

    renderPeaceDialog() {
        const g = this.game, s = this.peace, t = s.target, me = g.player;
        const occ = g.occupation(t), sats = g.satellitesOf(me);
        const offered = g.proposals.some(p => p.kind === 'paz' && p.from === t);
        const crushed = g.isCrushed(t);
        if (s.mode === 'satellite' && !crushed) s.mode = 'annex';
        const opt = (mode, title, desc, enabled = true) => `<button class="peace-opt ${s.mode === mode ? 'on' : ''}" data-action="peace-mode" data-mode="${mode}" ${enabled ? '' : 'disabled'}><b>${title}</b><span>${desc}</span></button>`;
        const keeps = s.mode === 'annex' || (s.mode === 'satellite' && s.keep);
        let extra = '';
        if (keeps && occ.mine && sats.length && s.mode === 'annex') {
            extra += `<label class="field"><span>Lo que has ocupado tú es para</span>
                <select id="peace-mine"><option value="-1" ${s.mine < 0 ? 'selected' : ''}>Ti</option>
                ${sats.map(x => `<option value="${x}" ${s.mine === x ? 'selected' : ''}>Tu satélite ${g.nm(x)}</option>`).join('')}</select></label>`;
        }
        if (keeps && occ.sats) {
            extra += `<div class="field"><span>Lo que han ocupado tus satélites es para</span><div class="seg">
                <button data-action="peace-sat" data-value="self" class="${s.satGains === 'self' ? 'on' : ''}">Ellos</button>
                <button data-action="peace-sat" data-value="overlord" class="${s.satGains === 'overlord' ? 'on' : ''}">Ti</button></div></div>`;
        }
        if (s.mode === 'satellite') {
            extra += `<label class="check small" style="margin-top:10px"><input type="checkbox" id="peace-keep" ${s.keep ? 'checked' : ''}><span>Quedarte lo que has ocupado de ${g.nm(t)} (si no, se lo devuelves)</span></label>`;
        }
        const asked = !offered && g.proposedThisTurn.has(`paz${t}`);
        $('#peace-body').innerHTML = `
            <div class="row" style="justify-content:space-between"><h2>Paz con ${g.nm(t)}</h2><button class="btn ghost" data-action="peace-close" aria-label="Cerrar">✕</button></div>
            <p class="note" style="margin-bottom:10px">${offered ? `${g.nm(t)} te ha propuesto la paz: aceptará anexionar lo ocupado o una paz blanca.` : `Elige las condiciones. ${g.nm(t)} puede rechazarlas, y solo puedes proponerle la paz una vez por turno.`}</p>
            <dl class="facts" style="margin-bottom:12px">
                <dt>Has ocupado</dt><dd>${plural(occ.mine, 'casilla', 'casillas')} en ${plural(occ.provinces, 'provincia', 'provincias')}${occ.sats ? `, y tus satélites ${occ.sats} más` : ''}</dd>
                <dt>Te ha ocupado</dt><dd>${plural(occ.theirs, 'casilla', 'casillas')} tuyas o de tus satélites</dd>
            </dl>
            <div class="stack">
                ${opt('annex', 'Anexionar lo ocupado', 'Cada bando se queda lo que ocupa: deja de estar en disputa y pasa a ser territorio propio, con toda su renta.')}
                ${opt('satellite', `Convertir a ${g.nm(t)} en tu satélite`, crushed
                    ? `Conserva su país, te paga el ${CONFIG.TRIBUTE * 100} % de sus ingresos, entra en tus guerras y nunca te ataca. Lo que te ocupó vuelve a ti.`
                    : 'Solo si le has vencido claramente: ocupas su capital o el 40 % de su territorio, o tiene menos de un tercio de tu fuerza.', crushed)}
                ${opt('white', 'Paz blanca', 'Cada uno recupera lo suyo; las casillas ocupadas vuelven a su dueño.')}
            </div>
            ${extra}
            <div class="row" style="margin-top:16px;justify-content:flex-end">
                <button class="btn" data-action="peace-close">Cancelar</button>
                <button class="btn primary" data-action="peace-send" ${asked ? 'disabled' : ''}>${asked ? 'Ya has propuesto la paz este turno' : 'Proponer estas condiciones'}</button>
            </div>`;
    }

    watchSettings() {
        const p = this.prefs, seg = (action, opts, cur) => `<div class="seg">${opts.map(([v, label]) => `<button data-action="${action}" data-value="${v}" class="${cur === v ? 'on' : ''}">${label}</button>`).join('')}</div>`;
        return `<div class="field"><span>Turno de los demás países</span>
                ${seg('watch', [['directo', 'Directo a mi turno'], ['ver', 'Ver sus jugadas']], p.watch)}</div>
            ${p.watch === 'ver' ? `<div class="field"><span>Velocidad</span>${seg('speed', [['lenta', 'Lenta'], ['normal', 'Normal'], ['rapida', 'Rápida']], p.speed)}
                <p class="note">Cada país juega por orden y se resalta su territorio; los que no hacen nada se saltan. «Saltar» o Esc lo termina al instante.</p></div>` : ''}`;
    }

    renderGameDialog() {
        const g = this.game, saves = readSaves(), playing = g.player !== null;
        const when = s => new Date(s.date).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
        $('#game-dialog-body').innerHTML = `
            <div class="row" style="justify-content:space-between"><h2>Partida</h2><button class="btn ghost" data-action="close-game" aria-label="Cerrar">✕</button></div>
            <p class="note" style="margin-bottom:8px">Se guarda sola al terminar cada turno. Las ranuras viven en este navegador; para hacer copias o jugar en otro equipo, exporta a archivo.</p>
            ${Object.entries(SLOTS).map(([slot, label]) => {
                const s = saves[slot];
                return `<div class="slot"><div><b>${label}</b><div class="small muted">${s ? `${esc(s.nation)}, turno ${s.turn}, ${when(s)}` : 'vacía'}</div></div>
                    ${slot === 'auto' ? '<span></span>' : `<button class="btn" data-action="save" data-slot="${slot}" ${playing && !g.over ? '' : 'disabled'}>Guardar aquí</button>`}
                    <button class="btn" data-action="load" data-slot="${slot}" ${s ? '' : 'disabled'}>Cargar</button></div>`;
            }).join('')}
            ${Object.keys(MAPS).filter(m => m !== MAP_ID).map(m => {
                const other = readSaves(m), list = Object.keys(SLOTS).filter(slot => other[slot]);
                return list.length ? `<h3 class="slots-other">Mapa ${MAPS[m].name}</h3>${list.map(slot => `<div class="slot"><div><b>${SLOTS[slot]}</b><div class="small muted">${esc(other[slot].nation)}, turno ${other[slot].turn}, ${when(other[slot])}</div></div>
                    <span></span><button class="btn" data-action="load" data-map="${m}" data-slot="${slot}" title="Cambia al mapa ${MAPS[m].name} y carga la partida">Cargar</button></div>`).join('')}` : '';
            }).join('')}
            ${this.watchSettings()}
            <div class="row" style="margin-top:14px">
                <button class="btn" data-action="export" ${playing ? '' : 'disabled'}>Exportar a archivo</button>
                <button class="btn" data-action="import">Importar archivo</button>
            </div>`;
    }

    renderOverlay() {
        const g = this.game, overlay = $('#overlay');
        overlay.hidden = !g.over;
        if (!g.over) return;
        $('#overlay-card').innerHTML = `
            <h2 style="color:${g.won ? SIGNAL : 'var(--war)'}">${g.won ? 'Victoria' : 'Derrota'}</h2>
            <p>${g.won ? `${g.nm(g.player)} domina ${MAP.it} en el turno ${g.turn}.` : `${g.nm(g.player)} ha caído en el turno ${g.turn}.`}</p>
            <button class="btn primary" style="margin-top:16px" data-action="restart">Nueva partida</button>`;
    }
}

const seedParam = Number(new URLSearchParams(location.search).get('seed'));
let game = new GameEngine(Number.isFinite(seedParam) && seedParam > 0 ? seedParam : Date.now() % 2147483647);
const ui = new GameUI(game);
// --- Actualizaciones ---
// La app compara su versión con version.json (al abrirse, al volver a primer plano y cada 15 minutos). Si hay una
// nueva, guarda la partida, recarga y la reanuda: las apps instaladas no se quedan con versiones antiguas.
const APP_VERSION = '2026.10.21-093633';
const RESUME_KEY = 'nanwar.resume';
let updating = false;
async function checkForUpdate() {
    if (location.protocol === 'file:' || updating) return;
    try {
        const res = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;
        const { version } = await res.json();
        if (version && version !== APP_VERSION && APP_VERSION !== 'dev') applyUpdate(version);
    } catch { /* sin conexión: se seguirá con esta versión */ }
}
function applyUpdate(version) {
    // Un solo intento por versión y sesión: si la recarga trajera aún la página vieja, no se entra en bucle.
    try { if (sessionStorage.getItem('nanwar.updateTried') === version) return; sessionStorage.setItem('nanwar.updateTried', version); } catch { /* sin almacenamiento */ }
    updating = true;
    if (game.player !== null && !game.over && writeSave('auto', game)) {
        try { localStorage.setItem(RESUME_KEY, 'auto'); } catch { /* sin almacenamiento no se puede reanudar */ }
    }
    const box = document.createElement('div');
    box.className = 'toast float';
    box.innerHTML = '<p style="margin:0"><b>Actualizando NanWar…</b> Tu partida se ha guardado y continuará en un momento.</p>';
    $('#toasts').prepend(box);
    const reg = navigator.serviceWorker ? navigator.serviceWorker.getRegistration() : Promise.resolve(null);
    reg.then(r => r && r.update()).catch(() => {}).finally(() => setTimeout(() => location.reload(), 1200));
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(err => console.warn('Sin modo sin conexión:', err));
}
// Tras una actualización, se reanuda la partida que se estaba jugando.
try {
    const resume = localStorage.getItem(RESUME_KEY);
    if (resume) {
        localStorage.removeItem(RESUME_KEY);
        if (resume === 'import') {
            const text = sessionStorage.getItem(IMPORT_KEY);
            sessionStorage.removeItem(IMPORT_KEY);
            if (text) { ui.setGame(GameEngine.load(JSON.parse(text))); game.log(`Partida importada (mapa ${MAP.name}).`); ui.render(); }
        } else {
            // "auto" tras una actualización; "mapa:ranura" al cargar una partida de otro mapa.
            const [map, slot] = resume.includes(':') ? resume.split(':') : [MAP_ID, resume];
            const save = map === MAP_ID && Object.prototype.hasOwnProperty.call(SLOTS, slot) ? readSaves()[slot] : null;
            if (save) {
                ui.setGame(GameEngine.load(save.data));
                game.log(resume.includes(':') ? `Partida cargada de ${SLOTS[slot]} (mapa ${MAP.name}).` : `NanWar se ha actualizado a la versión ${APP_VERSION}. Continúas tu partida.`);
                ui.render();
            }
        }
    }
} catch { /* sin almacenamiento local */ }
setTimeout(checkForUpdate, 2000);
setInterval(checkForUpdate, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
</script>
</body>
