            if (this.advance(a, c, r, false, op.state === 'repliega') !== 'blocked') { tally.moved++; leave(pick, a); } else this.reattach(a);
        }
        // Los que sobran refuerzan la casilla más amenazada de la línea (se juntan con quien la guarde).
        const hot = [...op.cells].sort((x, y) => danger.get(y) - danger.get(x))[0];
        for (const a0 of idle) {
            if (!live(a0) || hot === undefined) continue;
            const a = this.detach(a0), r = this.reach(id, a.cell, this.mp(a), a.used === 0);
            if (this.advance(a, hot, r, true, op.state === 'repliega') !== 'blocked') { tally.moved++; leave(a0, a); } else this.reattach(a);
        }
        if (garrisons.length) tally.notes.push(`deja guarnición en ${[...new Set(garrisons)].join(', ')}`);
        if (cut.length) tally.notes.push(`${plural(cut.length, 'ejército cortado aguanta', 'ejércitos cortados aguantan')} en ${[...new Set(cut)].join(', ')}`);
        if (op.fortify) {
            for (const c of [...op.cells].sort((x, y) => danger.get(y) - danger.get(x))) {
                if (tally.fortified >= 2 || this.nations[id].gold < rules.fortCost) break;
                if (!held(c) || this.owner[c] !== id || this.fort[c] || this.fortWork.has(c)) continue;
                this.buildFort(id, { cells: [c], path: [c], cost: rules.fortCost, cls: 'fort' });
                tally.fortified++;
            }
        }
    }

    // --- Plantillas y refuerzos de las operaciones ---
    // op.gold: oro por turno para refuerzos, que se va guardando en op.pool. op.template: 'auto', una plantilla de serie
    // o 'c<n>', una propia. op.form: la formación en curso { name, units, zone, recruited, pending: [[ciudad, unidades]] }.
    // Se recluta en las ciudades más cercanas a la zona de reunión; al turno siguiente los reclutas marchan hasta ella y
    // se juntan (army.form = id de la operación); cuando está completa, el ejército entra en la operación.
    templateOf(id, key) {
        if (/^c\d+$/.test(key)) { const t = this.nations[id].templates[+key.slice(1)]; return t ? { key, name: t.name, units: t.units, why: 'Plantilla propia.' } : null; }
        const t = Object.hasOwn(TEMPLATES, key) ? TEMPLATES[key] : null;
        return t ? { key, ...t } : null;
    }
    // Composición sugerida para una operación según su tipo, su objetivo y el terreno de su eje.
    suggestTemplate(op) {
        if (op.kind === 'defensa') return { key: 'infanteria', why: 'Para sostener una línea: la infantería es la defensa más barata.' };
        if (op.kind === 'reserva') return { key: 'mecanizada', why: 'Para acudir a cualquier frente: aguanta y avanza.' };
        const obj = op.cells[op.cells.length - 1];
        if (this.fort[obj] || CAPITAL_OF[obj] >= 0) return { key: 'artilleria', why: 'El objetivo es una capital o está fortificado: hace falta fuego para romper la defensa.' };
        let n = 0, rough = 0;
        for (let i = 0; i + 1 < op.cells.length; i++) {
            const a = op.cells[i], b = op.cells[i + 1], k = Math.max(1, Math.round(Math.hypot(G.cx[b] - G.cx[a], G.cy[b] - G.cy[a]) / G.W));
            for (let j = 0; j <= k; j++) {
                const c = G.cellAt(G.cx[a] + (G.cx[b] - G.cx[a]) * j / k, G.cy[a] + (G.cy[b] - G.cy[a]) * j / k);
                if (c < 0 || !isLand(c)) continue;
                n++;
                if (['forest', 'hills', 'mountain', 'marsh'].includes(CELL_TERRAIN[c])) rough++;
            }
        }
        if (n && rough / n >= 0.4) return { key: 'mecanizada', why: 'Terreno abrupto en el eje: infantería y tanques juntos.' };
        if (n >= 8) return { key: 'punta', why: 'Eje largo y llano: tanques solos, los más rápidos.' };
        return { key: 'acorazada', why: 'Eje corto y llano: tanques con infantería.' };
    }
    opTemplate(op) {
        if (op.template !== 'auto') { const t = this.templateOf(op.owner, op.template); if (t) return t; }
        const sug = this.suggestTemplate(op);
        return { ...this.templateOf(op.owner, sug.key), why: sug.why, auto: true };
    }
    templateCost(id, units) { return UNIT_KEYS.reduce((sum, k) => sum + (units[k] || 0) * this.unitCost(id, k), 0); }
    // Zona de reunión de los refuerzos: casilla libre suya, sin ciudad, junto al punto de partida de la operación.
    formZone(op) {
        const id = op.owner, anchor = op.kind === 'defensa' ? op.cells[Math.floor(op.cells.length / 2)] : op.cells[0];
        let best = -1, bd = Infinity;
        for (const [c, d] of this.nearCells(anchor, 3)) {
            if (!isLand(c) || this.owner[c] !== id || CITY_OF[c] >= 0 || this.armyAt[c] || op.cells.includes(c) && op.kind === 'defensa') continue;
            if (d < bd) { bd = d; best = c; }
        }
        return best >= 0 ? best : anchor;
    }
    // Refuerzos de todas las operaciones de `id`: reclutan por rondas, una unidad cada una y las más prioritarias primero,
    // para que ninguna acapare el oro ni el cupo de las ciudades mientras las demás esperan.
    stepReinforcements(id) {
        const ctx = new Map();
        for (const op of this.opsOf(id)) if (!op.paused && (op.gold || op.form || op.extra)) { const c = this.reinforceBegin(op); if (c) ctx.set(op, c); }
        const order = [...ctx.keys()].sort((x, y) => this.priorityOf(y) * (1 + this.opNeed(y)) - this.priorityOf(x) * (1 + this.opNeed(x)) || x.id - y.id);
        for (let busy = true, guard = 0; busy && guard < 400; guard++) { busy = false; for (const op of order) if (this.recruitOne(op, ctx.get(op))) busy = true; }
        for (const op of ctx.keys()) this.reinforceEnd(op);
    }
    reinforce(op) {
        const c = this.reinforceBegin(op);
        if (!c) return;
        while (this.recruitOne(op, c));
        this.reinforceEnd(op);
    }
    // Fondo del turno, formación nueva si toca y marcha de lo reclutado el turno anterior. Devuelve con qué reclutar, o null.
    reinforceBegin(op) {
        const id = op.owner;
        if (op.poolTurn !== this.turn) {   // una vez por turno
            op.poolTurn = this.turn;
            const tpl = this.opTemplate(op);
            op.pool = Math.min((op.pool ?? 0) + op.gold, Math.max(op.gold * 6, this.templateCost(id, tpl.units) * 3)) + (op.extra ?? 0);
            op.extra = 0;
        }
        let f = op.form;
        if (!f) {
            if (!op.gold && op.pool < this.templateCost(id, this.opTemplate(op).units) / 4) return null;
            const tpl = this.opTemplate(op);
            f = op.form = { name: tpl.name, units: copyUnits(tpl.units), zone: this.formZone(op), recruited: emptyUnits(), pending: [] };
        }
        // Lo reclutado el turno anterior sale de su ciudad hacia la zona de reunión.
        f.pending = f.pending.filter(([city, units]) => {
            const g = this.armyOn(city);
            if (!g || g.owner !== id) return false;
            const take = emptyUnits();
            for (const k of UNIT_KEYS) take[k] = Math.min(units[k] || 0, g.units[k] || 0);
            if (!countUnits(take)) return false;
            const mover = sameUnits(take, g.units) ? g : this.split(g, take);
            if (mover !== g) mover.op = 0;
            mover.form = op.id;
            if (!this.setOrder(mover, { kind: 'march', dest: f.zone })) { if (mover !== g) this.settle(mover); return false; }
            if (city !== f.zone) this.stepOrder(mover);
            if (mover !== g && this.armies.has(mover.id) && mover.cell === city && this.armyAt[city] !== mover.id) { this.settle(mover); return true; }   // no ha podido salir: otra vez el turno que viene
            return false;
        });
        // Se recluta en la ciudad con cupo más cercana a la zona.
        const zx = G.cx[f.zone], zy = G.cy[f.zone];
        const cities = PROVINCES.filter(p => this.owner[p.city] === id && this.legal[p.city] === id)
            .sort((x, y) => (G.cx[x.city] - zx) ** 2 + (G.cy[x.city] - zy) ** 2 - (G.cx[y.city] - zx) ** 2 - (G.cy[y.city] - zy) ** 2);
        return { cities, path: this.orderField(id, f.zone), done: false };
    }
    // Recluta una unidad de lo que falta a la formación, del tipo más atrasado. true si ha reclutado.
    recruitOne(op, ctx) {
        const id = op.owner, n = this.nations[id], f = op.form;
        if (!f || !ctx || ctx.done) return false;
        const missing = UNIT_KEYS.filter(k => (f.recruited[k] || 0) < (f.units[k] || 0)).sort((x, y) => (f.recruited[x] || 0) / f.units[x] - (f.recruited[y] || 0) / f.units[y]);
        const p = missing.length ? ctx.cities.find(c => c.city !== f.zone && this.canRecruitAt(id, c) && ctx.path.to(c.city) < Infinity) : null;
        // El tipo más atrasado que se pueda pagar (si la artillería no llega, una infantería).
        const type = p && missing.find(k => { const c = this.unitCost(id, k, p.id); return op.pool >= c && n.gold >= c; });
        if (!type || !this.recruit(id, p, type)) { ctx.done = true; return false; }
        const cost = this.unitCost(id, type, p.id);
        op.pool -= cost;
        f.recruited[type] = (f.recruited[type] || 0) + 1;
        const entry = f.pending.find(([c]) => c === p.city);
        if (entry) entry[1][type] = (entry[1][type] || 0) + 1; else { const u = emptyUnits(); u[type] = 1; f.pending.push([p.city, u]); }
        return true;
    }
    // Quien perdió su marcha deja la formación; la formación completa entra en la operación.
    reinforceEnd(op) {
        const id = op.owner, f = op.form;
        if (!f) return;
        // Quien perdió su marcha (sin paso tres turnos) deja la formación.
        for (const a of this.armies.values()) if (a.form === op.id && a.owner === id && !a.order && a.cell !== f.zone) a.form = 0;
        // Formación completa: el ejército de la zona entra en la operación.
        const at = this.armyOn(f.zone), done = UNIT_KEYS.every(k => (f.recruited[k] || 0) >= (f.units[k] || 0)) && !f.pending.length;
        const marching = [...this.armies.values()].some(a => a.form === op.id && a !== at && a.owner === id);
        if (done && !marching) {
            const whole = at && at.owner === id && at.form === op.id;
            if (whole) { at.form = 0; at.order = null; at.op = op.id; }
            op.form = null;
            op.formed = (op.formed ?? 0) + 1;
            this.orderVersion++;
            if (id === this.player) this.log(whole ? `${op.name}: formada una ${f.name.toLowerCase()} en ${this.placeName(f.zone)}; entra en la operación.`
                : `${op.name}: reclutada una ${f.name.toLowerCase()}; sus tropas se han unido a los ejércitos que había en ${this.placeName(f.zone)}.`);
        } else if (at && at.owner === id && at.form === op.id && !at.order) this.setOrder(at, { kind: 'hold' });
    }
    // Lo que lleva hecho una formación: reclutadas, en camino y ya en la zona.
    formProgress(op) {
        const f = op.form;
        if (!f) return null;
        const total = countUnits(f.units), done = countUnits(f.recruited);
        const at = this.armyOn(f.zone), ready = at && at.form === op.id ? countUnits(at.units) : 0;
        let moving = 0;
        for (const a of this.armies.values()) if (a.form === op.id && a !== at) moving += countUnits(a.units);
        return { total, done, ready, moving, waiting: f.pending.reduce((s, [, u]) => s + countUnits(u), 0) };
    }

    // --- Directiva nacional: postura, objetivos, presupuesto, teatros y retaguardia ---
    // nation.command = { posture, spend, budget, share, pools, goals: [provincias], goalsMet: [países], priority: { país: 'alta'|… }, rear }
    // Teatro (frente) de una operación: el país enemigo de su objetivo o el más cercano a sus casillas (-1 si ninguno).
    opFront(op) {
        if (op.front >= 0 && this.atWar(op.owner, op.front)) return op.front;
        const key = `${this.turn}:${this.blocVersion}:${op.cells.length}:${op.cells[0]}:${op.cells[op.cells.length - 1]}`;
        if (op._frontKey === key) return op._front;
        let front = -1;
        const id = op.owner, obj = op.cells[op.cells.length - 1];
        if (op.kind === 'ofensiva' && this.owner[obj] !== id && this.owner[obj] >= 0) front = this.owner[obj];
        else {
            // El enemigo más cercano: anillos de casillas cada vez más anchos alrededor de la operación.
            const enemies = new Set(this.enemiesOf(id));
            if (enemies.size) {
                const seen = new Set(op.cells);
                let ring = [...op.cells];
                for (let k = 0; k < 60 && ring.length && front < 0; k++) {
                    const next = [];
                    for (const u of ring) for (let d = 0; d < 6; d++) {
                        const v = G.nb[u * 6 + d];
                        if (v < 0 || seen.has(v)) continue;
                        seen.add(v);
                        if (isLand(v) && enemies.has(this.owner[v])) { front = this.owner[v]; break; }
                        next.push(v);
                    }
                    ring = next;
                }
            }
        }
        op._frontKey = key; op._front = front;
        return front;
    }
    priorityOf(op) { const v = this.nations[op.owner].command.priority[this.opFront(op)]; return Object.hasOwn(PRIORITY, v) ? PRIORITY[v] : 2; }
    setPosture(id, key) {
        const c = this.nations[id].command;
        if (!Object.hasOwn(POSTURES, key)) return;
        c.posture = key;
        c.budget = { ...POSTURES[key].budget };
    }
    // Progreso de los objetivos estratégicos: provincias en tu poder de las marcadas, agrupadas por su dueño legal.
    goalProgress(id) {
        const c = this.nations[id].command, byNation = new Map();
        for (const pid of c.goals) {
            const p = PROVINCES[pid], k = this.legal[p.city] === id ? p.country : this.legal[p.city];   // de quién era o es
            if (!byNation.has(k)) byNation.set(k, { nation: k, total: 0, held: 0 });
            const e = byNation.get(k);
            e.total++;
            if (this.owner[p.city] === id) e.held++;
        }
        return [...byNation.values()];
    }
    toggleGoal(id, pid) {
        const c = this.nations[id].command, i = c.goals.indexOf(pid);
        if (i >= 0) c.goals.splice(i, 1); else if (c.goals.length < 400) c.goals.push(pid);
        this.orderVersion++;
    }
    // Ofensivas enemigas que conoce `viewer`: con un espía que informe en la provincia de su salida o de su objetivo,
    // o con Reconocimiento aéreo (galones y muros a la vista) si ve su salida.
    knownEnemyOps(viewer) {
        if (viewer === null) return [];
        const spied = this.spiedProvinces(), aerial = this.rules(viewer).intelLevels;
        return [...this.ops.values()].filter(op => op.kind === 'ofensiva' && this.atWar(viewer, op.owner)
            && (spied.has(G.prov[op.cells[0]]) || spied.has(G.prov[op.cells[op.cells.length - 1]]) || (aerial && this.sees(viewer, op.cells[0]))));
    }
    // Lo que hace la directiva cada turno, antes de los refuerzos de las operaciones.
    directive(id) {
        const n = this.nations[id], c = n.command;
        // Frente en guerra sin línea de defensa: se avisa una vez por guerra (y se olvida al firmar la paz).
        if (id === this.player) {
            const enemies = this.enemiesOf(id);
            c.warned = (c.warned ?? []).filter(e => enemies.includes(e));
            const covered = new Set(this.opsOf(id).filter(o => o.kind === 'defensa').map(o => this.opFront(o)));
            for (const e of enemies) {
                if (covered.has(e) || c.warned.includes(e)) continue;
                if (!G.land.some(x => this.owner[x] === id && [0, 1, 2, 3, 4, 5].some(d => { const j = G.nb[x * 6 + d]; return j >= 0 && isLand(j) && this.owner[j] === e; }))) continue;
                c.warned.push(e);
                this.log(`Frente con ${this.nm(e)} sin línea de defensa: hay una propuesta en Mando.`);
            }
        }
        // Objetivos cumplidos frente a un país en guerra: se avisa una vez.
        for (const gp of this.goalProgress(id)) {
            const met = gp.total > 0 && gp.held === gp.total;
            if (met && !c.goalsMet.includes(gp.nation)) {
                c.goalsMet.push(gp.nation);
                if (id === this.player) this.log(`Objetivos estratégicos cumplidos frente a ${this.nm(gp.nation)}: es buen momento para proponer la paz.`);
            } else if (!met && c.goalsMet.includes(gp.nation)) c.goalsMet.splice(c.goalsMet.indexOf(gp.nation), 1);
        }
        // Retaguardia: con una reserva activa, lo que sobra en las ciudades sin peligro va a la reserva (deja una infantería).
        if (c.rear && this.enemiesOf(id).length) {
            const res = this.opsOf(id).find(o => o.kind === 'reserva' && !o.paused && o.auto !== 'manual');
            if (res) for (const a of [...this.armies.values()]) {
                if (a.owner !== id || a.op || a.order || a.form || CITY_OF[a.cell] < 0 || countUnits(a.units) < 2 || this.armyOn(a.cell) !== a) continue;
                if (this.threat(id, a.cell) === 0) { a.op = res.id; this.orderVersion++; }
            }
        }
        if (!c.spend || c.spentTurn === this.turn) return;   // las órdenes se pueden cumplir varias veces por turno; el reparto, una
        c.spentTurn = this.turn;
        // Presupuesto: una parte de la renta (share) se reparte según el presupuesto; el resto queda para ti.
        const income = Math.max(0, this.income(id)) * c.share / 100, total = Object.values(c.budget).reduce((x, y) => x + y, 0) || 1;
        const part = k => Math.floor(income * c.budget[k] / total);
        // Reclutar: a las operaciones, más a las de prioridad alta y a las que piden ayuda.
        const ops = this.opsOf(id).filter(o => !o.paused);
        if (ops.length) {
            const w = ops.map(o => this.priorityOf(o) * (1 + this.opNeed(o))), sum = w.reduce((x, y) => x + y, 0);
            ops.forEach((o, i) => { o.extra = (o.extra ?? 0) + Math.floor(part('recruit') * w[i] / sum); });
        }
        c.pools.research = Math.min(c.pools.research + part('research'), income * 40 + 1000);
        c.pools.forts = Math.min(c.pools.forts + part('forts'), income * 40 + 1000);
        c.pools.roads = Math.min(c.pools.roads + part('roads'), income * 40 + 1000);
        // Investigar lo que investigaría la IA en tu lugar, cuando lo guardado alcance.
        if (n.tech.current.length < this.rules(id).labs) {
            const tech = this.aiTechChoice(id);
            if (tech && this.techState(id, tech) === 'open') {
                const cost = this.researchCost(id, tech);
                if (c.pools.research >= cost && n.gold >= cost && this.startResearch(id, tech)) c.pools.research -= cost;
            } else if (tech && this.techState(id, tech) === 'paused') this.startResearch(id, tech);
        }
        // Fortificar las ciudades más amenazadas: primero se reparan las fortificaciones dañadas y después se construye.
        const fortCost = this.rules(id).fortCost;
        if (c.pools.forts >= Math.round(fortCost / 2)) {
            const threatened = this.citiesOf(id).filter(p => this.legal[p.city] === id)
                .map(p => [p.city, this.threat(id, p.city)]).filter(([, t]) => t > 0).sort((x, y) => y[1] - x[1]);
            for (const [cell] of threatened) {
                const plan = this.fortRepairPlan(id, cell);
                if (!plan || plan.cost > c.pools.forts || !this.startFortRepair(id, plan)) continue;
                c.pools.forts -= plan.cost;
                if (id === this.player) this.log(`Directiva: se repara la fortificación de ${this.placeName(cell)}.`);
            }
            const cities = threatened.filter(([cell]) => !this.fort[cell] && !this.fortWork.has(cell));
            for (const [cell] of cities) {
                if (c.pools.forts < fortCost || n.gold < fortCost) break;
                this.buildFort(id, { cells: [cell], path: [cell], cost: fortCost, cls: 'fort' });
                c.pools.forts -= fortCost;
                if (id === this.player) this.log(`Directiva: se fortifica ${this.placeName(cell)}.`);
            }
        }
        // Reparar los tramos rotos antes de construir nada nuevo.
        if (c.pools.roads > 0) {
            const before = this.roadWork.size, spent = this.aiRepairRoads(id, Math.min(c.pools.roads, n.gold));
            if (spent) {
                c.pools.roads -= spent;
                if (id === this.player) this.log(`Directiva: se reparan ${plural(this.roadWork.size - before, 'tramo', 'tramos')}.`);
            }
        }
        // Carreteras hasta la ciudad más valiosa que aún no esté unida a la capital.
        if (c.pools.roads >= CONFIG.ROAD_COST * 2 && this.owner[n.capitalCell] === id) {
            const e = this.economy(id), loose = this.citiesOf(id).filter(p => !e.connected.has(p.id)).sort((x, y) => y.value - x.value)[0];
            const plan = loose ? this.planRoad(id, loose.city, x => e.seen[x] === 1, 1) : null;
            if (plan && plan.cost <= c.pools.roads && plan.cost <= n.gold && this.buildRoad(id, plan)) {
                c.pools.roads -= plan.cost;
                if (id === this.player) this.log(`Directiva: carretera hasta ${loose.cityName} (${plan.cost} de oro).`);
            }
        }
    }
    // Propuestas de operaciones para un frente sin ninguna: línea en la frontera y ofensiva sobre la ciudad más cercana.
    frontSuggestions(id) {
        const fronts = new Set(this.opsOf(id).map(op => this.opFront(op)));
        return this.enemiesOf(id).filter(e => !fronts.has(e)).map(e => this.frontPlan(id, e)).filter(Boolean);
    }
    // Plan para el frente con `e`: una línea de defensa sobre el tramo de frontera por donde aprieta (sus ejércitos a 3
    // casillas o menos, con 2 de margen a cada lado; si no hay ninguno, frente a su ciudad más cercana), llevada al mejor
    // terreno a 3 casillas o menos, y una ofensiva sobre esa ciudad. El resto del frente queda a las guarniciones.
    frontPlan(id, e) {
        const key = `${this.turn}:${this.version}:${this.armyVersion}:${id}:${e}`;
        if ((this._plans ??= new Map()).has(key)) return this._plans.get(key);
        if (this._plans.size > 200) this._plans.clear();
        const border = G.land.filter(c => this.owner[c] === id && [0, 1, 2, 3, 4, 5].some(d => { const j = G.nb[c * 6 + d]; return j >= 0 && isLand(j) && this.owner[j] === e; }));
        if (!border.length) { this._plans.set(key, null); return null; }
        // Encadena las casillas de la frontera de vecina en vecina, empezando por un extremo.
        const left = new Set(border), chain = [];
        let cur = border.reduce((m, c) => (G.cx[c] + G.cy[c] < G.cx[m] + G.cy[m] ? c : m), border[0]);
        while (cur !== undefined && chain.length < 400) {
            chain.push(cur); left.delete(cur);
            let next, nd = Infinity;
            for (const c of left) { const d = (G.cx[c] - G.cx[cur]) ** 2 + (G.cy[c] - G.cy[cur]) ** 2; if (d < nd) { nd = d; next = c; } }
            cur = next;
        }
        // Ciudad enemiga más cercana a la frontera (en línea recta, para no recorrer todo el mapa) y salida frente a ella.
        const d2 = (a, b) => (G.cx[a] - G.cx[b]) ** 2 + (G.cy[a] - G.cy[b]) ** 2;
        let city = null, cd = Infinity;
        for (const p of PROVINCES) {
            if (this.owner[p.city] !== e) continue;
            for (let i = 0; i < border.length; i += Math.max(1, Math.floor(border.length / 12))) { const d = d2(p.city, border[i]); if (d < cd) { cd = d; city = p; } }
        }
        const start = city ? border.reduce((m, c) => (d2(c, city.city) < d2(m, city.city) ? c : m), border[0]) : border[0];
        // Tramo amenazado: los trozos de la cadena con ejércitos enemigos cerca (huecos de 2 casillas o menos), el de más ataque.
        const foesNear = c => { const out = []; for (const x of this.nearCells(c, 3).keys()) { const a = this.armyOn(x); if (a && a.owner === e && this.sees(id, x)) out.push(a); } return out; };
        const power = chain.map(c => foesNear(c).reduce((t, a) => t + this.seenPower(id, a, 'atk'), 0));
        let i0 = -1, i1 = -1;
        if (power.some(x => x > 0)) {
            let best = -1, g0 = -1, last = -9, sum = 0;
            const close = () => { if (g0 >= 0 && sum > best) { best = sum; i0 = g0; i1 = last; } };
            power.forEach((x, i) => {
                if (!x) return;
                if (i - last > 3 || d2(chain[i], chain[Math.max(0, last)]) > (3 * G.W) ** 2) { close(); g0 = i; sum = 0; }
                sum += x; last = i;
            });
            close();
        } else {
            i0 = i1 = chain.reduce((m, c, i) => (d2(c, start) < d2(chain[m], start) ? i : m), 0);
        }
        i0 = Math.max(0, i0 - 2); i1 = Math.min(chain.length - 1, i1 + 2);
        // Une el tramo por tu territorio, sin saltos.
        const ref = [chain[i0]];
        for (let i = i0 + 1; i <= i1; i++) {
            if (d2(chain[i], ref[ref.length - 1]) > (4 * G.W) ** 2) break;
            const p = this.planFort(id, ref[ref.length - 1], chain[i]);
            if (!p) break;
            for (const c of p.path.slice(1)) if (!ref.includes(c)) ref.push(c);
        }
        // La mejor línea a 3 casillas o menos, con los ejércitos libres cercanos y el ataque enemigo de ese tramo.
        const near = new Set();
        for (const c of ref) for (const x of this.nearCells(c, 4).keys()) near.add(x);
        const forces = [...this.armies.values()].filter(a => a.owner === id && !a.op && !a.order && !a.form && near.has(a.cell) && this.armyOn(a.cell) === a && !(CITY_OF[a.cell] >= 0 && countUnits(a.units) <= 1));
        const foes = new Set();
        for (const c of ref) for (const a of foesNear(c)) foes.add(a);
        const enemy = [...foes].reduce((t, a) => t + this.seenPower(id, a, 'atk'), 0), cap = this.nations[id].capitalCell;
        const res = this.bestLine(id, { ref, forces, enemy, dir: this.lineDir(id, ref), limit: 3, steps: true, keep: this.owner[cap] === id ? cap : -1 });
        const line = res ? res.cells : ref;
        const plan = { enemy: e, line, attack: city ? [start, city.city] : null, target: city?.cityName,
            lineInfo: { label: this.lineLabel(id, line), rel: res?.rel ?? null, front: (res?.front ?? []).map(c => this.placeName(c)), forces: forces.length } };
        this._plans.set(key, plan);
        return plan;
    }

    // Movimientos, ataques y misiones aéreas que haría una operación asistida, sin hacerlos: se juegan en una copia.
    previewOps(id, ids) {
        const copy = GameEngine.load(JSON.parse(JSON.stringify(this.serialize())));
        for (const a of this.armies.values()) if (a.direct === this.turn && copy.armies.has(a.id)) copy.armies.get(a.id).direct = this.turn;
        copy.motion = [];
        copy.executeOps(id, ids);
        return copy.motion.filter(ev => ev.kind === 'move' || ev.kind === 'battle' || ev.kind === 'air');
    }

    zoc(cell, a) {
        for (let d = 0; d < 6; d++) {
            const j = G.nb[cell * 6 + d];
            if (j >= 0 && isLand(j) && this.armyAt[j] && this.atWar(a, this.armies.get(this.armyAt[j]).owner)) return true;
        }
        return false;
    }

    // Alcance con `mp` subpuntos. exp: casillas desde las que se puede seguir; term: donde hay que detenerse
    // (desembarco o contacto con el enemigo); attacks: casilla con ejército enemigo → casilla desde la que se ataca.
    // `fresh`: el ejército aún no se ha movido este turno, así que siempre puede avanzar al menos una casilla de tierra
    // aunque cueste más de lo que le queda (ese paso gasta todo el movimiento).
    // Mar: desde tierra, una casilla de mar vecina es un embarque (term con `embark`, gasta el turno) y, si sobra
    // movimiento, un salto (`hop` en exp) desde el que solo se desembarca o se ataca: nunca dos casillas de mar seguidas.
    // Embarcado (inicio en el mar), navega por exp a MOVE la casilla y desembarca en la costa con lo que le quede.
    reach(a, start, mp, fresh = false) {
        const exp = new Map([[start, { cost: 0, prev: -1 }]]);
        const term = new Map(), attacks = new Map();
        const buckets = Array.from({ length: mp + 1 }, () => []);
        buckets[0].push(start);
        const tryAttack = (from, cost) => {
            if (cost >= mp) return;
            for (let d = 0; d < 6; d++) {
                const v = G.nb[from * 6 + d];
                if (v < 0 || !this.armyAt[v]) continue;
                const o = this.armies.get(this.armyAt[v]).owner;
                if (o === a || !this.atWar(a, o)) continue;
                // Desde tierra antes que desde el mar (el asalto anfibio solo si no hay otra); entre iguales, el más barato.
                const prev = attacks.get(v);
                if (prev !== undefined) {
                    const better = isLand(prev) !== isLand(from) ? isLand(from) : cost < (exp.get(prev) ?? term.get(prev)).cost;
                    if (!better) continue;
                }
                attacks.set(v, from);
            }
        };
        for (let c = 0; c <= mp; c++) {
            for (const u of buckets[c]) {
                if (exp.get(u).cost !== c) continue;
                tryAttack(u, c);
                const uSea = !isLand(u), hop = exp.get(u).hop;
                for (let d = 0; d < 6; d++) {
                    const v = G.nb[u * 6 + d];
                    if (v < 0) continue;
                    const av = this.armyAt[v];
                    if (av && this.armies.get(av).owner !== a) continue;
                    if (!isLand(v)) {
                        if (hop) continue;   // desde un salto no se sigue por el mar
                        const nc = c + MOVE;
                        if (uSea) {   // embarcado: navega
                            if (nc <= mp && (exp.get(v)?.cost ?? Infinity) > nc) { exp.set(v, { cost: nc, prev: u }); buckets[nc].push(v); }
                            continue;
                        }
                        if (c >= mp) continue;
                        if (!term.has(v)) term.set(v, { cost: mp, prev: u, landing: false, embark: true });
                        // Con movimiento de sobra, cruza: el salto solo sirve para desembarcar o atacar desde él.
                        if (nc < mp && (exp.get(v)?.cost ?? Infinity) > nc) { exp.set(v, { cost: nc, prev: u, hop: true }); buckets[nc].push(v); }
                        continue;
                    }
                    const o = this.owner[v];
                    const hostile = this.atWar(a, o);
                    if (!(o === a || hostile || this.allied(a, o))) continue;
                    if (uSea && !hop) {   // embarcado: desembarca con lo que le quede
                        if (c < mp && !term.has(v)) term.set(v, { cost: mp, prev: u, landing: true });
                        continue;
                    }
                    const walled = hostile && this.fort[v] > 0;   // muro enemigo: cuesta más y detiene la marcha
                    const nc = c + this.stepCost(a, u, d, hostile);
                    if (nc > mp) {
                        if (fresh && mp > 0 && u === start && !uSea && !exp.has(v) && !term.has(v)) term.set(v, { cost: mp, prev: u, landing: false });
                        continue;
                    }
                    if (uSea || walled || this.zoc(v, a)) {
                        if ((term.get(v)?.cost ?? Infinity) > nc) term.set(v, { cost: nc, prev: u, landing: uSea });
                    } else if ((exp.get(v)?.cost ?? Infinity) > nc) {
                        exp.set(v, { cost: nc, prev: u });
                        buckets[nc].push(v);
                    }
                }
            }
        }
        for (const [v, t] of term) if (!t.landing) tryAttack(v, t.cost);
        return { start, mp, exp, term, attacks };
    }

    destinations(r) {
        const out = new Set();
        // En el mar, las casillas de exp son destino solo si se navega desde el mar; los saltos desde tierra no.
        const afloatStart = afloat(r.start);
        for (const v of r.exp.keys()) if (v !== r.start && (isLand(v) || afloatStart)) out.add(v);
        for (const v of r.term.keys()) out.add(v);
        return out;
    }

    entry(r, v) {
        const e = isLand(v) || afloat(r.start) ? r.exp.get(v) : null, t = r.term.get(v);
        if (e && (!t || e.cost <= t.cost)) return { ...e, terminal: false };
        return t ? { ...t, terminal: true } : null;
    }

    moveArmy(army, dest, r) {
        const e = this.entry(r, dest);
        if (!e) return army;
        const path = [dest];
        for (let p = e.prev; p !== r.start; p = r.exp.get(p).prev) path.push(p);
        path.reverse();
        this.note({ kind: 'move', id: army.id, owner: army.owner, type: dominantType(army.units), n: countUnits(army.units), cells: [r.start, ...path] });
        if (this.armyAt[army.cell] === army.id) this.armyAt[army.cell] = 0;
        for (const c of path) {
            army.cell = c;
            if (isLand(c) && this.atWar(army.owner, this.owner[c])) this.capture(c, army.owner, true);
        }
        army.used = e.terminal ? 999 : army.used + e.cost;
        return this.settle(army);
    }

    note(ev) {
        this.motion.push(ev);
        if (this.motion.length > 400) this.motion.splice(0, this.motion.length - 400);
    }

    // Subpuntos que le cuesta a un ejército de `owner` pasar de la casilla u (de tierra o de mar) a su vecina de tierra
    // en la dirección d: terreno o carretera según sus reglas, río, entrada en territorio enemigo y muro del enemigo
    // (que cuesta según su nivel).
    stepCost(owner, u, d, hostile) {
        const v = G.nb[u * 6 + d], r = this.rules(owner), uSea = !isLand(u);
        const roadCls = uSea ? 0 : this.road[u * 6 + d];
        const step = roadCls ? r.roadMove[roadCls] : MOVE * r.terrainCost[CELL_TERRAIN[v]] + (!uSea && RIVER[u * 6 + d] ? r.riverCrossing : 0);
        const walled = hostile && this.fort[v] > 0;
        return step + (hostile ? MOVE / 2 : 0) + (walled ? FORT_FX[this.fort[v]].wallCost : 0);
    }

    attack(army, from, target, r) {
        // Un destacamento que ataca desde su propia casilla aún no está registrado en ella: battle() lo asienta al final.
        if (from !== army.cell) army = this.moveArmy(army, from, r);
        const def = this.armyOn(target);
        if (!def) { this.settle(army); return; }
        this.battle(army, def, target);
    }
    // Ejércitos de `owner` que pueden atacar `target` este turno (está entre sus ataques, les queda movimiento y no han
    // atacado ya), cada uno con la casilla desde la que atacaría y su alcance. Con `ids` (un Set), solo esos.
    jointCandidates(owner, target, ids = null) {
        const out = [];
        for (const a of this.armies.values()) {
            if (a.owner !== owner || a.used >= 999 || (ids && !ids.has(a.id)) || !this.inStrike(a, target)) continue;
            const r = this.reach(owner, a.cell, this.mp(a), a.used === 0), from = r.attacks.get(target);
            if (from !== undefined) out.push({ army: a, from, r });
        }
        return out;
    }
    // ¿Puede quedar `target` al alcance de un ataque de `a` este turno? Cota sin calcular el camino: le queda movimiento y
    // no está más lejos de lo que da el paso más barato (carretera o terreno), más el paso mínimo de un ejército fresco y
    // la casilla del ataque.
    inStrike(a, target) {
        const mp = this.mp(a);
        if (mp <= 0) return false;
        const rl = this.rules(a.owner), step = Math.min(MOVE * Math.min(...Object.values(rl.terrainCost)), ...Object.values(rl.roadMove));
        return hexDist(a.cell, target) <= Math.floor(mp / step) + 2;
    }
    // Factores de un ataque conjunto: cada parte ({ units, from, id }) ataca con su estado, su asalto anfibio si sale del
    // mar y, si cruza un río sin Pontoneros, ÷ CONFIG.RIVER_DEFENSE (lo que hoy es la defensa ×1,25, pero solo para él).
    // El ataque es la suma; la defensa, la de combatFactors sin el río.
    jointFactors(owner, parts, def, cell) {
        const sea = afloat(cell), ignore = this.rules(owner).ignoreRiver;
        const all = parts.map(p => this.combatFactors(owner, p.units, p.from, def, cell, p.id));
        const members = parts.map((p, i) => {
            const d = G.dirTo(p.from, cell), river = !sea && !ignore && d >= 0 && !!RIVER[p.from * 6 + d];
            return { id: p.id, atk: all[i].atk / (river ? CONFIG.RIVER_DEFENSE : 1), attState: all[i].attState, attParts: all[i].attParts, river };
        });
        const f = all[0], fparts = f.parts.filter(([n]) => n !== 'río');
        const raw = fparts.reduce((m, [, x]) => m * x, 1), bonus = Math.min(raw, f.cap);
        return { atk: members.reduce((s, m) => s + m.atk, 0), dfn: Math.max(0.5, f.baseDef * bonus * f.defState.mult),
            baseAtk: all.reduce((s, x) => s + x.baseAtk, 0), baseDef: f.baseDef, parts: fparts, bonus, cap: f.cap, capped: raw > bonus,
            defState: f.defState, members };
    }
    // Ataque de varios ejércitos a la vez ([{ army, from, r }], como jointCandidates). Uno solo ataca como siempre; varios
    // van cada uno a su casilla de ataque y combaten juntos.
    attackJoint(list, target) {
        if (list.length === 1) { const [{ army, from, r }] = list; this.attack(army, from, target, r); return; }
        const atts = [];
        for (const { army, from, r } of list) {
            if (!this.armies.has(army.id)) continue;   // se juntó con otro participante al llegar
            const a = from !== army.cell ? this.moveArmy(army, from, r) : army;
            if (!atts.includes(a)) atts.push(a);
        }
        const def = this.armyOn(target);
        if (!def) { for (const a of atts) this.settle(a); return; }
        if (atts.length === 1) this.battle(atts[0], def, target);
        else this.jointBattle(atts, def, target);
    }

    // Factores de un combate, sin azar: sirven para resolverlo, preverlo y explicarlo.
    // `attId` es el ejército que ataca, para no contarlo como su propio apoyo; `def.id`, el que defiende. Para prever el
    // ataque de una parte de un ejército (attId 0: el resto se queda y sí apoya), `attFrom` es ese ejército, del que la
    // parte se lleva la desorganización, como en split.
    combatFactors(attOwner, attUnits, fromCell, def, cell, attId = 0, attFrom = attId) {
        const sea = afloat(cell), ra = this.rules(attOwner), rd = this.rules(def.owner);
        const terrain = sea ? null : terrainOf(cell), d = G.dirTo(fromCell, cell);
        const parts = [];
        if (sea) parts.push(['embarcado', CONFIG.EMBARKED_DEF]);
        else if (terrain.def > 1) parts.push([terrain.name.toLowerCase(), terrain.def]);
        if (!sea && d >= 0 && RIVER[fromCell * 6 + d] && !ra.ignoreRiver) parts.push(['río', CONFIG.RIVER_DEFENSE]);
        if (!sea && CITY_OF[cell] >= 0) parts.push(['ciudad', CONFIG.CITY_DEFENSE]);
        if (!sea && CAPITAL_OF[cell] >= 0) parts.push(['capital', CONFIG.CAPITAL_DEFENSE]);
        const fx = !sea && this.fort[cell] ? FORT_FX[this.fort[cell]] : null;   // la fortificación, según su nivel
        if (fx) parts.push(['fortificación', fx.fortDefense]);
        const raw = parts.reduce((m, [, x]) => m * x, 1);
        const cap = fx ? fx.fortCap : CONFIG.MAX_DEFENSE_BONUS;
        const bonus = Math.min(raw, cap);
        const attState = this.armyState(attOwner, fromCell, attUnits, attId, attFrom);
        const defState = this.armyState(def.owner, cell, def.units, def.id ?? 0);
        const baseAtk = unitPower(attUnits, 'atk', ra), baseDef = unitPower(def.units, 'def', rd);
        // Desde un barco se ataca con asalto anfibio; un ejército en el mar solo cuenta con el casco (sin terreno ni tope).
        const attParts = afloat(fromCell) ? [['asalto anfibio', ra.amphibious]] : [];
        return { baseAtk, baseDef, parts, bonus, cap, capped: raw > bonus, attState, defState, attParts,
            atk: baseAtk * attState.mult * attParts.reduce((m, [, x]) => m * x, 1), dfn: Math.max(0.5, baseDef * bonus * defState.mult) };
    }
    // Probabilidad de que gane el atacante (cada lado tira un ±20 % de azar).
    winChance(atk, dfn) {
        const N = 40;
        let wins = 0;
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (atk * (0.8 + 0.4 * (i + 0.5) / N) > dfn * (0.8 + 0.4 * (j + 0.5) / N)) wins++;
        return wins / (N * N);
    }
    battle(att, def, cell) {
        const roll = () => 0.8 + this.rng() * 0.4;
        const sea = afloat(cell), p = PROVINCES[sea ? SEA_PROV[cell] : G.prov[cell]];
        const fx = this.combatFactors(att.owner, att.units, att.cell, def, cell, att.id);
        const nA0 = countUnits(att.units), nD0 = countUnits(def.units);
        const from = att.cell;
        this.note({ kind: 'battle', att: att.id, def: def.id, from, cell, attOwner: att.owner, defOwner: def.owner,
            attType: dominantType(att.units), defType: dominantType(def.units), attN: nA0, defN: nD0 });
        const atk = fx.atk * roll();
        const dfn = fx.dfn * roll();
        const attWins = atk > dfn;
        const [w, l] = attWins ? [atk, dfn] : [dfn, atk];
        const winnerLoss = 0.3 * l / w * this.rules(attWins ? att.owner : def.owner).winnerLoss;
        const loserLoss = Math.min(1, 0.35 + 0.35 * (w / l - 1));
        const lostA = this.applyLosses(att.units, attWins ? winnerLoss : loserLoss, attWins);
        const lostD = this.applyLosses(def.units, attWins ? loserLoss : winnerLoss, !attWins);
        att.used = 999;
        let retreatNote = '';
        if (attWins) {
            retreatNote = this.rout(def, cell, sea, p, nD0);
            if (sea) this.settle(att);   // el mar no se ocupa: el atacante se queda donde estaba
            else this.occupy(att, from, cell);
        } else {
            if (countUnits(att.units) === 0) this.removeArmy(att);
            else this.settle(att);
        }
        if (this.involvesPlayer(att.owner, def.owner)) this.log(this.battleReport(att.owner, def.owner, p, fx, atk, dfn, attWins, nA0, nD0, nA0 - countUnits(lostA), nD0 - countUnits(lostD), retreatNote));
    }
    // El defensor vencido deja la casilla: se retira a una vecina propia o aliada libre, se rinde si no la hay o, en el mar
    // sin costa propia al lado, se hunde. Devuelve la coletilla del parte.
    rout(def, cell, sea, p, nD0) {
        this.removeArmy(def);
        const left = countUnits(def.units), retreat = left > 0 ? this.retreatCell(def, cell) : -1;
        if (sea && retreat < 0) {   // sin costa propia a la que arrimarse, el barco vencido se va a pique entero
            if (this.involvesPlayer(def.owner)) this.log(`Hundido frente a ${p.name}: se pierden ${nD0} unidades.`);
            return left > 0 ? '; sus supervivientes se hunden' : '; el barco se hunde';
        }
        if (!left) return '';
        if (retreat < 0) return '; sin sitio para retirarse, sus supervivientes se rinden';
        const joins = !!this.armyOn(retreat);
        this.note({ kind: 'move', id: def.id, owner: def.owner, type: dominantType(def.units), n: left, cells: [cell, retreat] });
        def.cell = retreat; def.used = 999; this.armies.set(def.id, def); this.settle(def);
        return joins ? `; sus ${countUnits(def.units)} supervivientes se retiran y se unen a otro ejército suyo` : '; sus supervivientes se retiran a una casilla vecina';
    }
    // El atacante vencedor entra en la casilla de tierra ganada (desde `from`) y la toma.
    occupy(att, from, cell) {
        if (this.armyAt[att.cell] === att.id) this.armyAt[att.cell] = 0;
        this.note({ kind: 'move', id: att.id, owner: att.owner, type: dominantType(att.units), n: countUnits(att.units), cells: [from, cell] });
        att.cell = cell;
        this.settle(att);
        if (this.owner[cell] !== att.owner) this.capture(cell, att.owner, true);
    }
    // Combate de varios atacantes contra un defensor: como battle, con su ataque sumado (jointFactors) y una sola tirada
    // por bando. Todos pierden la misma fracción y gastan el turno; si ganan, entra el de más ataque que esté en tierra
    // (ninguno si todos salen del mar o la casilla es de mar) y los demás se quedan donde están.
    jointBattle(atts, def, cell) {
        const roll = () => 0.8 + this.rng() * 0.4;
        const owner = atts[0].owner, sea = afloat(cell), p = PROVINCES[sea ? SEA_PROV[cell] : G.prov[cell]];
        const fx = this.jointFactors(owner, atts.map(a => ({ units: a.units, from: a.cell, id: a.id })), def, cell);
        const n0 = atts.map(a => countUnits(a.units)), nA0 = n0.reduce((s, n) => s + n, 0), nD0 = countUnits(def.units);
        const strongest = list => list.reduce((b, i) => (b < 0 || fx.members[i].atk > fx.members[b].atk ? i : b), -1);
        const idx = atts.map((_, i) => i), li = sea ? -1 : strongest(idx.filter(i => !afloat(atts[i].cell)));
        const lead = li >= 0 ? atts[li] : null, head = atts[li >= 0 ? li : strongest(idx)], from = head.cell;
        const total = emptyUnits();
        for (const a of atts) for (const k of UNIT_KEYS) total[k] += a.units[k] || 0;
        this.note({ kind: 'battle', att: head.id, def: def.id, from, cell, attOwner: owner, defOwner: def.owner,
            attType: dominantType(total), defType: dominantType(def.units), attN: nA0, defN: nD0, joint: atts.map(a => a.id) });
        const atk = fx.atk * roll();
        const dfn = fx.dfn * roll();
        const attWins = atk > dfn;
        const [w, l] = attWins ? [atk, dfn] : [dfn, atk];
        const winnerLoss = 0.3 * l / w * this.rules(attWins ? owner : def.owner).winnerLoss;
        const loserLoss = Math.min(1, 0.35 + 0.35 * (w / l - 1));
        let lostA = 0;
        for (const a of atts) lostA += countUnits(this.applyLosses(a.units, attWins ? winnerLoss : loserLoss, attWins));
        const lostD = this.applyLosses(def.units, attWins ? loserLoss : winnerLoss, !attWins);
        for (const a of atts) a.used = 999;
        let retreatNote = '';
        if (attWins) {
            retreatNote = this.rout(def, cell, sea, p, nD0);
            for (const a of atts) if (a !== lead) this.settle(a);
            if (lead) this.occupy(lead, from, cell);
        } else {
            for (const a of atts) { if (countUnits(a.units) === 0) this.removeArmy(a); else this.settle(a); }
        }
        if (this.involvesPlayer(owner, def.owner)) {
            const who = `${atts.length} ejércitos (${n0.slice(0, -1).join(', ')} y ${n0[n0.length - 1]} unidades)`;
            this.log(this.battleReport(owner, def.owner, p, fx, atk, dfn, attWins, nA0, nD0, nA0 - lostA, nD0 - countUnits(lostD), retreatNote, who));
        }
    }
    // Parte de combate para el registro, contado desde el lado del jugador.
    // En un ataque conjunto, `who` dice quiénes atacan («3 ejércitos (30, 30 y 30 unidades)») y el ataque es la suma de
    // cada uno, con su estado (y ÷1,25 el que cruza un río).
    battleReport(a, d, p, fx, atk, dfn, attWins, nA0, nD0, nA1, nD1, retreatNote, who = null) {
        const num = x => String(Math.round(x * 100) / 100).replace('.', ',');
        const state = s => s.parts.map(([n, x]) => ` ×${num(x)} ${n}`).join('');
        const factors = fx.parts.map(([n, x]) => ` ×${num(x)} ${n}`).join('') + (fx.capped ? ` (tope ×${num(fx.cap)})` : '') + state(fx.defState);
        let atkTxt;
        if (fx.members) {
            const one = m => { const s = state({ parts: [...m.attState.parts, ...m.attParts] }) + (m.river ? ` ÷${num(CONFIG.RIVER_DEFENSE)} río` : ''); return s ? `${Math.round(m.atk)} (${s.trim()})` : `${Math.round(m.atk)}`; };
            atkTxt = `${fx.members.map(one).join(' + ')} = ${Math.round(fx.atk)}`;
        } else {
            const attParts = { parts: [...fx.attState.parts, ...fx.attParts] };
            atkTxt = `${Math.round(fx.baseAtk)}${state(attParts)}${attParts.parts.length ? ` = ${Math.round(fx.atk)}` : ''}`;
        }
        const defTxt = `${Math.round(fx.baseDef)}${factors}${factors ? ` = ${Math.round(fx.dfn)}` : ''}`;
        const luck = `con el azar, ${Math.round(atk)} contra ${Math.round(dfn)}`;
        const force = who ?? `${nA0} unidades`;
        if (a === this.player) {
            return `Atacas ${p.name} (${this.nm(d)}) con ${force} contra ${nD0}. Tu ataque ${atkTxt} contra su defensa ${defTxt}; ${luck}. ` +
                `${attWins ? 'VICTORIA' : 'DERROTA'}: te quedan ${nA1} y a ${this.nm(d)} ${nD1}${attWins ? retreatNote : ''}.`;
        }
        return `${this.nm(a)} ataca ${p.name} con ${force} contra tus ${nD0}. Su ataque ${atkTxt} contra tu defensa ${defTxt}; ${luck}. ` +
            `${attWins ? `PIERDES la posición: te quedan ${nD1}${retreatNote.replace('sus', 'tus').replace('suyo', 'tuyo')}` : `RESISTES: te quedan ${nD1}`} y a ${this.nm(a)} ${nA1}.`;
    }

    retreatCell(army, from) {
        for (let d = 0; d < 6; d++) {
            const j = G.nb[from * 6 + d];
            if (j >= 0 && isLand(j) && !this.armyAt[j] && (this.owner[j] === army.owner || this.allied(army.owner, this.owner[j]))) return j;
        }
        return -1;
    }

    applyLosses(units, frac, keepOne) {
        const before = copyUnits(units), lost = emptyUnits();
        for (const k of UNIT_KEYS) {
            if (k === 'antiair' && !units[k]) continue;   // sin antiaéreas no tira: las tiradas de siempre no cambian
            lost[k] = Math.min(units[k], Math.floor(units[k] * frac + this.rng()));
            units[k] -= lost[k];
        }
        if (keepOne && countUnits(units) === 0) {
            const k = UNIT_KEYS.find(t => before[t] > 0);
            if (k) { units[k] = 1; lost[k]--; }
        }
        return lost;
    }

    // Tomar la ciudad de una provincia entrega toda la provincia, salvo donde aún resisten tropas del anterior dueño
    // o una fortificación terminada. `byForce`: la casilla la ocupan tropas (se cortan carreteras y muros).
    capture(cell, a, byForce = false) {
        const prev = this.owner[cell];
        if (prev === a) return;
        // Liberar tierra ocupada de un país con el que no se está en guerra se la devuelve a su dueño:
        // solo se queda (en disputa) lo que es de un enemigo.
        const holder = c => (this.legal[c] !== a && !this.atWar(a, this.legal[c]) ? this.legal[c] : a);
        this.owner[cell] = holder(cell);
        this.version++;
        this.loseAirfield(cell);   // antes de que la ciudad quede asediada: el aeródromo cae al entrar
        this.loseAASite(cell);     // y el antiaéreo, igual
        this.sieges.delete(cell);
        if (byForce) this.wreck(cell, prev, a);
        const res = RESOURCE_AT.get(cell);
        if (res && this.involvesPlayer(a, prev)) this.log(`${this.nm(a)} se hace con ${res.typeName.toLowerCase()} de ${res.name}.`);
        const pid = CITY_OF[cell];
        if (pid < 0) return;
        const p = PROVINCES[pid];
        // Una ciudad ajena no cae al entrar: hay que mantener tropas en ella SIEGE_TURNS turnos (recuperar la propia es inmediato).
        if (byForce && prev >= 0 && this.owner[cell] === a && this.legal[cell] !== a) {
            this.sieges.set(cell, { by: a, prev, held: 0 });
            if (this.involvesPlayer(a, prev, this.legal[cell])) {
                this.log(`${this.nm(a)} asedia ${p.cityName} (${p.name}): debe mantener sus tropas allí ${this.rules(a).siegeTurns} turnos para tomarla.`);
            }
            return;
        }
        this.completeCity(cell, a, prev, byForce);
    }

    // La ciudad cae: su provincia pasa al vencedor (salvo donde resisten tropas o muros), se saquea y pierde desarrollo.
    completeCity(cell, a, prev, byForce) {
        const p = PROVINCES[CITY_OF[cell]], pid = p.id;
        const holder = c => (this.legal[c] !== a && !this.atWar(a, this.legal[c]) ? this.legal[c] : a);
        if (byForce && this.dev[pid]) { this.dev[pid] = Math.floor(this.dev[pid] * CONFIG.DEV_WAR_DAMAGE); this.devVersion++; }
        for (const c of p.cells) {
            if (this.owner[c] !== prev) continue;
            const ar = this.armyOn(c);
            if ((!ar || ar.owner !== prev) && !this.fort[c]) {
                this.owner[c] = holder(c);
                if (byForce) this.loseAirfield(c);   // un aeródromo fuera de la ciudad cae con ella, como el de la ciudad
            }
        }
        if (byForce && prev >= 0) this.plunder(a, prev, p);
        if (CAPITAL_OF[cell] >= 0 || this.involvesPlayer(a, prev)) {
            this.log(`${this.nm(a)} toma ${p.cityName} (${p.name})${CAPITAL_OF[cell] >= 0 ? `, capital de ${this.nm(CAPITAL_OF[cell])}` : ''}.`);
        }
        this.checkElimination(prev, a);
        this.checkGameOver();
    }

    // Saqueo: quien toma una ciudad se lleva parte del tesoro del defensor, más cuanto más pesa la provincia en
    // su renta (y mucho si es la capital), y unos turnos de producción de los yacimientos de la provincia.
    plunder(a, prev, p) {
        const victim = this.nations[prev];
        if (victim.gold <= 0) return;
        const value = p.value * (1 + this.dev[p.id] / 1000);
        let share = Math.min(CONFIG.LOOT_MAX, CONFIG.LOOT_FACTOR * value / Math.max(1, this.economy(prev).total + value));
        if (CAPITAL_OF[p.city] === prev) share = Math.max(share, CONFIG.LOOT_CAPITAL);
        const fromMines = RESOURCES.filter(r => r.province === p.id).reduce((s, r) => s + r.value * CONFIG.LOOT_RESOURCE_TURNS, 0);
        const loot = Math.min(victim.gold, Math.round(victim.gold * share) + fromMines);
        if (loot <= 0) return;
        victim.gold -= loot;
        this.nations[a].gold += loot;
        if (a === this.player) this.log(`Saqueas ${loot} de oro en ${p.cityName}.`);
        else if (prev === this.player) this.log(`${this.nm(a)} te saquea ${loot} de oro en ${p.cityName}.`);
    }

    checkElimination(id, captor) {
        const n = this.nations[id];
        if (!n.alive || PROVINCES.some(p => this.owner[p.city] === id || this.sieges.get(p.city)?.prev === id)) return;   // una ciudad asediada aún es suya
        n.alive = false;
        for (const [c, s] of [...this.sieges]) if (s.by === id || s.prev === id) this.sieges.delete(c);
        // Lo que tenía pasa al conquistador; lo que ocupaba de un tercero vuelve a su dueño si el conquistador no está en guerra con él.
        for (const i of G.land) {
            if (this.owner[i] !== id) continue;
            const l = this.legal[i];
            this.owner[i] = l !== id && this.nations[l].alive && !this.atWar(captor, l) ? l : captor;
        }
        for (const i of G.land) if (this.legal[i] === id) this.legal[i] = this.owner[i];   // lo que era suyo pasa a quien lo ocupa
        for (const s of this.nations) if (s.overlord === id) s.overlord = -1;
        n.overlord = -1;
        this.blocsChanged();
        for (const a of [...this.armies.values()]) if (a.owner === id) this.removeArmy(a);
        for (const op of this.opsOf(id)) this.endOp(op);
        if (this.sats.some(s => s.owner === id)) { this.sats = this.sats.filter(s => s.owner !== id); this.airVersion++; }   // sin nadie que los use
        for (const o of this.nations) if (o.id !== id) Object.assign(this.rel(id, o.id), { state: 'paz' });
        this.warVersion++;
        for (const b of this.blocsOf(id)) this.leaveBloc(b, id);
        this.proposals = this.proposals.filter(p => p.from !== id && p.against !== id);
        this.version++;
        this.log(`${n.name} HA SIDO ELIMINADA por ${this.nm(captor)}.`);
    }

    checkGameOver() {
        if (this.over || this.player === null) return;
        const p = this.player;
        if (!this.nations[p].alive) {
            this.over = true; this.won = false;
            this.log("DERROTA: tu nación ha caído.");
            return;
        }
        const lands = this.landCounts();
        const share = [p, ...this.satellitesOf(p)].reduce((s, x) => s + lands[x], 0) / G.land.length;
        if (share >= this.settings.victory || this.nations.every(n => n.id === p || !n.alive || n.overlord === p)) {
            this.over = true; this.won = true;
            this.log(`VICTORIA: ${MAP.it[0].toUpperCase() + MAP.it.slice(1)} está bajo tu mando.`);
        }
    }

    // --- Niebla de guerra y espionaje ---
    // Casillas que ve la nación: su territorio y el de sus aliados con una franja alrededor, el entorno de sus
    // ejércitos y los de sus aliados, las provincias de las que un espía ha informado este turno y los blancos de sus
    // misiones aéreas de este turno y el círculo de sus satélites. Lanzar uno, o que se acabe, cambia airVersion.
    visibleCells(id) {
        const key = `${id}:${this.version}:${this.armyVersion}:${this.blocVersion}:${this.turn}:${this.spyVersion}:${this.techVersion}:${this.airVersion}`;
        if (this.visCache?.key === key) return this.visCache.map;
        const rules = this.rules(id), R = Math.max(rules.visionTerritory, rules.visionArmy);
        const range = new Int8Array(G.N).fill(-1);
        const buckets = Array.from({ length: R + 1 }, () => []);
        const seed = (c, r) => { if (range[c] < r) { range[c] = r; buckets[r].push(c); } };
        const friend = o => o === id || this.allied(id, o);
        for (const i of G.land) if (friend(this.owner[i])) seed(i, rules.visionTerritory);
        for (const a of this.armies.values()) if (friend(a.owner)) seed(a.cell, rules.visionArmy);
        for (let r = R; r > 0; r--) {
            for (const u of buckets[r]) {
                if (range[u] !== r) continue;
                for (let d = 0; d < 6; d++) {
                    const v = G.nb[u * 6 + d];
                    if (v < 0 || range[v] >= r - 1) continue;
                    range[v] = r - 1;
                    buckets[r - 1].push(v);
                }
            }
        }
        const map = new Uint8Array(G.N);
        for (let i = 0; i < G.N; i++) if (range[i] >= 0) map[i] = 1;
        if (id === this.player) for (const pid of this.spiedProvinces()) for (const c of PROVINCES[pid].cells) map[c] = 1;
        for (const [k, t] of this.airSeen) if (t === this.turn && Math.floor(k / G.N) === id) map[k % G.N] = 1;
        for (const s of this.sats) if (s.owner === id) for (const c of hexDisc(s.cell, this.satRadius(id))) map[c] = 1;   // solo los suyos
        this.visCache = { key, map };
        return map;
    }
    sees(id, cell) { return !this.settings.fog || id === null || this.visibleCells(id)[cell] === 1; }

    // Provincias de las que un espía del jugador ha informado este turno; con Agentes dobles, también sus vecinas del
    // mismo país.
    spiedProvinces() {
        const key = `${this.turn}:${this.spyVersion}:${this.techVersion}:${this.version}`;
        if (this.spiedCache?.key === key) return this.spiedCache.set;
        const set = new Set(), wide = this.player !== null && this.rules(this.player).spyWide;
        for (const [pid, s] of this.spies) {
            if (s.revealedTurn !== this.turn) continue;
            set.add(pid);
            const o = this.owner[PROVINCES[pid].city];
            if (wide) for (const q of PROVINCE_NEIGHBORS[pid]) if (this.owner[PROVINCES[q].city] === o) set.add(q);
        }
        this.spiedCache = { key, set };
        return set;
    }
    // Qué sabe `viewer` de las tropas y muros de `owner` en `cell`: tipo y número (exact) y niveles (galones y
    // fortificación). Sin niebla, de lo propio y de los aliados, todo; si no, depende de Reconocimiento, de los espías y
    // de las misiones aéreas de este turno, que desvelan el tipo y el número de lo que hay en su blanco, y de sus
    // satélites, que desvelan tipo y número en su círculo y, con Óptica de alta resolución (satLevels), también niveles.
    intel(viewer, owner, cell) {
        if (!this.settings.fog || viewer === null || owner === viewer || owner < 0 || this.allied(viewer, owner)) return { exact: true, levels: true };
        const r = this.rules(viewer), sat = this.sats.length > 0 && this.satCovers(viewer, cell);
        if (viewer === this.player && this.spiedProvinces().has(SEA_PROV[cell])) return { exact: true, levels: r.spyWide || r.intelLevels || (sat && r.satLevels) };
        if (sat) return { exact: true, levels: r.intelLevels || r.satLevels };
        if (this.airSeen.get(viewer * G.N + cell) === this.turn) return { exact: true, levels: r.intelLevels };   // una misión suya, este turno
        return { exact: r.intelExact, levels: r.intelLevels };
    }
    // Cómo ve `viewer` un ejército: tipo y unidades si los conoce (si no, solo el escalón) y galones si conoce los niveles.
    armyView(viewer, a) {
        const k = this.intel(viewer, a.owner, a.cell), n = countUnits(a.units), type = dominantType(a.units);
        return { type: k.exact ? type : null, n: k.exact ? n : null, echelon: echelonOf(n).mark, level: k.levels ? this.techLevel(a.owner, UNIT_BRANCH[type]) : null };
    }
    // Nivel de la fortificación de una casilla (0 a 3, como FORT_LEVELS), si `viewer` lo conoce (null si no). En una
    // casilla sin fortificación, el de una nueva de su dueño.
    fortLevel(viewer, cell) {
        const o = this.owner[cell];
        if (!this.intel(viewer, o, cell).levels) return null;
        return (this.fort[cell] || this.fortMax(o)) - 1;
    }
    // ¿Sabe `viewer` qué investiga `id`? Sin niebla sí; si no, con un espía que informe desde su capital o, con
    // Agentes dobles, desde cualquier provincia suya.
    knowsResearch(viewer, id) {
        if (!this.settings.fog || viewer === id || this.allied(viewer, id)) return true;
        if (viewer !== this.player) return false;
        const wide = this.rules(viewer).spyWide;
        return [...this.spiedProvinces()].some(pid => this.owner[PROVINCES[pid].city] === id && (wide || CAPITAL_OF[PROVINCES[pid].city] === id));
    }

    spyOdds(pid) {
        const p = PROVINCES[pid], s = this.spies.get(pid), r = this.rules(this.player);
        const hard = CAPITAL_OF[p.city] >= 0 || this.fort[p.city] > 0;
        const turns = s ? this.turn - s.since : 0;
        return {
            success: hard ? r.spySuccessHard : r.spySuccess,
            caught: Math.min(r.spyCatchMax, (r.spyCatchBase + r.spyCatchPerTurn * turns) * (hard ? 1.5 : 1))
        };
    }
    canSpy(pid) {
        const o = this.owner[PROVINCES[pid].city];
        return !!this.settings.fog && this.player !== null && o !== this.player && !this.allied(this.player, o) && !this.spies.has(pid);
    }
    // El espía intenta informar: si lo consigue, la provincia queda a la vista hasta el turno siguiente.
    spyReport(pid) {
        const s = this.spies.get(pid), p = PROVINCES[pid];
        if (this.rng() < this.spyOdds(pid).success) {
            s.revealedTurn = this.turn;
            const units = emptyUnits();
            for (const c of p.cells) {
                const a = this.armyOn(c);
                if (a && a.owner !== this.player && !this.allied(this.player, a.owner)) for (const k of UNIT_KEYS) units[k] += a.units[k] || 0;
            }
            let extra = '';
            if (this.rules(this.player).spyWide) {   // Agentes dobles: también muros e investigación
                const o = this.owner[p.city], t = this.nations[o].tech;
                const forts = p.cells.filter(c => this.fort[c]), top = Math.max(0, ...forts.map(c => this.fort[c]));
                if (forts.length) extra += ` ${plural(forts.length, 'casilla fortificada', 'casillas fortificadas')} (${forts.length > 1 ? 'la más fuerte, con' : 'con'} ${FORT_LEVELS[top - 1]}).`;
                extra += t.current.length ? ` ${this.nm(o)} investiga ${t.current.map(x => `${TECH_BY_ID.get(x).name} (faltan ${this.techTurns(o, x) - this.techProgress(o, x)})`).join(' y ')}.`
                    : ` ${this.nm(o)} no investiga nada ahora.`;
            }
            this.log(`Tu espía en ${p.name} informa: ${countUnits(units) ? unitWords(units) : 'no hay tropas enemigas'}.${extra}`);
        } else {
            this.log(`Tu espía en ${p.name} no consigue información este turno.`);
        }
        this.spyVersion++;
    }
    // Al empezar cada turno del jugador: los espías pueden ser capturados y, si no, vuelven a informar.
    spyTurn() {
        for (const [pid, s] of [...this.spies]) {
            const p = PROVINCES[pid], o = this.owner[p.city];
            if (o === this.player || this.allied(this.player, o)) {
                this.spies.delete(pid);
                this.log(`Tu espía vuelve de ${p.name}: la provincia ya está en manos amigas.`);
                continue;
            }
            if (this.rng() < this.spyOdds(pid).caught) {
                this.spies.delete(pid);
                this.log(`${this.nm(o)} ha capturado a tu espía en ${p.name}.`);
                continue;
            }
            this.spyReport(pid);
        }
        this.spyVersion++;
    }
    playerSendSpy(pid) {
        if (this.over || !this.canSpy(pid)) return;
        const n = this.nations[this.player], p = PROVINCES[pid];
        const cost = this.rules(this.player).spyCost;
        if (n.gold < cost) { this.log(`No tienes oro para un espía (cuesta ${cost}).`); return; }
        n.gold -= cost;
        this.spies.set(pid, { since: this.turn, revealedTurn: -1 });
        this.log(`Envías un espía a ${p.name} (${this.nm(this.owner[p.city])}).`);
        this.spyReport(pid);
    }
    playerRecallSpy(pid) {
        if (!this.spies.delete(pid)) return;
        this.spyVersion++;
        this.log(`Retiras a tu espía de ${PROVINCES[pid].name}.`);
    }

    // --- Investigación ---
    // Reglas de la nación: las de CONFIG con lo que ha investigado encima.
    rules(id) {
        const c = this.rulesCache[id];
        if (c && c.v === this.techVersion) return c.r;
        const r = baseRules(), done = this.nations[id].tech.done;
        for (const t of TECHS) if (done.has(t.id)) mergeFx(r, t.fx);
        this.rulesCache[id] = { v: this.techVersion, r };
        return r;
    }
    techLevel(id, branch) { const d = this.nations[id].tech.done; return d.has(`${branch}3`) ? 3 : d.has(`${branch}2`) ? 2 : d.has(`${branch}1`) ? 1 : 0; }
    techTurns(id, techId) { return Math.max(1, Math.round(CONFIG.RESEARCH.TURNS[TECH_BY_ID.get(techId).tier - 1] * this.rules(id).researchTurns)); }
    techProgress(id, techId) { return Math.min(this.nations[id].tech.progress.get(techId) ?? 0, this.techTurns(id, techId) - 1); }
    // Oro de una investigación: turnos de renta según el nivel, un 10 % más por cada una ya terminada.
    researchCost(id, techId) {
        const R = CONFIG.RESEARCH, i = TECH_BY_ID.get(techId).tier - 1;
        const base = Math.max(R.COST_MIN[i], this.income(id) * R.COST_TURNS[i]);
        return Math.round(base * (1 + R.COST_GROWTH * this.nations[id].tech.done.size) * this.rules(id).researchCost);
    }
    techState(id, techId) {
        const s = this.nations[id].tech, t = TECH_BY_ID.get(techId);
        if (s.done.has(techId)) return 'done';
        if (s.current.includes(techId)) return 'current';
        if (s.progress.has(techId)) return 'paused';
        if (t.tier > 1 && !s.done.has(`${t.branch}${t.tier - 1}`)) return 'locked';
        return 'open';
    }
    // Empieza (pagando) o reanuda (gratis) una investigación. Sin laboratorio libre, la más antigua en curso queda en pausa.
    startResearch(id, techId) {
        const t = TECH_BY_ID.get(techId), n = this.nations[id], s = n.tech;
        if (!t || this.over) return false;
        const st = this.techState(id, techId);
        if (st === 'open') {
            const cost = this.researchCost(id, techId);
            if (n.gold < cost) return false;
            n.gold -= cost;
            s.progress.set(techId, 0);
            if (id === this.player) this.log(`Empiezas a investigar ${t.name} (${cost} oro, ${plural(this.techTurns(id, techId), 'turno', 'turnos')}).`);
        } else if (st === 'paused') {
            if (id === this.player) this.log(`Reanudas ${t.name}.`);
        } else return false;
        if (s.current.length >= this.rules(id).labs) {
            const old = s.current.shift();
            if (id === this.player) this.log(`${TECH_BY_ID.get(old).name} queda en pausa.`);
        }
        s.current.push(techId);
        return true;
    }
    pauseResearch(id, techId) {
        const s = this.nations[id].tech;
        if (!s.current.includes(techId)) return;
        s.current = s.current.filter(x => x !== techId);
        if (id === this.player) this.log(`${TECH_BY_ID.get(techId).name} queda en pausa.`);
    }
    // Al empezar el turno de la nación, cada investigación en curso avanza un turno.
    advanceResearch(id) {
        const s = this.nations[id].tech;
        for (const techId of [...s.current]) {
            const p = (s.progress.get(techId) ?? 0) + 1;
            if (p < this.techTurns(id, techId)) { s.progress.set(techId, p); continue; }
            s.progress.delete(techId);
            s.current = s.current.filter(x => x !== techId);
            s.done.add(techId);
            this.techVersion++;
            const t = TECH_BY_ID.get(techId);
            if (t.branch === 'fortificacion') {   // sus fortificaciones intactas pasan al nivel nuevo; las dañadas, no
                for (const c of G.land) if (this.fort[c] === t.tier && this.owner[c] === id) this.fort[c] = t.tier + 1;
                this.fortVersion++;
            }
            if (id === this.player) this.log(`Investigación terminada: ${TECH_BY_ID.get(techId).name}.`);
        }
    }

    // --- Reclutamiento ---
    // Coste de una unidad para una nación: sus yacimientos abaratan el material.
    // Coste de una unidad reclutada en la provincia `pid`: la abaratan los yacimientos que abastecen a esa provincia.
    unitCost(id, type, pid = -1) {
        const list = pid >= 0 ? this.economy(id).access.get(pid) ?? [] : [];
        const byType = {};
        for (const r of list) byType[r.type] = (byType[r.type] ?? 0) + 1;
        let disc = 0;
        const r = this.rules(id);
        for (const [k, v] of Object.entries(CONFIG.RESOURCE_DISCOUNT[type])) disc += v * (byType[k] ?? 0) * r.discountMult;
        return Math.round(CONFIG.TYPES[type].cost * (1 - Math.min(r.maxDiscount, disc)));
    }
    // Cupo de reclutamiento por turno de una provincia: crece con su población, su desarrollo, sus conexiones y los
    // yacimientos que la abastecen, y es mayor en la capital.
    recruitBreakdown(nation, p) {
        const e = this.economy(nation);
        const parts = [['población', p.recruitCap]];
        const dev = Math.floor(this.dev[p.id] / 250);
        if (dev) parts.push(['desarrollo', dev]);
        if (e.connected.has(p.id)) parts.push(['carretera a la capital', 1]);
        const r = this.rules(nation);
        if (r.recruitAll) parts.push(['investigación', r.recruitAll]);
        if ([0, 1, 2, 3, 4, 5].some(d => this.road[p.city * 6 + d] === 2)) parts.push(['autopista', r.highwayRecruit]);
        const mines = Math.floor((e.access.get(p.id)?.length ?? 0) / 2);
        if (mines) parts.push(['yacimientos', mines]);
        if (CAPITAL_OF[p.city] === nation) parts.push(['capital', r.capitalRecruit]);
        if (r.recruitMult > 1) {
            const sum = parts.reduce((s, [, n]) => s + n, 0);
            parts.push(['movilización general', Math.floor(sum * r.recruitMult) - sum]);
        }
        return parts;
    }
    recruitCap(nation, p) { return this.recruitBreakdown(nation, p).reduce((s, [, n]) => s + n, 0); }
    recruitLeft(nation, p) { return this.recruitCap(nation, p) - (this.nations[nation].recruited.get(p.id) ?? 0); }
    canRecruitAt(nation, p) {
        const ar = this.armyOn(p.city);
        return this.owner[p.city] === nation && this.legal[p.city] === nation && (!ar || ar.owner === nation) && this.recruitLeft(nation, p) > 0;
    }
    // Tropas que puede reclutar `id`: la Antiaérea, solo con Defensa aérea 3.
    recruitTypes(id) { return UNIT_KEYS.filter(k => k !== 'antiair' || this.rules(id).mobileAA); }
    recruit(nation, p, type) {
        if (!Object.hasOwn(CONFIG.TYPES, type) || (type === 'antiair' && !this.rules(nation).mobileAA)) return false;
        const n = this.nations[nation], cost = this.unitCost(nation, type, p.id);
        if (n.gold < cost || !this.canRecruitAt(nation, p)) return false;
        n.gold -= cost;
        n.recruited.set(p.id, (n.recruited.get(p.id) ?? 0) + 1);
        const units = emptyUnits(); units[type] = 1;
        this.settle(this.newArmy(nation, p.city, units, 999));   // los reclutas no se mueven este turno
        return true;
    }

    // --- Turnos ---
    start(playerId) {
        this.player = playerId;
        this.log(`Asumes el mando de ${this.nm(playerId)}. IA ${this.ai.name.toLowerCase()}, alianzas ${this.settings.alliances}.`);
        this.beginNationTurn(playerId);
    }

    beginNationTurn(id) {
        this.airSweep();
        this.nations[id].lastTurn = this.turn;
        this.airTurn(id);
        for (const a of this.armies.values()) if (a.owner === id) a.used = 0;
        this.feedArmies(id);
        this.advanceResearch(id);
        // Obras de fortificación: la nueva termina al nivel máximo de su dueño; la reparación sube un nivel y no avanza
        // con el enemigo al lado. Las dos se pierden si la casilla cambia de dueño.
        let done = 0, raised = 0;
        for (const [c, w] of this.fortWork) {
            if (w.owner !== id) continue;
            if (this.owner[c] !== id || (w.up && !this.fort[c])) { this.fortWork.delete(c); this.fortVersion++; continue; }
            if (w.up && this.repairBlocked(id, c, c)) continue;
            if (--w.left > 0) continue;
            this.fortWork.delete(c);
            if (w.up) { this.fort[c] = Math.min(this.fortMax(id), this.fort[c] + 1); raised++; }
            else { this.fort[c] = this.fortMax(id); done++; }
        }
        if (done || raised) {
            this.fortVersion++;
            if (id === this.player && done) this.log(`Fortificación terminada en ${done} casilla${done > 1 ? 's' : ''}.`);
            if (id === this.player && raised) this.log(`Fortificación reparada en ${raised} casilla${raised > 1 ? 's' : ''}.`);
        }
        let fixed = 0, dropped = 0;
        for (const [key, w] of [...this.roadWork]) {
            if (w.owner !== id) continue;
            const u = Math.floor(key / 6), d = key % 6, v = G.nb[u * 6 + d];
            if (this.owner[u] !== id || this.owner[v] !== id || !this.broken[u * 6 + d]) { this.roadWork.delete(key); dropped++; continue; }
            if (this.repairBlocked(id, u, v)) continue;
            if (--w.left <= 0) {
                this.road[u * 6 + d] = w.cls; this.road[v * 6 + (d + 3) % 6] = w.cls;
                this.broken[u * 6 + d] = 0; this.broken[v * 6 + (d + 3) % 6] = 0;
                this.roadWork.delete(key); fixed++;
            }
        }
        if (fixed || dropped) this.roadVersion++;   // la obra que se cae también deja de pintarse
        if (fixed && id === this.player) this.log(`Reparados ${plural(fixed, 'tramo', 'tramos')} de carretera.`);
        this.nations[id].recruited.clear();
        if (id === this.player) this.spyTurn();
        for (const [cell, s] of [...this.sieges]) {
            if (s.by !== id) continue;
            if (this.owner[cell] !== id) { this.sieges.delete(cell); continue; }
            const ar = this.armyOn(cell);
            if (!ar || ar.owner !== id) { s.held = 0; continue; }   // sin tropas encima, el asedio no avanza
            if (++s.held >= this.rules(id).siegeTurns) { this.sieges.delete(cell); this.completeCity(cell, id, s.prev, true); }
            if (this.over) return 0;
        }
        const econ = this.economy(id);
        let grew = false;
        for (const p of PROVINCES) {
            if (this.owner[p.city] !== id || this.legal[p.city] !== id) continue;
            const linked = econ.connected.has(p.id);
            const max = linked ? CONFIG.DEV_MAX_CONNECTED : CONFIG.DEV_MAX;
            if (this.dev[p.id] >= max) continue;
            this.dev[p.id] = Math.min(max, this.dev[p.id] + (linked ? CONFIG.DEV_GROWTH_CONNECTED : CONFIG.DEV_GROWTH));
            grew = true;
        }
        if (grew) this.devVersion++;
        const inc = this.income(id);
        this.nations[id].gold += inc;
        return inc;
    }

    // El fin de turno en tres pasos, para que la interfaz pueda enseñar la jugada de cada país (el resultado es el mismo).
    endTurn() {
        if (!this.beginAiPhase()) return;
        for (const id of this.aiOrder()) this.aiStep(id);
        this.finishAiPhase();
    }
    beginAiPhase() {
        if (this.over || this.player === null) return false;
        this.executeOrders(this.player);   // lo que quede de las órdenes del jugador, antes de que jueguen los demás
        if (this.over) return false;
        for (const p of [...this.proposals]) this.answerProposal(this.proposals.indexOf(p), false, true);
        this.proposals = [];
        this.alerts = [];
        return true;
    }
    aiOrder() {
        const out = [];
        for (let i = 1; i < this.nations.length; i++) out.push((this.player + i) % this.nations.length);
        return out;
    }
    aiStep(id) {
        if (this.over || !this.nations[id].alive) return false;
        this.beginNationTurn(id);
        this.aiTurn(id);
        return true;
    }
    finishAiPhase() {
        if (this.over) return;
        this.turn++;
        this.proposedThisTurn.clear();
        const inc = this.beginNationTurn(this.player);
        this.log(`— TURNO ${this.turn} — Ingresos: +${inc}g`);
    }

    // --- Diplomacia ---
    declareWar(a, b) {
        const r = this.rel(a, b);
        if (r.state === 'guerra' || this.turn < r.truceUntil || !this.nations[b].alive || a === b) return false;
        if (this.nations[a].overlord === b || this.nations[b].overlord === a) return false;   // ni el satélite ni su señor se atacan
        for (const bl of this.sharedBlocs(a, b)) this.leaveBloc(bl, a, ` por atacar a ${this.nm(b)}`);
        Object.assign(r, { state: 'guerra', since: this.turn });
        this.log(`${this.nm(a)} DECLARA LA GUERRA a ${this.nm(b)}.`);
        if (b === this.player) this.alerts.push({ kind: 'war', from: a });
        const joined = [], handled = new Set([a, b]);
        for (const bl of this.blocsOf(b)) {
            for (const c of [...bl.members]) {
                if (handled.has(c) || !this.nations[c].alive || this.atWar(c, a)) continue;
                handled.add(c);
                this.reveal(bl);
                if (c === this.player) { this.proposals.push({ kind: 'llamada', from: b, against: a }); continue; }
                for (const bl2 of this.sharedBlocs(c, a)) this.leaveBloc(bl2, c, ` para defender a ${this.nm(b)}`);
                Object.assign(this.rel(c, a), { state: 'guerra', since: this.turn });
                joined.push(this.nm(c));
                if (a === this.player) this.alerts.push({ kind: 'joined', from: c, defending: b });
            }
        }
        if (joined.length) this.log(`En defensa de ${this.nm(b)} entran en guerra contra ${this.nm(a)}: ${joined.join(', ')}.`);
        for (const s of this.nations) {
            if (!s.alive || s.overlord < 0 || handled.has(s.id)) continue;
            const side = s.overlord === a ? a : s.overlord === b ? b : -1;
            if (side < 0) continue;
            const foe = side === a ? b : a;
            handled.add(s.id);
            if (this.atWar(s.id, foe)) continue;
            Object.assign(this.rel(s.id, foe), { state: 'guerra', since: this.turn });
            this.log(`${s.name}, satélite de ${this.nm(side)}, entra en la guerra contra ${this.nm(foe)}.`);
            if (foe === this.player) this.alerts.push({ kind: 'joined', from: s.id, defending: side });
        }
        const lord = this.nations[b].overlord;
        if (lord >= 0 && !handled.has(lord) && lord !== a && !this.atWar(lord, a)) {
            if (lord === this.player) this.proposals.push({ kind: 'llamada', from: b, against: a });
