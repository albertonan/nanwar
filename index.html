            const num = x => String(Math.round(x * 100) / 100).replace('.', ',');
            const factors = fx.parts.map(([nm, x]) => `${nm} ×${num(x)}`).concat(fx.capped ? [`tope ×${CONFIG.MAX_DEFENSE_BONUS}`] : [], fx.defFlank < 1 ? [`rodeado ×${num(fx.defFlank)}`] : []).join(', ');
            const color = chance >= 0.7 ? '#a8e38a' : chance >= 0.35 ? '#ffd166' : '#ff8a78';
            lines.push(`<b style="color:${color}">Clic para atacar: ${Math.round(chance * 100)} % de victoria</b>`);
            lines.push(`Tu ataque ${Math.round(fx.atk)}${fx.attFlank < 1 ? ' (rodeado)' : ''} contra su defensa ${Math.round(fx.dfn)}${factors ? ` (${factors})` : ''}`);
            lines.push(`Si ganas te quedan unas ${winLeft} de ${n}; si pierdes, unas ${loseLeft}`);
        } else if (this.reachInfo?.attacks.has(cell)) lines.push('<b style="color:#ff8a78">Clic para atacar</b>');
        else if (this.reachInfo?.moves.has(cell)) lines.push('<b style="color:#a8e38a">Clic para mover aquí</b>');
        const prev = this.view.preview;
        if (prev && cell === this.view.hoverCell) {
            const what = prev.cls === 'fort' ? `Fortificar ${plural(prev.cells.length, 'casilla', 'casillas')}` : `${plural(prev.path.length - 1, 'tramo', 'tramos')} de ${prev.cls === 2 ? 'autopista' : 'carretera'}`;
            lines.push(`<b style="color:${prev.affordable ? '#a8e38a' : '#ff8a78'}">${what}: ${prev.cost} de oro${prev.affordable ? '' : ' (no te alcanza)'}</b>`);
        }
        tip.innerHTML = lines.join('<br>');
        tip.hidden = false;
        const box = this.view.canvas.parentElement.getBoundingClientRect();
        const x = e.clientX - box.left + 16, y = e.clientY - box.top + 16;
        tip.style.left = `${Math.min(x, box.width - tip.offsetWidth - 8)}px`;
        tip.style.top = `${Math.min(y, box.height - tip.offsetHeight - 8)}px`;
    }

    clickCell(cell) {
        const g = this.game;
        if (this.replaying) return;
        if (cell < 0 || !isLand(cell)) { if (this.tool === 'command') this.select(-1); return; }
        if (g.player === null) { this.choice = g.owner[cell]; this.render(); return; }
        if (g.over) return;
        if (this.tool === 'cities') { this.toggleCity(cell); return; }
        if (this.tool !== 'command') { this.buildClick(cell); return; }
        const army = this.selectedArmy();
        if (army && this.reachInfo && (this.reachInfo.attacks.has(cell) || this.reachInfo.moves.has(cell))) {
            const result = g.playerMove(army, copyUnits(this.send), cell);
            const next = result && g.armies.has(result.id) && result.owner === g.player ? result.cell : cell;
            this.select(next);
            return;
        }
        this.select(cell === this.selected ? -1 : cell);
    }

    buildClick(cell) {
        const g = this.game;
        if (g.owner[cell] !== g.player) { this.flash('Solo puedes construir en tu territorio.'); return; }
        const fort = this.tool === 'fort';
        this.pending = null;
        if (this.anchor < 0 || (cell === this.anchor && !fort)) {
            this.anchor = cell;
        } else {
            const plan = this.planTo(cell);
            if (!plan) this.flash('No hay camino por tu territorio hasta esa casilla.');
            else if (this.touch) {
                // Sin ratón no hay vista previa al pasar por encima: se enseña el trazado y se pide confirmación.
                this.pending = { ...plan, to: cell };
                this.view.preview = { ...plan, affordable: plan.cost <= g.nations[g.player].gold };
                this.selected = cell;
                this.render();
                return;
            }
            else if (fort ? g.playerFortify(plan) : g.playerBuild(plan)) this.anchor = cell;
        }
        this.view.preview = null;
        this.view.hoverCell = -2;
        this.selected = cell;
        this.render();
    }

    confirmBuild() {
        const g = this.game, plan = this.pending;
        if (!plan) return;
        if (plan.cls === 'fort' ? g.playerFortify(plan) : g.playerBuild(plan)) this.anchor = plan.to;
        this.pending = null;
        this.view.preview = null;
        this.render();
    }

    myCities() { const g = this.game; return PROVINCES.filter(p => g.owner[p.city] === g.player && g.legal[p.city] === g.player); }
    toggleCity(cell) {
        const g = this.game;
        if (cell < 0 || !isLand(cell)) return;
        const p = PROVINCES[G.prov[cell]];
        if (g.owner[p.city] !== g.player || g.legal[p.city] !== g.player) { this.flash('Solo puedes seleccionar ciudades tuyas que no estén en disputa.'); return; }
        if (this.multi.has(p.id)) this.multi.delete(p.id); else this.multi.add(p.id);
        this.render();
    }
    // Cuántas unidades saldrían (y por cuánto oro) reclutando `qty` por ciudad en la selección, ciudad por ciudad.
    multiPlan(type, qty) {
        const g = this.game;
        let gold = g.nations[g.player].gold, units = 0, cost = 0;
        for (const pid of this.multi) {
            const p = PROVINCES[pid];
            if (!g.canRecruitAt(g.player, p)) continue;
            const c = g.unitCost(g.player, type, pid);
            for (let n = Math.min(qty, g.recruitLeft(g.player, p)); n > 0 && gold >= c; n--) { gold -= c; cost += c; units++; }
        }
        return { units, cost };
    }
    renderMultiCard() {
        const g = this.game, el = $('#card'), p0 = g.player, color = g.nations[p0].color;
        for (const pid of [...this.multi]) { const p = PROVINCES[pid]; if (g.owner[p.city] !== p0 || g.legal[p.city] !== p0) this.multi.delete(pid); }
        const list = [...this.multi].map(pid => PROVINCES[pid]);
        const qty = this.recruitQty ?? 1, gold = g.nations[p0].gold;
        const forts = list.map(p => p.city).filter(c => !g.fort[c] && !g.fortWork.has(c));
        const canFort = Math.min(forts.length, Math.floor(gold / CONFIG.FORT_COST));
        el.hidden = false;
        el.style.setProperty('--owner', color);
        el.innerHTML = `
            <header class="card-head">
                <div><h2>${list.length ? plural(list.length, 'ciudad seleccionada', 'ciudades seleccionadas') : 'Selecciona ciudades'}</h2>
                <p class="small muted">Haz clic en tus provincias para añadirlas o quitarlas.</p></div>
                <button class="btn ghost" data-action="tool" data-tool="command" aria-label="Cerrar" title="Cerrar (Esc)">✕</button>
            </header>
            <section class="sec"><div class="row">
                <button class="btn" data-action="multi-all">Todas mis ciudades (${this.myCities().length})</button>
                <button class="btn ghost" data-action="multi-none" ${list.length ? '' : 'disabled'}>Ninguna</button></div>
                ${list.length ? `<p class="small muted" style="margin-top:8px">${list.slice(0, 12).map(p => esc(p.cityName)).join(', ')}${list.length > 12 ? ` y ${list.length - 12} más` : ''}</p>` : ''}
            </section>
            ${list.length ? `<section class="sec"><h3>Reclutar en todas</h3>
                <div class="row" style="margin-bottom:8px"><span class="small">Por ciudad</span><div class="seg" style="flex:1">
                    ${[['1', '×1'], ['5', '×5'], ['max', 'Máximo']].map(([v, label]) => `<button data-action="recruit-qty" data-qty="${v}" class="${String(qty) === v || (v === 'max' && qty === Infinity) ? 'on' : ''}">${label}</button>`).join('')}
                </div></div>
                <div class="recruit">${UNIT_KEYS.map(k => { const pl = this.multiPlan(k, qty); return `<button class="btn" data-action="multi-recruit" data-unit="${k}" ${pl.units ? '' : 'disabled'}>
                    ${unitIcon(k, color)}${CONFIG.TYPES[k].name}<b>${pl.units} uds</b><small>${pl.cost} oro</small></button>`; }).join('')}</div>
                <p class="note">Se recluta ciudad por ciudad hasta agotar el oro o el cupo de cada una.</p></section>
            <section class="sec"><h3>Fortificar</h3>
                <button class="btn" data-action="multi-fort" ${canFort ? '' : 'disabled'}>Fortificar ${plural(canFort, 'ciudad', 'ciudades')} (${canFort * CONFIG.FORT_COST} oro)</button>
                <p class="note">Listas en ${CONFIG.FORT_TURNS} turnos. No cuentan las que ya están fortificadas o en obras${canFort < forts.length ? '; no te llega el oro para todas' : ''}.</p></section>` : ''}`;
    }

    flash(msg) { this.game.log(msg); this.hintOverride = msg; this.render(); }

    setTool(id) {
        if (this.game.player === null || this.game.over) return;
        this.tool = id;
        this.anchor = -1;
        this.pending = null;
        this.view.preview = null;
        this.view.canvas.classList.toggle('building', id !== 'command');
        this.render();
    }

    cancel() {
        if (this.pending) { this.pending = null; this.view.preview = null; this.render(); return; }
        if (this.tool !== 'command') {
            if (this.anchor >= 0) { this.anchor = -1; this.view.preview = null; this.render(); }
            else this.setTool('command');
        } else this.select(-1);
    }

    selectedArmy() {
        if (this.selected < 0 || this.tool !== 'command') return null;
        const a = this.game.armyOn(this.selected);
        return a && a.owner === this.game.player && !this.game.over ? a : null;
    }

    select(cell) {
        this.selected = cell;
        const a = this.selectedArmy();
        this.send = a ? copyUnits(a.units) : emptyUnits();
        this.render();
    }

    nextArmy() {
        const g = this.game;
        if (g.player === null || g.over) return;
        const ready = [...g.armies.values()].filter(a => a.owner === g.player && g.armyOn(a.cell) === a && g.mp(a) > 0).sort((x, y) => x.id - y.id);
        if (!ready.length) { this.flash('Ningún ejército puede moverse más este turno.'); return; }
        const cur = g.armyOn(this.selected);
        const next = ready.find(a => cur && a.id > cur.id) ?? ready[0];
        this.setTool('command');
        this.view.centerOn(next.cell, 9);
        this.select(next.cell);
    }

    updateReach() {
        const g = this.game, a = this.selectedArmy();
        this.reachInfo = null;
        if (a) {
            for (const k of UNIT_KEYS) this.send[k] = Math.min(this.send[k], a.units[k]);
            if (countUnits(this.send) > 0) {
                const r = g.reach(a.owner, a.cell, g.moveBudget(a.owner, a.cell, this.send, a.used), a.used === 0);
                this.reachInfo = { moves: g.destinations(r), attacks: new Set(r.attacks.keys()), from: r.attacks };
            }
        }
        this.view.highlight = this.reachInfo;
        this.view.selectedCell = this.selected;
        this.view.multi = this.tool === 'cities' ? new Set([...this.multi].map(pid => PROVINCES[pid].city)) : null;
    }

    // --- Entrada ---
    onAction(e) {
        const b = e.target.closest('[data-action]');
        if (!b || b.disabled) return;
        const g = this.game, d = b.dataset;
        if (this.replaying && !['skip-replay', 'watch', 'speed'].includes(d.action)) return;
        const p = this.selected >= 0 ? PROVINCES[G.prov[this.selected]] : null;
        switch (d.action) {
            case 'setting': g.configure({ ...g.settings, [d.key]: d.key === 'victory' ? +d.value : d.key === 'fog' ? d.value === 'si' : d.value }); break;
            case 'spy-send': g.playerSendSpy(+d.pid); break;
            case 'call-war': {
                const sel = document.querySelector(`select[data-call-war="${d.target}"]`);
                if (sel) { this.callAlly = +sel.value; g.playerCallToWar(+sel.value, +d.target); }
                break;
            }
            case 'peace-open':
                if (!g.atWar(g.player, +d.target)) return;
                this.peace = { target: +d.target, mode: 'annex', keep: true, mine: -1, satGains: 'self' };
                this.renderPeaceDialog();
                $('#peace-dialog').showModal();
                return;
            case 'peace-mode': this.peace.mode = d.mode; this.renderPeaceDialog(); return;
            case 'peace-sat': this.peace.satGains = d.value; this.renderPeaceDialog(); return;
            case 'peace-close': $('#peace-dialog').close(); return;
            case 'peace-send':
                g.playerPeace(this.peace.target, { ...this.peace });
                $('#peace-dialog').close();
                break;
            case 'sat-annex-prov': g.playerAnnexProvince(+d.pid); break;
            case 'sat-annex': g.playerAnnexSatellite(+d.target); this.focusNation = null; break;
            case 'sat-release': g.playerReleaseSatellite(+d.target); break;
            case 'spy-recall': g.playerRecallSpy(+d.pid); break;
            case 'start':
                if (this.choice === null) return;
                g.start(this.choice);
                this.seenLog = g.logs.length;
                this.view.hoverNation = -1;
                this.view.centerOn(g.nations[this.choice].capitalCell, 5);
                this.select(g.nations[this.choice].capitalCell);
                return;
            case 'end-turn': this.endTurnFlow(); return;
            case 'skip-replay': this.skipReplay(); return;
            case 'multi-all': this.multi = new Set(this.myCities().map(p => p.id)); break;
            case 'multi-none': this.multi.clear(); break;
            case 'multi-recruit': g.playerRecruitMany([...this.multi], d.unit, this.recruitQty ?? 1); break;
            case 'multi-fort': {
                const cells = [...this.multi].map(pid => PROVINCES[pid].city).filter(c => !g.fort[c] && !g.fortWork.has(c))
                    .slice(0, Math.floor(g.nations[g.player].gold / CONFIG.FORT_COST));
                if (cells.length) g.playerFortify({ cells, path: cells, cost: cells.length * CONFIG.FORT_COST, cls: 'fort' });
                break;
            }
            case 'watch': this.prefs.watch = d.value; writePrefs(this.prefs); if ($('#game-dialog').open) this.renderGameDialog(); break;
            case 'speed': this.prefs.speed = d.value; writePrefs(this.prefs); if ($('#game-dialog').open) this.renderGameDialog(); break;
            case 'alerts-close': $('#alerts-dialog').close(); g.alerts = []; break;
            case 'alert-goto': $('#alerts-dialog').close(); g.alerts = []; this.view.centerOn(+d.cell, 6); this.setTool('command'); this.select(+d.cell); return;
            case 'next-army': this.nextArmy(); return;
            case 'install':
                if (this.installPrompt) { this.installPrompt.prompt(); this.installPrompt.userChoice.finally(() => { this.installPrompt = null; this.renderTop(); }); }
                return;
            case 'confirm-build': this.confirmBuild(); return;
            case 'cancel-build': this.cancel(); return;
            case 'stop-build': this.setTool('command'); return;
            case 'open-drawer': this.drawerOpen = true; break;
            case 'tool': this.setTool(d.tool === this.tool && d.tool !== 'command' ? 'command' : d.tool); return;
            case 'supply': this.view.showSupply = !this.view.showSupply; break;
            case 'view-mode': this.toggleViewMode(); return;
            case 'close-card': this.select(-1); return;
            case 'step': {
                const a = this.selectedArmy();
                if (!a) return;
                this.send[d.unit] = Math.max(0, Math.min(a.units[d.unit], this.send[d.unit] + +d.delta));
                break;
            }
            case 'send-all': { const a = this.selectedArmy(); if (a) this.send = copyUnits(a.units); break; }
            case 'recruit': g.playerRecruit(p, d.unit, this.recruitQty ?? 1); break;
            case 'recruit-qty': this.recruitQty = d.qty === 'max' ? Infinity : +d.qty; break;
            case 'diplo': g.playerDiplomacy(d.kind, +d.target); break;
            case 'invite': g.playerInvite(+d.bloc, +d.target); break;
            case 'accept': case 'reject':
                g.answerProposal(+d.index, d.action === 'accept');
                if ($('#alerts-dialog').open) this.renderAlerts();
                break;
            case 'tab': this.tab = d.tab; this.drawerOpen = true; this.focusNation = null; break;
            case 'drawer': this.drawerOpen = !this.drawerOpen; break;
            case 'nation': this.focusNation = +d.id; this.tab = 'paises'; this.drawerOpen = true; break;
            case 'nation-back': this.focusNation = null; break;
            case 'goto':
                if (isMobile()) this.drawerOpen = false;
                this.view.centerOn(+d.cell, 8); this.setTool('command'); this.select(+d.cell); return;
            case 'bloc-create': g.playerCreateBloc(this.blocName, this.blocSecret); this.blocName = ''; this.blocSecret = false; break;
            case 'bloc-invite': {
                const sel = document.querySelector(`select[data-bloc-invite="${d.bloc}"]`);
                if (sel && sel.value !== '') g.playerInvite(+d.bloc, +sel.value);
                break;
            }
            case 'bloc-request': g.playerRequestJoin(+d.bloc); break;
            case 'bloc-leave': g.playerLeaveBloc(+d.bloc); break;
            case 'open-game': this.renderGameDialog(); $('#game-dialog').showModal(); return;
            case 'close-game': $('#game-dialog').close(); return;
            case 'save': {
                const ok = writeSave(d.slot, g);
                g.log(ok ? `Partida guardada en ${SLOTS[d.slot]}.` : 'No se pudo guardar: el navegador bloquea el almacenamiento. Usa «Exportar a archivo».');
                this.renderGameDialog();
                break;
            }
            case 'load': {
                const save = readSaves()[d.slot];
                if (!save) return;
                try { this.setGame(GameEngine.load(save.data)); this.game.log(`Partida cargada de ${SLOTS[d.slot]}.`); }
                catch (err) { g.log(`No se pudo cargar: ${err.message}`); }
                $('#game-dialog').close();
                this.render();
                return;
            }
            case 'export': {
                const blob = new Blob([JSON.stringify(g.serialize())], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `nanwar-${g.nations[g.player].key}-turno${g.turn}.json`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                g.log(`Partida exportada a ${a.download}.`);
                break;
            }
            case 'import': $('#import-file').click(); return;
            case 'restart': location.href = location.pathname; return;
            default: return;
        }
        this.render();
    }

    // Fin de turno: los demás países juegan de golpe ("directo") o uno a uno, enseñando cada jugada ("ver").
    async endTurnFlow() {
        const g = this.game;
        if (this.replaying || g.player === null || g.over || !g.beginAiPhase()) return;
        this.setTool('command');
        const order = g.aiOrder();
        if (this.prefs.watch !== 'ver') {
            for (const id of order) g.aiStep(id);
            g.motion.length = 0;   // «directo»: nada que animar
        } else {
            this.replaying = true;
            this.skipping = false;
            $('#tooltip').hidden = true;
            $('#hint').hidden = true;
            $('#card').hidden = true;
            const delay = SPEEDS[this.prefs.speed] ?? SPEEDS.normal;
            this.view.motion.speed = { lenta: 1.4, normal: 1, rapida: 0.45 }[this.prefs.speed] ?? 1;
            for (let i = 0; i < order.length; i++) {
                const id = order[i];
                if (this.skipping || g.over || !g.nations[id].alive) { g.aiStep(id); continue; }
                const before = `${g.version}:${g.armyVersion}:${g.roadVersion}:${g.fortVersion}:${g.logs.length}`;
                this.view.hoverNation = id;
                this.renderReplay(id, i + 1, order.length);
                g.aiStep(id);
                const changed = before !== `${g.version}:${g.armyVersion}:${g.roadVersion}:${g.fortVersion}:${g.logs.length}`;
                if (!changed) continue;   // quien no hace nada no hace esperar
                this.view.draw();
                this.renderTop();
                const wait = Math.max(delay, this.view.motion.pendingMs() + 120);   // que se vea acabar cada movimiento
                await new Promise(res => { this.wakeReplay = res; setTimeout(res, wait); });
            }
            this.view.hoverNation = -1;
            this.replaying = false;
            $('#replay').hidden = true;
        }
        g.finishAiPhase();
        writeSave('auto', g);
        this.select(this.selected);
        if (g.alerts.length || g.proposals.some(p => p.kind === 'llamada')) this.openAlerts();
    }
    skipReplay() { this.skipping = true; this.view.motion.clear(); this.game.motion.length = 0; this.wakeReplay?.(); }
    // Vista sencilla ⇄ realista (botón «Relieve» y tecla V). Se guarda en este dispositivo, no en la partida.
    toggleViewMode() {
        this.prefs.view = this.prefs.view === 'realista' ? 'sencilla' : 'realista';
        writePrefs(this.prefs);
        this.view.setMode(this.prefs.view);
        this.renderTools();
        this.renderHint();
    }
    renderReplay(id, n, total) {
        const g = this.game, el = $('#replay');
        el.hidden = false;
        el.innerHTML = `<span class="chip"><i style="background:${g.nations[id].color}"></i>${g.nm(id)}</span>
            <span class="small muted">turno ${n} de ${total}</span>
            <button class="btn" data-action="skip-replay" title="Terminar al instante (Esc)">Saltar</button>`;
    }

    // Partes de guerra al volver a tu turno: quién te ataca y qué aliados piden ayuda.
    openAlerts() { this.renderAlerts(); if (!$('#alerts-dialog').open) $('#alerts-dialog').showModal(); }
    renderAlerts() {
        const g = this.game, items = [];
        for (const a of g.alerts) {
            const cap = g.nations[a.from].capitalCell;
            if (a.kind === 'war') items.push(`<div class="alert"><p><b>${g.nm(a.from)}</b> te ha declarado la guerra.</p>
                <div class="row" style="margin-top:6px"><button class="btn" data-action="alert-goto" data-cell="${cap}">Ver en el mapa</button></div></div>`);
            else items.push(`<div class="alert"><p><b>${g.nm(a.from)}</b> entra en la guerra contra ti en defensa de ${g.nm(a.defending)}.</p></div>`);
        }
        g.proposals.forEach((pr, i) => {
            if (pr.kind !== 'llamada') return;
            items.push(`<div class="alert ally"><p>Tu aliado <b>${g.nm(pr.from)}</b> ha sido atacado por <b>${g.nm(pr.against)}</b>. ¿Entras en la guerra?</p>
                <p class="note">Si no intervienes, sales de las alianzas que compartís con ${g.nm(pr.from)}.</p>
                <div class="row" style="margin-top:6px"><button class="btn war" data-action="accept" data-index="${i}">Ir a la guerra</button>
                <button class="btn" data-action="reject" data-index="${i}">No intervenir</button></div></div>`);
        });
        const pending = g.proposals.some(p => p.kind === 'llamada');
        $('#alerts-body').innerHTML = `<h2>Partes de guerra</h2>
            ${items.join('') || '<p class="note" style="margin-top:8px">Ya has respondido a todo.</p>'}
            <div class="row" style="margin-top:14px;justify-content:flex-end">
                <button class="btn ${pending ? '' : 'primary'}" data-action="alerts-close">${pending ? 'Decidir más tarde' : 'Entendido'}</button></div>`;
    }

    onInput(e) {
        if (e.target.id === 'nation-search') { this.filter = e.target.value; this.renderNationList(); }
        if (e.target.id === 'bloc-name') this.blocName = e.target.value;
    }

    onChange(e) {
        if (e.target.id === 'nation-select') { this.choice = +e.target.value; this.render(); }
        if (e.target.id === 'bloc-secret') this.blocSecret = e.target.checked;
        if (e.target.dataset.callWar !== undefined) { this.callAlly = +e.target.value; this.render(); }
        if (e.target.id === 'peace-mine') { this.peace.mine = +e.target.value; this.renderPeaceDialog(); }
        if (e.target.id === 'peace-keep') { this.peace.keep = e.target.checked; this.renderPeaceDialog(); }
    }

    onKey(e) {
        if (this.replaying) { if (e.key === 'Escape') this.skipReplay(); return; }
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || $('#game-dialog').open || $('#peace-dialog').open || $('#alerts-dialog').open) return;
        const g = this.game;
        if (e.key === 'Escape') { this.cancel(); return; }
        if (e.key === 'v' || e.key === 'V') { this.toggleViewMode(); return; }
        if (g.player === null || g.over) return;
        const tool = TOOLS.find(t => t.key === e.key);
        if (tool) { this.setTool(tool.id); return; }
        if (e.key === 'l' || e.key === 'L') { this.view.showSupply = !this.view.showSupply; this.render(); }
        else if (e.key === 'n' || e.key === 'N') this.nextArmy();
        else if (e.key === 'Enter') { e.preventDefault(); $('#end-turn').click(); }
    }

    // --- Pintado ---
    render() {
        $('#tooltip').hidden = true;
        this.updateReach();
        this.view.draw();
        this.renderTop();
        this.renderTools();
        this.renderSetup();
        this.renderCard();
        this.renderToasts();
        this.renderDrawer();
        this.renderHint();
        this.renderConfirm();
        this.renderOverlay();
        this.hintOverride = null;
    }

    relationChip(id) {
        const g = this.game;
        if (!g.nations[id].alive) return '<span class="chip">eliminado</span>';
        if (g.player === null) return '';
        if (id === g.player) return '<span class="chip tu">tú</span>';
        if (g.nations[id].overlord === g.player) return '<span class="chip alianza">tu satélite</span>';
        if (g.nations[id].overlord >= 0) return `<span class="chip">satélite de ${g.nm(g.nations[id].overlord)}</span>`;
        if (g.atWar(g.player, id)) return '<span class="chip guerra">en guerra</span>';
        if (g.allied(g.player, id)) return '<span class="chip alianza">aliado</span>';
        const r = g.rel(g.player, id);
        return g.turn < r.truceUntil ? `<span class="chip">tregua hasta el turno ${r.truceUntil}</span>` : '<span class="chip">en paz</span>';
    }
    nationChip(id) { return `<span class="chip"><i style="background:${this.game.nations[id].color}"></i>${this.game.nm(id)}</span>`; }
    unitsLong(u) {
        return UNIT_KEYS.filter(k => u[k] > 0).map(k => `${u[k]} ${CONFIG.TYPES[k].name.toLowerCase()}`).join(', ') || 'sin tropas';
    }

    renderTop() {
        const g = this.game, p0 = g.player;
        $('#turn').textContent = g.turn;
        $('#end-turn').disabled = p0 === null || g.over;
        $('#btn-next').hidden = p0 === null;
        $('#btn-install').hidden = !this.installPrompt;
        if (p0 === null) {
            $('#nation-name').textContent = 'NanWar';
            $('#flag').style.background = SIGNAL;
            $('#gold').textContent = '—';
            return;
        }
        const n = g.nations[p0];
        $('#nation-name').textContent = n.name;
        $('#flag').style.background = n.color;
        $('#gold').innerHTML = `${n.gold}<small>+${g.income(p0)}</small>`;
    }

    renderTools() {
        const playing = this.game.player !== null && !this.game.over;
        $('#tools').innerHTML = TOOLS.map(t => `
            <button class="tool ${this.tool === t.id ? 'on' : ''}" data-action="tool" data-tool="${t.id}" title="${t.title}" ${playing ? '' : 'disabled'}>
                ${t.icon}${t.label}<kbd>${t.key}</kbd></button>`).join('') + `<hr>
            <button class="tool ${this.view.showSupply ? 'on' : ''}" data-action="supply" title="Mostrar en naranja tu territorio sin suministro" ${playing ? '' : 'disabled'}>
                ${ICONS.supply}Logística<kbd>L</kbd></button>
            <button class="tool ${this.prefs.view === 'realista' ? 'on' : ''}" data-action="view-mode" title="Vista realista: relieve, bosques y ríos reales, ejércitos en miniatura (V)">
                ${ICONS.relief}Relieve<kbd>V</kbd></button>
            <button class="tool mobile-only" data-action="open-drawer" ${playing ? '' : 'disabled'}>${ICONS.globe}Países</button>`;
    }

    renderSetup() {
        const g = this.game, el = $('#setup');
        el.hidden = g.player !== null;
        if (g.player !== null) return;
        const s = g.settings, c = this.choice;
        const seg = (key, options, cur) => `<div class="seg" role="group">${(Array.isArray(options) ? options : Object.entries(options)).map(([v, label]) =>
            `<button data-action="setting" data-key="${key}" data-value="${v}" class="${String(cur) === v ? 'on' : ''}">${label}</button>`).join('')}</div>`;
        const sorted = [...g.nations].sort((a, b) => a.name.localeCompare(b.name, 'es'));
        let pick = '<p class="note">Haz clic en un país del mapa o elígelo en la lista.</p>';
        if (c !== null) {
            const e = g.economy(c), lands = g.landCounts(), powers = g.powers();
            pick = `<div class="pick" style="border-left-color:${g.nations[c].color}">
                <h3>${g.nm(c)}</h3>
                <dl class="facts" style="margin-top:8px">
                    <dt>Capital</dt><dd>${esc(g.nations[c].capitalName)}</dd>
                    <dt>Territorio</dt><dd>${plural(g.citiesOf(c).length, 'provincia', 'provincias')}, ${(100 * lands[c] / G.land.length).toFixed(1)} % de Europa</dd>
                    <dt>Ejército</dt><dd>fuerza ${powers[c]}</dd>
                    <dt>Economía</dt><dd>${e.total} de oro por turno, ${g.nations[c].gold} en el tesoro</dd>
                    <dt>Recursos</dt><dd>${[...e.resources, ...e.looseResources].map(r => `${CONFIG.RESOURCE_ICON[r.type]} ${esc(r.name)}`).join(', ') || 'ninguno'}${e.resources.length ? '<br><span class="small muted">Cada uno abastece a su provincia; con carretera, también a las ciudades que una.</span>' : ''}</dd>
                    <dt>Alianzas</dt><dd>${g.blocsOf(c).map(b => esc(b.name)).join(', ') || 'ninguna'}</dd>
                </dl></div>
                <button class="btn primary wide" style="margin-top:12px;padding:11px" data-action="start">Empezar con ${g.nm(c)}</button>`;
        }
        el.innerHTML = `
            <h2>Nueva partida</h2>
            <p class="lead">Europa, 2025. Elige cómo será la partida y qué país diriges.</p>
            <div class="field"><span>Agresividad de los demás países</span>
                ${seg('aggression', Object.fromEntries(Object.entries(AGGRESSION).map(([k, v]) => [k, v.name])), s.aggression)}
                <p class="note">${g.ai.desc}</p></div>
            <div class="field"><span>Alianzas al empezar</span>${seg('alliances', { reales: 'OTAN y OTSC', ninguna: 'Ninguna' }, s.alliances)}</div>
            <div class="field"><span>Niebla de guerra</span>${seg('fog', [['no', 'Ver todo'], ['si', 'Solo lo que ves']], s.fog ? 'si' : 'no')}
                <p class="note">${s.fog
                    ? `Solo ves las tropas en tu territorio y el de tus aliados, en una franja de ${CONFIG.VISION_TERRITORY} casillas alrededor y a ${CONFIG.VISION_ARMY} de tus ejércitos. Puedes enviar espías.`
                    : 'Ves todas las tropas de Europa.'}</p></div>
            <div class="field"><span>Para ganar</span>${seg('victory', [['0.5', '50 % de Europa'], ['0.75', '75 %'], ['1', 'Toda Europa']], s.victory)}</div>
            <div class="field"><span>Tu país</span>
                <select id="nation-select"><option value="" ${c === null ? 'selected' : ''} disabled>Elige un país…</option>
                ${sorted.map(n => `<option value="${n.id}" ${c === n.id ? 'selected' : ''}>${n.name}</option>`).join('')}</select>
                ${pick}</div>
            ${this.watchSettings()}
            <button class="btn ghost wide" style="margin-top:12px" data-action="open-game">Cargar una partida guardada</button>
            ${this.installPrompt ? '<button class="btn wide" style="margin-top:6px" data-action="install">Instalar NanWar en este dispositivo</button>' : ''}
            ${isIOS() && !isStandalone() ? '<p class="note" style="margin-top:10px">Para instalarlo en el iPhone o iPad: botón Compartir de Safari y «Añadir a pantalla de inicio». Después funciona sin conexión.</p>' : ''}`;
    }

    renderCard() {
        const g = this.game, cell = this.selected, p0 = g.player, el = $('#card');
        if (this.tool === 'cities' && p0 !== null && !g.over) { this.renderMultiCard(); return; }
        if (p0 === null || g.over || cell < 0 || !isLand(cell) || (isMobile() && this.tool !== 'command')) { el.hidden = true; return; }
        el.hidden = false;
        const p = PROVINCES[G.prov[cell]], o = g.owner[cell], a = g.armyOn(cell);
        el.style.setProperty('--owner', g.nations[o].color);
        const sections = [];

        // Ejército
        if (a && a.owner === p0 && this.tool === 'command') {
            const full = speedOf(this.send) * MOVE, left = g.moveBudget(a.owner, a.cell, this.send, a.used);
            const supplied = g.inSupply(p0, a.cell);
            const rows = UNIT_KEYS.filter(k => a.units[k] > 0).map(k => `
                <div class="unit-row">${unitIcon(k, g.nations[o].color)}
                    <div>${CONFIG.TYPES[k].name}<div class="small muted">ataque ${CONFIG.TYPES[k].atk}, defensa ${CONFIG.TYPES[k].def}, velocidad ${CONFIG.TYPES[k].speed}</div></div>
                    <div class="stepper"><button data-action="step" data-unit="${k}" data-delta="-1" ${this.send[k] ? '' : 'disabled'} aria-label="Una menos">−</button>
                    <output>${this.send[k]} de ${a.units[k]}</output>
                    <button data-action="step" data-unit="${k}" data-delta="1" ${this.send[k] < a.units[k] ? '' : 'disabled'} aria-label="Una más">+</button></div>
                </div>`).join('');
            const partial = !sameUnits(this.send, a.units);
            sections.push(`<section class="sec">
                <h3>Tu ejército</h3>
                <div class="units">${rows}</div>
                ${partial ? '<div class="row"><span class="small muted">Mueves solo una parte: el resto se queda.</span><button class="btn ghost" data-action="send-all">Todas</button></div>' : ''}
                <div class="meter"><i style="width:${!supplied ? (left > 0 ? 100 : 0) : full ? Math.round(100 * left / full) : 0}%"></i></div>
                <p class="small">${left <= 0 ? 'Ya no puede moverse este turno.'
                    : supplied ? `Le quedan ${fmtMp(left)} de ${fmtMp(speedOf(this.send) * MOVE)} puntos de movimiento.`
                    : 'Puede avanzar una casilla este turno.'}</p>
                ${(() => { const sides = g.hostileSides(p0, a.cell); if (sides < CONFIG.FLANKED_SIDES) return '';
                    const cercado = sides >= CONFIG.SURROUNDED_SIDES;
                    return `<p class="note warn">${cercado ? 'Cercado' : 'Rodeado'} por ${sides} lados: ataque y defensa ×${g.flankFactor(p0, a.cell)} y ${cercado ? 'solo puede avanzar una casilla' : 'mueve la mitad'}. Mejor retirarse o romper el cerco.</p>`; })()}
                ${supplied ? '' : `<p class="note warn">Sin suministro: lejos de tus ciudades y de tu red de carreteras solo avanza una casilla por turno. Construye carreteras hasta el frente para abastecerlo (llegan a ${CONFIG.SUPPLY_ROAD_RANGE} casillas de la red).</p>`}
                ${left > 0 ? `<p class="note">Haz clic en una casilla ${this.view.isRealistic() ? 'de la zona clara' : 'verde'} para mover o en una roja para atacar. Por carretera llegas más lejos; si no se ha movido este turno, siempre puede avanzar al menos una casilla.</p>` : ''}
            </section>`);
        } else if (a && g.sees(p0, cell)) {
            sections.push(`<section class="sec"><h3>Ejército de ${g.nm(a.owner)}</h3>
                <div class="units">${UNIT_KEYS.filter(k => a.units[k] > 0).map(k => `<div class="unit-row">${unitIcon(k, g.nations[a.owner].color)}<div>${a.units[k]} ${CONFIG.TYPES[k].name.toLowerCase()}</div><span></span></div>`).join('')}</div>
                <p class="small muted">Ataque ${unitPower(a.units, 'atk')}, defensa ${unitPower(a.units, 'def')}${g.fort[cell] ? `, ×${CONFIG.FORT_DEFENSE} por la fortificación` : ''}.</p></section>`);
        }

        // Reclutar
        if (this.tool === 'command' && g.owner[p.city] === p0 && g.legal[p.city] !== p0) {
            sections.push(`<section class="sec"><h3>Reclutar</h3><p class="note warn">${esc(p.cityName)} está en disputa: no puedes reclutar aquí hasta que se anexione al firmar la paz.</p></section>`);
        } else if (this.tool === 'command' && g.owner[p.city] === p0) {
            const left = g.recruitLeft(p0, p), ok = g.canRecruitAt(p0, p), gold = g.nations[p0].gold;
            sections.push(`<section class="sec">
                <h3>Reclutar en ${esc(p.cityName)}</h3>
                <p class="small muted" style="margin:-3px 0 4px">${left > 0 ? `Puedes reclutar ${plural(left, 'unidad', 'unidades')} más este turno, de cualquier tipo.` : 'Ya no puedes reclutar más aquí este turno.'}</p>
                <p class="small muted" style="margin:0 0 8px">Cupo ${g.recruitCap(p0, p)}: ${g.recruitBreakdown(p0, p).map(([what, n]) => `${what} ${n}`).join(', ')}. Sube con el desarrollo, las carreteras y autopistas y los yacimientos que la abastecen.</p>
                <div class="row" style="margin-bottom:8px"><span class="small">Cantidad</span><div class="seg" style="flex:1">
                    ${[['1', '×1'], ['5', '×5'], ['max', 'Máximo']].map(([v, label]) => `<button data-action="recruit-qty" data-qty="${v}" class="${String(this.recruitQty ?? 1) === v || (v === 'max' && this.recruitQty === Infinity) ? 'on' : ''}">${label}</button>`).join('')}
                </div></div>
                <div class="recruit">${UNIT_KEYS.map(k => {
                    const t = CONFIG.TYPES[k];
                    const cost = g.unitCost(p0, k, p.id);
                    return `<button class="btn" data-action="recruit" data-unit="${k}" ${!ok || gold < cost ? 'disabled' : ''} title="${cost < t.cost ? `Tus yacimientos lo abaratan: ${t.cost} → ${cost}` : ''}">
                        ${unitIcon(k, g.nations[p0].color)}${t.name}<b>${cost} oro</b></button>`;
                }).join('')}</div>
                <p class="note">Las tropas nuevas aparecen en la ciudad y se mueven a partir del turno siguiente.</p></section>`);
        }

        // Niebla de guerra y espionaje
        if (g.settings.fog && o !== p0 && !g.allied(p0, o)) {
            const spy = g.spies.get(p.id), odds = g.spyOdds(p.id), pct = x => `${Math.round(x * 100)} %`;
            const seen = g.sees(p0, cell);
            let body;
            if (spy) {
                body = `<p class="small">${spy.revealedTurn === g.turn ? 'Tu espía ha informado este turno: ves las tropas de la provincia.' : 'Tu espía no ha conseguido informar este turno.'}
                    ${g.turn === spy.since ? 'Acaba de llegar.' : `Lleva ${plural(g.turn - spy.since, 'turno', 'turnos')} allí.`}</p>
                    <p class="note">Cada turno informa con un ${pct(odds.success)} de probabilidad; el riesgo de que lo capturen el próximo turno es del ${pct(Math.min(CONFIG.SPY_CATCH_MAX, odds.caught + CONFIG.SPY_CATCH_PER_TURN))}.</p>
                    <div class="row" style="margin-top:8px"><button class="btn" data-action="spy-recall" data-pid="${p.id}">Retirar el espía</button></div>`;
            } else {
                body = `<p class="small">${seen ? 'Ahora mismo ves esta casilla.' : 'No ves qué tropas hay en esta provincia.'} Un espía informa de las tropas de toda la provincia cada turno (${pct(odds.success)}) hasta que lo capturan (${pct(odds.caught)} el primer turno, y más cada turno).</p>
                    <div class="row" style="margin-top:8px"><button class="btn" data-action="spy-send" data-pid="${p.id}" ${g.canSpy(p.id) && g.nations[p0].gold >= CONFIG.SPY_COST ? '' : 'disabled'}>Enviar un espía (${CONFIG.SPY_COST} oro)</button></div>`;
            }
            sections.push(`<section class="sec"><h3>Espionaje</h3>${body}</section>`);
        }

        // Diplomacia rápida con el dueño de la casilla
        if (o !== p0 && g.nations[o].alive) sections.push(`<section class="sec">${this.diplomacyActions(o, p.id)}</section>`);

        // Provincia
        const control = new Map();
        for (const c of p.cells) control.set(g.owner[c], (control.get(g.owner[c]) ?? 0) + 1);
        const bar = [...control.entries()].sort((x, y) => y[1] - x[1])
            .map(([id, n]) => `<i title="${g.nm(id)}: ${Math.round(100 * n / p.cells.length)} %" style="width:${100 * n / p.cells.length}%;background:${g.nations[id].color}"></i>`).join('');
        const cityOwner = g.owner[p.city];
        const connected = g.economy(cityOwner).connected.has(p.id);
        const res = RESOURCES.filter(r => r.province === p.id);
        sections.push(`<section class="sec">
            <h3>Provincia</h3>
            <div class="control-bar">${bar}</div>
            <dl class="facts">
                <dt>Ciudad</dt><dd>${esc(p.cityName)}${CAPITAL_OF[p.city] >= 0 ? ' ★' : ''}, en manos de ${g.nm(cityOwner)}</dd>
                <dt>Población</dt><dd>${(p.population / 1e6).toLocaleString('es-ES', { maximumFractionDigits: 2 })} millones</dd>
                <dt>Renta</dt><dd>${Math.round(p.value * (1 + g.dev[p.id] / 1000))} de oro${connected ? ` (+${CONFIG.ROAD_BONUS * 100} % por carretera)` : ', sin carretera a la capital'}</dd>
                <dt>Desarrollo</dt><dd>+${Math.round(g.dev[p.id] / 10)} % de renta${g.dev[p.id] < (connected ? CONFIG.DEV_MAX_CONNECTED : CONFIG.DEV_MAX) && g.legal[p.city] === cityOwner ? `, crece un ${(connected ? CONFIG.DEV_GROWTH_CONNECTED : CONFIG.DEV_GROWTH) / 10} % por turno${connected ? '' : ' (con carretera a la capital crecería más)'}` : ''}</dd>
                <dt>Terreno</dt><dd>${this.terrainText(cell)}</dd>
                ${g.sieges.has(p.city) ? `<dt>Asedio</dt><dd class="warn-text">${g.nm(g.sieges.get(p.city).by)} tiene tropas en ${esc(p.cityName)}: lleva ${g.sieges.get(p.city).held} de ${CONFIG.SIEGE_TURNS} turnos. Si las mantiene, toma la provincia.</dd>` : ''}
                ${g.isDisputed(cell) ? `<dt>Estado</dt><dd class="warn-text">en disputa: la ocupa ${g.nm(o)} pero es de ${g.nm(g.legal[cell])}. Rinde la mitad y se anexiona al firmar la paz.</dd>` : ''}
                ${res.map(r => { const reach = g.resourceReach(r); return `<dt>${r.typeName}</dt><dd>${CONFIG.RESOURCE_ICON[r.type]} ${esc(r.name)}, +${r.value} de oro. ${reach.length ? `Abastece también a ${reach.map(x => esc(PROVINCES[x].name)).join(', ')}.` : 'Solo abastece a esta provincia: pasa una carretera por su casilla y llévala hasta otras ciudades.'}</dd>`; }).join('')}
                ${(() => { const s = g.provinceSupply(p.id); return s.length ? `<dt>Industria</dt><dd>+${Math.round(100 * Math.min(CONFIG.RESOURCE_INDUSTRY_MAX, CONFIG.RESOURCE_INDUSTRY * s.length))} % de renta y tropas más baratas: la abastecen ${s.map(r => `${CONFIG.RESOURCE_ICON[r.type]} ${esc(r.name)}`).join(', ')}</dd>` : ''; })()}
                ${g.fort[cell] ? `<dt>Casilla</dt><dd>fortificada</dd>` : g.fortWork.has(cell) ? `<dt>Casilla</dt><dd>fortificando, ${plural(g.fortWork.get(cell).left, 'turno', 'turnos')}</dd>` : ''}
            </dl></section>`);

        el.innerHTML = `
            <header class="card-head">
                <div><h2>${esc(p.name)}</h2>
                    <p class="row">${this.nationChip(o)} ${this.relationChip(o)}${g.isDisputed(cell) ? ` <span class="small warn-text">en disputa con ${g.nm(g.legal[cell])}</span>` : o !== p.country ? ` <span class="small muted">antes de ${g.nm(p.country)}</span>` : ''}</p></div>
                <button class="btn ghost" data-action="close-card" aria-label="Cerrar" title="Cerrar (Esc)">✕</button>
            </header>${sections.join('')}`;
    }

    // Botones de diplomacia con una nación (en la ficha y en el panel de países).
    diplomacyActions(t, pid = -1) {
        const g = this.game, p0 = g.player, r = g.rel(p0, t);
        let html = `<h3>Diplomacia con ${g.nm(t)}</h3>`;
        if (g.nations[t].overlord === p0) {
            const p = pid >= 0 ? PROVINCES[pid] : null;
            return html + `<p class="small muted">Es tu satélite: te paga ${Math.round(g.economy(t).total * CONFIG.TRIBUTE)} de oro por turno, entra en tus guerras y nunca te ataca.</p>
                <div class="row" style="margin-top:8px">
                    ${p && g.owner[p.city] === t ? `<button class="btn" data-action="sat-annex-prov" data-pid="${p.id}">Anexionar ${esc(p.name)}</button>` : ''}
                    <button class="btn" data-action="sat-annex" data-target="${t}">Anexionar todo el país</button>
                    <button class="btn ghost" data-action="sat-release" data-target="${t}">Conceder la independencia</button>
                </div>`;
        }
        if (g.atWar(p0, t)) {
            const asked = g.proposedThisTurn.has(`paz${t}`);
            html += `<p class="small muted">En guerra desde el turno ${r.since}.</p>
                <div class="row" style="margin-top:8px"><button class="btn" data-action="peace-open" data-target="${t}" ${asked ? 'disabled' : ''}>${asked ? 'Paz ya propuesta este turno' : 'Negociar la paz'}</button></div>`;
            const helpers = g.nations.filter(n => n.alive && n.id !== p0 && g.allied(p0, n.id) && n.overlord < 0 && !g.atWar(n.id, t));
            if (helpers.length) {
                const label = x => { const o = g.callToWarOdds(x, t); return o >= 0.6 ? 'probable' : o >= 0.3 ? 'dudoso' : o > 0 ? 'improbable' : 'no puede'; };
                const sel = this.callAlly && helpers.some(n => n.id === this.callAlly) ? this.callAlly : helpers.sort((a, b) => g.callToWarOdds(b.id, t) - g.callToWarOdds(a.id, t))[0].id;
                const asked2 = g.proposedThisTurn.has(`call${sel}:${t}`);
                html += `<p class="small" style="margin-top:12px">Pedir a un aliado que entre en la guerra contra ${g.nm(t)}:</p>
                    <div class="row" style="margin-top:6px">
                        <select data-call-war="${t}" style="flex:1">${helpers.map(n => `<option value="${n.id}" ${n.id === sel ? 'selected' : ''}>${n.name} (${label(n.id)})</option>`).join('')}</select>
                        <button class="btn" data-action="call-war" data-target="${t}" ${asked2 || !g.callToWarOdds(sel, t) ? 'disabled' : ''}>${asked2 ? 'Ya se lo has pedido' : 'Pedir ayuda'}</button>
                    </div>
                    <p class="note">Acepta más si tiene frontera con ${g.nm(t)} y si juntos sois más fuertes. Si entra, los aliados de ${g.nm(t)} irán contra él.</p>`;
            }
            return html;
        }
        const allies = g.knownAllies(p0, t).filter(x => x !== p0);
        const shared = g.sharedBlocs(p0, t);
        const truce = g.turn < r.truceUntil;
        const invites = g.blocsOf(p0).filter(b => !b.members.has(t));
        if (allies.length) html += `<p class="small muted">Si le atacas, también te declaran la guerra: ${allies.map(x => g.nm(x)).join(', ')}.</p>`;
        if (shared.length) html += `<p class="note warn">Sois aliados: atacarle te expulsa de ${shared.map(b => esc(b.name)).join(', ')}.</p>`;
        html += `<div class="row" style="margin-top:8px">
            <button class="btn war" data-action="diplo" data-kind="war" data-target="${t}" ${truce ? 'disabled' : ''}>${truce ? `Tregua hasta el turno ${r.truceUntil}` : 'Declarar la guerra'}</button>
            ${invites.map(b => {
                const asked = g.proposedThisTurn.has(`inv${b.id}:${t}`);
                return `<button class="btn" data-action="invite" data-bloc="${b.id}" data-target="${t}" ${asked ? 'disabled' : ''}>Invitar a ${esc(b.name)}</button>`;
            }).join('')}</div>`;
        return html;
    }

    renderToasts() {
        const g = this.game;
        $('#toasts').innerHTML = g.proposals.map((pr, i) => {
            const who = `<b>${g.nm(pr.from)}</b>`;
            let text, yes = 'Aceptar', no = 'Rechazar';
            if (pr.kind === 'paz') text = `${who} te propone la paz.`;
            else if (pr.kind === 'bloque') text = `${who} te invita a ${pr.blocId && g.bloc(pr.blocId) ? `unirte a ${esc(g.bloc(pr.blocId).name)}` : 'formar una alianza'}.`;
            else { text = `${who}, tu aliado, ha sido atacado por <b>${g.nm(pr.against)}</b>. Si no acudes, saldrás de vuestras alianzas.`; yes = 'Ir a la guerra'; no = 'No intervenir'; }
            const yesAction = pr.kind === 'paz' ? `data-action="peace-open" data-target="${pr.from}"` : `data-action="accept" data-index="${i}"`;
            if (pr.kind === 'paz') yes = 'Negociar';
            return `<div class="toast float" style="border-left-color:${g.nations[pr.from].color}"><p>${text}</p>
                <div class="row"><button class="btn primary" ${yesAction}>${yes}</button>
                <button class="btn" data-action="reject" data-index="${i}">${no}</button></div></div>`;
        }).join('');
    }

    renderConfirm() {
        const g = this.game, el = $('#confirm'), plan = this.pending;
        if (!plan || g.player === null) {
            // Con el dedo, mientras se construye, un botón visible para terminar (no hay clic derecho ni Esc).
            el.hidden = !(this.touch && this.tool !== 'command' && this.tool !== 'cities' && g.player !== null);
            if (!el.hidden) el.innerHTML = `<span class="small">${this.anchor < 0 ? 'Toca una casilla tuya para empezar' : 'Toca dónde termina la obra'}</span>
                <button class="btn" data-action="stop-build">Terminar obras</button>`;
            return;
        }
        const ok = plan.cost <= g.nations[g.player].gold;
        const what = plan.cls === 'fort' ? `Fortificar ${plural(plan.cells.length, 'casilla', 'casillas')}` : `${plural(plan.path.length - 1, 'tramo', 'tramos')} de ${plan.cls === 2 ? 'autopista' : 'carretera'}`;
        el.hidden = false;
        el.innerHTML = `<span>${what}: <b style="color:${ok ? 'var(--signal)' : 'var(--war)'}">${plan.cost} de oro</b></span>
            <button class="btn primary" data-action="confirm-build" ${ok ? '' : 'disabled'}>Confirmar</button>
            <button class="btn" data-action="cancel-build">Cancelar</button>`;
    }

    renderHint() {
        const g = this.game, el = $('#hint');
        let text;
        if (this.hintOverride) text = this.hintOverride;
        else if (g.player === null) text = 'Haz clic en un país para elegirlo. Rueda del ratón: zoom; arrastrar: mover el mapa.';
        else if (g.over) text = '';
        else if (this.tool === 'cities') text = 'Ciudades: haz clic en tus provincias para añadirlas o quitarlas de la selección.';
        else if (this.tool === 'fort') text = this.anchor < 0 ? 'Fortificar: haz clic en una casilla tuya.' : 'Clic en otra casilla para fortificar la línea, o en la misma para solo esa. Clic derecho para terminar.';
        else if (this.tool !== 'command') text = this.anchor < 0 ? `${this.toolDef().label}: haz clic en una casilla tuya para empezar.` : 'Haz clic donde termina el tramo; se construye el camino más barato. Clic derecho para terminar.';
        else if (this.reachInfo) text = `${this.view.isRealistic() ? 'Zona clara: mover' : 'Verde: mover'}. Rojo: atacar. Clic derecho o Esc para cancelar.`;
        else text = 'Clic en un ejército tuyo para darle órdenes, o en una provincia para ver qué puedes hacer.';
        el.textContent = text;
        el.hidden = !text;
        el.classList.toggle('beside-card', !$('#card').hidden);
    }

    renderDrawer() {
        const g = this.game, el = $('#drawer');
        el.hidden = g.player === null;
        el.classList.toggle('closed', !this.drawerOpen);
        if (g.player === null) return;
        const unread = g.logs.length - this.seenLog;
        if (this.tab === 'registro' && this.drawerOpen) this.seenLog = g.logs.length;
        const tabs = [['paises', 'Países'], ['alianzas', 'Alianzas'], ['registro', 'Registro']];
        el.innerHTML = `<div class="tabs">
            ${tabs.map(([id, label]) => `<button data-action="tab" data-tab="${id}" class="${this.tab === id ? 'on' : ''}">${label}${id === 'registro' && unread > 0 && this.tab !== 'registro' ? `<span class="count">${unread}</span>` : ''}</button>`).join('')}
            <button class="toggle" data-action="drawer" title="${this.drawerOpen ? 'Ocultar el panel' : 'Mostrar el panel'}" aria-label="${this.drawerOpen ? 'Cerrar' : 'Abrir'}">${isMobile() ? '✕' : this.drawerOpen ? '›' : '‹'}</button></div>
            <div class="drawer-body" id="drawer-body"></div>`;
        if (!this.drawerOpen) return;
        if (this.tab === 'paises') this.renderNations();
        else if (this.tab === 'alianzas') this.renderBlocs();
        else this.renderLog();
    }

    renderNations() {
        const g = this.game, body = $('#drawer-body');
        if (this.focusNation !== null) {
            const t = this.focusNation, n = g.nations[t], lands = g.landCounts(), powers = g.powers();
            const blocs = g.visibleBlocs(g.player).filter(b => b.members.has(t));
            body.innerHTML = `<button class="btn ghost" data-action="nation-back">‹ Todos los países</button>
                <div class="pick" style="border-left-color:${n.color}">
                    <h3>${n.name}</h3><p class="row" style="margin-top:4px">${this.relationChip(t)}</p>
                    <dl class="facts" style="margin-top:8px">
                        <dt>Capital</dt><dd>${esc(n.capitalName)}${g.owner[n.capitalCell] !== t ? ` (en manos de ${g.nm(g.owner[n.capitalCell])})` : ''}</dd>
                        <dt>Territorio</dt><dd>${(100 * lands[t] / G.land.length).toFixed(1)} % de Europa</dd>
                        <dt>Fuerza</dt><dd>${this.powerText(t, powers)}</dd>
                        <dt>Alianzas</dt><dd>${blocs.map(b => esc(b.name) + (b.secret ? ' (secreta)' : '')).join(', ') || 'ninguna conocida'}</dd>
                        ${n.overlord >= 0 ? `<dt>Señor</dt><dd>${g.nm(n.overlord)}</dd>` : ''}
                        ${n.overlord === g.player ? `<dt>Tributo</dt><dd>${Math.round(g.economy(t).total * CONFIG.TRIBUTE)} de oro por turno</dd>` : ''}
                        ${g.satellitesOf(t).length ? `<dt>Satélites</dt><dd>${g.satellitesOf(t).map(x => g.nm(x)).join(', ')}</dd>` : ''}
                    </dl>
                    ${t === g.player ? this.economyFacts(t) : ''}
                    <button class="btn" style="margin-top:10px" data-action="goto" data-cell="${n.capitalCell}" ${n.alive ? '' : 'disabled'}>Ver en el mapa</button>
                </div>
                ${n.alive && t !== g.player ? `<div style="margin-top:12px">${this.diplomacyActions(t)}</div>` : ''}`;
            return;
        }
        body.innerHTML = `<input type="search" id="nation-search" placeholder="Buscar país" value="${esc(this.filter)}" aria-label="Buscar país">
            <div id="nation-list"></div>`;
        this.renderNationList();
    }

    // Con niebla de guerra solo se conoce la fuerza propia y la de los aliados.
    powerText(id, powers) {
        const g = this.game;
        return !g.settings.fog || id === g.player || g.allied(g.player, id) ? String(powers[id]) : '?';
    }

    // Desglose de la renta y de los precios de las tropas (para tu país).
    economyFacts(id) {
        const g = this.game, e = g.economy(id), tr = g.tribute(id);
        const counts = Object.entries(e.byType).map(([k, n]) => `${CONFIG.RESOURCE_ICON[k]} ${n}`).join(' ');
        return `<h3 style="margin-top:12px">Economía</h3><dl class="facts">
            <dt>Provincias</dt><dd>${e.base} de oro</dd>
            <dt>Desarrollo</dt><dd>+${e.dev}</dd>
            <dt>Industria</dt><dd>+${e.industry}${e.access.size ? ` (${plural(e.access.size, 'provincia abastecida', 'provincias abastecidas')} por yacimientos)` : ''}</dd>
            <dt>Carreteras</dt><dd>+${e.road}</dd>
            <dt>Imperio</dt><dd>+${e.empire}${e.empireRate > 0 ? ` (+${Math.round(e.empireRate * 100)} % por ${e.legalProvinces - START_PROVINCES[id]} provincias ganadas)` : ' (crece al anexionar provincias)'}</dd>
            <dt>Recursos</dt><dd>+${e.res}${counts ? ` (${counts})` : ''}${e.looseResources.length ? `<br><span class="small muted">${plural(e.looseResources.length, 'yacimiento', 'yacimientos')} sin carretera: solo abastecen a su provincia</span>` : ''}</dd>
            ${tr.in || tr.out ? `<dt>Tributo</dt><dd>${tr.in ? `+${tr.in}` : ''}${tr.out ? ` −${tr.out}` : ''}</dd>` : ''}
            ${e.capitalLost ? `<dt>Capital</dt><dd class="warn-text">perdida: tus yacimientos y tu industria rinden la mitad hasta que la recuperes</dd>` : ''}
            <dt>Total</dt><dd><b>${g.income(id)} de oro por turno</b></dd>
            <dt>Precios en la capital</dt><dd>${UNIT_KEYS.map(k => `${CONFIG.TYPES[k].name.toLowerCase()} ${g.unitCost(id, k, G.prov[g.nations[id].capitalCell])}`).join(', ')}</dd>
        </dl>`;
    }

    renderNationList() {
        const g = this.game, p0 = g.player, list = $('#nation-list');
        if (!list) return;
        const lands = g.landCounts(), powers = g.powers();
        const spies = [...g.spies].map(([pid, s]) => { const p = PROVINCES[pid]; return `<button class="nation-row" data-action="goto" data-cell="${p.city}">
            <span class="sw" style="background:${g.nations[g.owner[p.city]].color}"></span><span>${esc(p.name)}</span>
            <span class="num">${s.revealedTurn === g.turn ? 'informa' : 'sin noticias'}</span><span class="num">espía</span></button>`; }).join('');
        const q = this.filter.trim().toLowerCase();
        const groups = [
            ['Tu país', n => n.id === p0],
            ['Tus satélites', n => n.alive && n.overlord === p0],
            ['En guerra contigo', n => n.alive && g.atWar(p0, n.id)],
            ['Aliados', n => n.alive && g.allied(p0, n.id) && !g.atWar(p0, n.id) && n.overlord !== p0],
            ['Resto de Europa', n => n.alive && n.id !== p0 && !g.atWar(p0, n.id) && !g.allied(p0, n.id)],
            ['Eliminados', n => !n.alive]
        ];
        list.innerHTML = (spies && !q ? `<p class="group-title">Tus espías</p>${spies}` : '') + groups.map(([title, test]) => {
            const rows = g.nations.filter(n => test(n) && (!q || n.name.toLowerCase().includes(q)))
                .sort((a, b) => (g.settings.fog ? lands[b.id] - lands[a.id] : powers[b.id] - powers[a.id]))
                .map(n => `<button class="nation-row" data-action="nation" data-id="${n.id}">
                    <span class="sw" style="background:${n.color}"></span><span>${n.name}</span>
                    <span class="num" title="Parte de Europa">${(100 * lands[n.id] / G.land.length).toFixed(1)} %</span>
                    <span class="num" title="Fuerza militar">${this.powerText(n.id, powers)}</span></button>`).join('');
            return rows ? `<p class="group-title">${title}</p>${rows}` : '';
        }).join('') || '<p class="note">Ningún país coincide con la búsqueda.</p>';
    }

    renderBlocs() {
        const g = this.game, p0 = g.player, body = $('#drawer-body');
        const visible = g.visibleBlocs(p0);
        const mine = visible.filter(b => b.members.has(p0));
        const others = visible.filter(b => !b.members.has(p0));
        const memberChips = b => `<div class="members">${[...b.members].map(m => this.nationChip(m)).join('')}</div>`;
        const eligible = b => g.nations.filter(n => n.alive && !b.members.has(n.id) && !g.atWar(p0, n.id)).sort((x, y) => x.name.localeCompare(y.name, 'es'));
        body.innerHTML = `
            <p class="group-title" style="margin-top:0">Tus alianzas</p>
            ${mine.map(b => `<div class="bloc mine">
                <h3>${esc(b.name)}${b.secret ? ' <span class="chip">secreta</span>' : ''}</h3>
                ${memberChips(b)}
                <div class="row"><select data-bloc-invite="${b.id}" style="flex:1">${eligible(b).map(n => `<option value="${n.id}">${n.name}</option>`).join('')}</select>
                <button class="btn" data-action="bloc-invite" data-bloc="${b.id}">Invitar</button></div>
                <button class="btn ghost" style="margin-top:6px" data-action="bloc-leave" data-bloc="${b.id}">Abandonar la alianza</button>
            </div>`).join('') || '<p class="note" style="margin:0 0 8px 8px">No perteneces a ninguna alianza.</p>'}
            <div class="bloc">
                <h3>Fundar una alianza</h3>
                <div class="stack">
                    <input type="text" id="bloc-name" maxlength="40" placeholder="Pacto de ${esc(g.nations[p0].capitalName)}" value="${esc(this.blocName)}" aria-label="Nombre de la alianza">
                    <label class="check small"><input type="checkbox" id="bloc-secret" ${this.blocSecret ? 'checked' : ''}><span>Secreta: solo la conocen sus miembros hasta que una guerra la active</span></label>
                    <button class="btn primary" data-action="bloc-create">Fundar alianza</button>
                </div>
                <p class="note">Puedes estar en varias a la vez, OTAN incluida. Si atacan a un miembro, los demás entran en guerra.</p>
            </div>
            ${others.length ? `<p class="group-title">Otras alianzas</p>${others.map(b => `<div class="bloc">
                <h3>${esc(b.name)}</h3>${memberChips(b)}
                <button class="btn" data-action="bloc-request" data-bloc="${b.id}" ${g.proposedThisTurn.has(`req${b.id}`) ? 'disabled' : ''}>Pedir el ingreso</button></div>`).join('')}` : ''}`;
    }

    renderLog() {
        const body = $('#drawer-body');
        const entries = this.game.logs.slice(-250).reverse();
        let html = '', turn = null;
        for (const { turn: t, msg } of entries) {
            if (msg.startsWith('— TURNO')) continue;
            if (t !== turn) { html += `<p class="log-turn">Turno ${t}</p>`; turn = t; }
            html += `<p class="log-line">${esc(msg)}</p>`;
        }
        body.innerHTML = html || '<p class="note">Todavía no ha pasado nada.</p>';
    }

    renderPeaceDialog() {
        const g = this.game, s = this.peace, t = s.target, me = g.player;
        const occ = g.occupation(t), sats = g.satellitesOf(me);
        const offered = g.proposals.some(p => p.kind === 'paz' && p.from === t);
        const crushed = g.isCrushed(t);
        if (s.mode === 'satellite' && !crushed) s.mode = 'annex';
        const opt = (mode, title, desc, enabled = true) => `<button class="peace-opt ${s.mode === mode ? 'on' : ''}" data-action="peace-mode" data-mode="${mode}" ${enabled ? '' : 'disabled'}><b>${title}</b><span>${desc}</span></button>`;
        const keeps = s.mode === 'annex' || (s.mode === 'satellite' && s.keep);
        let extra = '';
        if (keeps && occ.mine && sats.length && s.mode === 'annex') {
            extra += `<label class="field"><span>Lo que has ocupado tú es para</span>
                <select id="peace-mine"><option value="-1" ${s.mine < 0 ? 'selected' : ''}>Ti</option>
                ${sats.map(x => `<option value="${x}" ${s.mine === x ? 'selected' : ''}>Tu satélite ${g.nm(x)}</option>`).join('')}</select></label>`;
        }
        if (keeps && occ.sats) {
            extra += `<div class="field"><span>Lo que han ocupado tus satélites es para</span><div class="seg">
                <button data-action="peace-sat" data-value="self" class="${s.satGains === 'self' ? 'on' : ''}">Ellos</button>
                <button data-action="peace-sat" data-value="overlord" class="${s.satGains === 'overlord' ? 'on' : ''}">Ti</button></div></div>`;
        }
        if (s.mode === 'satellite') {
            extra += `<label class="check small" style="margin-top:10px"><input type="checkbox" id="peace-keep" ${s.keep ? 'checked' : ''}><span>Quedarte lo que has ocupado de ${g.nm(t)} (si no, se lo devuelves)</span></label>`;
        }
        const asked = !offered && g.proposedThisTurn.has(`paz${t}`);
        $('#peace-body').innerHTML = `
            <div class="row" style="justify-content:space-between"><h2>Paz con ${g.nm(t)}</h2><button class="btn ghost" data-action="peace-close" aria-label="Cerrar">✕</button></div>
            <p class="note" style="margin-bottom:10px">${offered ? `${g.nm(t)} te ha propuesto la paz: aceptará anexionar lo ocupado o una paz blanca.` : `Elige las condiciones. ${g.nm(t)} puede rechazarlas, y solo puedes proponerle la paz una vez por turno.`}</p>
            <dl class="facts" style="margin-bottom:12px">
                <dt>Has ocupado</dt><dd>${plural(occ.mine, 'casilla', 'casillas')} en ${plural(occ.provinces, 'provincia', 'provincias')}${occ.sats ? `, y tus satélites ${occ.sats} más` : ''}</dd>
                <dt>Te ha ocupado</dt><dd>${plural(occ.theirs, 'casilla', 'casillas')} tuyas o de tus satélites</dd>
            </dl>
            <div class="stack">
                ${opt('annex', 'Anexionar lo ocupado', 'Cada bando se queda lo que ocupa: deja de estar en disputa y pasa a ser territorio propio, con toda su renta.')}
                ${opt('satellite', `Convertir a ${g.nm(t)} en tu satélite`, crushed
                    ? `Conserva su país, te paga el ${CONFIG.TRIBUTE * 100} % de sus ingresos, entra en tus guerras y nunca te ataca. Lo que te ocupó vuelve a ti.`
                    : 'Solo si le has vencido claramente: ocupas su capital o el 40 % de su territorio, o tiene menos de un tercio de tu fuerza.', crushed)}
                ${opt('white', 'Paz blanca', 'Cada uno recupera lo suyo; las casillas ocupadas vuelven a su dueño.')}
            </div>
            ${extra}
            <div class="row" style="margin-top:16px;justify-content:flex-end">
                <button class="btn" data-action="peace-close">Cancelar</button>
                <button class="btn primary" data-action="peace-send" ${asked ? 'disabled' : ''}>${asked ? 'Ya has propuesto la paz este turno' : 'Proponer estas condiciones'}</button>
            </div>`;
    }

    watchSettings() {
        const p = this.prefs, seg = (action, opts, cur) => `<div class="seg">${opts.map(([v, label]) => `<button data-action="${action}" data-value="${v}" class="${cur === v ? 'on' : ''}">${label}</button>`).join('')}</div>`;
        return `<div class="field"><span>Turno de los demás países</span>
                ${seg('watch', [['directo', 'Directo a mi turno'], ['ver', 'Ver sus jugadas']], p.watch)}</div>
            ${p.watch === 'ver' ? `<div class="field"><span>Velocidad</span>${seg('speed', [['lenta', 'Lenta'], ['normal', 'Normal'], ['rapida', 'Rápida']], p.speed)}
                <p class="note">Cada país juega por orden y se resalta su territorio; los que no hacen nada se saltan. «Saltar» o Esc lo termina al instante.</p></div>` : ''}`;
    }

    renderGameDialog() {
        const g = this.game, saves = readSaves(), playing = g.player !== null;
        const when = s => new Date(s.date).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
        $('#game-dialog-body').innerHTML = `
            <div class="row" style="justify-content:space-between"><h2>Partida</h2><button class="btn ghost" data-action="close-game" aria-label="Cerrar">✕</button></div>
            <p class="note" style="margin-bottom:8px">Se guarda sola al terminar cada turno. Las ranuras viven en este navegador; para hacer copias o jugar en otro equipo, exporta a archivo.</p>
            ${Object.entries(SLOTS).map(([slot, label]) => {
                const s = saves[slot];
                return `<div class="slot"><div><b>${label}</b><div class="small muted">${s ? `${esc(s.nation)}, turno ${s.turn}, ${when(s)}` : 'vacía'}</div></div>
                    ${slot === 'auto' ? '<span></span>' : `<button class="btn" data-action="save" data-slot="${slot}" ${playing && !g.over ? '' : 'disabled'}>Guardar aquí</button>`}
                    <button class="btn" data-action="load" data-slot="${slot}" ${s ? '' : 'disabled'}>Cargar</button></div>`;
            }).join('')}
            ${this.watchSettings()}
            <div class="row" style="margin-top:14px">
                <button class="btn" data-action="export" ${playing ? '' : 'disabled'}>Exportar a archivo</button>
                <button class="btn" data-action="import">Importar archivo</button>
            </div>`;
    }

    renderOverlay() {
        const g = this.game, overlay = $('#overlay');
        overlay.hidden = !g.over;
        if (!g.over) return;
        $('#overlay-card').innerHTML = `
            <h2 style="color:${g.won ? SIGNAL : 'var(--war)'}">${g.won ? 'Victoria' : 'Derrota'}</h2>
            <p>${g.won ? `${g.nm(g.player)} domina Europa en el turno ${g.turn}.` : `${g.nm(g.player)} ha caído en el turno ${g.turn}.`}</p>
            <button class="btn primary" style="margin-top:16px" data-action="restart">Nueva partida</button>`;
    }
}

const seedParam = Number(new URLSearchParams(location.search).get('seed'));
let game = new GameEngine(Number.isFinite(seedParam) && seedParam > 0 ? seedParam : Date.now() % 2147483647);
const ui = new GameUI(game);
// --- Actualizaciones ---
// La app compara su versión con version.json (al abrirse, al volver a primer plano y cada 15 minutos). Si hay una
// nueva, guarda la partida, recarga y la reanuda: las apps instaladas no se quedan con versiones antiguas.
const APP_VERSION = '2026.10.19-103217';
const RESUME_KEY = 'nanwar.resume';
let updating = false;
async function checkForUpdate() {
    if (location.protocol === 'file:' || updating) return;
    try {
        const res = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;
        const { version } = await res.json();
        if (version && version !== APP_VERSION && APP_VERSION !== 'dev') applyUpdate(version);
    } catch { /* sin conexión: se seguirá con esta versión */ }
}
function applyUpdate(version) {
    // Un solo intento por versión y sesión: si la recarga trajera aún la página vieja, no se entra en bucle.
    try { if (sessionStorage.getItem('nanwar.updateTried') === version) return; sessionStorage.setItem('nanwar.updateTried', version); } catch { /* sin almacenamiento */ }
    updating = true;
    if (game.player !== null && !game.over && writeSave('auto', game)) {
        try { localStorage.setItem(RESUME_KEY, 'auto'); } catch { /* sin almacenamiento no se puede reanudar */ }
    }
    const box = document.createElement('div');
    box.className = 'toast float';
    box.innerHTML = '<p style="margin:0"><b>Actualizando NanWar…</b> Tu partida se ha guardado y continuará en un momento.</p>';
    $('#toasts').prepend(box);
    const reg = navigator.serviceWorker ? navigator.serviceWorker.getRegistration() : Promise.resolve(null);
    reg.then(r => r && r.update()).catch(() => {}).finally(() => setTimeout(() => location.reload(), 1200));
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(err => console.warn('Sin modo sin conexión:', err));
}
// Tras una actualización, se reanuda la partida que se estaba jugando.
try {
    if (localStorage.getItem(RESUME_KEY)) {
        localStorage.removeItem(RESUME_KEY);
        const save = readSaves().auto;
        if (save) { ui.setGame(GameEngine.load(save.data)); game.log(`NanWar se ha actualizado a la versión ${APP_VERSION}. Continúas tu partida.`); ui.render(); }
    }
} catch { /* sin almacenamiento local */ }
setTimeout(checkForUpdate, 2000);
setInterval(checkForUpdate, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
</script>
</body>
